    fb:'Семь цитат отобрало агентство, поэтому частоту по ним не посчитать — нужны все расшифровки. Графики, экспорт и «скажите, что я молодец» — разные решения одной задачи: увидеть свой прогресс. История про алкоголь говорит о силе переживаний, а не о массовости; масштаб каждой задачи проверяют в поведении.'},
   {t:'Перенести запросы в бэклог как есть — графики, экспорт, похвалу за прогресс: люди прямо сказали, чего хотят.', q:'bad', fx:{trust:4, debt:8, morale:-3}, later:{in:2, fx:{ret:0.002}, note:'Графики, экспорт и похвала вышли по отдельности. Каждой фичей пользуется горстка людей, удержание почти не сдвинулось.'},
    fb:'Пользователи формулируют решения, и здесь они противоречат друг другу: одним нужны графики, другим — «не графики». Перенося цитаты в бэклог буквально, ты строишь три фичи вместо одной, которая решает общую задачу.'},
   {t:'Сделать ставку на самую сильную историю: если Ритм помогает людям не пить, это и есть наше позиционирование.', q:'bad', fx:{morale:3, cash:-8000}, later:{in:2, fx:{cac:0.15, trust:-3}, note:'Лендинг «Ритм помогает бросить пить» привёл мало установок, и те дорогие: основная аудитория себя в нём не узнала.'},
    fb:'Самая яркая цитата — не самая частая. Одна история показывает, насколько важной привычка может быть для человека, но не говорит, сколько таких людей. Менять позиционирование по одному интервью — строить продукт вокруг выброса.'},
   {t:'Не тратить время на отчёт: 20 интервью — это не выборка, а решения мы принимаем по продуктовым данным.', q:'ok', fx:{trust:-5},
    fb:'Скепсис отчасти верен: по 20 интервью нельзя судить о частоте. Но данные показывают «что» и «где», а не «почему» — без интервью ты не знаешь, что в них искать. А $15 000 Андрея выбрасываются вместе с его доверием к discovery.'}
  ], lesson:'Цитаты — сырьё, а не бэклог: своди их в задачи пользователей, отделяй яркое от частого и проверяй масштаб в данных.'},
 {id:'s41', d:'disc', from:'sup', title:'«Верните старый дизайн!»',
  text:'Неделю назад вышел релиз 4.0 с новым главным экраном, и рейтинг в сторе упал с 4,6 до 4,3. Оля: «Отзывов с одной звездой — 41, тикетов — 380, вдвое больше обычного, но там в основном вопросы „как теперь сделать…“». Типичные:<ul><li>1★: «ВЕРНИТЕ СТАРЫЙ ДИЗАЙН. Плачу два года — и вот так?»</li><li>1★: «Кто это рисовал? Удаляю».</li><li>Тикет: «Как теперь отметить привычку за вчера? Вечером забыла — серия сбросилась».</li><li>Тикет: «Раньше долгим нажатием можно было отметить прошлый день. Где это?»</li><li>4★: «Новый вид симпатичный. Только серия почему-то обнулилась».</li><li>5★: «Наконец-то быстро и современно!»</li></ul>',
  options:[
   {t:'Разметить отзывы и тикеты за неделю по проблемам, посчитать каждую и сверить с данными по отметкам.', q:'best', fx:{trust:2}, later:{in:1, fx:{ret:0.012, trust:2}, note:'Злых отзывов про дизайн — 41, вопросов про отметку за вчера — 230: новый экран спрятал её в меню, и серии массово сбрасывались. Вернули долгое нажатие и восстановили серии — удержание вернулось, а жалобы на дизайн за две недели стихли.'},
    fb:'Громкость — не частота. Капс и одна звезда — сильная эмоция немногих, а вежливые вопросы «как отметить за вчера» — массовая поломка, которая молча обнуляет серии. Разметка превращает шум в список проблем с весом, а данные по отметкам показывают, что реально бьёт по поведению.'},
   {t:'Откатить редизайн целиком: рейтинг в сторе бьёт по CAC, а злятся платящие, которые с нами по два года.', q:'ok', fx:{ret:0.006, morale:-6, trust:2},
    fb:'Откат гасит и шум, и тихую поломку — но вслепую. Ты выбрасываешь то, что в редизайне работало, команда теряет месяц, а причину так никто и не назвал: следующий релиз наступит на те же грабли.'},
   {t:'Ответить каждому автору и выждать пару недель: к новому дизайну всегда сначала привыкают, это нормально.', q:'bad', fx:{trust:3}, later:{in:1, fx:{ret:-0.01}, note:'Злые отзывы правда стихли — люди привыкли. А тихая проблема осталась: без отметки за вчера серии сбрасывались, и удержание просело.'},
    fb:'Неприятие изменений — реальное явление, и для чисто визуальной правки выждать часто правильно. Но в той же куче лежала функциональная поломка, а её ожидание не лечит. Сначала отдели вкусовщину от проблемы.'},
   {t:'Вернуть старый дизайн как опцию в настройках: пусть каждый, кому новый не нравится, включит его сам.', q:'bad', fx:{debt:8, trust:2}, later:{in:2, fx:{ret:-0.004}, note:'Старый вид включили 6% пользователей, команда теперь поддерживает два экрана, а в новом отметки за вчера так и нет.'},
    fb:'Опция успокаивает громких, но удваивает поддержку интерфейса, а большинство остаётся на новом экране с той же поломкой. Ты ответил на тон отзывов, а не на их суть.'}
  ], lesson:'Громкое — не значит частое: размечай сигналы по проблемам, считай их и сверяй с поведением, прежде чем реагировать на тон.'},
 {id:'s42', d:'metr', from:'data', title:'44% «точно купили бы». Купят ли?',
  text:'Лена хочет продавать программы привычек от экспертов — сон, бег, медитация — по $4,99. Дима принёс опрос в приложении: из 3 100 ответивших 44% «точно купили бы». Андрей уже умножил на всю базу: 45 000 × 44% × $4,99 ≈ $99 000. Но поведение рисует другую картину: бесплатную программу «Сон», которая уже есть в приложении, начали 9% активных пользователей, а закончили 1,5%. А из тех, кто ответил «точно куплю», пейвол Premium за $9 видели больше половины — оплатили 6%, почти как в среднем (5%).',
  options:[
   {t:'Проверить спрос делом: на неделю кнопка «Купить за $4,99» (fake door) и 6 интервью о прошлых покупках.', q:'best', fx:{trust:-2}, later:{in:1, fx:{conv:0.002, ret:0.004}, note:'Кнопку с ценой нажали 2% увидевших — в двадцать с лишним раз меньше, чем обещал опрос. Интервью показали: людям нужна не программа, а готовый план на первые две недели. Встроили его в Premium — конверсия и удержание подросли.'},
    fb:'Сказать «точно куплю» ничего не стоит, поэтому опрос мерит симпатию, а не спрос. Кнопка с ценой ловит действие, а вопросы о прошлом («когда вы последний раз платили за курс?») — реальное поведение. Потребность из опроса никуда не делась: ты узнал её настоящий размер и форму.'},
   {t:'Запускать: даже если купит лишь каждый пятый из сказавших «да», это около $20k — ещё месяц выручки.', q:'bad', fx:{cash:-20000, debt:5, morale:-2}, later:{in:2, fx:{cash:3000, trust:-5}, note:'Три программы вышли. За два месяца их купили около 600 раз — $3 000 при затратах на экспертов и разработку в разы больше. Андрей успел пообещать фонду совсем другие цифры.'},
    fb:'Поправка «каждый пятый» выглядит трезво, но это всё та же опора на слова, только уменьшенная на глаз. К тому же ответы самых вовлечённых ты умножил на всю базу. Поведение уже подсказало порядок цифр: бесплатную программу дочитывают 1,5%.'},
   {t:'Сделать одну платную программу с экспертом и продавать её месяц: реальные покупки честнее любого опроса.', q:'ok', fx:{cash:-6000, debt:2}, later:{in:1, fx:{cash:1500}, note:'Программу купили около 300 раз — в разы меньше прогноза. Почему остальные не купили, так и осталось загадкой.'},
    fb:'Реальные продажи — правильная валюта: это уже поведение, а не слова. Но ты платишь месяцем и бюджетом на контент за то, что кнопка с ценой показала бы за неделю. А без разговоров с людьми не узнаешь, почему не купили.'},
   {t:'Закрыть идею: бесплатную программу «Сон» дочитывают 1,5%, значит, такому опросу верить просто нельзя.', q:'ok', fx:{trust:-4},
    fb:'Поведение ты прочитал верно: заявленный интерес раздут. Но 44% выбрали программы не случайно — за этим стоит потребность в структуре и подсказке, с чего начать. Выбросив опрос целиком, ты теряешь и её.'}
  ], lesson:'Заявленное намерение купить — не спрос. Прогноз выручки строй на поведении (конверсия, клики по реальной цене), а опрос используй, чтобы понять потребность.'},
 {id:'s36', d:'disc', from:'design', title:'Три макета главного экрана',
  text:'Кира перерисовывает главный экран, где отмечают привычки. На 6 домашних интервью она увидела, как это происходит на самом деле: вечером, лёжа в кровати, одной рукой, за 5–10 секунд. А в прошлогоднем опросе 64% просили «больше статистики». Из трёх макетов Киры Андрею нравится A: «Выглядит как серьёзный продукт».',
  options:[
   {t:'Вариант A — дашборд с графиком недели и компактным списком: две трети пользователей в опросе прямо просили статистику.', q:'bad', fx:{trust:3}, later:{in:1, fx:{ret:-0.006}, note:'Вечерних отметок стало меньше: в темноте люди промахивались по мелким чекбоксам и откладывали отметку «на завтра».'},
    fb:'Опрос фиксирует пожелания, интервью — поведение. Задача экрана — отметить день за секунды одной рукой в полутьме, а мелкие чекбоксы под графиками превращают её в прицеливание. Статистике место на отдельной вкладке, а не над главным действием.', img:'<svg viewBox="0 0 120 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect class="wf-frame" x="2" y="2" width="116" height="196" rx="12"/><rect class="wf-block" x="50" y="7" width="20" height="3" rx="1.5"/><circle class="wf-block" cx="28" cy="36" r="14"/><path class="wf-accent" d="M28 36V22A14 14 0 1 1 14.7 40.3Z"/><circle class="wf-soft" cx="28" cy="36" r="9"/><path class="wf-block" d="M52 38h5v10h-5zM60 32h5v16h-5zM68 40h5v8h-5zM76 30h5v18h-5zM84 36h5v12h-5zM92 26h5v22h-5z"/><path class="wf-accent" d="M100 34h5v14h-5zM102 65h5v5h-5zM102 80h5v5h-5zM102 110h5v5h-5z"/><path class="wf-bar" d="M22 65h44v3h-44zM22 71h20v2h-20zM22 80h38v3h-38zM22 86h20v2h-20zM22 95h50v3h-50zM22 101h20v2h-20zM22 110h34v3h-34zM22 116h20v2h-20zM22 125h46v3h-46zM22 131h20v2h-20zM22 140h40v3h-40zM22 146h20v2h-20zM22 155h30v3h-30zM22 161h20v2h-20z"/><path class="wf-icon" d="M12.5 68a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0 -5 0zM12.5 83a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0 -5 0zM12.5 98a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0 -5 0zM12.5 113a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0 -5 0zM12.5 128a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0 -5 0zM12.5 143a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0 -5 0zM12.5 158a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0 -5 0zM22 185a3 3 0 1 0 6 0a3 3 0 1 0 -6 0zM45 185a3 3 0 1 0 6 0a3 3 0 1 0 -6 0zM69 185a3 3 0 1 0 6 0a3 3 0 1 0 -6 0zM92 185a3 3 0 1 0 6 0a3 3 0 1 0 -6 0z"/><path class="wf-line" d="M10 56h100M2 174h116M102 95h5v5h-5zM102 125h5v5h-5zM102 140h5v5h-5zM102 155h5v5h-5z"/></svg>'},
   {t:'Вариант B — крупные строки в нижней половине экрана: отметка одним тапом большого пальца, статистика свёрнута в строку.', q:'best', fx:{ret:0.004}, later:{in:1, fx:{ret:0.008}, note:'Доля дней с отметкой выросла: вечерняя отметка занимает пару секунд, а статистику на второй вкладке открывают те, кому она правда нужна.'},
    fb:'Ты выбираешь по задаче и контексту, которые увидела Кира: кровать, одна рука, секунды. Крупные зоны нажатия там, куда достаёт большой палец, — это и скорость, и доступность. Статистика никуда не делась, она просто не мешает главному действию.', img:'<svg viewBox="0 0 120 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect class="wf-frame" x="2" y="2" width="116" height="196" rx="12"/><rect class="wf-block" x="50" y="7" width="20" height="3" rx="1.5"/><path class="wf-bar" d="M12 20h46v4h-46zM12 28h30v3h-30zM18 79h40v4h-40zM18 105h40v4h-40zM18 131h40v4h-40zM18 157h40v4h-40z"/><rect class="wf-accent" x="86" y="19" width="22" height="10" rx="5"/><path class="wf-block" d="M14 48a4 4 0 1 0 8 0a4 4 0 1 0 -8 0zM28 48a4 4 0 1 0 8 0a4 4 0 1 0 -8 0zM42 48a4 4 0 1 0 8 0a4 4 0 1 0 -8 0zM56 48a4 4 0 1 0 8 0a4 4 0 1 0 -8 0zM84 48a4 4 0 1 0 8 0a4 4 0 1 0 -8 0zM98 48a4 4 0 1 0 8 0a4 4 0 1 0 -8 0z"/><circle class="wf-icon" cx="74" cy="48" r="4"/><rect class="wf-soft" x="10" y="70" width="100" height="22" rx="6"/><rect class="wf-soft" x="10" y="96" width="100" height="22" rx="6"/><rect class="wf-soft" x="10" y="122" width="100" height="22" rx="6"/><rect class="wf-soft" x="10" y="148" width="100" height="22" rx="6"/><path class="wf-accent" d="M89 81a7 7 0 1 0 14 0a7 7 0 1 0 -14 0zM89 107a7 7 0 1 0 14 0a7 7 0 1 0 -14 0z"/><path class="wf-line" d="M89 133a7 7 0 1 0 14 0a7 7 0 1 0 -14 0zM89 159a7 7 0 1 0 14 0a7 7 0 1 0 -14 0zM2 178h116"/><path class="wf-icon" d="M37 188a3 3 0 1 0 6 0a3 3 0 1 0 -6 0zM77 188a3 3 0 1 0 6 0a3 3 0 1 0 -6 0z"/></svg>'},
   {t:'Вариант C — по карточке на привычку, свайп вправо засчитывает: удобно одной рукой, и отметка становится маленькой игрой.', q:'ok', fx:{ret:0.002, morale:3},
    fb:'Одна рука учтена, но у тех, кто ведёт пять привычек, отметка превращается в пять свайпов, а случайный свайп в полусне засчитывает не то. К тому же жест неочевиден: новичок не знает, что карточку надо тянуть.', img:'<svg viewBox="0 0 120 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect class="wf-frame" x="2" y="2" width="116" height="196" rx="12"/><rect class="wf-block" x="50" y="7" width="20" height="3" rx="1.5"/><path class="wf-accent" d="M42 20a2 2 0 1 0 4 0a2 2 0 1 0 -4 0zM50 20a2 2 0 1 0 4 0a2 2 0 1 0 -4 0z"/><path class="wf-icon" d="M58 20a2 2 0 1 0 4 0a2 2 0 1 0 -4 0zM66 20a2 2 0 1 0 4 0a2 2 0 1 0 -4 0zM74 20a2 2 0 1 0 4 0a2 2 0 1 0 -4 0z"/><rect class="wf-block" x="22" y="32" width="76" height="112" rx="8"/><rect class="wf-soft" x="18" y="38" width="84" height="112" rx="8" transform="rotate(7 60 94)"/><rect class="wf-line" x="18" y="38" width="84" height="112" rx="8" transform="rotate(7 60 94)"/><circle class="wf-icon" cx="60" cy="76" r="14" transform="rotate(7 60 94)"/><path class="wf-bar" d="M36 100h48v4h-48zM42 108h36v3h-36z" transform="rotate(7 60 94)"/><path class="wf-line" d="M50 164h20m-4-3l4 3-4 3M27 180a9 9 0 1 0 18 0a9 9 0 1 0 -18 0zM32 176l8 8m0-8l-8 8"/><circle class="wf-accent" cx="84" cy="180" r="9"/><path class="wf-soft" d="M79 180l2.5-2.5 2 2 5-5 2.5 2.5-7.5 7.5z"/></svg>'}
  ], lesson:'Выбирай макет по задаче и контексту пользователя из исследования, а не по вкусу — своему, дизайнера или CEO — и не по пожеланиям из опроса.'},
 {id:'s37', d:'prio', from:'design', dilemma:true, title:'Как позвать напарника',
  text:'Цель квартала — чтобы новички заводили напарника по привычке: с ним удержание вдвое выше. Кира принесла три варианта экрана приглашения, Тимур оценил каждый. Команда одна, и от выбранного варианта зависит, что ещё успеет попасть в квартал.',
  options:[
   {t:'Вариант A — системное меню «Поделиться» со ссылкой: 3 дня работы, привычно на iOS и Android, данные уже в этом спринте.', q:'best', fx:{viral:0.002}, later:{in:1, fx:{viral:0.002}, note:'Приглашения пошли с первой недели, но по голой ссылке друзья соглашались редко. Зато стало видно, кого и когда зовут, — и что улучшать дальше.'},
    fb:'Ты покупаешь скорость и данные: через неделю видно, зовут ли люди напарников вообще, а системный экран никому не надо осваивать. Плата — принятие приглашений: голая ссылка в мессенджере ничего не обещает другу, и часть напарников ты недосчитаешься.', img:'<svg viewBox="0 0 120 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect class="wf-frame" x="2" y="2" width="116" height="196" rx="12"/><rect class="wf-block" x="50" y="7" width="20" height="3" rx="1.5"/><path class="wf-icon" d="M42 40a8 8 0 1 0 16 0a8 8 0 1 0 -16 0zM62 40a8 8 0 1 0 16 0a8 8 0 1 0 -16 0z"/><path class="wf-bar" d="M30 56h60v4h-60zM38 64h44v3h-44z"/><rect class="wf-accent" x="20" y="76" width="80" height="14" rx="7"/><rect class="wf-soft" x="3" y="100" width="114" height="97" rx="11"/><rect class="wf-block" x="52" y="105" width="16" height="3" rx="1.5"/><rect class="wf-block" x="12" y="114" width="14" height="14" rx="3"/><rect class="wf-block" x="12" y="140" width="13" height="13" rx="3"/><rect class="wf-block" x="32" y="140" width="13" height="13" rx="3"/><rect class="wf-block" x="52" y="140" width="13" height="13" rx="3"/><rect class="wf-block" x="72" y="140" width="13" height="13" rx="3"/><rect class="wf-block" x="92" y="140" width="13" height="13" rx="3"/><path class="wf-bar" d="M30 116h50v3h-50zM30 122h34v2h-34zM13.5 157h10v2h-10zM33.5 157h10v2h-10zM53.5 157h10v2h-10zM73.5 157h10v2h-10zM93.5 157h10v2h-10zM14 172h40v3h-40zM14 184h32v3h-32z"/><path class="wf-line" d="M12 134h96M12 166h96"/><path class="wf-icon" d="M99.5 173.5a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0 -5 0zM99.5 185.5a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0 -5 0z"/></svg>'},
   {t:'Вариант B — своя карточка-приглашение с превью общего прогресса: 3 недели, зато она сама объясняет другу, зачем соглашаться.', q:'best', fx:{debt:3, morale:2}, later:{in:2, fx:{viral:0.005, ret:0.003}, note:'Карточка вышла к середине квартала: друзья принимали приглашения заметно чаще, но первые данные пришли на месяц позже.'},
    fb:'Ты покупаешь качество главной точки роста: приглашение — это реклама Ритма, которую видит друг, и сильная карточка поднимает принятие. Плата — время: три недели без данных и риск отполировать то, чем люди, возможно, не станут пользоваться.', img:'<svg viewBox="0 0 120 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect class="wf-frame" x="2" y="2" width="116" height="196" rx="12"/><rect class="wf-block" x="50" y="7" width="20" height="3" rx="1.5"/><path class="wf-bar" d="M40 21h40v4h-40z"/><rect class="wf-soft" x="12" y="36" width="96" height="104" rx="10"/><path class="wf-line" d="M15 19l-4 4 4 4M63 58a10 10 0 1 0 20 0a10 10 0 1 0 -20 0zM73 53v10M68 58h10M28 106h7v7h-7zM38 106h7v7h-7zM48 106h7v7h-7zM58 106h7v7h-7zM68 106h7v7h-7zM78 106h7v7h-7zM88 106h7v7h-7z"/><path class="wf-icon" d="M37 58a10 10 0 1 0 20 0a10 10 0 1 0 -20 0zM17 97.5a3 3 0 1 0 6 0a3 3 0 1 0 -6 0zM17 109.5a3 3 0 1 0 6 0a3 3 0 1 0 -6 0z"/><path class="wf-bar" d="M30 74h60v4h-60zM38 82h44v3h-44zM30 124h60v3h-60z"/><path class="wf-accent" d="M28 94h7v7h-7zM38 94h7v7h-7zM48 94h7v7h-7zM58 94h7v7h-7zM68 94h7v7h-7z"/><path class="wf-block" d="M78 94h7v7h-7zM88 94h7v7h-7z"/><rect class="wf-accent" x="12" y="150" width="96" height="16" rx="8"/><path class="wf-icon" d="M39 182a5 5 0 1 0 10 0a5 5 0 1 0 -10 0zM55 182a5 5 0 1 0 10 0a5 5 0 1 0 -10 0zM71 182a5 5 0 1 0 10 0a5 5 0 1 0 -10 0z"/></svg>'},
   {t:'Вариант C — полноценные друзья: поиск по нику, заявки и список напарников. 2 месяца, зато это фундамент для всех будущих соцфич.', q:'bad', fx:{debt:10, morale:-4}, later:{in:2, fx:{viral:0.002}, note:'Друзья вышли под конец квартала. Поиском по нику почти не пользовались: людям нужен был один конкретный человек, а не сеть.'},
    fb:'Платформа под фичу, которую ещё не проверили: два месяца на поиск и заявки, когда задача — позвать одного близкого человека. Фундамент строят под доказанный спрос, а не на вырост.', img:'<svg viewBox="0 0 120 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect class="wf-frame" x="2" y="2" width="116" height="196" rx="12"/><rect class="wf-block" x="50" y="7" width="20" height="3" rx="1.5"/><rect class="wf-line" x="10" y="16" width="100" height="12" rx="6"/><path class="wf-line" d="M16 22a3 3 0 1 0 6 0a3 3 0 1 0 -6 0zM21 24l3 3M10 94h100M2 176h116M104 111l3 3-3 3M104 127l3 3-3 3M104 143l3 3-3 3M104 159l3 3-3 3M93 62h16v8h-16zM93 78h16v8h-16z"/><rect class="wf-soft" x="10" y="34" width="100" height="10" rx="5"/><rect class="wf-accent" x="10" y="34" width="34" height="10" rx="5"/><path class="wf-accent" d="M77 186a3 3 0 1 0 6 0a3 3 0 1 0 -6 0zM74 62h16v8h-16zM74 78h16v8h-16z"/><path class="wf-bar" d="M28 21h30v2h-30zM62 38h14v2h-14zM88 38h14v2h-14zM10 52h30v3h-30zM10 100h24v3h-24zM25 63h34v3h-34zM25 68h22v2h-22zM25 79h34v3h-34zM25 84h22v2h-22zM25 111h40v3h-40zM25 116h20v2h-20zM25 127h32v3h-32zM25 132h20v2h-20zM25 143h44v3h-44zM25 148h20v2h-20zM25 159h36v3h-36zM25 164h20v2h-20z"/><path class="wf-icon" d="M11 66a5 5 0 1 0 10 0a5 5 0 1 0 -10 0zM11 82a5 5 0 1 0 10 0a5 5 0 1 0 -10 0zM11 114a5 5 0 1 0 10 0a5 5 0 1 0 -10 0zM11 130a5 5 0 1 0 10 0a5 5 0 1 0 -10 0zM11 146a5 5 0 1 0 10 0a5 5 0 1 0 -10 0zM11 162a5 5 0 1 0 10 0a5 5 0 1 0 -10 0zM17 186a3 3 0 1 0 6 0a3 3 0 1 0 -6 0zM37 186a3 3 0 1 0 6 0a3 3 0 1 0 -6 0zM57 186a3 3 0 1 0 6 0a3 3 0 1 0 -6 0zM97 186a3 3 0 1 0 6 0a3 3 0 1 0 -6 0z"/></svg>'}
  ], lesson:'Выбор макета — это и выбор цены: скорость обучения или качество ключевого экрана. Назови плату явно, а платформу под непроверенный спрос не строй.'},
 {id:'s38', d:'metr', from:'design', title:'Экран сорванной серии',
  text:'Каждый месяц около 3 000 человек срывают серию длиннее недели, и 40% из них больше не возвращаются. Кира нарисовала три варианта экрана, который они увидят на следующий день. Андрей сразу выбрал C: «Даже если купят 5% — это плюс $1 350 MRR каждый месяц».',
  options:[
   {t:'Вариант A — честный ноль без утешений: серия ценна, пока её можно потерять, а заморозки и выкупы только её обесценят.', q:'ok', fx:{trust:-2},
    fb:'Аргумент про ценность серии справедлив, и экран честный. Но он не решает задачу, ради которой его перерисовывают: 40% сорвавшихся уходят, увидев ноль. Удержание после срыва остаётся там же, где было.', img:'<svg viewBox="0 0 120 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect class="wf-frame" x="2" y="2" width="116" height="196" rx="12"/><rect class="wf-block" x="50" y="7" width="20" height="3" rx="1.5"/><path class="wf-block" d="M60 20c8 10 16 16 16 28a16 16 0 0 1-32 0c0-7 4-11 7-16 2 5 4 7 7 8 0-8-1-13 2-20zM23 116h8v8h-8zM34 116h8v8h-8zM45 116h8v8h-8zM56 116h8v8h-8zM67 116h8v8h-8zM78 116h8v8h-8z"/><path class="wf-line" d="M57 30l5 9-4 6 4 9M89 116h8v8h-8zM19 120h82"/><path class="wf-icon" d="M60 74a11 15 0 1 1 0 30a11 15 0 1 1 0-30zM60 80a5 9 0 1 0 0 18a5 9 0 1 0 0-18z"/><path class="wf-bar" d="M26 134h68v4h-68zM34 142h52v3h-52z"/><rect class="wf-accent" x="14" y="164" width="92" height="16" rx="8"/></svg>'},
   {t:'Вариант B — бесплатная заморозка сохраняет серию и зовёт отметиться сегодня; судим по удержанию сорвавшихся через 30 дней.', q:'best', fx:{ret:0.004, trust:-2}, later:{in:1, fx:{ret:0.008}, note:'Через 30 дней среди сорвавших серию осталось заметно больше людей: заморозка превратила срыв в паузу.'},
    fb:'Ты выбираешь метрику, которая отражает цель пользователя — продолжить привычку, — и экран, который ей служит: срыв становится паузой, а не провалом. Платящие вырастут из тех, кто остался, а не из тех, кого прижали в худший момент.', img:'<svg viewBox="0 0 120 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect class="wf-frame" x="2" y="2" width="116" height="196" rx="12"/><rect class="wf-block" x="50" y="7" width="20" height="3" rx="1.5"/><circle class="wf-soft" cx="60" cy="48" r="26"/><rect class="wf-soft" x="14" y="122" width="92" height="26" rx="6"/><path class="wf-accent" d="M60 27c8 10 16 16 16 28a16 16 0 0 1-32 0c0-7 4-11 7-16 2 5 4 7 7 8 0-8-1-13 2-20zM23 86h8v8h-8zM34 86h8v8h-8zM45 86h8v8h-8zM56 86h8v8h-8zM67 86h8v8h-8zM22 138h58v4h-58z"/><path class="wf-icon" d="M80 60l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9v-6zM78 86h8v8h-8z"/><path class="wf-line" d="M89 86h8v8h-8z"/><path class="wf-bar" d="M26 104h68v4h-68zM34 112h52v3h-52zM22 129h36v3h-36z"/><path class="wf-block" d="M80 138h18v4h-18z"/><rect class="wf-accent" x="14" y="164" width="92" height="16" rx="8"/></svg>'},
   {t:'Вариант C — серию можно вернуть только с Premium, пока идёт таймер: мотивация на пике, и такой экран меряется прямой выручкой.', q:'bad', fx:{conv:0.004, trust:3}, later:{in:1, fx:{ret:-0.01, trust:-5}, note:'Покупки на экране были, но в отзывах появилось «держат серию в заложниках», а сорвавшиеся бесплатные пользователи стали уходить ещё чаще.'},
    fb:'Выручка реальная, но экран зарабатывает на стыде: таймер и мелкий крестик давят в худший момент. Деньги с экрана видны сразу, а ушедшие пользователи и злые отзывы — только через месяц, в удержании и рейтинге.', img:'<svg viewBox="0 0 120 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect class="wf-frame" x="2" y="2" width="116" height="196" rx="12"/><rect class="wf-block" x="50" y="7" width="20" height="3" rx="1.5"/><rect class="wf-soft" x="24" y="46" width="72" height="46" rx="10"/><rect class="wf-block" x="38" y="57" width="18" height="24" rx="7"/><rect class="wf-block" x="64" y="57" width="18" height="24" rx="7"/><path class="wf-line" d="M106 13l3 3m0-3l-3 3M25 108a5 5 0 1 0 10 0a5 5 0 1 0 -10 0zM30 105v3h2M56 66v-4a4 4 0 0 1 8 0v4"/><path class="wf-accent" d="M48 26l6 6 6-9 6 9 6-6-2 12h-20zM40 106h14v4h-14z"/><rect class="wf-icon" x="53" y="66" width="14" height="11" rx="2"/><path class="wf-block" d="M54 106h42v4h-42z"/><path class="wf-bar" d="M22 122h76v4h-76zM30 130h60v3h-60zM48 182h24v1.5h-24z"/><rect class="wf-accent" x="12" y="148" width="96" height="22" rx="11"/></svg>'}
  ], lesson:'Оценивай экран по метрике цели пользователя — удержанию через месяц, — а не по деньгам и кликам на самом экране.'},
 {id:'s39', d:'exp', from:'design', title:'Один тест на три макета',
  text:'Новичков хватает на один A/B-тест онбординга в месяц, и он поймает эффект от 10% и выше. Кира принесла три варианта первого экрана, а в текущем онбординге 35% новичков отваливаются на шаге настройки привычек. Какой вариант пойдёт в тест против текущего?',
  options:[
   {t:'Вариант A — тот же экран с новой иллюстрацией и яркой кнопкой: риск минимальный, тест чистый, а откатывать почти нечего.', q:'bad', later:{in:1, fx:{morale:-3}, note:'Тест закончился «без значимой разницы»: месяц трафика ушёл на то, что можно было просто выкатить.'},
    fb:'Косметика двигает метрики на 1–2%, а тест ловит от 10%: почти наверняка выйдет «разницы нет», и месяц трафика сгорит впустую. Мелкую полировку выкатывают без теста и следят за дашбордами.', img:'<svg viewBox="0 0 120 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect class="wf-frame" x="2" y="2" width="116" height="196" rx="12"/><rect class="wf-block" x="50" y="7" width="20" height="3" rx="1.5"/><rect class="wf-soft" x="12" y="20" width="96" height="88" rx="10"/><circle class="wf-accent" cx="84" cy="42" r="8"/><path class="wf-block" d="M14 100c14-22 30-22 44-8 12-14 30-18 48-4v12h-92z"/><rect class="wf-accent" x="46" y="118" width="8" height="4" rx="2"/><path class="wf-icon" d="M58 120a2 2 0 1 0 4 0a2 2 0 1 0 -4 0zM64 120a2 2 0 1 0 4 0a2 2 0 1 0 -4 0zM70 120a2 2 0 1 0 4 0a2 2 0 1 0 -4 0z"/><path class="wf-bar" d="M22 132h76v5h-76zM30 142h60v3h-60zM36 148h48v3h-48z"/><rect class="wf-accent" x="14" y="166" width="92" height="18" rx="9"/></svg>'},
   {t:'Вариант B — сразу выбрать одну привычку и отметить её: бьёт ровно в шаг, где теряем 35%, и эффект, если есть, будет крупным.', q:'best', later:{in:1, fx:{ret:0.01, conv:0.002}, note:'Тест добежал: D7 вырос на 14%, конверсия в оплату тоже подросла. Раскатили на всех новичков.'},
    fb:'Тест — дорогой ресурс, и тратить его стоит на крупное рискованное изменение с гипотезой из данных. Вариант бьёт в главную точку потерь, и эффект такого размера тест увидит. Если гипотеза неверна, ты узнаешь это за месяц, а не после раскатки.', img:'<svg viewBox="0 0 120 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect class="wf-frame" x="2" y="2" width="116" height="196" rx="12"/><rect class="wf-block" x="50" y="7" width="20" height="3" rx="1.5"/><path class="wf-bar" d="M16 20h64v5h-64zM16 30h44v3h-44zM20 66h26v3h-26zM20 106h26v3h-26zM68 106h26v3h-26zM20 146h26v3h-26zM68 146h26v3h-26z"/><rect class="wf-soft" x="14" y="42" width="44" height="34" rx="8"/><rect class="wf-soft" x="14" y="82" width="44" height="34" rx="8"/><rect class="wf-soft" x="62" y="82" width="44" height="34" rx="8"/><rect class="wf-soft" x="14" y="122" width="44" height="34" rx="8"/><rect class="wf-soft" x="62" y="122" width="44" height="34" rx="8"/><rect class="wf-accent" x="62" y="42" width="44" height="34" rx="8"/><path class="wf-icon" d="M20 54a6 6 0 1 0 12 0a6 6 0 1 0 -12 0zM20 94a6 6 0 1 0 12 0a6 6 0 1 0 -12 0zM68 94a6 6 0 1 0 12 0a6 6 0 1 0 -12 0zM20 134a6 6 0 1 0 12 0a6 6 0 1 0 -12 0zM68 134a6 6 0 1 0 12 0a6 6 0 1 0 -12 0z"/><rect class="wf-accent" x="14" y="166" width="92" height="18" rx="9"/><path class="wf-soft" d="M68 54a6 6 0 1 0 12 0a6 6 0 1 0 -12 0zM68 66h26v3h-26zM53 175l2.5-2.5 2 2 5-5 2.5 2.5-7.5 7.5z"/></svg>'},
   {t:'Вариант C — квиз из 8 вопросов о целях и персональный план: у фитнес-приложений такой онбординг заметно поднимает конверсию в оплату.', q:'ok', later:{in:1, fx:{conv:0.001}, note:'Квиз поднял оплату у дошедших до конца, но дошло меньше людей — в сумме почти ноль. Месяц ушёл, зато гипотезу закрыли.'},
    fb:'Крупное изменение — правильный кандидат в тест, но гипотеза спорит с твоими же данными: люди отваливаются на длинной настройке, а квиз её удлиняет. Чужой кейс — повод для гипотезы, а не замена своей воронки.', img:'<svg viewBox="0 0 120 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect class="wf-frame" x="2" y="2" width="116" height="196" rx="12"/><rect class="wf-block" x="50" y="7" width="20" height="3" rx="1.5"/><rect class="wf-soft" x="10" y="96" width="100" height="20" rx="6"/><path class="wf-line" d="M12 18l-3 3 3 3M20 82a4 4 0 1 0 8 0a4 4 0 1 0 -8 0zM20 130a4 4 0 1 0 8 0a4 4 0 1 0 -8 0zM20 154a4 4 0 1 0 8 0a4 4 0 1 0 -8 0z"/><path class="wf-accent" d="M20 19.5h9v3h-9zM31 19.5h9v3h-9zM20 106a4 4 0 1 0 8 0a4 4 0 1 0 -8 0z"/><path class="wf-block" d="M42 19.5h9v3h-9zM53 19.5h9v3h-9zM64 19.5h9v3h-9zM75 19.5h9v3h-9zM86 19.5h9v3h-9zM97 19.5h9v3h-9z"/><path class="wf-bar" d="M14 36h84v5h-84zM14 46h64v5h-64zM14 58h50v3h-50zM34 80.5h44v3h-44zM34 104.5h56v3h-56zM34 128.5h38v3h-38zM34 152.5h50v3h-50z"/><rect class="wf-line" x="10" y="72" width="100" height="20" rx="6"/><rect class="wf-line" x="10" y="96" width="100" height="20" rx="6"/><rect class="wf-line" x="10" y="120" width="100" height="20" rx="6"/><rect class="wf-line" x="10" y="144" width="100" height="20" rx="6"/><rect class="wf-accent" x="14" y="172" width="92" height="16" rx="8"/></svg>'}
  ], lesson:'A/B-тест — дорогой ресурс: трать его на крупные и рискованные изменения интерфейса с гипотезой из данных, а косметику выкатывай и мониторь.'},
 {id:'s43', d:'exp', from:'data', c:['data','lead'], title:'Эффект пропал после раскатки',
  text:'Дима озадачен. Тест нового пейвола — план на первые 30 дней вместо списка функций — шёл три недели в январе и дал +12% к конверсии в оплату, p = 0,01, группы ровные. Пейвол раскатили на всех, и за четыре недели конверсия не сдвинулась: 5,0% до и 5,0% после, а ждали 5,6%. Андрей: «Выходит, тест нас обманул?» Лена предлагает вернуть старый пейвол.',
  options:[
   {t:'Откатить пейвол: раз на всех эффект не повторился, тест дал ложный сигнал, и держать вариант дальше — риск.', q:'bad', fx:{trust:2, morale:-3}, later:{in:1, fx:{conv:-0.002}, note:'Через месяц Дима всё же разобрал данные: на новичков новый пейвол работал, но на Android его видела лишь половина. Откат забрал и этот эффект.'},
    fb:'Ложный результат при p = 0,01 возможен, но это наименее вероятное объяснение. Тест доказал эффект в своих условиях: на январской аудитории и с той реализацией. Откатывая вслепую, ты можешь выбросить работающее изменение и так и не узнать, что поменялось при раскатке.'},
   {t:'Выждать ещё два месяца: эффект после раскатки часто проявляется не сразу, а данных пока маловато.', q:'bad', fx:{trust:-2}, later:{in:2, fx:{trust:-4}, note:'Через два месяца конверсия стояла на тех же 5,0%, и объяснить фонду, куда делся рост из плана, было нечем.'},
    fb:'Ожидание без гипотезы — не план. Отложенный эффект бывает у медленных метрик вроде удержания, а на пейволе человек решает сразу, и четырёх недель на всей базе для конверсии хватает с запасом. Если вариант видят не все или он работал только на части аудитории, через два месяца картина будет той же, а время на исправление уйдёт.'},
   {t:'Сразу перезапустить тот же тест 50/50 на всех: повторный замер честнее любых догадок о причинах.', q:'ok', later:{in:1, fx:{morale:-2}, note:'Повторный тест через месяц показал почти ноль. Почему — так и осталось неясным, и разбирать причины всё равно пришлось.'},
    fb:'Повторный тест — честный замер, но дорогой: месяц трафика, и ответ будет «эффекта нет», а не «почему». Большинство причин — показ варианта, состав аудитории, сезон, сегменты — проверяются за пару дней на данных, которые уже есть. Тест имеет смысл потом, чтобы подтвердить найденную причину.'},
   {t:'Сверить раскатку с тестом: все ли видят вариант, та ли аудитория и сезон, у кого был эффект, — и решать.', q:'best', later:{in:1, fx:{conv:0.003}, note:'Нашлись две причины. На Android новый пейвол видела только половина: у тех, кто не обновил приложение, остался старый экран. А в январе эффект почти целиком дали новички с новогодними целями — у давних бесплатных пользователей разницы не было. Починили показ, за давних пользователей взялись отдельно — конверсия выросла на честные 6%.'},
    fb:'A/B-тест доказывает эффект в условиях теста. Ты по очереди проверяешь, чем раскатка от них отличается: реализация и показ варианта, состав аудитории (новые и давние, платформы, каналы), время (новизна, сезон) и разный эффект по сегментам — а итог сверяешь с выручкой. Найденная причина подсказывает решение: чинить, нацеливать на сегмент или откатывать.'}
  ], lesson:'A/B-тест доказывает эффект в условиях теста, а не для любой аудитории: если после раскатки эффект пропал, ищи, чем раскатка отличается от теста.'},
 {id:'s44', d:'disc', from:'mkt', c:['user','data'], title:'Отзывы удваивают конверсию?',
  text:'В Ритме есть каталог челленджей от сообщества: 240 программ на 21–30 дней от блогеров и тренеров, участие — в Premium. Следующими в роадмапе стоят публичные отзывы, но зачем они, толком никто не сформулировал. Лена принесла цифры: со страниц челленджей с отзывами в триал уходят 8% посетителей, с остальных — 4%. «Отзывы удваивают конверсию! Давай просить отзыв у всех на третий день». Почти все отзывы сейчас — у 30 самых популярных челленджей.',
  options:[
   {t:'Просить отзыв у каждого участника на третий день: у челленджей с отзывами конверсия вдвое выше.', q:'bad', fx:{trust:3}, later:{in:1, fx:{ret:-0.004, trust:-2}, note:'Отзывов стало впятеро больше, но в основном «пока норм» на третий день. Конверсия страниц почти не сдвинулась, а окно посреди челленджа раздражало — часть участников бросила.'},
    fb:'Это корреляция, а не причина: популярные челленджи собирают и трафик, и отзывы, потому что они хороши, — отзывы скорее следствие, чем двигатель. К тому же на третий день человеку нечего рассказать, а окно посреди челленджа мешает самой привычке. Конверсия не удвоится от того, что отзывов станет больше.'},
   {t:'Не делать публичных отзывов: накрутки от авторов и травлю в комментариях нам без модерации не разгрести.', q:'ok', fx:{trust:-3},
    fb:'Риск настоящий: авторы будут накручивать пятёрки, а конкуренты — топить друг друга. Но его закрывают правила: отзыв оставляет только тот, кто прошёл челлендж, есть жалобы и проверка новых авторов. Отказываясь целиком, ты оставляешь участников без подсказки, какой из 240 челленджей им по силам.'},
   {t:'Сделать как на маркетплейсах — звёзды и текст — и записать в цель квартала 3 000 отзывов.', q:'bad', fx:{debt:4}, later:{in:2, fx:{trust:-3}, note:'Цель по отзывам выполнили — за счёт напоминаний и «5 звёзд, всё супер». Стали ли люди чаще стартовать челленджи, никто сказать не смог.'},
    fb:'Число отзывов — метрика выхода: её легко нагнать, и она ничего не говорит о том, помогают ли отзывы выбирать. Звёзды маркетплейса отвечают на вопрос «не обманут ли меня с товаром», а участнику челленджа нужно другое. Без названной задачи ты копируешь форму и считаешь активность вместо результата.'},
   {t:'Назвать задачу отзывов для участника и автора, узнать, почему их не пишут, а эффект мерить тестом.', q:'best', fx:{trust:-1}, later:{in:1, fx:{conv:0.002, ret:0.002}, note:'В интервью выяснилось: перед стартом людям важно одно — «осилю ли я». Отзыв стал двумя вопросами на финише: насколько сложно и сколько минут в день. Тест «отзывы показаны / скрыты» дал +12% к стартам триала — не вдвое, зато честно.'},
    fb:'8% против 4% — корреляция: у популярных челленджей больше и посетителей, и отзывов, а качество двигает и то и другое. Ты начинаешь с задачи — участнику решить «мне это по силам?», автору получить обратную связь и репутацию, — выясняешь, почему отзывов мало, а эффект меряешь тестом «показаны / скрыты» или сравнением похожих челленджей одной категории с похожим трафиком.'}
  ], lesson:'Сначала задача фичи, потом метрика. «С отзывами конверсия выше» — корреляция, а не причина: эффект проверяй тестом или сравнением похожих.'},
 {id:'s45', d:'prio', from:'design', c:['exec','data'], title:'Пять заноз в онбординге',
  text:'Кира прошла онбординг с 6 новичками и записала, где они спотыкались. Экранов четыре, после них — главный экран и первая отметка:<ul><li>Экран 1: размытый вопрос «Чего ты хочешь добиться?» — замялись 4 из 6.</li><li>Экран 2: обязательный аккаунт ещё до того, как человек что-то увидел, — поворчали 2 из 6.</li><li>Экран 3: 14 категорий привычек — путались все шестеро.</li><li>Там же, сразу после выбора: запрос на уведомления — отказали 3 из 6.</li><li>Экран 4: триал, цена и автопродление мелким шрифтом — 5 из 6 спросили, спишут ли деньги.</li></ul>Воронка за месяц: экран 1 открыли 10 000 человек, экран 2 — 9 200, экран 3 — 5 800, экран 4 — 5 100, первую отметку сделали 4 100. В спринт влезает одна доработка.',
  options:[
   {t:'Начать с экрана категорий: на нём путались все шестеро — это самая частая проблема в тестах.', q:'bad', fx:{morale:2}, later:{in:1, fx:{ret:0.002}, note:'Новый экран выбора вышел аккуратным: переход с него вырос с 88% до 93%. Но первую отметку стали делать лишь на пару сотен человек больше — основная масса по-прежнему уходила на экране аккаунта.'},
    fb:'Частота в юзабилити-тесте — ещё не потери: участники путались, но доходили, и в жизни экран 3 пропускает 88%. На тесте люди редко бросают — им неловко перед исследователем, а реальный новичок просто закрывает приложение. Больше всего людей теряется на экране 2: 3 400 из 9 200.', img:'<svg viewBox="0 0 120 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect class="wf-frame" x="2" y="2" width="116" height="196" rx="12"/><rect class="wf-block" x="50" y="7" width="20" height="3" rx="1.5"/><path class="wf-line" d="M15 18l-4 4 4 4M16.5 57a3.5 3.5 0 1 0 7 0a3.5 3.5 0 1 0 -7 0zM22.5 59.5l3 3"/><path class="wf-accent" d="M36 20.5h11v3h-11zM49 20.5h11v3h-11zM62 20.5h11v3h-11z"/><path class="wf-block" d="M75 20.5h11v3h-11z"/><rect class="wf-soft" x="12" y="70" width="46" height="38" rx="8"/><rect class="wf-soft" x="12" y="112" width="46" height="38" rx="8"/><rect class="wf-soft" x="62" y="112" width="46" height="38" rx="8"/><rect class="wf-line" x="12" y="70" width="46" height="38" rx="8"/><rect class="wf-line" x="12" y="112" width="46" height="38" rx="8"/><rect class="wf-line" x="62" y="112" width="46" height="38" rx="8"/><path class="wf-bar" d="M14 31h70v5h-70zM14 40h48v3h-48zM29 56h50v2h-50zM19 97h30v3h-30zM19 139h30v3h-30zM69 139h30v3h-30z"/><rect class="wf-line" x="10" y="50" width="100" height="13" rx="6.5"/><rect class="wf-accent" x="62" y="70" width="46" height="38" rx="8"/><path class="wf-icon" d="M19 84a6 6 0 1 0 12 0a6 6 0 1 0 -12 0zM19 126a6 6 0 1 0 12 0a6 6 0 1 0 -12 0zM69 126a6 6 0 1 0 12 0a6 6 0 1 0 -12 0z"/><path class="wf-soft" d="M69 84a6 6 0 1 0 12 0a6 6 0 1 0 -12 0zM69 97h30v3h-30z"/><path class="wf-accent" d="M44 157h28v3h-28zM74 156l3 2.5-3 2.5z"/><rect class="wf-accent" x="14" y="168" width="92" height="16" rx="8"/></svg>'},
   {t:'Перенести запрос уведомлений на момент после первой отметки и объяснить, зачем они нужны.', q:'ok', fx:{ret:0.002}, later:{in:1, fx:{ret:0.004}, note:'Уведомления стали разрешать 55% новичков вместо 38%, удержание на второй неделе подросло. А до первой отметки по-прежнему доходит 41%.'},
    fb:'Мысль верная: разрешение просят, когда человек увидел ценность, а без напоминаний трекер теряет удержание. Правка дешёвая и полезная, но бьёт после активации и воронку до первой отметки почти не меняет. Самая большая дыра остаётся на экране 2 — 37% уходят ещё до выбора привычки.', img:'<svg viewBox="0 0 120 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect class="wf-frame" x="2" y="2" width="116" height="196" rx="12"/><rect class="wf-block" x="50" y="7" width="20" height="3" rx="1.5"/><rect class="wf-soft" x="10" y="54" width="100" height="22" rx="6"/><rect class="wf-soft" x="10" y="86" width="100" height="94" rx="10"/><rect class="wf-line" x="10" y="86" width="100" height="94" rx="10"/><path class="wf-bar" d="M12 20h46v4h-46zM12 28h30v3h-30zM18 63h40v4h-40zM26 118h68v4h-68zM34 126h52v3h-52zM54 139h20v2h-20zM48 171h24v2h-24z"/><circle class="wf-accent" cx="16" cy="45" r="4"/><path class="wf-block" d="M26 45a4 4 0 1 0 8 0a4 4 0 1 0 -8 0zM40 45a4 4 0 1 0 8 0a4 4 0 1 0 -8 0zM54 45a4 4 0 1 0 8 0a4 4 0 1 0 -8 0zM68 45a4 4 0 1 0 8 0a4 4 0 1 0 -8 0zM82 45a4 4 0 1 0 8 0a4 4 0 1 0 -8 0zM96 45a4 4 0 1 0 8 0a4 4 0 1 0 -8 0z"/><circle class="wf-accent" cx="96" cy="65" r="7"/><path class="wf-soft" d="M92.25 66l1.5 -1.5 1.5 1.5 3.38 -3.38 1.5 1.5 -4.88 4.88z"/><path class="wf-accent" d="M60 95c-5 0-8 4-8 9v4l-3 4h22l-3-4v-4c0-5-3-9-8-9zM57 113a3 3 0 0 0 6 0z"/><rect class="wf-line" x="40" y="134" width="40" height="12" rx="6"/><path class="wf-line" d="M45 140a3 3 0 1 0 6 0a3 3 0 1 0 -6 0zM48 138v2h1.5"/><rect class="wf-accent" x="18" y="153" width="84" height="12" rx="6"/></svg>'},
   {t:'Пустить к первой отметке без аккаунта, а сохранить прогресс предложить уже после неё.', q:'best', fx:{debt:2}, later:{in:1, fx:{ret:0.01, conv:0.001}, note:'До выбора привычки стали доходить 85% вместо 63%, первую отметку делает 51% новичков вместо 41%. Аккаунт после отметки создают две трети: им уже есть что сохранять.'},
    fb:'Порядок правок задаёт воронка до метрики активации, а не число жалоб. Экран 2 теряет 37% — 3 400 человек в месяц, больше, чем все остальные шаги вместе, — и всё это до первой отметки. На тесте об аккаунте ворчали двое, потому что участники доводят дело до конца; в жизни люди молча закрывают приложение. Условия триала поправь заодно: это текст на день и вопрос честности.', img:'<svg viewBox="0 0 120 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect class="wf-frame" x="2" y="2" width="116" height="196" rx="12"/><rect class="wf-block" x="50" y="7" width="20" height="3" rx="1.5"/><rect class="wf-soft" x="3" y="100" width="114" height="96" rx="11"/><path class="wf-bar" d="M12 20h46v4h-46zM34 76h52v4h-52zM42 84h36v3h-36zM26 143h68v4h-68zM34 151h52v3h-52zM48 189h24v2h-24z"/><circle class="wf-accent" cx="60" cy="50" r="18"/><path class="wf-soft" d="M51.5 52l3.4 -3.4 3.4 3.4 7.65 -7.65 3.4 3.4 -11.05 11.05z"/><rect class="wf-block" x="52" y="105" width="16" height="3" rx="1.5"/><path class="wf-icon" d="M54.5 122a5.5 5.5 0 1 0 11 0a5.5 5.5 0 1 0 -11 0zM49 138c0-7 5-10 11-10s11 3 11 10z"/><rect class="wf-accent" x="14" y="159" width="92" height="11" rx="5.5"/><rect class="wf-line" x="14" y="174" width="92" height="11" rx="5.5"/><path class="wf-icon" d="M19.5 179.5a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0 -5 0z"/></svg>'}
  ], lesson:'Чини онбординг по воронке до метрики активации: первой идёт самая большая дыра, а не самая частая жалоба.'}

const SCEN_EN = {
 s1:{title:'“Let\'s build a friends feed”', text:'A competitor just launched a social feed where friends can see each other\'s progress. Andrew is convinced Rhythm needs one too: “It\'s two months of dev work, but it\'s worth it.”', options:[
   {t:'Take it on: social features are a proven retention driver, and the competitor is already pulling ahead.', fb:'Building a feature without validating the problem is the most expensive way to test a hypothesis. Two months of team time went into a solution nobody validated.', note:'The feed shipped — only a handful of people use it, and retention barely moved.'},
   {t:'First, 8–10 problem interviews plus usage data: do users share their progress today, with whom, and why?', fb:'You\'re testing the problem, not the solution. Instead of an expensive feed, you find a narrow, cheap feature that hits a real pain point.', note:'Interviews showed people don\'t need a feed — they need support from one close person. You built a lightweight “habit buddy” — retention went up.'},
   {t:'Fake door: a “Friends” button in the menu for a week. If over 5% of active users click, interest is proven — build it.', fb:'A fake door measures interest fast but doesn\'t explain the “why.” Great as a first step; paired with interviews it would be ideal.', note:'The fake door showed moderate interest — you shipped a stripped-down version.'},
   {t:'Pass for now: the roadmap is locked, and a feed would derail the onboarding work. Revisit it at next quarter’s planning.', fb:'Saying no without data damages your relationship with a stakeholder. Better to offer a fast, cheap way to test the idea.'}
 ], lesson:'Validate the problem before the solution: interviews, data, and fake doors are cheaper than two months of development.'},
 s2:{title:'200 reviews asking for dark mode', text:'Olivia sends over an export: more than 200 reviews in a month asking for dark mode, some of them one-star. “People are angry — let\'s just build it.”', options:[
   {t:'Ship dark mode this sprint: 200 reviews is a strong signal, and it’s only a couple of days of work.', fb:'Sometimes a request is literal, and building it is fine. But a request at this scale is your cue to find out which user job is behind it.'},
   {t:'Get on calls with 6 of the reviewers and find out when, where, and why they actually open the app.', fb:'Jobs To Be Done: behind “dark mode” was the job “quickly log the day in bed before sleep without fully waking up.” The solution ended up broader and more valuable than the request.', note:'Turns out people log their habits in bed before going to sleep. You built a night mode — dark theme, quiet reminders, one-tap check-off.'},
   {t:'Skip it: dark mode is cosmetic and won’t move retention. Reply in the store that it’s planned.', fb:'A recurring signal from support is valuable discovery input, even when users phrase it as a ready-made solution.'}
 ], lesson:'Users bring solutions; the PM\'s job is to dig down to the job (JTBD) they\'re trying to get done.'},
 s3:{title:'58% leave after day one', text:'Dan shows you the numbers: 58% of new users don\'t come back on day two. “There\'s a hole somewhere in onboarding, but we can\'t tell where.”', options:[
   {t:'Full redesign: the UI looks dated, our store screenshots lose to rivals, and first impressions decide D1.', fb:'A redesign without a diagnosis is a shot in the dark. First find exactly where and why the user journey breaks.', note:'The redesign shipped. D1 barely moved — the problem was never the visuals.'},
   {t:'Break down the onboarding funnel step by step and run 5 usability tests with brand-new users.', fb:'Quantitative data shows where the problem is; qualitative shows why. Funnel analysis plus usability testing is the backbone of discovery.', note:'Found it: the “pick 5 habits” step scares people off. You cut it to one — D1 rose noticeably.'},
   {t:'Daily reminder pushes for new users: push is a habit tracker’s main re-engagement channel.', fb:'A short-term bump at the cost of long-term retention and your app rating. You\'re treating the symptom, not the cause.', note:'Push spam: users turn off notifications and delete the app.'}
 ], lesson:'Data tells you “where,” talking to users tells you “why.” Don\'t pick a solution before you have a diagnosis.'},
 s4:{title:'Rhythm for enterprise?', text:'Lena is fired up: “A friend of mine who works in HR at a bank wants Rhythm for their employees. Let\'s build a corporate version with an admin panel and reports!”', options:[
   {t:'Build the B2B version: admin panel, reports, SSO. Enterprise deals pay far more, and the bank is a ready client.', fb:'One HR friend is not a market. A new segment needs its own discovery: whose pain is it, who pays, how long is the sales cycle?'},
   {t:'10 interviews with HR directors, plus one pilot you run entirely by hand (a concierge MVP).', fb:'Concierge MVP: you sell and deliver by hand before writing any code. If people pay for the manual service, it\'s worth automating.'},
   {t:'Put it off until next year: B2C isn’t profitable yet, and a small team can’t split across two segments.', fb:'Focus is a legitimate choice. But without a quick, cheap test, you\'ll never know the cost of the missed opportunity.'}
 ], lesson:'Test a new segment manually (concierge / Wizard of Oz), not by building it.'},
 s5:{title:'Three “urgent” requests, one sprint', text:'Andrew wants gamification, Lena wants a referral program, and Olivia wants cross-device sync fixed — 12% of paying users complain about it. You only have capacity for one.', options:[
   {t:'Do all three in parallel, each cut down to an MVP, so no stakeholder walks away empty-handed.', fb:'Working on everything at once means nothing gets finished. Capacity is finite, and context switching is expensive.'},
   {t:'Score all three requests with RICE and share the math openly with every stakeholder; sync goes first.', fb:'Transparent prioritization defuses the conflict: people argue with the formula, not with you. A bug hitting 12% of paying users moves retention more than new features do.'},
   {t:'Gamification: Andrew sees the big picture, and streaks and badges are a proven retention lever.', fb:'HiPPO (highest paid person’s opinion) is not a prioritization method. The paying users\' problem is still unsolved.'}
 ], lesson:'Prioritize with a transparent framework (RICE/ICE) and show your math to stakeholders.'},
 s6:{title:'Tech debt is choking releases', text:'Tim: “Every release breaks something. Give me a full sprint for refactoring.” The big marketing campaign is a month away.', options:[
   {t:'Say no until after the campaign: a wave of new users lands in a month, so features come first.', fb:'Tech debt works like a loan: every sprint you don\'t service it makes the next ones more expensive and riskier.'},
   {t:'Agree with Tim on a standing 20% of every sprint’s capacity for tech debt, starting with this one.', fb:'Regular hygiene beats rare heroic sprints: the business gets predictability, and risk goes down continuously.'},
   {t:'Give Tim a full refactoring sprint now: better to clean up the code before the campaign than firefight under load.', fb:'Cuts the debt a lot, but freezing features right before the campaign costs you trust with the business.'}
 ], lesson:'Reserve a fixed share of capacity for tech debt instead of letting it pile up into a crisis.'},
 s7:{title:'Friday, 7:40 PM. Payments are broken', text:'Since yesterday\'s release, subscription payments have been failing for 6% of users. The team is already heading home.', options:[
   {t:'Roll back the release, message the affected users, and hold a blameless postmortem on Monday.', fb:'Rolling back is the fastest way to stop the bleeding. Honest communication preserves trust; a blameless postmortem prevents a repeat.'},
   {t:'Send the team home and dig in on Monday with fresh eyes: 94% of payments go through, and late-night fixes break more.', fb:'Every hour of broken payments means lost revenue and paying users churning.'},
   {t:'Keep the team late and hotfix it tonight: the bug looks contained, so that’s faster than a full rollback.', fb:'It might work, but fixing forward under pressure is risky. A rollback is usually safer and faster.'}
 ], lesson:'In an incident, stop the damage first (roll back), then communicate, then run the postmortem.'},
 s8:{title:'A competitor launched an AI coach', text:'Industry chats are buzzing: a competitor now has an AI coach that picks habits for you. Andrew is nervous: “We\'re falling behind!”', options:[
   {t:'Copy it fast and pause everything else: with LLM APIs, an AI coach is a two-sprint job.', fb:'Reactive copying pulls you off your own strategy. First figure out whether this threatens the job users choose you for.', note:'A half-baked AI coach shipped. There\'s an effect, but it\'s small.'},
   {t:'Check the data for churn to the competitor and interview 5 users who left; decide in 2 weeks.', fb:'Competitive analysis through the lens of your own users: what they “hire” you for and why they leave.', note:'Turns out users aren\'t leaving because of AI — they\'re leaving because setup is complicated. You built personalized tips instead — cheaper and more targeted.'},
   {t:'Don’t react: we have our own strategy, and AI features like this often turn out to be hype.', fb:'Staying calm is good, but ignoring it without data leaves the risk in place and stakeholders anxious.'}
 ], lesson:'Answer a competitor\'s move with data on your own users, not by copying.'},
 s9:{title:'A 12-month roadmap “with dates”', text:'Ahead of the next tranche, North Ventures asks for a 12-month roadmap with specific release dates for every feature.', options:[
   {t:'A year of features with dates, each padded by 30%: the fund gets exactly what it asked for.', fb:'Feature-by-date commitments a year out are promises that almost always slip: uncertainty grows with the horizon.', note:'Two dates on the roadmap slipped. The investor is disappointed.'},
   {t:'Now / Next / Later with metric-based goals for each horizon; dates only for the next quarter.', fb:'An outcome-based roadmap shows which results you\'re driving and leaves room to choose the solutions.'},
   {t:'Explain that year-out dates are fiction at a startup: we iterate fast and share plans sprint by sprint.', fb:'Agile doesn\'t mean no planning. Stakeholders need a predictable direction.'}
 ], lesson:'A roadmap is about outcomes, not a list of features with dates.'},
 s10:{title:'What\'s our North Star?', text:'Andrew wants one key metric the whole team will live by. The options on the whiteboard:', options:[
   {t:'Installs: everyone understands them, from investors to marketing, and they update daily.', fb:'Installs are a vanity metric: they grow with marketing and say nothing about the value of the product.'},
   {t:'MAU — monthly active users: the industry standard investors benchmark us on.', fb:'Better than installs, but it doesn\'t show whether people get value: you can open the app and do nothing.'},
   {t:'Number of users who logged habits on at least 3 different days in a given week.', fb:'A good North Star reflects user value and predicts revenue. Regular check-ins are the core value of a habit tracker.'},
   {t:'Revenue: the business runs on money, and there’s no fooling yourself with it.', fb:'Revenue is an outcome, not a driver: it lags and gives the team little guidance on what to do tomorrow.'}
 ], lesson:'A North Star reflects user value and is a leading indicator of revenue.'},
 s11:{title:'“CAC just got cut in half!”', text:'Lena is beaming: she moved budget into incentivized traffic (installs in exchange for rewards inside other apps), and CAC per install dropped by half.', options:[
   {t:'Double the budget there: at half the cost per install, the same money brings in twice the users.', fb:'A cheap install ≠ a cheap customer. Incentivized traffic barely retains and almost never pays — CAC per payer went up.'},
   {t:'Compare cohort retention and paid conversion across channels before moving any budget.', fb:'Unit economics are calculated for the channel end to end: CAC ÷ paid conversion, against the LTV of that specific cohort.', note:'You switched off the “junk” channel and reallocated the budget — CAC per payer went down.'},
   {t:'Set a rule: marketing clears channel changes with product in advance, so there are no surprises.', fb:'Control instead of analysis kills experimentation. You need a shared metric (CAC per payer), not bans.'}
 ], lesson:'Look at CAC per payer and retention by channel, not at the cost of an install.'},
 s12:{title:'Raise the price from $9 to $13?', text:'Andrew thinks Rhythm is worth more: “Let\'s raise the subscription to $13 — revenue goes up 44%.”', options:[
   {t:'Raise it for everyone at once, current subscribers included: full revenue impact, and one simple price.', fb:'A sharp price hike for existing users risks churn and a wave of backlash. Price elasticity is unknown.'},
   {t:'Run an A/B test of the new price on new users; keep current subscribers on the old price.', fb:'Price is your most powerful revenue lever. Test elasticity on new users and protect loyal ones (grandfathering).', note:'The test showed that at $12, revenue per user is higher and conversion barely dipped. You rolled it out to new users.'},
   {t:'The opposite: cut it to $6 — more payers, and a bigger base outweighs the lower price.', fb:'A discount lifts conversion, but not necessarily revenue. Do the math — ARPU = paid conversion × ARPPU: here it went down.'}
 ], lesson:'Test pricing with an experiment; look at ARPU, not just conversion.'},
 s13:{title:'A discounted annual plan', text:'Dan proposes an annual plan at 35% off the monthly price and asks for your take.', options:[
   {t:'Launch it and make annual the default on the paywall, with the savings shown right next to the price.', fb:'An annual plan brings money in up front (cash!) and reduces churn. The trade-off: a slightly lower average monthly payment.'},
   {t:'Don’t launch: 35% off means losing a third of revenue from people who’d have paid monthly anyway.', fb:'The discount does lower the average payment, but you miss out on prepayment and the lower churn of annual subscribers.'},
   {t:'Offer a $30 lifetime plan instead: lots of cash up front, and people would rather pay once.', fb:'A lifetime plan gives you a one-time cash injection but eats your recurring revenue: LTV is capped forever.'}
 ], lesson:'Annual plans improve cash flow and retention; lifetime plans eat into LTV.'},
 s14:{title:'4 days in, p = 0.03. Ship it?', text:'The new paywall test is planned for 14 days. On day four, Dan messages you: “+11% conversion, p = 0.03! Should we roll it out?”', options:[
   {t:'Ship it: p = 0.03 is below the 0.05 threshold, and meanwhile half our traffic sees the worse paywall.', fb:'Peeking: if you check the p-value every day and stop at the first significant result, your false positive rate multiplies.', note:'The effect “deflated” — it was noise caught by peeking.'},
   {t:'Wait the full pre-calculated 14 days — two complete weekly cycles and the planned sample size.', fb:'Duration and sample size are fixed in advance. Full weeks cancel out day-of-week effects.', note:'The test ran its course: the effect held up, but it was smaller — around +6%.'},
   {t:'Stop the test and keep the new paywall: it’s winning on both the numbers and user feedback.', fb:'Without a completed test, you don\'t know the effect size and could roll out something that makes things worse.'}
 ], lesson:'Don\'t peek: calculate the sample size up front and wait until you hit it.'},
 s15:{title:'Conversion +15%, but refunds ×2', text:'The new paywall lifted paid conversion by 15%. A week later, refund requests have doubled, and reviews mention a “hidden subscription.”', options:[
   {t:'Ship it: a 15% lift more than covers the refunds, and we’ll tweak the copy next release.', fb:'Guardrail metrics (refunds, complaints, churn) protect you from “wins” that hurt the business.', note:'A wave of cancellations and refunds; the app store rating dropped.'},
   {t:'Calculate 30-day revenue per user net of refunds, strip out the dark patterns, then relaunch.', fb:'You look at the end value, not an intermediate metric, and fix the root cause — the misleading design.'},
   {t:'Roll it back and drop the paywall work: our reputation is worth more than 15% conversion.', fb:'Safe, but you\'re throwing away whatever worked in the variant. Better to figure out what actually drove the lift.'}
 ], lesson:'Every test needs guardrail metrics.'},
 s16:{title:'20 push variants and one “winner”', text:'Lena launched 20 variants of reminder copy at once. One showed p = 0.04. “We have a winner!”', options:[
   {t:'Roll the winner out: p = 0.04 is significant, and a bad push text is easy to undo.', fb:'With 20 comparisons at α = 0.05, you\'d expect about one “significant” result by pure chance. That\'s the multiple comparisons trap.'},
   {t:'Re-run the winner in a separate head-to-head test against the control group.', fb:'A replication test is the most reliable way to separate signal from noise.', note:'The re-test: the “winner” didn\'t hold up, but you found another variant that works.'},
   {t:'Take the top 3 and keep testing with a multiple comparisons correction.', fb:'Right idea (Bonferroni / FDR), but a correction requires a bigger sample — the test will drag on.', note:'With the Bonferroni correction, no variant cleared the threshold — but you narrowed the search.'}
 ], lesson:'More comparisons → more false discoveries. Correct for it or re-test.'},
 s17:{title:'“Why do we even need these tests?”', text:'Andrew is irritated: “Tests slow us down. I already know what users need. Let\'s just ship.”', options:[
   {t:'Agree and ship straight away, watching the dashboards: at our traffic levels, learning fast beats statistical precision.', fb:'Without experiments, you can\'t tell the effect of your changes apart from seasonality and noise.', note:'One of the “obvious” changes quietly dragged down conversion — nobody noticed for a month.'},
   {t:'Show 3 past calls where intuition was wrong, and agree to test only what’s expensive to roll back or touches revenue.', fb:'Agreeing on what gets tested resolves the tension between speed and quality.'},
   {t:'Test every single change, down to button colors: make one exception and the whole experimentation culture falls apart.', fb:'Testing small tweaks with tiny effects is expensive: there isn\'t enough traffic, and the team slows down.'}
 ], lesson:'Test what\'s expensive, risky, or non-obvious; ship the small stuff and monitor it.'},
 s18:{title:'NPS crashed from 41 to 29', text:'Olivia is worried: NPS dropped from 41 to 29 in a month, and the comments are all over the place — from pricing to bugs. Andrew is already asking what happened and whose fault it is.', options:[
   {t:'Slice NPS by platform, app version, and cohort, read the detractors’ comments, and call 8 of them.', fb:'An aggregate hides where the drop comes from. Segments show who and after what; talking to detractors shows why. A diagnosis takes days, not a quarter.', note:'The drop sat in one cohort: after update 3.4, Android was resetting reminder times. You fixed it and apologized — NPS and retention recovered.'},
   {t:'Take the top 3 complaints by number of mentions and put them straight into the next sprint.', fb:'Mention counts show what’s loudest, not what changed. You’d be treating the evergreen complaints and could miss whatever caused this particular drop.'},
   {t:'It’s probably sampling noise — NPS jumps around. Wait a month and see whether the trend holds.', fb:'Noise is a hypothesis, and you can check it in a day: sample size and a segment breakdown. A month of waiting is a month for the problem to spread.', note:'It wasn’t noise: over the month the problem reached new cohorts, and retention dipped.'},
   {t:'Make NPS support’s key metric, with a target of 41 by quarter-end — someone has to own it.', fb:'NPS reflects the whole product, and support doesn’t control it. A target with no levers behind it leads to gaming the number — like surveying only happy users.'}
 ], lesson:'When an aggregate metric drops, segment first (who, where, after what), then talk to those people.'},
 s19:{title:'“Too expensive” — or is it?', text:'Dan brings the cancellation survey: 62% picked “too expensive.” But the data shows the same people stopped logging habits 2–3 weeks before they canceled. Andrew is already pitching a discount.', options:[
   {t:'Talk to 8 recent churners about when and why they stopped logging habits — not about the price.', fb:'The survey captures what people say on the way out; the data shows when they actually left. Interviews about that real moment surface the cause — “too expensive” often means “no longer worth it.”', note:'Turns out people broke their streak, got discouraged, and quit. You added a “streak freeze” and a gentle comeback after a missed day — churn went down.'},
   {t:'Offer users who cancel 50% off for three months: they told us themselves the problem is the price.', fb:'A save offer will keep some payers, but you’re treating price when people left the product before they left the subscription. The cause stays, and users soon learn to cancel just to get the discount.'},
   {t:'Leave it: “too expensive” is the polite default answer — people pick it at cancellation everywhere.', fb:'The observation is right — cancellation answers are unreliable. But concluding “do nothing” throws away a strong signal in the data: usage drops long before people cancel.', note:'Churn kept climbing, and nobody ever went looking for the cause.'},
   {t:'Rework the cancellation survey: add more answer options and a free-text “tell us more” field.', fb:'A better instrument helps, but it’s still self-reporting at the worst possible moment, and new answers take weeks to pile up. The behavior data has already told you where to look.', note:'The new survey produced more varied answers, but it still took another month to get to the real cause.'}
 ], lesson:'Behavior beats stated reasons: check survey answers against the data and dig into the moment people stopped getting value.'},
 s20:{title:'Just ask everyone what to build?', text:'Andrew wants to send all 45,000 users a survey — “Which features should we add to Rhythm?” — with a list of 15 ideas: “Let the users pick the roadmap themselves.”', options:[
   {t:'Send it as is: thousands of responses are real statistics, not the opinion of a couple of people.', fb:'Picking from a feature list is a question about solutions, not problems. The most engaged users answer, and they pick whatever sounds nice. You get a ranking of wishes, not causes.', note:'You built the survey’s winning feature — far fewer people use it than voted for it.'},
   {t:'Start with 8 interviews about how people keep habits, then a survey to size what you found.', fb:'Interviews uncover problems you didn’t know about; a survey measures how widespread they are. Andrew still gets his survey — just with the right questions.', note:'Interviews surfaced 4 recurring problems, and the survey showed the biggest one: people set an “every day” goal and burn out. You added a “starter pace” — retention went up.'},
   {t:'Keep the survey but ask about problems, not features: “What gets in the way of your habits?”', fb:'Better: it asks about problems, not solutions. But open-ended answers from thousands of people are shallow and hard to analyze — without interviews, you don’t know what to dig into.', note:'Thousands of answers boiled down to “no time” and “I forget.” You made reminders smarter — the effect was modest.'},
   {t:'Skip the survey: users don’t know what they want — “a faster horse,” as Ford supposedly said.', fb:'The horse quote is about not asking users for solutions, not about never asking them anything. People know their problems perfectly well, and a CEO’s initiative is better redirected than killed.'}
 ], lesson:'Surveys measure; interviews discover. Find the problems in conversations first, then size them with a survey.'},
 s21:{title:'Students or professionals?', text:'Dan clustered the user base. Students: 55% of users, happy to invite friends, but only 2% pay. Professionals 30+: 20% of users, 11% pay, but they arrive almost exclusively through paid ads. You only have room for deep discovery on one segment.', options:[
   {t:'Focus on students: interviews about classes and exams, and a bet on growth through friend invites.', fb:'You’re buying cheap organic growth and a big user base. You pay in monetization: revenue will lag, and you’ll have to figure out how to get students to pay later.', note:'Students brought their classmates along: organic growth picked up noticeably, while revenue barely moved.'},
   {t:'Focus on professionals 30+: interviews about work and health, and a bet on value people pay for.', fb:'You’re buying monetization: these people pay for value and stick around longer. You pay in growth: nearly every user comes from expensive ads, there’s no organic, and the base grows slowly.', note:'Professionals told you about their morning routine — you built a daily plan, and payers started sticking around longer.'},
   {t:'Run ads and referrals to both segments for two weeks, then pick whichever one shows the better numbers.', fb:'The segments’ strengths are already visible in the data — a test would only repeat them. You pay time and money to postpone a strategic choice the numbers won’t make for you.'},
   {t:'Build a single “busy 25–35-year-old” persona — a happy medium between the two segments.', fb:'An averaged persona describes someone who doesn’t exist. A product “for everyone” ends up for no one — and you haven’t avoided the segment choice, just hidden it.', note:'Features built for the “average user” didn’t land with students or professionals.'}
 ], lesson:'There’s no free option: choosing a segment means choosing what you pay with — growth or monetization. Name the price explicitly and choose deliberately.'},
 s22:{title:'Brazil out of nowhere', text:'Lena noticed that installs from Brazil grew fourfold in two months, even though Rhythm is only available in English and Russian. “Let’s localize into Portuguese — it’s a new market!”', options:[
   {t:'Localize everything while the wave lasts: UI, push notifications, store listing, and prices in reais.', fb:'You’re investing in a market without knowing why it showed up. If the spike is a one-off, the localization becomes an expensive monument to it.', note:'The localization shipped six weeks later — by then the flow from Brazil had almost dried up.'},
   {t:'First find out where the wave came from: dig into sources and cohorts, call 5 users in Brazil.', fb:'An anomaly in the data is a gift for discovery: someone found value in the product you don’t know about. First understand what job they “hired” Rhythm for, then decide what to scale.', note:'The cause: a Brazilian creator’s video about a 30-day challenge. You built a shareable challenge template — it spread well beyond Brazil.'},
   {t:'Machine-translate the UI in a week: it’s cheap, and we’ll see right away whether retention moves.', fb:'A cheap experiment is a good instinct, but it tests the hypothesis “language is the barrier,” which nobody actually stated. And a clunky translation can cost you ratings.'}
 ], lesson:'An unexpected spike calls for “why?” before “how do we scale it?”'},
 s23:{title:'Quarterly OKRs', text:'North Ventures wants quarterly OKRs ahead of the board meeting. Every lead has already sent in their goals — the draft has 6 objectives and 19 key results.', options:[
   {t:'Keep all 6 objectives: each team owns its area, and nobody feels their work got pushed aside.', fb:'OKRs that include everything are a to-do list, not a focus. The team spreads itself across 19 results and misses most of them.', note:'By quarter-end you’d hit 4 of 19 KRs — the board meeting got uncomfortable.'},
   {t:'One objective — “new users lock in a habit in their first 2 weeks” — with 3 measurable retention KRs.', fb:'One objective targets the business’s main constraint, and the KRs measure outcomes, not shipped features. The rest of the work doesn’t disappear — it just stops pretending to be a priority.', note:'The whole team aimed at one goal — retention in new cohorts rose noticeably.'},
   {t:'Turn roadmap features into KRs: “ship widgets,” “launch smart tips” — clear and easy to check.', fb:'That’s output, not outcome: you can ship everything on the list and move no metric at all. A KR describes a change, not a task.', note:'Every feature shipped and the KRs were “done” — but when the fund asked what changed in the numbers, you had no answer.'},
   {t:'Take the fund’s target — MRR up 30% this quarter — and break it down into KRs for each team.', fb:'Tying into the investor’s goals is a plus, but MRR is a lagging result, and individual teams have no lever on it. Better to pick the driver of MRR the team can actually move.'}
 ], lesson:'OKRs are about focus: few objectives, and KRs about outcomes, not shipped features.'},
 s24:{title:'Down one iOS developer', text:'Tim: “Our strongest iOS developer leaves in two weeks, and we won’t find a replacement for 2–3 months.” The quarter’s plan has widgets for Lena’s campaign and 20% for tech debt. It won’t all fit.', options:[
   {t:'Keep the 20% for tech debt and stability, push widgets to next quarter, and tell Lena right now.', fb:'You protect the health of the product and the team: releases stay stable, and the people left don’t burn out. You pay in growth — the campaign will be weaker, and Lena has to rework her plan.', note:'The campaign launched without widgets — the response was weaker, and installs cost more.'},
   {t:'Ship widgets for the campaign and freeze tech debt for a quarter, with a return date and risk log.', fb:'You’re buying growth: the campaign launches with a strong hook. You pay in tech debt — it grows, and you must bring back the 20% after the quarter, or the pause becomes the norm.', note:'Widgets shipped in time for the campaign: installs got cheaper and paid conversion ticked up. But releases started breaking more often.'},
   {t:'Cut nothing: the rest of the team will manage if everyone pushes a bit harder for one quarter.', fb:'You can’t make up a quarter of your capacity with enthusiasm. If you don’t choose what to cut, things cut themselves — quality and people.', note:'By mid-quarter another developer was talking about leaving, and release bugs became more frequent.'},
   {t:'Bring in an experienced contractor for three months to plug the gap and leave the quarter’s plan untouched.', fb:'Money buys hours, not context: a contractor needs a month to ramp up, and the team maintains their code afterward. The plan survives on paper; the choice is just postponed.'}
 ], lesson:'When capacity shrinks, there’s no free option: decide explicitly what you pay with — growth or product health — and spell out the cost to stakeholders.'},
 s25:{title:'Andrew’s pet project', text:'Andrew is back from a conference: “We need an Apple Watch app. I wear a watch myself, and so does everyone around me.” Tim estimates 6 weeks. This quarter’s roadmap is entirely about new-user retention.', options:[
   {t:'Add it to the quarter: the CEO rarely asks for anything personally, and wearables really are trending.', fb:'Personal enthusiasm and a trend aren’t data. Six weeks go somewhere other than the quarter’s main goal, and the team learns the roadmap can be overridden by rank.', note:'The watch app shipped: 3% of users use it, and new-user retention didn’t budge.'},
   {t:'Run the idea through the roadmap criteria: how many users own a watch, and does it move the quarter’s goal?', fb:'One yardstick for everyone: the CEO’s idea isn’t rejected, it competes on equal terms. Data takes the personal out of the conversation, and a cheap slice of the idea often fits right now.', note:'Only 9% of users had a watch. Andrew suggested postponing it himself, and you shipped the cheap part — checking off a habit right from a notification — in 3 days.'},
   {t:'Give Andrew one developer “for an experiment” so the main plan doesn’t take a hit.', fb:'A compromise that looks free: a side project eats capacity and attention, and without success criteria it will only grow.'},
   {t:'Politely say no: the roadmap is agreed, and changing it mid-quarter sends the team a bad signal.', fb:'A roadmap protects focus, but a flat “no” to the CEO without analysis turns a product discussion into a power struggle — and you’ll lose the next one.'}
 ], lesson:'The CEO’s ideas go through the same criteria as everyone else’s: not “yes,” not “no,” but “let’s run the numbers.”'},
 s26:{title:'A deal with a gym chain', text:'Lena brings a deal: the Pulse gym chain will buy 3,000 annual subscriptions for its members — $45,000 up front. The condition: integrate their login and a branded screen within 6 weeks. That’s half the team’s capacity for the quarter.', options:[
   {t:'Take it: build the integration as a separate module in a strict timebox and push the roadmap back.', fb:'You’re buying cash and early revenue — for an unprofitable startup, that’s months of runway. You pay in focus and tech debt: the custom code stays with you, and the retention roadmap slips.', note:'The money came in, but work on new-user retention slipped by two months.'},
   {t:'Counter-offer: standard promo codes now, the integration only if a pilot shows real activation.', fb:'You keep your focus and a clean codebase, and build the integration only once a pilot proves its value. You pay in cash: the partner buys less — and could have walked away entirely.', note:'Pulse took 800 subscriptions via promo codes instead of 3,000, and the team finished the retention work on schedule.'},
   {t:'Politely decline: custom development for a single client is the road to becoming an agency.', fb:'The principle is sound, but you didn’t negotiate: between “everything your way” and “no” there were options that kept both the money and the focus.'},
   {t:'Take it, and throw in white label and custom reports — let the first big client be absolutely thrilled.', fb:'Scope creep for a single client: you’re selling them a separate product, and every promise turns into support forever.', note:'Pulse buried the team in change requests, and the custom code broke with every release.'}
 ], lesson:'No deal is free: a client’s money is paid for with your team’s focus. Compare what you get with what you pay, and choose explicitly.'},
 s27:{title:'Paid conversion +1.4 pp overnight', text:'After release 3.2, paid conversion on the dashboard jumped from 5.0% to 6.4%. Andrew has already bragged about it to North Ventures. Dan can’t explain the lift: the release only had a new settings screen and an updated in-app purchase SDK.', options:[
   {t:'Work out which changes in 3.2 drove the lift and double down on them in the next sprint.', fb:'Amplifying an effect you don’t understand is building on sand. An unexplained jump gets checked for a data error first; only then do you look for a product cause.', note:'You spent a month amplifying an effect that didn’t exist: after the SDK update, restored purchases were counted as new payments. North Ventures asked which other numbers they shouldn’t trust.'},
   {t:'Reconcile purchase events with App Store and Google Play revenue for the same days.', fb:'Store revenue hadn’t moved: after the SDK update, restored purchases were being logged as new payments. An unexplained spike is a data suspect first, and the source of truth for money is billing.'},
   {t:'Wait a week: if the lift holds steady, it’s real — and then we can celebrate.', fb:'Caution is right, but time proves nothing: a tracking bug is just as “stable” as a real lift. Check the data source instead of waiting.', note:'A week later the lift was still there — and so was the bug: after the SDK update, restored purchases were logged as new payments. You had to send North Ventures a correction.'}
 ], lesson:'Before celebrating a metric spike, reconcile it with an independent source of truth — revenue, billing, raw logs.'},
 s28:{title:'“CAC is $2.1 — pour it on!”', text:'North Ventures sees a blended CAC of $2.1 in the report and suggests tripling the ad budget from $20k to $60k a month. Dan points out that blended includes free organic installs: a paid install costs $2.5, and payer LTV (~$63) is only slightly above CAC per payer (~$50).', options:[
   {t:'Triple the budget as the fund asks: blended CAC is low and the investor wants growth.', fb:'Blended CAC is diluted by free organic installs, and when you triple the budget each extra install gets pricier: bids go up, the audience burns out. At LTV/CAC ≈ 1.3, that just burns cash faster.', note:'Installs went up, but each additional one cost more: CAC per payer climbed to about $100 against an LTV of $63. You burned cash faster than MRR grew.'},
