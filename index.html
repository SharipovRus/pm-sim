<style>
:root{color-scheme:light dark; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
body{font-family:system-ui,sans-serif; font-size:14px}
img{max-width:100%}
[hidden]{display:none !important}
</style>
<title>Ритм · PM-симулятор</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#EDF0EA; --surface:#FFFFFF; --surface2:#F5F7F2; --ink:#16202A; --muted:#5A6570; --line:#D5DBD1;
  --accent:#2A4FE6; --accent-soft:#E3E8FD; --accent-ink:#FFFFFF;
  --xp:#D98E0B; --xp-soft:#FBEFD6;
  --good:#1D8657; --good-soft:#DDF2E7; --warn:#B87200; --warn-soft:#FAEBCF; --bad:#C23E2C; --bad-soft:#F8E0DB;
  --shadow:0 1px 0 rgba(22,32,42,.04), 0 8px 24px -12px rgba(22,32,42,.18);
  --display:"Unbounded", "Onest", system-ui, sans-serif;
  --body:"Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1217; --surface:#161B22; --surface2:#1C222A; --ink:#E6EBEE; --muted:#96A1AB; --line:#29313B;
    --accent:#7B93FF; --accent-soft:#1F2847; --accent-ink:#0E1217;
    --xp:#F0B340; --xp-soft:#3A2E14;
    --good:#43C488; --good-soft:#15301F; --warn:#E6A844; --warn-soft:#342812; --bad:#F2705B; --bad-soft:#3A1C17;
    --shadow:0 1px 0 rgba(0,0,0,.2), 0 10px 30px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1217; --surface:#161B22; --surface2:#1C222A; --ink:#E6EBEE; --muted:#96A1AB; --line:#29313B;
  --accent:#7B93FF; --accent-soft:#1F2847; --accent-ink:#0E1217;
  --xp:#F0B340; --xp-soft:#3A2E14;
  --good:#43C488; --good-soft:#15301F; --warn:#E6A844; --warn-soft:#342812; --bad:#F2705B; --bad-soft:#3A1C17;
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 10px 30px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased}
.app{max-width:1200px; margin:0 auto; padding-inline:16px; padding-block:18px 48px}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums}

/* HUD */
.hud{display:flex; flex-wrap:wrap; align-items:center; gap:14px 24px; margin-bottom:18px}
.brand{display:flex; align-items:baseline; gap:10px}
.brand b{font-family:var(--display); font-weight:700; font-size:22px; letter-spacing:-.01em}
.brand span{color:var(--muted); font-size:13px}
.track{flex:1 1 280px; display:flex; flex-direction:column; gap:6px; min-width:0}
.track-label{display:flex; justify-content:space-between; font-size:12px; color:var(--muted); letter-spacing:.04em; text-transform:uppercase}
.segs{display:grid; grid-template-columns:repeat(10,1fr); gap:4px}
.seg{height:8px; border-radius:2px; background:var(--line)}
.seg.done{background:var(--accent)}
.seg.now{background:var(--accent); opacity:.45; animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.9}}
.rank{display:flex; align-items:center; gap:10px; padding:6px 12px 6px 6px; background:var(--surface); border:1px solid var(--line); border-radius:999px}
.rank i{font-style:normal; font-family:var(--mono); font-size:12px; font-weight:600; background:var(--xp-soft); color:var(--xp); padding:3px 8px; border-radius:999px}
.rank b{font-size:13px; font-weight:600}
.lang{display:inline-flex; padding:3px; gap:2px; border:1px solid var(--line); border-radius:999px; background:var(--surface)}
.lang button{padding:4px 10px; border:0; border-radius:999px; background:none; cursor:pointer; font-size:12px; font-weight:700; letter-spacing:.04em; color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
.lang button:not([aria-pressed="true"]):hover{color:var(--accent)}

.grid{display:grid; grid-template-columns:minmax(0,1fr) 370px; gap:20px; align-items:start}
@media (max-width: 920px){ .grid{grid-template-columns:minmax(0,1fr)} }

/* Stage */
.stage{background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:26px; min-width:0}
@media (max-width:560px){ .stage{padding:18px} }
.eyebrow{display:flex; flex-wrap:wrap; align-items:center; gap:8px; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:14px}
.chip{display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:600; letter-spacing:.02em; text-transform:none; background:var(--surface2); border:1px solid var(--line); color:var(--ink)}
.chip.d-disc{background:#E6F3EC; border-color:#BFE0CD; color:#1B6B45}
.chip.d-prio{background:#F4E9FB; border-color:#DDC6EE; color:#6A2F93}
.chip.d-metr{background:#E3EAFD; border-color:#C3D0F7; color:#2440B8}
.chip.d-exp{background:#FCEBDD; border-color:#F0CDAE; color:#9A4A0E}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .chip.d-disc{background:#14301F;border-color:#23523A;color:#7DDBA9} :root:not([data-theme="light"]) .chip.d-prio{background:#2A1A38;border-color:#4A2F63;color:#D3A8F2} :root:not([data-theme="light"]) .chip.d-metr{background:#1A2446;border-color:#2E3F78;color:#9DB2FF} :root:not([data-theme="light"]) .chip.d-exp{background:#36220F;border-color:#5C3A1A;color:#F3B37C} }
:root[data-theme="dark"] .chip.d-disc{background:#14301F;border-color:#23523A;color:#7DDBA9}
:root[data-theme="dark"] .chip.d-prio{background:#2A1A38;border-color:#4A2F63;color:#D3A8F2}
:root[data-theme="dark"] .chip.d-metr{background:#1A2446;border-color:#2E3F78;color:#9DB2FF}
:root[data-theme="dark"] .chip.d-exp{background:#36220F;border-color:#5C3A1A;color:#F3B37C}

h1,h2,h3{text-wrap:balance; margin:0}
.h-display{font-family:var(--display); font-weight:700; letter-spacing:-.015em; line-height:1.15}
h2.h-display{font-size:clamp(20px,2.4vw,26px); margin-bottom:12px}
.lead{color:var(--muted); max-width:62ch}
p{margin:0 0 12px}

.msg-head{display:flex; align-items:center; gap:12px; margin-bottom:16px}
.ava{width:40px; height:40px; border-radius:12px; display:grid; place-items:center; font-weight:700; font-size:14px; color:#fff; flex:none}
.msg-who b{display:block; font-weight:600}
.msg-who span{font-size:13px; color:var(--muted)}
.msg-body{font-size:16px; max-width:64ch; margin-bottom:20px}

.opts{display:flex; flex-direction:column; gap:10px}
.opt{display:flex; gap:14px; align-items:flex-start; text-align:left; width:100%; padding:14px 16px; background:var(--surface2); border:1px solid var(--line); border-radius:12px; cursor:pointer; transition:border-color .15s, transform .15s, background .15s}
.opt:hover{border-color:var(--accent); background:var(--accent-soft)}
.opt:active{transform:translateY(1px)}
.opt kbd{flex:none; width:26px; height:26px; display:grid; place-items:center; border-radius:7px; border:1px solid var(--line); background:var(--surface); font-family:var(--mono); font-size:12px; color:var(--muted)}
.opt[disabled]{cursor:default; opacity:.55}
.opt[disabled]:hover{border-color:var(--line); background:var(--surface2)}
.opt.picked{opacity:1; border-color:var(--ink)}
.opt.is-best{border-color:var(--good); background:var(--good-soft); opacity:1}
.opt.is-wrong{border-color:var(--bad); background:var(--bad-soft); opacity:1}

.verdict{border-radius:12px; padding:16px 18px; margin-top:18px; border:1px solid}
.verdict.best{background:var(--good-soft); border-color:var(--good)}
.verdict.ok{background:var(--warn-soft); border-color:var(--warn)}
.verdict.bad{background:var(--bad-soft); border-color:var(--bad)}
.verdict h3{font-size:15px; font-weight:700; display:flex; align-items:center; gap:10px; margin-bottom:6px; flex-wrap:wrap}
.verdict h3 .xp{font-family:var(--mono); font-size:12px; background:var(--xp-soft); color:var(--xp); padding:2px 8px; border-radius:999px}
.verdict p{margin:0 0 8px; max-width:66ch}
.verdict p:last-child{margin-bottom:0}
.fx{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
.fx span{font-family:var(--mono); font-size:12px; padding:3px 8px; border-radius:6px; background:var(--surface); border:1px solid var(--line)}
.fx .up{color:var(--good)} .fx .down{color:var(--bad)}
.later{font-size:13px; color:var(--muted); margin-top:10px}

.actions{display:flex; flex-wrap:wrap; gap:10px; margin-top:20px; align-items:center}
.btn{display:inline-flex; align-items:center; gap:8px; padding:12px 20px; border-radius:11px; border:1px solid var(--line); background:var(--surface); cursor:pointer; font-weight:600}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.hint{font-size:12px; color:var(--muted)}

/* challenge */
.task-box{background:var(--surface2); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; overflow-x:auto}
table.t{border-collapse:collapse; width:100%; font-size:14px; min-width:360px}
table.t th, table.t td{padding:7px 10px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap}
table.t th:first-child, table.t td:first-child{text-align:left; white-space:normal}
table.t th{font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.04em}
table.t td{font-family:var(--mono); font-variant-numeric:tabular-nums}
table.t td:first-child{font-family:var(--body)}
table.t tr:last-child td{border-bottom:0}
@media (max-width:560px){ .task-box{padding:10px 8px} table.t{min-width:0; font-size:13px} table.t th, table.t td{padding:6px} }
.kv{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px}
.kv div{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 12px}
.kv small{display:block; font-size:12px; color:var(--muted)}
.kv b{font-family:var(--mono); font-size:18px}
.num-row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.num-row input{font-family:var(--mono); font-size:18px; padding:11px 14px; border-radius:11px; border:1px solid var(--line); background:var(--surface); color:var(--ink); width:200px; max-width:100%}
.num-row input:focus{outline:2px solid var(--accent); outline-offset:1px}

/* summary */
.deltas{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin:6px 0 18px}
.delta{border:1px solid var(--line); border-radius:12px; padding:12px 14px; background:var(--surface2)}
.delta small{display:block; color:var(--muted); font-size:12px}
.delta b{font-family:var(--mono); font-size:20px; display:block}
.delta em{font-style:normal; font-family:var(--mono); font-size:12px}
.up{color:var(--good)} .down{color:var(--bad)} .flat{color:var(--muted)}
.notes{display:flex; flex-direction:column; gap:8px; margin-bottom:18px}
.note{font-size:14px; padding:10px 14px; border-radius:10px; background:var(--accent-soft); border:1px solid var(--line)}
.note.warn{background:var(--warn-soft)}
.budget{border:1px solid var(--line); border-radius:12px; padding:16px; background:var(--surface2)}
.move{border:2px solid var(--accent); border-radius:14px; padding:16px; display:grid; gap:12px}
.move-head{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.move-head b{font-size:16px}
.move .hint{margin:0}
.chip.move-chip{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
@media (max-width:560px){ .move{padding:12px} .move .budget{padding:12px} .move .budget-calc{grid-template-columns:1fr 1fr} }
.budget-top{display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:8px}
.budget-top b{font-family:var(--mono); font-size:20px}
input[type=range]{width:100%; accent-color:var(--accent)}
.budget-calc{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px; margin-top:12px; font-size:13px}
.budget-calc div{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:8px 10px}
.budget-calc span{display:block; color:var(--muted); font-size:12px}
.budget-calc b{font-family:var(--mono)}

/* dash */
.dash{display:flex; flex-direction:column; gap:14px}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px}
.panel-title{display:flex; justify-content:space-between; align-items:baseline; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:12px}
.hero-metric{display:flex; justify-content:space-between; align-items:flex-end; gap:10px; padding-bottom:12px; border-bottom:1px solid var(--line); margin-bottom:12px}
.hero-metric small{display:block; color:var(--muted); font-size:12px}
.hero-metric b{font-family:var(--display); font-size:28px; font-weight:700; letter-spacing:-.02em}
.hero-metric svg{color:var(--accent); flex:none}
.tiles{display:grid; grid-template-columns:1fr 1fr; gap:10px 14px}
.tile small{display:block; color:var(--muted); font-size:12px}
.tile b{font-family:var(--mono); font-size:16px; font-weight:600}
.tile .row{display:flex; align-items:center; justify-content:space-between; gap:6px}
.tile svg{color:var(--muted)}
.pill{display:inline-block; font-size:11px; font-weight:700; padding:2px 7px; border-radius:999px; font-family:var(--body)}
.pill.good{background:var(--good-soft); color:var(--good)} .pill.warn{background:var(--warn-soft); color:var(--warn)} .pill.bad{background:var(--bad-soft); color:var(--bad)}
.bars{display:flex; flex-direction:column; gap:10px}
.bar-row{display:grid; grid-template-columns:110px 1fr 34px; align-items:center; gap:10px; font-size:13px}
.bar{height:8px; border-radius:4px; background:var(--surface2); border:1px solid var(--line); overflow:hidden}
.bar i{display:block; height:100%; border-radius:4px; background:var(--accent); transition:width .5s}
.bar i.good{background:var(--good)} .bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}
.bar-row b{font-family:var(--mono); font-size:12px; text-align:right}
.skill{display:grid; grid-template-columns:1fr auto; gap:4px 10px; font-size:13px}
.skill + .skill{margin-top:12px}
.skill .lvl{font-family:var(--mono); font-size:12px; color:var(--muted)}
.skill .bar{grid-column:1/-1}
.skill .bar i{background:var(--xp)}

/* intro & end */
.intro-hero{display:grid; gap:14px; margin-bottom:22px}
.intro-hero h1{font-family:var(--display); font-weight:700; font-size:clamp(26px,4vw,40px); letter-spacing:-.02em; line-height:1.08}
.rules{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; margin:18px 0}
.rule{border:1px solid var(--line); border-radius:12px; padding:14px; background:var(--surface2)}
.rule b{display:block; margin-bottom:4px}
.rule span{font-size:14px; color:var(--muted)}
.goals{display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 4px}
.grade{display:flex; align-items:center; gap:18px; flex-wrap:wrap; margin-bottom:18px}
.grade-badge{font-family:var(--display); font-weight:700; font-size:clamp(26px,4vw,36px); letter-spacing:-.02em}
.score{font-family:var(--mono); font-size:14px; padding:6px 12px; border-radius:999px; background:var(--xp-soft); color:var(--xp); font-weight:600}
.badges{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; margin:10px 0 20px}
.badge{border:1px dashed var(--line); border-radius:12px; padding:12px; font-size:13px; color:var(--muted)}
.badge b{display:block; font-size:14px}
.badge.on{border-style:solid; border-color:var(--xp); background:var(--xp-soft); color:var(--ink)}
.chip.dilemma{background:var(--xp-soft); border-color:var(--xp); color:var(--xp)}
.lb{background:var(--surface2); border:1px solid var(--line); border-radius:14px; padding:14px; margin:4px 0 22px}
.lb-form{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) auto; gap:8px}
.lb-form input{padding:11px 12px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font:inherit; min-width:0}
.lb-form input:focus{outline:2px solid var(--accent); outline-offset:1px}
.lb-msg{color:var(--bad); margin:10px 0 0}
table.lb-t td:nth-child(2), table.lb-t th:nth-child(2){text-align:left; white-space:normal}
table.lb-t td:first-child{color:var(--muted)}
table.lb-t td:nth-child(2), table.lb-t td:nth-child(3){font-family:var(--body)}
table.lb-t tr.me td{background:var(--accent-soft)}
table.lb-t a{color:var(--accent); text-decoration:none} table.lb-t a:hover{text-decoration:underline}
@media (max-width:560px){ .lb-form{grid-template-columns:minmax(0,1fr)} }
.share{display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:16px; align-items:center; background:var(--surface2); border:1px solid var(--line); border-radius:14px; padding:14px; margin:4px 0 22px}
.share img{display:block; width:100%; aspect-ratio:1200/630; border-radius:10px; border:1px solid var(--line); background:var(--bg)}
.share-btns{display:flex; flex-direction:column; gap:8px}
.share-btns .btn{justify-content:center; padding:10px 14px}
.share-btns .hint{margin:2px 0 0; text-align:center}
@media (max-width:560px){ .share{grid-template-columns:minmax(0,1fr)} }
.review-box{border:1px solid var(--line); border-radius:12px; padding:12px 14px; background:var(--surface2); font-size:13px}
.review-box b{display:block; margin-bottom:4px}
.review-box .bar{margin-top:8px}
.review{display:flex; flex-direction:column; gap:10px; margin-top:10px}
.rev{border:1px solid var(--line); border-radius:12px; padding:12px 14px; display:grid; grid-template-columns:auto 1fr; gap:4px 12px}
.rev .dot{width:10px; height:10px; border-radius:50%; margin-top:7px}
.rev .dot.best{background:var(--good)} .rev .dot.ok{background:var(--warn)} .rev .dot.bad{background:var(--bad)}
.rev b{font-size:14px}
.rev p{grid-column:2; margin:0; font-size:14px; color:var(--muted)}
.section-h{font-family:var(--display); font-size:17px; font-weight:700; margin:22px 0 8px}
/* glossary */
.term{display:inline; padding:0; margin:0; background:none; border:0; font:inherit; color:inherit; cursor:help; text-decoration:underline; text-decoration-style:dotted; text-decoration-color:var(--accent); text-underline-offset:3px; text-decoration-thickness:1px}
.term:hover{background:var(--accent-soft); border-radius:3px}
#pop{position:fixed; z-index:60; width:340px; max-width:calc(100vw - 24px); background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px 18px; box-shadow:0 18px 40px -18px rgba(0,0,0,.45); animation:fadeIn .16s ease both}
#pop.sheet{left:0 !important; right:0; top:auto !important; bottom:0; width:auto; max-width:none; border-radius:16px 16px 0 0; padding-bottom:calc(18px + env(safe-area-inset-bottom, 0px))}
#pop h4, .gitem h4{font-family:var(--display); font-size:16px; font-weight:700; margin:0 0 2px}
.term-sub{font-size:12px; color:var(--muted); margin-bottom:8px}
#pop p, .gitem p{margin:0 0 8px; font-size:14px}
.term-f{font-family:var(--mono); font-size:12.5px; background:var(--surface2); border:1px solid var(--line); border-radius:8px; padding:7px 10px}
.term-close{position:absolute; top:8px; right:10px; background:none; border:0; font-size:20px; line-height:1; color:var(--muted); cursor:pointer}
#pop[hidden], #sheet[hidden], #board[hidden]{display:none !important}
#sheet, #board{position:fixed; inset:0; z-index:70; background:rgba(10,14,18,.45); display:flex; align-items:flex-start; justify-content:center; padding:24px 16px}
.sheet-panel{background:var(--bg); border:1px solid var(--line); border-radius:18px; width:min(880px,100%); max-height:100%; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 30px 60px -30px rgba(0,0,0,.6)}
.sheet-head{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:16px 18px 12px}
.sheet-head b{font-size:19px}
#gsearch{margin:0 18px 12px; padding:10px 14px; border-radius:11px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font:inherit}
.sheet-body{overflow-y:auto; padding:0 18px 20px; display:flex; flex-direction:column; gap:18px}
.gsec-h{font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:10px}
.gitem{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:8px}
.hud-btn{padding:7px 14px; border-radius:999px; border:1px solid var(--line); background:var(--surface); cursor:pointer; font-size:13px; font-weight:600}
.hud-btn:hover{border-color:var(--accent); color:var(--accent)}
.fade{animation:fadeIn .35s ease both}
@keyframes fadeIn{from{transform:translateY(6px)} to{transform:none}}
@media (prefers-reduced-motion: reduce){ .fade,.seg.now{animation:none} .bar i{transition:none} }
</style>

<body>
<div class="app">
  <header class="hud" id="hud"></header>
  <div class="grid">
    <main class="stage" id="stage" aria-live="polite"></main>
    <aside class="dash" id="dash"></aside>
  </div>
</div>

<script>
/* ============ language ============ */
const LANGS = ['ru','en'], LANG_KEY = 'ritm-lang';
let LANG = (()=>{
  try{
    const q = new URLSearchParams(location.search).get('lang'); if(LANGS.includes(q)) return q;
    const s = localStorage.getItem(LANG_KEY); if(LANGS.includes(s)) return s;
  }catch(e){}
  return (navigator.languages||[navigator.language||'']).some(l=>/^(ru|uk|be|kk)/i.test(l)) ? 'ru' : 'en';
})();
const L = (ru, en) => LANG==='en' ? en : ru;

/* ============ analytics ============ */
// GoatCounter: no cookies, no personal data. Empty code = analytics off; never runs locally.
// Stats: https://sharipovrus.goatcounter.com
const GC_CODE = 'sharipovrus';
(()=>{
  if(!GC_CODE || location.protocol==='file:' || /^(localhost|127\.|\[::1\])/.test(location.hostname)) return;
  // /en/ redirects here and leaves the original referrer in sessionStorage, otherwise it would be lost
  let ref = null; try{ ref = sessionStorage.getItem('ritm-ref'); sessionStorage.removeItem('ritm-ref'); }catch(e){}
  // one path per language actually shown, without utm and other query noise
  window.goatcounter = Object.assign({path: ()=>location.pathname + (LANG==='en' ? '?lang=en' : '')}, ref!==null ? {referrer: ()=>ref} : {});
  const s = document.createElement('script');
  s.async = true; s.src = 'https://gc.zgo.at/count.js'; s.dataset.goatcounter = `https://${GC_CODE}.goatcounter.com/count`;
  document.head.appendChild(s);
})();
function track(ev){ try{ window.goatcounter?.count?.({path:`${ev}-${LANG}`, title:ev, event:true}); }catch(e){} }

/* ============ constants ============ */
const MONTHS = 10, TEAM_COST = 35000, MARGIN = 0.7, START_CASH = 350000, SAVE_KEY = 'ritm-pm-sim-v1';
// investor review: the second tranche depends on MRR growth by the end of REVIEW.month
const REVIEW = {month:5, tranche:300000, full:1.25, half:1.10};
// share of the team on tech debt (0–0.4): debt drifts +drift a month, each 10% of the team removes paydown/10
const DEBT_WORK = {drift:3, paydown:25, organic:1.5, morale:10, max:0.4, penalty:0.0015};
let DOMAINS, PEOPLE, QUAL, FX_META, CHAL_BONUS;
function i18nConsts(){
  const pp = L(' п.п.',' pp'), sgn = v => v>0 ? '+' : '−';
  DOMAINS = {
    disc:{name:'Discovery', full:L('Discovery и CustDev','Discovery and customer interviews')},
    prio:{name:L('Приоритизация','Prioritization'), full:L('Приоритизация и роадмап','Prioritization and roadmap')},
    metr:{name:L('Метрики','Metrics'), full:L('Метрики и юнит-экономика','Metrics and unit economics')},
    exp:{name:L('Эксперименты','Experiments'), full:L('A/B-тесты и аналитика','A/B tests and analytics')}
  };
  PEOPLE = {
    ceo:{name:L('Андрей','Andrew'), role:L('CEO и сооснователь','CEO & co-founder'), ini:L('АН','AN'), color:'#3B4A63'},
    mkt:{name:L('Лена','Lena'), role:L('Маркетинг','Marketing'), ini:L('ЛЕ','LE'), color:'#C2527A'},
    tech:{name:L('Тимур','Tim'), role:L('Техлид','Tech lead'), ini:L('ТИ','TI'), color:'#2E7D6B'},
    sup:{name:L('Оля','Olivia'), role:L('Поддержка','Support'), ini:L('ОЛ','OL'), color:'#B7791F'},
    data:{name:L('Дима','Dan'), role:L('Продуктовый аналитик','Product analyst'), ini:L('ДИ','DA'), color:'#4B5BD6'},
    inv:{name:L('Фонд «Север»','North Ventures'), role:L('Инвестор','Investor'), ini:L('ФС','NV'), color:'#6B5B4B'}
  };
  QUAL = {
    best:{label:L('Сильное решение','Strong call'), xp:30, pts:2},
    ok:{label:L('Рабочий вариант, но есть лучше','Workable, but there’s a better option'), xp:15, pts:1},
    bad:{label:L('Слабое решение','Weak call'), xp:5, pts:0}
  };
  FX_META = {
    ret:{label:'Retention', fmt:v=>sgn(v)+dec(Math.abs(v)*100,1)+pp, inv:false},
    conv:{label:L('Конверсия в оплату','Paid conversion'), fmt:v=>sgn(v)+dec(Math.abs(v)*100,1)+pp, inv:false},
    arppu:{label:'ARPPU', fmt:v=>(v>0?'+$':'−$')+dec(Math.abs(v),1), inv:false},
    cac:{label:L('CAC установки','CAC per install'), fmt:v=>(v>0?'+$':'−$')+dec(Math.abs(v),2), inv:true},
    viral:{label:L('Органика','Organic'), fmt:v=>sgn(v)+dec(Math.abs(v)*100,1)+pp, inv:false},
    cash:{label:L('Кэш','Cash'), fmt:v=>(v>0?'+':'−')+money(Math.abs(v)), inv:false},
    trust:{label:L('Доверие','Trust'), fmt:v=>sgn(v)+Math.abs(Math.round(v)), inv:false},
    morale:{label:L('Мораль','Morale'), fmt:v=>sgn(v)+Math.abs(Math.round(v)), inv:false},
    debt:{label:L('Техдолг','Tech debt'), fmt:v=>sgn(v)+Math.abs(Math.round(v)), inv:true}
  };
  CHAL_BONUS = {
    disc:{fx:{ret:0.004}, why:L('лучше понимаешь пользователей','you understand users better')},
    prio:{fx:{debt:-4, morale:3}, why:L('команда работает над правильным','the team works on the right things')},
    metr:{fx:{cac:-0.1}, why:L('бюджет тратится точнее','budget is spent more precisely')},
    exp:{fx:{conv:0.002}, why:L('эксперименты дают честный результат','experiments give honest results')}
  };
}

/* ============ scenarios ============ */
const SCEN = [
 {id:'s1', d:'disc', from:'ceo', title:'«Давай сделаем ленту друзей»',
  text:'У конкурента вышла социальная лента, где друзья видят прогресс друг друга. Андрей уверен, что Ритму нужна такая же: «Это 2 месяца разработки, но оно того стоит».',
  options:[
   {t:'Берём в работу: соцмеханики — проверенный драйвер retention, а конкурент уже уводит у нас аудиторию.', q:'bad', fx:{trust:5, morale:-5, debt:10}, later:{in:2, fx:{ret:0.003}, note:'Лента вышла — пользуются единицы, удержание почти не изменилось.'},
    fb:'Строить фичу без проверки проблемы — самый дорогой способ проверить гипотезу. Два месяца команды ушли на решение, которое никто не валидировал.'},
   {t:'Сначала 8–10 проблемных интервью и данные: делятся ли пользователи прогрессом уже сейчас, с кем и зачем.', q:'best', fx:{trust:-2}, later:{in:1, fx:{ret:0.015}, note:'Интервью показали: людям нужна не лента, а поддержка одного близкого человека. Сделали лёгкого «напарника по привычке» — удержание выросло.'},
    fb:'Ты проверяешь проблему, а не решение. Вместо дорогой ленты находится узкая, дешёвая фича, которая бьёт в реальную боль.'},
   {t:'Fake door: на неделю добавить в меню кнопку «Друзья». Кликнут больше 5% активных — интерес подтверждён, строим.', q:'ok', fx:{trust:2}, later:{in:1, fx:{ret:0.006}, note:'Fake door показал умеренный интерес — сделали упрощённую версию.'},
    fb:'Fake door быстро меряет интерес, но не объясняет «зачем». Хорош как первый шаг; в паре с интервью было бы идеально.'},
   {t:'Не брать: роадмап квартала согласован, лента сорвёт работу над онбордингом. Вернёмся к идее на следующем планировании.', q:'bad', fx:{trust:-10},
    fb:'Отказ без данных портит отношения со стейкхолдером. Лучше предложить быстрый и дешёвый способ проверить идею.'}
  ], lesson:'Валидируй проблему до решения: интервью, данные, fake door — дешевле двух месяцев разработки.'},
 {id:'s2', d:'disc', from:'sup', title:'200 отзывов про тёмную тему',
  text:'Оля присылает выгрузку: за месяц больше 200 отзывов с просьбой о тёмной теме, некоторые с одной звездой. «Люди злятся, давайте просто сделаем».',
  options:[
   {t:'Делаем тёмную тему в этом спринте: 200 отзывов — сильный сигнал, а работы там на пару дней.', q:'ok', fx:{ret:0.004, trust:3},
    fb:'Иногда запрос буквален, и сделать его — нормально. Но массовый запрос — повод выяснить, какая задача пользователя за ним стоит.'},
   {t:'Созвониться с 6 авторами отзывов и выяснить, когда, где и зачем они обычно открывают приложение.', q:'best', later:{in:1, fx:{ret:0.012, conv:0.003}, note:'Выяснили: привычки отмечают в кровати перед сном. Сделали вечерний режим — тёмная тема, тихие напоминания, отметка одним тапом.'},
    fb:'Jobs To Be Done: за «тёмной темой» стояла работа «быстро отметить день перед сном, не проснувшись окончательно». Решение получилось шире и ценнее запроса.'},
   {t:'Не брать: тёмная тема — косметика, на retention не влияет. Ответим в сторе, что она в планах.', q:'bad', fx:{trust:-5, ret:-0.004},
    fb:'Повторяющийся сигнал из поддержки — ценный вход для discovery, даже если пользователи формулируют его как готовое решение.'}
  ], lesson:'Пользователи приносят решения; задача PM — докопаться до работы (JTBD), которую они пытаются сделать.'},
 {id:'s3', d:'disc', from:'data', title:'58% уходят после первого дня',
  text:'Дима показывает: 58% новых пользователей не возвращаются на второй день. «Где-то в онбординге дыра, но где — непонятно».',
  options:[
   {t:'Полный редизайн: интерфейс устарел, по скриншотам в сторе мы проигрываем, а первое впечатление решает D1.', q:'bad', fx:{morale:-8, debt:8, cash:-30000}, later:{in:3, fx:{ret:0.005}, note:'Редизайн вышел. D1 почти не сдвинулся — проблема была не в визуале.'},
    fb:'Редизайн без диагноза — выстрел наугад. Сначала найди, где именно и почему ломается путь пользователя.'},
   {t:'Разобрать воронку онбординга по шагам и провести 5 юзабилити-тестов с новыми пользователями.', q:'best', later:{in:1, fx:{ret:0.02}, note:'Нашли: шаг «выберите 5 привычек» пугает. Сократили до одной — D1 заметно вырос.'},
    fb:'Количественные данные показывают, где проблема, качественные — почему. Связка «воронка + юзабилити» — основа discovery.'},
   {t:'Ежедневные пуши-напоминания всем новичкам: для трекера привычек это главный канал возврата.', q:'bad', fx:{ret:0.008, trust:-3}, later:{in:2, fx:{ret:-0.015}, note:'Пуш-спам: пользователи отключают уведомления и удаляют приложение.'},
    fb:'Краткосрочный рост ценой долгосрочного удержания и рейтинга. Лечишь симптом, а не причину.'}
  ], lesson:'Данные говорят «где», разговоры с пользователями — «почему». Не выбирай решение до диагноза.'},
 {id:'s4', d:'disc', from:'mkt', title:'Ритм для корпораций?',
  text:'Лена загорелась: «Мой знакомый HR в банке хочет Ритм для сотрудников. Давайте сделаем корпоративную версию с админкой и отчётами!»',
  options:[
   {t:'Строим B2B-версию: админка, отчёты, SSO. Корпоративный чек в разы выше, а банк — готовый первый клиент.', q:'bad', fx:{debt:12, morale:-5, cash:-40000},
    fb:'Один знакомый HR — не рынок. Новый сегмент требует своего discovery: чья боль, кто платит, какой цикл сделки.'},
   {t:'10 интервью с HR-директорами и один пилот, который обслуживаем полностью вручную (concierge MVP).', q:'best', fx:{trust:5, cash:8000},
    fb:'Concierge MVP: продаёшь и обслуживаешь руками, прежде чем писать код. Если за ручной сервис платят — есть смысл автоматизировать.'},
   {t:'Отложить до следующего года: B2C ещё не окупается, а распылять маленькую команду на два сегмента — ошибка.', q:'ok', fx:{trust:-2},
    fb:'Фокус — законный выбор. Но без быстрой и дешёвой проверки ты не узнаешь цену упущенной возможности.'}
  ], lesson:'Новый сегмент проверяй вручную (concierge / wizard of Oz), а не разработкой.'},
 {id:'s5', d:'prio', from:'ceo', title:'Три «срочных» запроса в один спринт',
  text:'Андрей хочет геймификацию, Лена — реферальную программу, Оля — починить синхронизацию между устройствами: на неё жалуются 12% платящих. Капасити хватит на что-то одно.',
  options:[
   {t:'Делаем все три параллельно, урезав каждый до MVP: так никто из стейкхолдеров не останется ни с чем.', q:'bad', fx:{morale:-12, debt:15},

   {t:'Оценить все три запроса по RICE и открыто показать расчёт всем стейкхолдерам; первой идёт синхронизация.', q:'best', fx:{trust:6, ret:0.01, conv:0.002},

   {t:'Геймификацию: Андрей видит картину целиком, а стрики и бейджи — проверенный рычаг retention у трекеров.', q:'bad', fx:{trust:4, ret:-0.006},
    fb:'HiPPO (highest paid person’s opinion) — не метод приоритизации. Проблема платящих осталась нерешённой.'}
  ], lesson:'Приоритизируй по прозрачному фреймворку (RICE/ICE) и показывай расчёт стейкхолдерам.'},
 {id:'s6', d:'prio', from:'tech', title:'Техдолг душит релизы',

    fb:'Может сработать, но чинить вперёд под давлением рискованно. Откат обычно безопаснее и быстрее.'}
  ], lesson:'При инциденте сначала останови ущерб (откат), потом коммуникация, потом разбор.'},
 {id:'s8', d:'prio', from:'ceo', title:'Конкурент выпустил AI-коуча',

   {t:'Срочно делаем такой же AI-коуч, остальное на паузу: на готовых LLM-API это пара спринтов.', q:'bad', fx:{morale:-8, debt:10, cash:-25000}, later:{in:2, fx:{conv:0.002}, note:'Сырой AI-коуч вышел. Эффект есть, но небольшой.'},
    fb:'Реактивное копирование уводит от своей стратегии. Сначала пойми, угрожает ли это задаче, ради которой пользователи выбирают тебя.'},
   {t:'Проверить в данных отток к конкуренту и провести 5 интервью с ушедшими; решение — через 2 недели.', q:'best', fx:{trust:2}, later:{in:1, fx:{ret:0.006}, note:'Выяснили: уходят не из-за AI, а из-за сложной настройки. Сделали персональные подсказки — дешевле и точнее.'},
    fb:'Конкурентный анализ через призму своих пользователей: что они «нанимают» и почему уходят.'},
   {t:'Не реагировать: у нас своя стратегия, а AI-фичи конкурентов часто оказываются хайпом.', q:'ok', fx:{trust:-5},
    fb:'Спокойствие — это хорошо, но игнорирование без данных оставляет риск и тревогу стейкхолдеров.'}
  ], lesson:'На ход конкурента отвечай данными о своих пользователях, а не копированием.'},
 {id:'s9', d:'prio', from:'inv', title:'Роадмап на год «с датами»',
  text:'Фонд «Север» перед следующим траншем просит роадмап на 12 месяцев с конкретными датами релизов каждой фичи.',
  options:[
   {t:'Таблица фич с датами на год, с буфером 30% на каждую: фонд получит ровно то, что просит.', q:'bad', fx:{trust:4}, later:{in:3, fx:{trust:-12}, note:'Две даты из роадмапа сорвались. Инвестор разочарован.'},
    fb:'Фичи с датами на год — обещания, которые почти всегда срываются: неопределённость растёт с горизонтом.'},
   {t:'Now / Next / Later с целями по метрикам на каждый горизонт; даты — только на ближайший квартал.', q:'best', fx:{trust:8},
    fb:'Outcome-роадмап показывает, какие результаты ты двигаешь, и оставляет свободу в выборе решений.'},
   {t:'Объяснить фонду, что годовые даты в стартапе — фикция: работаем итерациями и покажем план на спринт.', q:'bad', fx:{trust:-12},
    fb:'Agile не отменяет планирования. Стейкхолдерам нужна предсказуемость направления.'}
  ], lesson:'Роадмап — про результаты (outcomes), а не про список фич с датами.'},
 {id:'s10', d:'metr', from:'ceo', title:'Какая у нас North Star?',
  text:'Андрей хочет одну главную метрику, по которой будет жить вся команда. Варианты на доске:',
  options:[
   {t:'Установки приложения: понятны всем, от инвестора до маркетинга, и видны каждый день.', q:'bad', fx:{morale:-3},
    fb:'Установки — vanity-метрика: растут от маркетинга и ничего не говорят о ценности продукта.'},
   {t:'MAU — месячная аудитория: стандарт индустрии, по нему нас сравнивают инвесторы.', q:'ok', fx:{ret:0.003},
    fb:'Лучше установок, но не показывает, получают ли люди ценность: можно открыть и ничего не сделать.'},
   {t:'Число пользователей, которые за неделю отметили привычки хотя бы в 3 разных дня.', q:'best', fx:{ret:0.01, morale:5},
    fb:'Хорошая North Star отражает ценность для пользователя и предсказывает выручку. Регулярные отметки — ядро ценности трекера.'},
   {t:'Выручка: бизнес живёт на деньги, и это единственная метрика без самообмана.', q:'ok', fx:{conv:0.002},
    fb:'Выручка — результат, а не драйвер: запаздывает и плохо подсказывает команде, что делать завтра.'}
  ], lesson:'North Star отражает ценность для пользователя и опережает выручку.'},
 {id:'s11', d:'metr', from:'mkt', title:'«CAC упал в два раза!»',
  text:'Лена сияет: перевела бюджет в мотивированный трафик (установки за бонусы в других приложениях), и стоимость установки упала вдвое.',
  options:[
   {t:'Удваиваем бюджет в этот канал: при вдвое меньшей цене установки те же деньги дадут вдвое больше людей.', q:'bad', fx:{cac:-0.6, ret:-0.02, conv:-0.006},
    fb:'Дешёвая установка ≠ дешёвый клиент. Мотивированный трафик почти не удерживается и не платит — CAC платящего вырос.'},
   {t:'Сравнить когортный retention и конверсию в оплату по каналам, прежде чем двигать бюджет.', q:'best', fx:{conv:0.002}, later:{in:1, fx:{cac:-0.25}, note:'Отключили «мусорный» канал, перераспределили бюджет — CAC платящего снизился.'},
    fb:'Юнит-экономика считается по каналу целиком: CAC ÷ конверсия в оплату, против LTV именно этой когорты.'},
   {t:'Ввести правило: изменения каналов маркетинг заранее согласует с продуктом, чтобы не было сюрпризов.', q:'bad', fx:{trust:-5, morale:-4},
    fb:'Контроль вместо анализа убивает эксперименты. Нужна общая метрика (CAC платящего), а не запреты.'}
  ], lesson:'Смотри на CAC платящего и удержание по каналам, а не на цену установки.'},
 {id:'s12', d:'metr', from:'ceo', title:'Поднимем цену с $9 до $13?',
  text:'Андрей считает, что Ритм стоит дороже: «Поднимем подписку до $13 — выручка вырастет на 44%».',
  options:[
   {t:'Поднять всем сразу, включая текущих: эффект на выручку будет полным, а две цены запутают поддержку.', q:'bad', fx:{arppu:3, conv:-0.012, ret:-0.02, trust:-4},
    fb:'Резкое повышение для текущих — риск оттока и волны негатива. Эластичность спроса неизвестна.'},
   {t:'A/B-тест новой цены на новых пользователях; текущим подписчикам сохранить старую цену.', q:'best', later:{in:1, fx:{arppu:1.5, conv:-0.002}, note:'Тест показал: при $12 выручка на пользователя выше, конверсия почти не упала. Раскатили на новых.'},
    fb:'Цена — самый сильный рычаг выручки. Проверяй эластичность на новых пользователях, лояльных защищай (grandfathering).'},
   {t:'Наоборот, снизить до $6: платящих станет заметно больше, и рост базы перекроет низкий чек.', q:'bad', fx:{arppu:-3, conv:0.01},
    fb:'Скидка поднимает конверсию, но не обязательно выручку. Считай ARPU = конверсия × ARPPU: здесь он упал.'}
  ], lesson:'Цену проверяй экспериментом; смотри на ARPU, а не только на конверсию.'},
 {id:'s13', d:'metr', from:'data', title:'Годовая подписка со скидкой',
  text:'Дима предлагает годовой план со скидкой 35% к помесячной цене и спрашивает твоё мнение.',
  options:[
   {t:'Запустить и сделать годовой план выбором по умолчанию на пейволе, а экономию показать рядом с ценой.', q:'best', fx:{cash:40000, arppu:-0.8, ret:0.01},
    fb:'Годовой план приносит деньги вперёд (кэш!) и снижает отток. Цена — чуть ниже средний чек в месяц.'},
   {t:'Не запускать: скидка 35% — минус треть выручки с тех, кто и так платил бы помесячно весь год.', q:'ok',
    fb:'Скидка действительно снижает чек, но ты упускаешь предоплату и более низкий отток годовых подписчиков.'},
   {t:'Вместо этого — пожизненная подписка за $30: сразу много кэша, и люди охотнее платят один раз.', q:'bad', fx:{cash:60000, arppu:-2.5},
    fb:'Lifetime-план даёт разовый приток кэша, но съедает рекуррентную выручку: LTV обрезается навсегда.'}
  ], lesson:'Годовые планы улучшают кэш-флоу и retention; пожизненные — съедают LTV.'},
 {id:'s14', d:'exp', from:'data', title:'4 дня теста, p = 0.03. Катим?',
  text:'Тест нового пейвола запланирован на 14 дней. На четвёртый день Дима пишет: «+11% к конверсии, p = 0.03! Раскатываем?»',
  options:[
   {t:'Катим: p = 0.03 ниже порога 0.05, а пока тест идёт, половина трафика видит худший пейвол.', q:'bad', fx:{conv:0.002}, later:{in:1, fx:{conv:-0.002}, note:'Эффект «сдулся» — это был шум, пойманный подглядыванием.'},
    fb:'Peeking: если смотреть p-value каждый день и останавливаться при первой значимости, доля ложных срабатываний растёт в разы.'},
   {t:'Ждём заранее рассчитанные 14 дней — это два полных недельных цикла и нужная выборка.', q:'best', later:{in:1, fx:{conv:0.004}, note:'Тест добежал: эффект подтвердился, но скромнее — около +6%.'},
    fb:'Длительность и размер выборки фиксируются заранее. Полные недели убирают эффект дня недели.'},
   {t:'Остановить тест и оставить новый пейвол: он лучше и по цифрам, и по фидбеку пользователей.', q:'bad', fx:{conv:0.001},
    fb:'Без завершённого теста ты не знаешь размер эффекта и можешь раскатить ухудшение.'}
  ], lesson:'Не подглядывай: заранее рассчитай выборку и дождись её.'},
 {id:'s15', d:'exp', from:'data', title:'Конверсия +15%, но возвраты ×2',
  text:'Новый пейвол поднял конверсию в оплату на 15%. Через неделю: запросы на возврат выросли вдвое, в отзывах — «скрытая подписка».',
  options:[
   {t:'Катим: +15% конверсии с запасом перекрывают возвраты, а тексты пейвола поправим потом.', q:'bad', fx:{conv:0.008, trust:-8}, later:{in:1, fx:{ret:-0.02, conv:-0.006}, note:'Волна отписок и возвратов, рейтинг в сторе упал.'},
    fb:'Guardrail-метрики (возвраты, жалобы, отток) защищают от «побед», которые вредят бизнесу.'},
   {t:'Посчитать выручку на пользователя за 30 дней с учётом возвратов, убрать тёмные паттерны и перезапустить.', q:'best', fx:{conv:0.003, trust:3},
    fb:'Смотришь на итоговую ценность, а не на промежуточную метрику, и чинишь причину — вводящий в заблуждение дизайн.'},
   {t:'Откатить и закрыть тему пейвола: репутация дороже 15% конверсии, рисковать ею снова не будем.', q:'ok',
    fb:'Безопасно, но ты выбрасываешь то, что в варианте сработало. Лучше разобраться, что именно дало рост.'}
  ], lesson:'У каждого теста должны быть guardrail-метрики.'},
 {id:'s16', d:'exp', from:'mkt', title:'20 вариантов пуша и один «победитель»',
  text:'Лена запустила 20 вариантов текста напоминания одновременно. Один показал p = 0.04. «У нас победитель!»',
  options:[
   {t:'Раскатить победителя на всех: p = 0.04 — значимо, а неудачный пуш откатывается за минуту.', q:'bad',
    fb:'При 20 сравнениях с α = 0.05 примерно один «значимый» результат ожидаем чисто случайно. Это ловушка множественных сравнений.'},
   {t:'Перепроверить победителя отдельным тестом один на один против контрольной группы.', q:'best', later:{in:1, fx:{ret:0.004}, note:'Повторный тест: «победитель» не подтвердился, зато нашли другой рабочий вариант.'},
    fb:'Повторный тест — самый надёжный способ отделить сигнал от шума.'},
   {t:'Взять 3 лучших и тестировать дальше с поправкой на множественные сравнения.', q:'ok', later:{in:1, fx:{ret:0.002}, note:'С поправкой Бонферрони ни один вариант не прошёл порог — но сузили поиск.'},
    fb:'Правильная идея (Бонферрони / FDR), но с поправкой нужна большая выборка — тест затянется.'}
  ], lesson:'Много сравнений → много ложных находок. Поправка или повторный тест.'},
 {id:'s17', d:'exp', from:'ceo', title:'«Зачем нам эти тесты?»',
  text:'Андрей раздражён: «Тесты тормозят. Я и так знаю, что нужно пользователям. Давайте выкатывать сразу».',
  options:[
   {t:'Согласиться и выкатывать сразу, следя за дашбордами: на нашем трафике скорость обучения важнее точности.', q:'bad', fx:{trust:3}, later:{in:2, fx:{conv:-0.004}, note:'Одно из «очевидных» изменений тихо снизило конверсию — заметили только через месяц.'},
    fb:'Без экспериментов ты не отличаешь эффект своих изменений от сезонности и шума.'},
   {t:'Показать 3 случая, где интуиция подвела, и договориться тестировать то, что дорого откатить или бьёт по деньгам.', q:'best', fx:{trust:6, morale:3},
    fb:'Договорённость о том, что тестировать, снимает конфликт скорости и качества.'},
   {t:'Тестировать каждое изменение, вплоть до цвета кнопок: стоит сделать одно исключение — и культура экспериментов развалится.', q:'bad', fx:{trust:-6, morale:-4},
    fb:'Тестировать мелочи с маленьким эффектом — дорого: не хватает трафика, команда тормозит.'}
  ], lesson:'Тестируй то, что дорого, рискованно или неочевидно; мелочи выкатывай и мониторь.'},
 {id:'s18', d:'disc', from:'sup', title:'NPS рухнул с 41 до 29',
  text:'Оля встревожена: за месяц NPS упал с 41 до 29, а в комментариях всё подряд — от цены до багов. Андрей уже спрашивает, что случилось и кто виноват.',
  options:[
   {t:'Разбить NPS по платформам, версиям и когортам, прочитать комментарии критиков и созвониться с 8 из них.', q:'best', fx:{trust:2}, later:{in:1, fx:{ret:0.01, trust:3}, note:'Падение сидело в одной когорте: после обновления 3.4 на Android сбрасывалось время напоминаний. Починили, извинились — NPS и удержание вернулись.'},
    fb:'Агрегат прячет, откуда взялось падение. Сегменты показывают, у кого и после чего, разговоры с критиками — почему. Диагноз занимает дни, а не квартал.'},
   {t:'Взять топ-3 жалобы по числу упоминаний в комментариях и сразу поставить их в ближайший спринт.', q:'ok', fx:{debt:5, ret:0.003},
    fb:'Частота упоминаний показывает, о чём говорят громче всего, а не что изменилось. Ты лечишь вечные жалобы и можешь не задеть причину именно этого падения.'},
   {t:'Скорее всего, это шум выборки: NPS часто скачет. Подождать месяц и посмотреть, сохранится ли тренд.', q:'bad', fx:{trust:-4}, later:{in:1, fx:{ret:-0.006}, note:'Это был не шум: за месяц проблема задела новые когорты, и удержание просело.'},
    fb:'Шум — это гипотеза, и проверяется она за день: размер выборки и разбивка по сегментам. Месяц ожидания — месяц, за который проблема разрастается.'},
   {t:'Сделать NPS главной метрикой поддержки с целью вернуть 41 к концу квартала — пусть кто-то отвечает.', q:'bad', fx:{morale:-6, trust:2},
    fb:'NPS складывается из всего продукта, и поддержка его не контролирует. Цель на метрику без рычагов ведёт к игре в цифры — например, к опросам только довольных.'}
  ], lesson:'Упала агрегатная метрика — сначала сегментируй (кто, где, после чего), потом говори с этими людьми.'},
 {id:'s19', d:'disc', from:'data', title:'«Слишком дорого» — или нет?',
  text:'Дима принёс опрос при отмене подписки: 62% выбрали «слишком дорого». Но в данных те же люди перестали отмечать привычки за 2–3 недели до отмены. Андрей уже предлагает скидку.',
  options:[
   {t:'Поговорить с 8 недавно ушедшими о том, когда и почему они бросили отмечать привычки, — не о цене.', q:'best', fx:{trust:-2}, later:{in:1, fx:{ret:0.012}, note:'Выяснилось: люди срывали серию, расстраивались и бросали. Сделали «заморозку серии» и мягкий возврат после пропуска — отток снизился.'},
    fb:'Опрос фиксирует, что человек говорит на выходе, данные — когда он ушёл на самом деле. Интервью о реальном моменте отказа достают причину: «дорого» часто значит «перестало стоить своих денег».'},
   {t:'Предлагать уходящим скидку 50% на три месяца: они сами написали, что проблема именно в цене.', q:'ok', fx:{arppu:-0.5, ret:0.004, trust:3},
    fb:'Оффер удержания сохранит часть платящих, но ты лечишь цену, а люди ушли из продукта раньше, чем из подписки. Причина осталась, а скидку быстро научатся выбивать отменой.'},
   {t:'Не реагировать: «дорого» — вежливый ответ по умолчанию, при отмене его выбирают всегда и везде.', q:'bad', fx:{trust:-3}, later:{in:2, fx:{ret:-0.005}, note:'Отток продолжил расти, а причину так никто и не искал.'},
    fb:'Наблюдение верное — ответы при отмене ненадёжны. Но вывод «ничего не делать» выбрасывает сильный сигнал из данных: использование падает задолго до отмены.'},
   {t:'Переделать опрос при отмене: добавить больше вариантов ответа и свободное поле «расскажите подробнее».', q:'ok', later:{in:2, fx:{ret:0.003}, note:'Новый опрос дал ответы разнообразнее, но до настоящей причины всё равно докапывались ещё месяц.'},
    fb:'Инструмент стал лучше, но это всё ещё самоотчёт в худший момент, а новые ответы копятся неделями. Поведение уже подсказало, где искать.'}
  ], lesson:'Поведение важнее заявлений: сверяй ответы опросов с данными и копай в момент, когда человек перестал получать ценность.'},
 {id:'s20', d:'disc', from:'ceo', title:'Спросим у всех, что делать дальше?',
  text:'Андрей хочет разослать всем 45 тысячам пользователей опрос «Какие фичи добавить в Ритм?» со списком из 15 идей: «Пусть пользователи сами выберут роадмап».',
  options:[
   {t:'Разослать как есть: тысячи ответов — это уже статистика, а не мнение пары человек на планёрке.', q:'bad', fx:{trust:4}, later:{in:2, fx:{ret:0.002}, note:'Сделали фичу-победителя опроса — пользуются ей куда меньше, чем за неё голосовали.'},
    fb:'Выбор из списка фич — это вопрос о решениях, а не о проблемах. Отвечают самые вовлечённые, и выбирают то, что звучит приятно. Получишь рейтинг желаний, а не причин.'},
   {t:'Сначала 8 интервью о том, как люди держат привычки, потом опрос, чтобы измерить масштаб.', q:'best', fx:{trust:2}, later:{in:1, fx:{ret:0.008, conv:0.002}, note:'Интервью нашли 4 повторяющиеся проблемы, опрос показал самую массовую: люди ставят цель «каждый день» и срываются. Сделали «стартовый темп» — удержание выросло.'},
    fb:'Интервью открывают проблемы, о которых ты не знал, опрос измеряет, насколько они массовые. Андрей получает свой опрос — только с правильными вопросами.'},
   {t:'Оставить опрос, но спрашивать о проблемах, а не о фичах: «Что мешает вам держать привычки?»', q:'ok', fx:{trust:3}, later:{in:1, fx:{ret:0.004}, note:'Тысячи ответов свелись к «нет времени» и «забываю». Сделали напоминания поумнее — эффект скромный.'},
    fb:'Уже лучше: вопрос о проблемах, а не о решениях. Но открытые ответы тысяч людей поверхностны и плохо разбираются — без интервью ты не знаешь, о чём спрашивать глубже.'},
   {t:'Отказаться от опроса: пользователи не знают, чего хотят, — «быстрее лошадь», как у Форда.', q:'bad', fx:{trust:-5},
    fb:'Цитата про лошадь — о том, что не стоит спрашивать о решениях, а не о том, что не надо спрашивать вовсе. Свои проблемы люди знают отлично, а инициативу CEO лучше перенаправить, чем зарубить.'}
  ], lesson:'Опрос измеряет, интервью открывают. Сначала найди проблемы в разговорах, потом измерь их масштаб опросом.'},
 {id:'s21', d:'disc', from:'data', dilemma:true, title:'Студенты или специалисты?',
  text:'Дима кластеризовал пользователей. Студенты: 55% аудитории, охотно зовут друзей, но платят 2%. Специалисты 30+: 20% аудитории, платят 11%, но приходят почти только из платной рекламы. Глубокого discovery хватит на один сегмент.',
  options:[
   {t:'Фокус на студентах: интервью про учёбу и сессии, ставка на рост через приглашения друзей.', q:'best', fx:{viral:0.006, ret:0.004, conv:-0.002}, later:{in:2, fx:{viral:0.003}, note:'Студенты потащили однокурсников: органика заметно выросла, а выручка — почти нет.'},
    fb:'Ты покупаешь дешёвый органический рост и большую базу. Платишь монетизацией: выручка будет отставать, а вопрос «как студенты начнут платить» придётся решать позже.'},
   {t:'Фокус на специалистах 30+: интервью про работу и здоровье, ставка на ценность, за которую платят.', q:'best', fx:{conv:0.005, arppu:0.5, cac:0.2, viral:-0.002}, later:{in:1, fx:{ret:0.004}, note:'Специалисты рассказали про утренний ритуал — сделали план на день, и платящие стали держаться дольше.'},
    fb:'Ты покупаешь монетизацию: эти люди платят за ценность и держатся дольше. Платишь ростом: почти каждый пользователь — из дорогой рекламы, органики нет, база растёт медленно.'},
   {t:'Две недели гонять рекламу и рефералку на оба сегмента, а потом выбрать тот, где цифры окажутся лучше.', q:'ok', fx:{cash:-8000},
    fb:'Сильные стороны сегментов уже видны в данных — тест их только повторит. Ты платишь временем и деньгами за то, чтобы отложить стратегический выбор, который цифры за тебя не сделают.'},
   {t:'Собрать единую персону «занятой человек 25–35» — золотую середину между двумя сегментами.', q:'bad', fx:{morale:-3}, later:{in:1, fx:{ret:-0.004}, note:'Фичи для «среднего пользователя» не зацепили ни студентов, ни специалистов.'},
    fb:'Усреднённая персона описывает человека, которого не существует. Продукт «для всех» выходит ни для кого, а выбор сегмента ты не избежал — просто спрятал.'}
  ], lesson:'Бесплатного варианта нет: выбор сегмента — это выбор, чем платить, ростом или монетизацией. Назови цену явно и выбирай осознанно.'},
 {id:'s22', d:'disc', from:'mkt', title:'Внезапная Бразилия',
  text:'Лена заметила: установки из Бразилии выросли в 4 раза за два месяца, хотя Ритм есть только на английском и русском. «Давай локализуем на португальский — это новый рынок!»',
  options:[
   {t:'Локализовать всё, пока волна не схлынула: интерфейс, пуши, страницу в сторе и цены в бразильских реалах.', q:'bad', fx:{cash:-25000, debt:6, morale:-3}, later:{in:2, fx:{conv:0.001}, note:'Локализация вышла через полтора месяца — к этому времени поток из Бразилии почти иссяк.'},
    fb:'Ты инвестируешь в рынок, не зная, почему он появился. Если всплеск разовый, локализация станет дорогим памятником ему.'},
   {t:'Сначала понять, откуда волна: разобрать источники и когорты, созвониться с 5 бразильцами.', q:'best', later:{in:1, fx:{viral:0.004, ret:0.004}, note:'Причина — ролик бразильского блогера про 30-дневный челлендж. Сделали шаблон челленджа с шерингом — он разошёлся и за пределами Бразилии.'},
    fb:'Аномалия в данных — подарок для discovery: кто-то нашёл в продукте ценность, о которой ты не знаешь. Сначала пойми, для какой задачи «наняли» Ритм, потом решай, что масштабировать.'},
   {t:'Машинный перевод интерфейса за неделю: дёшево, и сразу увидим, поднимет ли он удержание.', q:'ok', fx:{debt:3, ret:0.002, trust:2},
    fb:'Дешёвый эксперимент — хороший рефлекс, но он проверяет гипотезу «мешает язык», которую никто не формулировал. А кривой перевод может стоить рейтинга.'}
  ], lesson:'Неожиданный всплеск — сначала вопрос «почему?», а не «как масштабировать?».'},
 {id:'s23', d:'prio', from:'inv', title:'OKR на квартал',
  text:'Фонд «Север» просит OKR на квартал к совету директоров. Каждый лид уже прислал свои цели — в черновике 6 objectives и 19 ключевых результатов.',
  options:[
   {t:'Оставить все 6 целей: у каждой команды своя зона, и никто не почувствует, что его отодвинули.', q:'bad', fx:{trust:3, morale:-4}, later:{in:2, fx:{trust:-6}, note:'К концу квартала закрыли 4 KR из 19 — на совете директоров были неудобные вопросы.'},
    fb:'OKR, в которых есть всё, — это список дел, а не фокус. Команда размажется по 19 результатам и не закроет большинство.'},
   {t:'Одна цель: «новички закрепляют привычку в первые 2 недели» — и 3 измеримых KR по метрикам удержания.', q:'best', fx:{morale:5, trust:2}, later:{in:1, fx:{ret:0.008}, note:'Вся команда била в одну цель — удержание новых когорт заметно выросло.'},
    fb:'Одна цель бьёт в главное ограничение бизнеса, KR измеряют результат, а не выпуск фич. Остальная работа никуда не исчезает — она просто не притворяется приоритетом.'},
   {t:'Сделать KR из фич роадмапа: «выпустить виджеты», «запустить подсказки» — ясно и легко проверить.', q:'bad', fx:{trust:3, debt:4}, later:{in:2, fx:{trust:-4}, note:'Все фичи выпустили, KR «закрыты» — но фонд спросил, что изменилось в цифрах, и ответить было нечего.'},
    fb:'Это output, а не outcome: можно выпустить всё по списку и не сдвинуть ни одну метрику. KR описывает изменение, а не задачу.'},
   {t:'Взять цель фонда — MRR +30% за квартал — и разложить её на отдельные KR для каждой команды.', q:'ok', fx:{trust:5, morale:-4},
    fb:'Связь с целями инвестора — плюс, но MRR — запаздывающий результат, и у отдельных команд нет рычагов на него. Лучше выбрать драйвер MRR, который команда реально двигает.'}
  ], lesson:'OKR — это фокус: мало целей, а KR про результат (outcome), а не про выпуск фич.'},
 {id:'s24', d:'prio', from:'tech', dilemma:true, title:'Минус iOS-разработчик',
  text:'Тимур: «Наш сильнейший iOS-разработчик уходит через две недели, замену найдём не раньше чем через 2–3 месяца». В плане квартала — виджеты для кампании Лены и 20% на техдолг. Всё не влезет.',
  options:[
   {t:'Сохранить 20% на техдолг, виджеты перенести на следующий квартал и сказать Лене сейчас.', q:'best', fx:{debt:-6, morale:4, trust:-4}, later:{in:1, fx:{cac:0.1}, note:'Кампания вышла без виджетов — отклик слабее, установки обошлись дороже.'},
    fb:'Ты сохраняешь здоровье продукта и команды: релизы не ломаются, оставшиеся не выгорают. Платишь ростом — кампания выйдет слабее, а Лене придётся перестраивать план.'},
   {t:'Сделать виджеты к кампании, а техдолг заморозить на квартал — с датой возврата и списком рисков.', q:'best', fx:{debt:10, trust:4}, later:{in:1, fx:{conv:0.003, cac:-0.1}, note:'Виджеты вышли к кампании: установки подешевели, конверсия подросла. Но релизы стали чаще ломаться.'},
    fb:'Ты покупаешь рост: кампания выходит с сильным поводом. Платишь техдолгом — он растёт, и вернуть 20% после квартала нужно железно, иначе пауза станет нормой.'},
   {t:'Ничего не вырезать: остальные справятся, если на один квартал немного поднажать всей командой.', q:'bad', fx:{morale:-10, debt:8}, later:{in:1, fx:{ret:-0.004}, note:'К середине квартала ещё один разработчик заговорил об уходе, а баги в релизах участились.'},
    fb:'Потерю четверти капасити не закрыть энтузиазмом. Если не выбрать, что отрезать, отрежется само — качество и люди.'},
   {t:'Срочно взять опытного фрилансера на три месяца, чтобы закрыть дыру и вообще не трогать план квартала.', q:'ok', fx:{cash:-24000, debt:5, morale:-2},
    fb:'Деньгами можно купить часы, но не контекст: фрилансеру нужен месяц на вход, а его код потом поддерживать команде. План сохранён на бумаге, выбор просто отложен.'}
  ], lesson:'Когда ресурсов меньше, бесплатного варианта нет: явно выбери, чем платишь — ростом или здоровьем продукта, — и проговори цену со стейкхолдерами.'},
 {id:'s25', d:'prio', from:'ceo', title:'Любимый проект Андрея',
  text:'Андрей вернулся с конференции: «Нам нужно приложение для Apple Watch. Я сам ношу часы, и все вокруг носят». По оценке Тимура — 6 недель. Роадмап квартала целиком про удержание новичков.',
  options:[
   {t:'Взять в квартал: CEO редко просит что-то лично, а носимые устройства правда в тренде.', q:'bad', fx:{trust:6, morale:-4, debt:6}, later:{in:2, fx:{ret:0.002}, note:'Приложение для часов вышло: им пользуются 3% аудитории, удержание новичков не сдвинулось.'},
    fb:'Личный энтузиазм и тренд — не данные. Шесть недель уходят мимо главной цели квартала, и команда видит, что роадмап можно продавить статусом.'},
   {t:'Прогнать идею через критерии роадмапа: сколько у нас владельцев часов и двигает ли это цель квартала.', q:'best', fx:{trust:3}, later:{in:1, fx:{ret:0.004}, note:'Часы оказались у 9% пользователей. Андрей сам предложил отложить идею, а дешёвую часть — отметку привычки прямо из уведомления — сделали за 3 дня.'},
    fb:'Единая мерка для всех: идею CEO не отвергают, она соревнуется на равных. Данные снимают личное из разговора, а дешёвая часть идеи часто влезает уже сейчас.'},
   {t:'Выделить Андрею одного разработчика «на эксперимент», чтобы основной план не пострадал.', q:'ok', fx:{trust:5, morale:-3, debt:4},
    fb:'Компромисс, который выглядит бесплатным: побочный проект съедает часть капасити и внимание, а без критериев успеха он будет только расти.'},
   {t:'Вежливо отказать: роадмап согласован, и менять его посреди квартала — плохой сигнал команде.', q:'bad', fx:{trust:-8, morale:2},
    fb:'Роадмап защищает фокус, но голое «нет» CEO без анализа превращает продуктовый разговор в борьбу за власть — и следующую ты проиграешь.'}
  ], lesson:'Идеи CEO проходят через те же критерии, что и все остальные: не «да» и не «нет», а «давай посчитаем».'},
 {id:'s26', d:'prio', from:'mkt', dilemma:true, title:'Сделка с сетью фитнес-клубов',
  text:'Лена принесла сделку: сеть клубов «Пульс» купит 3 000 годовых подписок для своих клиентов — $45 000 сразу. Условие: за 6 недель встроить их логин и брендированный экран. Это половина капасити команды на квартал.',
  options:[
   {t:'Брать: делаем интеграцию отдельным модулем в жёстком таймбоксе, остальной роадмап сдвигаем.', q:'best', fx:{cash:45000, debt:8, morale:-3, trust:4}, later:{in:2, fx:{ret:-0.003}, note:'Деньги пришли, но работа над удержанием новичков сдвинулась на два месяца.'},
    fb:'Ты покупаешь кэш и раннюю выручку — для убыточного стартапа это месяцы runway. Платишь фокусом и техдолгом: кастомный код останется с тобой, а роадмап по удержанию сдвинется.'},
   {t:'Встречное предложение: стандартные промокоды сейчас, интеграция — если пилот покажет активацию.', q:'best', fx:{cash:12000, trust:-2}, later:{in:1, fx:{ret:0.005}, note:'«Пульс» взял 800 подписок по промокодам вместо 3 000, а команда закончила работу над удержанием в срок.'},
    fb:'Ты сохраняешь фокус и чистую кодовую базу, а интеграцию строишь, только когда пилот докажет ценность. Платишь деньгами: партнёр берёт меньше — а мог уйти совсем.'},
   {t:'Вежливо отказаться: кастомная разработка под одного клиента — прямой путь в аутсорс.', q:'ok', fx:{trust:-4, morale:2},
    fb:'Принцип верный, но ты не стал торговаться: между «всё по-вашему» и «нет» были варианты, которые сохраняли и деньги, и фокус.'},
   {t:'Брать и сверху предложить white label и отчёты — пусть первый крупный клиент будет в полном восторге.', q:'bad', fx:{cash:45000, debt:16, morale:-8}, later:{in:2, fx:{trust:-5, ret:-0.004}, note:'«Пульс» засыпал команду доработками, а кастомный код ломался с каждым релизом.'},
    fb:'Расширение объёма ради одного клиента: ты продаёшь ему отдельный продукт, и каждое обещание превращается в вечную поддержку.'}
  ], lesson:'Бесплатных сделок не бывает: деньги клиента оплачиваются фокусом команды. Сравни, что получаешь и чем платишь, и выбери явно.'},
 {id:'s27', d:'metr', from:'data', title:'Конверсия +1,4 п.п. за ночь',
  text:'После релиза 3.2 конверсия в оплату на дашборде прыгнула с 5,0% до 6,4%. Андрей уже похвастался фонду. Дима не может объяснить рост: в релизе были только новый экран настроек и обновлённый SDK покупок.',
  options:[
   {t:'Разобрать, какие изменения релиза 3.2 дали рост, и усилить их уже в следующем спринте.', q:'bad', fx:{morale:-4}, later:{in:1, fx:{trust:-8}, note:'Команда месяц «усиливала» несуществующий эффект: после обновления SDK восстановление покупки считалось новой оплатой. Фонд спросил, каким ещё цифрам не стоит верить.'},
    fb:'Усиливать эффект, причину которого не понимаешь, — строить на песке. Необъяснимый скачок сначала проверяют на ошибку в данных и лишь потом ищут продуктовую причину.'},
   {t:'Сверить события оплаты с фактической выручкой App Store и Google Play за те же дни.', q:'best', fx:{trust:2},
    fb:'Выручка в сторах не выросла: после обновления SDK восстановление покупки логировалось как новая оплата. Необъяснимый скачок — в первую очередь подозрение на данные, а источник правды по деньгам — биллинг.'},
   {t:'Подождать неделю: если рост устойчив, значит, он настоящий, — тогда и праздновать.', q:'ok', later:{in:1, fx:{trust:-4}, note:'Через неделю рост держался — как и баг: после обновления SDK восстановление покупки логировалось как новая оплата. Фонду пришлось отправлять поправку.'},
    fb:'Осторожность правильная, но время ничего не доказывает: баг трекинга так же «устойчив», как настоящий рост. Проверять нужно источник данных, а не ждать.'}
  ], lesson:'Прежде чем праздновать скачок метрики, сверь её с независимым источником правды — выручкой, биллингом, сырыми логами.'},
 {id:'s28', d:'metr', from:'inv', title:'«CAC $2,1 — лейте больше!»',
  text:'Фонд «Север» видит в отчёте blended CAC $2,1 и предлагает утроить рекламный бюджет — с $20k до $60k в месяц. Дима напоминает: в blended входят бесплатные органические установки, платная стоит $2,5, а LTV платящего (~$63) лишь немного выше его CAC (~$50).',
  options:[
   {t:'Утроить бюджет, как просит фонд: blended CAC низкий, а инвестор ждёт роста.', q:'bad', fx:{trust:6, cash:-40000, cac:0.4}, later:{in:1, fx:{trust:-8}, note:'Установок стало больше, но каждая следующая — дороже: CAC платящего вырос примерно до $100 при LTV $63. Кэш сгорал быстрее, чем рос MRR.'},
    fb:'Blended CAC разбавлен бесплатной органикой, а при утроении бюджета каждая следующая установка дороже: ставки растут, аудитория выгорает. При LTV/CAC ≈ 1,3 это ускоренное сжигание кэша.'},
   {t:'Отказать и сначала поднять LTV: при LTV/CAC около 1,3 масштабировать ещё рано.', q:'ok', fx:{trust:-5},
    fb:'Математика верная: при LTV/CAC ≈ 1,3 масштаб опасен. Но жёсткий отказ без данных портит отношения с фондом, а небольшой контролируемый шаг показал бы, где проходит предел.'},
   {t:'Поднять бюджет на 25%, замерить маржинальный CAC платящего и расти ступенями.', q:'best', fx:{trust:2, cash:-5000}, later:{in:1, fx:{cac:-0.15}, note:'Ступень +25% показала: дополнительные установки обходились так дорого, что маржинальный CAC платящего превысил LTV. Масштаб отложили, а худшие связки отключили — средний CAC снизился.'},
    fb:'Blended CAC прячет платный трафик за бесплатной органикой, а среднее — рост цены каждой следующей установки. Масштабируй ступенями и сравнивай маржинальный CAC платящего с LTV.'}
  ], lesson:'Решения о бюджете принимай по маржинальному CAC платящего в платных каналах, а не по blended-среднему.'},
 {id:'s29', d:'metr', from:'sup', dilemma:true, title:'Скидка тем, кто уходит?',
  text:'Каждый месяц отписываются около 220 платящих. Оля предлагает в момент отмены показывать скидку 50% на три месяца: «У конкурентов это удерживает до четверти уходящих». Тимур против: «Скидку раскусят — и начнут отменять ради неё».',
  options:[
   {t:'Скидка 50% на 3 месяца — только тем, кто ещё отмечает привычки, и раз на человека.', q:'best', fx:{ret:0.006, arppu:-0.4}, later:{in:2, fx:{arppu:-0.2}, note:'Про скидку при отмене написали в треде на Reddit — часть платящих стала «отменять ради скидки». Средний чек немного просел.'},
    fb:'Ты спасаешь часть платящих сразу и только тех, кто ещё получает ценность, — для них цена действительно может быть барьером. Плата — чек: часть спасённых осталась бы и без скидки, ARPPU снижается, а о скидке рано или поздно узнают.'},
   {t:'Без скидок: через месяц после отмены отправлять письмо с итогами прогресса и приглашением.', q:'ok', fx:{ret:0.002},
    fb:'Win-back-письма работают, но слабо: через месяц после отмены привычка уже разрушена. Момент отмены — самая дешёвая точка для удержания, и ты её пропускаешь.'},
   {t:'Вместо скидки — пауза подписки на 1–2 месяца для всех, кто нажимает «Отменить».', q:'best', fx:{debt:3}, later:{in:1, fx:{ret:0.005}, note:'Паузу выпустили: около трети взявших её вернулись к оплате. Цена не пострадала, но спасли меньше людей, чем спасла бы скидка.'},
    fb:'Пауза сохраняет цену и не учит отменять ради выгоды, а тем, кто уходит «на время», даёт повод вернуться. Плата — время разработки и меньше спасённых сейчас: тех, кто уходит из-за цены, пауза не удержит.'},
   {t:'Скидка 50% всем, кто нажал «Отменить»: удержать платящего дешевле, чем привлечь нового.', q:'bad', fx:{ret:0.008, arppu:-1.5},
    fb:'Скидка каждому, кто тянется к кнопке, быстро становится лайфхаком: отмена превращается в способ получить скидку, и ты субсидируешь тех, кто и так бы остался.'}
  ], lesson:'Удержание через цену всегда чем-то оплачивается: скидка — чеком и дисциплиной цены, пауза — временем и охватом. Выбирай, чем платить, осознанно.'},
 {id:'s30', d:'metr', from:'ceo', dilemma:true, title:'Закрыть бесплатную версию?',
  text:'Ритм — фримиум: базовые трекеры бесплатны, платят 5%, а каждая седьмая установка — органика от бесплатных пользователей, которые зовут друзей. Андрей прочитал кейс конкурента: жёсткий пейвол с 7-дневным триалом утроил им конверсию. «Денег до транша впритык — давай так же».',
  options:[
   {t:'Ничего не менять: фримиум — наш двигатель органики, и пейвол его просто заглушит.', q:'ok', fx:{trust:-5},
    fb:'Органику ты сохраняешь, но вопрос денег никуда не делся. Отказ что-либо менять при коротком runway — тоже решение, и дорогое.'},
   {t:'Оставить фримиум, но ограничить бесплатную версию тремя привычками — дальше Premium.', q:'best', fx:{conv:0.004, trust:-3}, later:{in:1, fx:{conv:0.002}, note:'Подкрутили лимит по данным: чаще всего пейвол срабатывает на четвёртой привычке. Конверсия подросла ещё, органика не пострадала.'},
    fb:'Ты сохраняешь воронку и органику, а платить начинают те, кто уже втянулся. Плата — скорость: выручка растёт скромнее, и до транша придётся дотягивать с меньшим запасом кэша.'},
   {t:'Пейвол сразу для всех, включая текущих бесплатных пользователей, — так эффект будет максимальным.', q:'bad', fx:{conv:0.014, ret:-0.025, viral:-0.008, trust:-6},
    fb:'Отбирать у текущих пользователей то, что они получали бесплатно, — гарантированная волна негатива и оттока. Эффект «максимальный» и в выручке, и в потерях.'},
   {t:'Жёсткий пейвол с 7-дневным триалом — только для новых; текущих бесплатных не трогать.', q:'best', fx:{conv:0.012, ret:-0.006, viral:-0.004}, later:{in:2, fx:{viral:-0.003}, note:'Платящих стало больше, но приглашений от друзей — заметно меньше: бесплатные пользователи были главным источником органики.'},
    fb:'Ты быстро получаешь деньги: триал отсекает тех, кто не готов платить, и конверсия резко растёт. Плата — органика и база: бесплатные пользователи, которые звали друзей, больше не появляются.'}
  ], lesson:'Модель монетизации — всегда обмен: жёсткий пейвол покупает выручку сейчас ценой органики, фримиум — наоборот. Назови цену выбора вслух.'},
 {id:'s31', d:'metr', from:'mkt', title:'$9 для Индии и Индонезии',
  text:'Лена разбила выручку по странам: 35% установок — из Индии, Индонезии и Турции, но там платят 1,2% пользователей против 7% в США и Европе. «Для них $9 — как для нас $30. Может, просто перестанем закупать там трафик?»',
  options:[
   {t:'Перестать закупать там трафик и перевести бюджет на США и Европу, где платят охотнее.', q:'ok', fx:{conv:0.003, cac:0.6},
    fb:'Логика понятна, но установка в США стоит в разы дороже, а аудитория там конечна — бюджет упрётся в растущий CAC. Ты уходишь с рынка, не проверив, при какой цене он окупается.'},
   {t:'Оставить $9 везде: региональные цены — лишняя сложность, а американцы купят через VPN.', q:'bad', fx:{trust:-3},
    fb:'Риск арбитража в мобильных сторах мал: цена привязана к стране аккаунта и способу оплаты. А единая цена оставляет треть аудитории почти без монетизации.'},
   {t:'Протестировать цены $3–4 на новых пользователях этих стран и сравнить ARPU.', q:'best', later:{in:1, fx:{conv:0.004, arppu:-0.4}, note:'При $4 в Индии, Индонезии и Турции платить стали втрое чаще — выручка с пользователя там выросла на треть. Раскатили на новых; средний чек по базе немного снизился.'},
    fb:'Цена должна соответствовать платёжеспособности рынка. Тест на новых пользователях показывает, при какой цене ARPU (конверсия × чек) в стране максимален, — без риска для текущей выручки.'}
  ], lesson:'Одна цена на весь мир — тоже решение о цене. Проверяй региональные цены по ARPU, а не по конверсии или чеку по отдельности.'},
 {id:'s32', d:'exp', from:'tech', title:'Сплит 50/50, а вышло 53/47',
  text:'Тимур делится итогами теста нового онбординга. Сплит планировали 50/50, но в контроле 5 300 пользователей, а в варианте — 4 700. Вариант даёт +9% к конверсии в оплату, p = 0.01. «Ну разошлись на пару сотен — значимость же есть. Катим?»',
  options:[
   {t:'Катим: p = 0.01 при таких выборках, а неравные группы статистика и так учитывает.', q:'bad', fx:{conv:0.001}, later:{in:1, fx:{conv:-0.001, ret:-0.006, trust:-2}, note:'После раскатки конверсия не выросла, зато владельцы старых Android завалили поддержку жалобами на вылеты в онбординге.'},
    fb:'Неравные группы статистика действительно переваривает — но только если перекос случайный. SRM говорит, что из варианта выпадают не случайные люди, и p-value уже ничего не значит.'},
   {t:'Не доверять результату: найти причину перекоса (платформы, версии, логи) и перезапустить.', q:'best', later:{in:1, fx:{conv:0.002}, note:'Нашли: на старых Android новый онбординг падал раньше, чем событие доходило до аналитики, — самые «слабые» пользователи выпадали из варианта. Починили, перезапустили: честный эффект — около +4%.'},
    fb:'Sample ratio mismatch — тревожный сигнал: при честной рандомизации такой перекос почти невозможен. Значит, из варианта кто-то систематически выпадает, и сравнение групп уже нечестное.'},
   {t:'Разбить результат по платформам и раскатить вариант там, где группы сошлись 50/50.', q:'ok', fx:{conv:0.001},
    fb:'Разбивка по платформам — верный первый шаг к поиску причины. Но раскатывать по «чистому» сегменту рано: пока причина не найдена, ты не знаешь, не задела ли она и его.'},
   {t:'Случайно убрать 600 лишних из контроля, пересчитать и катить, если значимость сохранится.', q:'bad', fx:{conv:0.001}, later:{in:1, fx:{conv:-0.001, ret:-0.005}, note:'Раскатили «выровненный» результат — эффект не повторился, а на старых Android онбординг начал падать у всех: именно эти люди и выпадали из варианта.'},
    fb:'Выравнивание числа не возвращает случайность: из варианта выпали конкретные люди (например, на медленных устройствах), и удаление случайных из контроля этот перекос не исправит.'}
  ], lesson:'Перед чтением результатов теста проверь SRM: если группы разошлись с плановым сплитом, ищи баг, а не эффект.'},
 {id:'s33', d:'exp', from:'ceo', title:'Конверсия упала, хотя везде выросла',
  text:'Андрей встревожен: за месяц конверсия в оплату упала с 5,2% до 4,6%. «Новый онбординг всё сломал — откатываем». Дима разбивает по каналам: в TikTok конверсия выросла с 2,0% до 2,4%, в остальных — с 6,0% до 6,4%. Но доля TikTok среди новых пользователей подскочила с 20% до 45%.',
  options:[
   {t:'Откатить онбординг: общая конверсия упала сразу после его релиза — зачем сейчас рисковать?', q:'bad', fx:{conv:-0.003, trust:2},
    fb:'Ты откатываешь изменение, которое улучшило конверсию в каждом канале. Общая цифра упала из-за сдвига в составе трафика, а не из-за продукта.'},
   {t:'Показать, что дело в миксе каналов: онбординг оставить, окупаемость TikTok считать отдельно.', q:'best', fx:{conv:0.002, trust:2}, later:{in:1, fx:{cac:-0.1}, note:'Посчитали окупаемость: CAC платящего из TikTok оказался в норме, кроме двух связок. Их отключили — бюджет стал работать точнее.'},
    fb:'Это парадокс Симпсона: в каждом канале конверсия выросла, а общая упала из-за смены микса. Онбординг работает; настоящий вопрос — окупается ли TikTok по CAC платящего.'},
   {t:'Срезать бюджет на TikTok: именно он тянет общую конверсию вниз, а все остальные каналы в порядке.', q:'ok', fx:{conv:0.003, cac:0.35},
    fb:'Низкая конверсия ещё не делает канал убыточным: если установка из TikTok вдвое дешевле, CAC платящего может быть в норме. Решай по CAC платящего, а не по конверсии.'}
  ], lesson:'Когда меняется состав аудитории, общая метрика может врать. Прежде чем делать выводы, разбей её по сегментам.'},
 {id:'s34', d:'exp', from:'mkt', title:'Эффект тает с каждой неделей',
  text:'Лена тестирует новый экран серий с анимацией и наградами. Ежедневные отметки привычек в варианте: +14% в первую неделю, +7% во вторую, +3% в третью. В среднем за три недели — +8%, p < 0.01. «Катим, отличный результат!»',
  options:[
   {t:'Катим, но обновлять анимации и награды каждый месяц, чтобы эффект новизны никогда не угасал.', q:'bad', fx:{ret:0.004, debt:6, morale:-4},
    fb:'Подпитывать новизну можно, но это беговая дорожка: команда постоянно делает косметику, а эффект всё равно затухает. Сначала узнай, есть ли у фичи устойчивый эффект.'},
   {t:'Катим: в среднем +8% за три недели при p < 0.01 — такой результат не бывает случайным.', q:'bad', fx:{ret:0.003, trust:2}, later:{in:2, fx:{trust:-5}, note:'Эффект «сдулся» до +3%, и план по удержанию, построенный на +8%, пришлось переписывать перед фондом.'},
    fb:'Значимость говорит, что эффект не ноль сейчас, но не говорит, каким он будет через месяц. Среднее за три недели прячет тренд: устойчивый эффект, скорее всего, около +3%.'},
   {t:'Не катить: эффект падает каждую неделю, и к пятой-шестой он, очевидно, обнулится.', q:'ok', fx:{morale:-3},
    fb:'Экстраполяция по трём точкам опасна: затухание новизны обычно выходит на плато, и устойчивые +3% — тоже результат. Без данных ты можешь выбросить работающую фичу.'},
   {t:'Проверить эффект на новичках, для которых экран не новинка, и продлить тест на 2 недели.', q:'best', later:{in:1, fx:{ret:0.004}, note:'У новичков эффект держался на +3% и через пять недель. Раскатили, рассчитывая на честные +3%, а не +8%.'},
    fb:'Падающий по неделям эффект — признак новизны: старые пользователи реагируют на «новое», а не на ценность. Новички не видели старой версии, поэтому их эффект ближе к устойчивому.'}
  ], lesson:'Если эффект тает по неделям, подозревай новизну: смотри на тренд и на новых пользователей, а не на среднее.'},
 {id:'s35', d:'exp', from:'mkt', dilemma:true, title:'Отключить холдаут по пушам?',
  text:'Год назад 10% пользователей отправили в холдаут — им не приходят напоминания. Их retention на 4 п.п. ниже. Лена: «Мы сознательно теряем около 180 человек в месяц. Включаем пуши всем». Дима против: холдаут — единственный способ видеть, что пуши дают на самом деле.',
  options:[
   {t:'Включить пуши всем, а эффект мерить двухнедельными холдаутами раз в квартал.', q:'best', fx:{ret:0.004, trust:3}, later:{in:2, fx:{ret:-0.001}, note:'Квартальный холдаут поймал усталость от пушей с опозданием: часть пользователей уже отключила уведомления.'},
    fb:'Ты сразу возвращаешь удержание и снимаешь конфликт с маркетингом, не отказываясь от измерений совсем. Плата — слепое пятно: двухнедельный тест не видит медленных эффектов, копящихся месяцами.'},
   {t:'Оставить 10% как есть: такой холдаут даёт точные цифры, а 180 человек в месяц — приемлемая цена.', q:'ok', fx:{trust:-4},
    fb:'Измерение сохраняешь, но 10% — больше, чем нужно для твоих вопросов: те же выводы дал бы холдаут вдвое меньше. Ты переплачиваешь удержанием и отношениями с маркетингом.'},
   {t:'Сократить холдаут до 5% и сделать постоянным: потери вдвое меньше, а измерение остаётся.', q:'best', fx:{ret:0.002, trust:-2}, later:{in:2, fx:{ret:0.003}, note:'Холдаут показал: после третьего пуша в неделю удержание начинает падать. Урезали частоту — retention вырос.'},
    fb:'Ты сохраняешь постоянное измерение и сможешь поймать медленные эффекты вроде усталости от пушей. Плата — часть удержания прямо сейчас и недовольство Лены, а точность замеров падает вместе с размером группы.'},
   {t:'Включить пуши всем и закрыть вопрос: эффект доказан за год, мерить дальше незачем.', q:'bad', fx:{ret:0.004, trust:3}, later:{in:2, fx:{ret:-0.006}, note:'Маркетинг добавлял пуш за пушем, а мерить вред было не на чем. Пользователи массово отключали уведомления — удержание просело.'},
    fb:'Год назад эффект был доказан для тех пушей. Без контрольной группы ты не увидишь, когда новые рассылки начнут вредить, — а маркетинг будет добавлять их и дальше.'}
  ], lesson:'Холдаут — это плата удержанием за знание. Бесплатного варианта нет: реши явно, сколько готов платить за то, чтобы видеть долгосрочный эффект.'}
];
const SCEN_EN = {
 s1:{title:'“Let\'s build a friends feed”', text:'A competitor just launched a social feed where friends can see each other\'s progress. Andrew is convinced Rhythm needs one too: “It\'s two months of dev work, but it\'s worth it.”', options:[
   {t:'Take it on: social features are a proven retention driver, and the competitor is already pulling ahead.', fb:'Building a feature without validating the problem is the most expensive way to test a hypothesis. Two months of team time went into a solution nobody validated.', note:'The feed shipped — only a handful of people use it, and retention barely moved.'},
