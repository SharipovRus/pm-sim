<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="author" content="Ruslan Sharipov">

<meta property="og:description" content="Браузерный тренажёр продакт-менеджера: 10 месяцев управления подписочным приложением. Кейсы стейкхолдеров, задачи на метрики, юнит-экономику, A/B-тесты, приоритизацию и discovery. Со встроенной шпаргалкой по терминам.">

<style>
:root{color-scheme:light dark; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
body{font-family:system-ui,sans-serif; font-size:14px}
img{max-width:100%}
[hidden]{display:none !important}
</style>
<title>Ритм · PM-симулятор</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#EDF0EA; --surface:#FFFFFF; --surface2:#F5F7F2; --ink:#16202A; --muted:#5A6570; --line:#D5DBD1;
  --accent:#2A4FE6; --accent-soft:#E3E8FD; --accent-ink:#FFFFFF;
  --xp:#D98E0B; --xp-soft:#FBEFD6;
  --good:#1D8657; --good-soft:#DDF2E7; --warn:#B87200; --warn-soft:#FAEBCF; --bad:#C23E2C; --bad-soft:#F8E0DB;
  --shadow:0 1px 0 rgba(22,32,42,.04), 0 8px 24px -12px rgba(22,32,42,.18);
  --display:"Unbounded", "Onest", system-ui, sans-serif;
  --body:"Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1217; --surface:#161B22; --surface2:#1C222A; --ink:#E6EBEE; --muted:#96A1AB; --line:#29313B;
    --accent:#7B93FF; --accent-soft:#1F2847; --accent-ink:#0E1217;
    --xp:#F0B340; --xp-soft:#3A2E14;
    --good:#43C488; --good-soft:#15301F; --warn:#E6A844; --warn-soft:#342812; --bad:#F2705B; --bad-soft:#3A1C17;
    --shadow:0 1px 0 rgba(0,0,0,.2), 0 10px 30px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1217; --surface:#161B22; --surface2:#1C222A; --ink:#E6EBEE; --muted:#96A1AB; --line:#29313B;
  --accent:#7B93FF; --accent-soft:#1F2847; --accent-ink:#0E1217;
  --xp:#F0B340; --xp-soft:#3A2E14;
  --good:#43C488; --good-soft:#15301F; --warn:#E6A844; --warn-soft:#342812; --bad:#F2705B; --bad-soft:#3A1C17;
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 10px 30px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased}
.app{max-width:1200px; margin:0 auto; padding-inline:16px; padding-block:18px 48px}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums}

/* HUD */
.hud{display:flex; flex-wrap:wrap; align-items:center; gap:14px 24px; margin-bottom:18px}
.brand{display:flex; align-items:baseline; gap:10px}
.brand b{font-family:var(--display); font-weight:700; font-size:22px; letter-spacing:-.01em}
.brand span{color:var(--muted); font-size:13px}
.track{flex:1 1 280px; display:flex; flex-direction:column; gap:6px; min-width:0}
.track-label{display:flex; justify-content:space-between; font-size:12px; color:var(--muted); letter-spacing:.04em; text-transform:uppercase}
.segs{display:grid; grid-template-columns:repeat(10,1fr); gap:4px}
.seg{height:8px; border-radius:2px; background:var(--line)}
.seg.done{background:var(--accent)}
.seg.now{background:var(--accent); opacity:.45; animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.9}}
.rank{display:flex; align-items:center; gap:10px; padding:6px 12px 6px 6px; background:var(--surface); border:1px solid var(--line); border-radius:999px}
.rank i{font-style:normal; font-family:var(--mono); font-size:12px; font-weight:600; background:var(--xp-soft); color:var(--xp); padding:3px 8px; border-radius:999px}
.rank b{font-size:13px; font-weight:600}
.lang{display:inline-flex; padding:3px; gap:2px; border:1px solid var(--line); border-radius:999px; background:var(--surface)}
.lang button{padding:4px 10px; border:0; border-radius:999px; background:none; cursor:pointer; font-size:12px; font-weight:700; letter-spacing:.04em; color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
.lang button:not([aria-pressed="true"]):hover{color:var(--accent)}

.grid{display:grid; grid-template-columns:minmax(0,1fr) 370px; gap:20px; align-items:start}
@media (max-width: 920px){ .grid{grid-template-columns:minmax(0,1fr)} }

/* Stage */
.stage{background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:26px; min-width:0}
@media (max-width:560px){ .stage{padding:18px} }
.eyebrow{display:flex; flex-wrap:wrap; align-items:center; gap:8px; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:14px}
.chip{display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:600; letter-spacing:.02em; text-transform:none; background:var(--surface2); border:1px solid var(--line); color:var(--ink)}
.chip.d-disc{background:#E6F3EC; border-color:#BFE0CD; color:#1B6B45}
.chip.d-prio{background:#F4E9FB; border-color:#DDC6EE; color:#6A2F93}
.chip.d-metr{background:#E3EAFD; border-color:#C3D0F7; color:#2440B8}
.chip.d-exp{background:#FCEBDD; border-color:#F0CDAE; color:#9A4A0E}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .chip.d-disc{background:#14301F;border-color:#23523A;color:#7DDBA9} :root:not([data-theme="light"]) .chip.d-prio{background:#2A1A38;border-color:#4A2F63;color:#D3A8F2} :root:not([data-theme="light"]) .chip.d-metr{background:#1A2446;border-color:#2E3F78;color:#9DB2FF} :root:not([data-theme="light"]) .chip.d-exp{background:#36220F;border-color:#5C3A1A;color:#F3B37C} }
:root[data-theme="dark"] .chip.d-disc{background:#14301F;border-color:#23523A;color:#7DDBA9}
:root[data-theme="dark"] .chip.d-prio{background:#2A1A38;border-color:#4A2F63;color:#D3A8F2}
:root[data-theme="dark"] .chip.d-metr{background:#1A2446;border-color:#2E3F78;color:#9DB2FF}
:root[data-theme="dark"] .chip.d-exp{background:#36220F;border-color:#5C3A1A;color:#F3B37C}

h1,h2,h3{text-wrap:balance; margin:0}
.h-display{font-family:var(--display); font-weight:700; letter-spacing:-.015em; line-height:1.15}
h2.h-display{font-size:clamp(20px,2.4vw,26px); margin-bottom:12px}
.lead{color:var(--muted); max-width:62ch}
p{margin:0 0 12px}

.msg-head{display:flex; align-items:center; gap:12px; margin-bottom:16px}
.ava{width:40px; height:40px; border-radius:12px; display:grid; place-items:center; font-weight:700; font-size:14px; color:#fff; flex:none}
.msg-who b{display:block; font-weight:600}
.msg-who span{font-size:13px; color:var(--muted)}
.msg-body{font-size:16px; max-width:64ch; margin-bottom:20px}

.opts{display:flex; flex-direction:column; gap:10px}
.opt{display:flex; gap:14px; align-items:flex-start; text-align:left; width:100%; padding:14px 16px; background:var(--surface2); border:1px solid var(--line); border-radius:12px; cursor:pointer; transition:border-color .15s, transform .15s, background .15s}
.opt:hover{border-color:var(--accent); background:var(--accent-soft)}
.opt:active{transform:translateY(1px)}
.opt kbd{flex:none; width:26px; height:26px; display:grid; place-items:center; border-radius:7px; border:1px solid var(--line); background:var(--surface); font-family:var(--mono); font-size:12px; color:var(--muted)}
.opt[disabled]{cursor:default; opacity:.55}
.opt[disabled]:hover{border-color:var(--line); background:var(--surface2)}
.opt.picked{opacity:1; border-color:var(--ink)}
.opt.is-best{border-color:var(--good); background:var(--good-soft); opacity:1}
.opt.is-wrong{border-color:var(--bad); background:var(--bad-soft); opacity:1}

.verdict{border-radius:12px; padding:16px 18px; margin-top:18px; border:1px solid}
.verdict.best{background:var(--good-soft); border-color:var(--good)}
.verdict.ok{background:var(--warn-soft); border-color:var(--warn)}
.verdict.bad{background:var(--bad-soft); border-color:var(--bad)}
.verdict h3{font-size:15px; font-weight:700; display:flex; align-items:center; gap:10px; margin-bottom:6px; flex-wrap:wrap}
.verdict h3 .xp{font-family:var(--mono); font-size:12px; background:var(--xp-soft); color:var(--xp); padding:2px 8px; border-radius:999px}
.verdict p{margin:0 0 8px; max-width:66ch}
.verdict p:last-child{margin-bottom:0}
.fx{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
.fx span{font-family:var(--mono); font-size:12px; padding:3px 8px; border-radius:6px; background:var(--surface); border:1px solid var(--line)}
.fx .up{color:var(--good)} .fx .down{color:var(--bad)}
.later{font-size:13px; color:var(--muted); margin-top:10px}

.actions{display:flex; flex-wrap:wrap; gap:10px; margin-top:20px; align-items:center}
.btn{display:inline-flex; align-items:center; gap:8px; padding:12px 20px; border-radius:11px; border:1px solid var(--line); background:var(--surface); cursor:pointer; font-weight:600}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.hint{font-size:12px; color:var(--muted)}

/* challenge */
.task-box{background:var(--surface2); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; overflow-x:auto}
table.t{border-collapse:collapse; width:100%; font-size:14px; min-width:360px}
table.t th, table.t td{padding:7px 10px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap}
table.t th:first-child, table.t td:first-child{text-align:left; white-space:normal}
table.t th{font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.04em}
table.t td{font-family:var(--mono); font-variant-numeric:tabular-nums}
table.t td:first-child{font-family:var(--body)}
table.t tr:last-child td{border-bottom:0}
@media (max-width:560px){ .task-box{padding:10px 8px} table.t{min-width:0; font-size:13px} table.t th, table.t td{padding:6px} }
.kv{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px}
.kv div{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 12px}
.kv small{display:block; font-size:12px; color:var(--muted)}
.kv b{font-family:var(--mono); font-size:18px}
.num-row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.num-row input{font-family:var(--mono); font-size:18px; padding:11px 14px; border-radius:11px; border:1px solid var(--line); background:var(--surface); color:var(--ink); width:200px; max-width:100%}
.num-row input:focus{outline:2px solid var(--accent); outline-offset:1px}

/* summary */
.deltas{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin:6px 0 18px}
.delta{border:1px solid var(--line); border-radius:12px; padding:12px 14px; background:var(--surface2)}
.delta small{display:block; color:var(--muted); font-size:12px}
.delta b{font-family:var(--mono); font-size:20px; display:block}
.delta em{font-style:normal; font-family:var(--mono); font-size:12px}
.up{color:var(--good)} .down{color:var(--bad)} .flat{color:var(--muted)}
.notes{display:flex; flex-direction:column; gap:8px; margin-bottom:18px}
.note{font-size:14px; padding:10px 14px; border-radius:10px; background:var(--accent-soft); border:1px solid var(--line)}
.note.warn{background:var(--warn-soft)}
.budget{border:1px solid var(--line); border-radius:12px; padding:16px; background:var(--surface2)}
.budget-top{display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:8px}
.budget-top b{font-family:var(--mono); font-size:20px}
input[type=range]{width:100%; accent-color:var(--accent)}
.budget-calc{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px; margin-top:12px; font-size:13px}
.budget-calc div{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:8px 10px}
.budget-calc span{display:block; color:var(--muted); font-size:12px}
.budget-calc b{font-family:var(--mono)}

/* dash */
.dash{display:flex; flex-direction:column; gap:14px}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px}
.panel-title{display:flex; justify-content:space-between; align-items:baseline; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:12px}
.hero-metric{display:flex; justify-content:space-between; align-items:flex-end; gap:10px; padding-bottom:12px; border-bottom:1px solid var(--line); margin-bottom:12px}
.hero-metric small{display:block; color:var(--muted); font-size:12px}
.hero-metric b{font-family:var(--display); font-size:28px; font-weight:700; letter-spacing:-.02em}
.hero-metric svg{color:var(--accent); flex:none}
.tiles{display:grid; grid-template-columns:1fr 1fr; gap:10px 14px}
.tile small{display:block; color:var(--muted); font-size:12px}
.tile b{font-family:var(--mono); font-size:16px; font-weight:600}
.tile .row{display:flex; align-items:center; justify-content:space-between; gap:6px}
.tile svg{color:var(--muted)}
.pill{display:inline-block; font-size:11px; font-weight:700; padding:2px 7px; border-radius:999px; font-family:var(--body)}
.pill.good{background:var(--good-soft); color:var(--good)} .pill.warn{background:var(--warn-soft); color:var(--warn)} .pill.bad{background:var(--bad-soft); color:var(--bad)}
.bars{display:flex; flex-direction:column; gap:10px}
.bar-row{display:grid; grid-template-columns:110px 1fr 34px; align-items:center; gap:10px; font-size:13px}
.bar{height:8px; border-radius:4px; background:var(--surface2); border:1px solid var(--line); overflow:hidden}
.bar i{display:block; height:100%; border-radius:4px; background:var(--accent); transition:width .5s}
.bar i.good{background:var(--good)} .bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}
.bar-row b{font-family:var(--mono); font-size:12px; text-align:right}
.skill{display:grid; grid-template-columns:1fr auto; gap:4px 10px; font-size:13px}
.skill + .skill{margin-top:12px}
.skill .lvl{font-family:var(--mono); font-size:12px; color:var(--muted)}
.skill .bar{grid-column:1/-1}
.skill .bar i{background:var(--xp)}

/* intro & end */
.intro-hero{display:grid; gap:14px; margin-bottom:22px}
.intro-hero h1{font-family:var(--display); font-weight:700; font-size:clamp(26px,4vw,40px); letter-spacing:-.02em; line-height:1.08}
.rules{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; margin:18px 0}
.rule{border:1px solid var(--line); border-radius:12px; padding:14px; background:var(--surface2)}
.rule b{display:block; margin-bottom:4px}
.rule span{font-size:14px; color:var(--muted)}
.goals{display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 4px}
.grade{display:flex; align-items:center; gap:18px; flex-wrap:wrap; margin-bottom:18px}
.grade-badge{font-family:var(--display); font-weight:700; font-size:clamp(26px,4vw,36px); letter-spacing:-.02em}
.score{font-family:var(--mono); font-size:14px; padding:6px 12px; border-radius:999px; background:var(--xp-soft); color:var(--xp); font-weight:600}
.badges{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; margin:10px 0 20px}
.badge{border:1px dashed var(--line); border-radius:12px; padding:12px; font-size:13px; color:var(--muted)}
.badge b{display:block; font-size:14px}
.badge.on{border-style:solid; border-color:var(--xp); background:var(--xp-soft); color:var(--ink)}
.review{display:flex; flex-direction:column; gap:10px; margin-top:10px}
.rev{border:1px solid var(--line); border-radius:12px; padding:12px 14px; display:grid; grid-template-columns:auto 1fr; gap:4px 12px}
.rev .dot{width:10px; height:10px; border-radius:50%; margin-top:7px}
.rev .dot.best{background:var(--good)} .rev .dot.ok{background:var(--warn)} .rev .dot.bad{background:var(--bad)}
.rev b{font-size:14px}
.rev p{grid-column:2; margin:0; font-size:14px; color:var(--muted)}
.section-h{font-family:var(--display); font-size:17px; font-weight:700; margin:22px 0 8px}
/* glossary */
.term{display:inline; padding:0; margin:0; background:none; border:0; font:inherit; color:inherit; cursor:help; text-decoration:underline; text-decoration-style:dotted; text-decoration-color:var(--accent); text-underline-offset:3px; text-decoration-thickness:1px}
.term:hover{background:var(--accent-soft); border-radius:3px}
#pop{position:fixed; z-index:60; width:340px; max-width:calc(100vw - 24px); background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px 18px; box-shadow:0 18px 40px -18px rgba(0,0,0,.45); animation:fadeIn .16s ease both}
#pop.sheet{left:0 !important; right:0; top:auto !important; bottom:0; width:auto; max-width:none; border-radius:16px 16px 0 0; padding-bottom:calc(18px + env(safe-area-inset-bottom, 0px))}
#pop h4, .gitem h4{font-family:var(--display); font-size:16px; font-weight:700; margin:0 0 2px}
.term-sub{font-size:12px; color:var(--muted); margin-bottom:8px}
#pop p, .gitem p{margin:0 0 8px; font-size:14px}
.term-f{font-family:var(--mono); font-size:12.5px; background:var(--surface2); border:1px solid var(--line); border-radius:8px; padding:7px 10px}
.term-close{position:absolute; top:8px; right:10px; background:none; border:0; font-size:20px; line-height:1; color:var(--muted); cursor:pointer}
#pop[hidden], #sheet[hidden]{display:none !important}
#sheet{position:fixed; inset:0; z-index:70; background:rgba(10,14,18,.45); display:flex; align-items:flex-start; justify-content:center; padding:24px 16px}
.sheet-panel{background:var(--bg); border:1px solid var(--line); border-radius:18px; width:min(880px,100%); max-height:100%; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 30px 60px -30px rgba(0,0,0,.6)}
.sheet-head{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:16px 18px 12px}
.sheet-head b{font-size:19px}
#gsearch{margin:0 18px 12px; padding:10px 14px; border-radius:11px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font:inherit}
.sheet-body{overflow-y:auto; padding:0 18px 20px; display:flex; flex-direction:column; gap:18px}
.gsec-h{font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:10px}
.gitem{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:8px}
.hud-btn{padding:7px 14px; border-radius:999px; border:1px solid var(--line); background:var(--surface); cursor:pointer; font-size:13px; font-weight:600}
.hud-btn:hover{border-color:var(--accent); color:var(--accent)}
.fade{animation:fadeIn .35s ease both}
@keyframes fadeIn{from{transform:translateY(6px)} to{transform:none}}
@media (prefers-reduced-motion: reduce){ .fade,.seg.now{animation:none} .bar i{transition:none} }
</style>

</head>
<body>
<div class="app">
  <header class="hud" id="hud"></header>
  <div class="grid">

<script>
/* ============ language ============ */
const LANGS = ['ru','en'], LANG_KEY = 'ritm-lang';
let LANG = (()=>{
  try{
    const q = new URLSearchParams(location.search).get('lang'); if(LANGS.includes(q)) return q;
    const s = localStorage.getItem(LANG_KEY); if(LANGS.includes(s)) return s;
  }catch(e){}
  return (navigator.languages||[navigator.language||'']).some(l=>/^(ru|uk|be|kk)/i.test(l)) ? 'ru' : 'en';
})();
const L = (ru, en) => LANG==='en' ? en : ru;

/* ============ constants ============ */

let DOMAINS, PEOPLE, QUAL, FX_META, CHAL_BONUS;

  };
  PEOPLE = {
    ceo:{name:L('Андрей','Andrew'), role:L('CEO и сооснователь','CEO & co-founder'), ini:L('АН','AN'), color:'#3B4A63'},
    mkt:{name:L('Лена','Lena'), role:L('Маркетинг','Marketing'), ini:L('ЛЕ','LE'), color:'#C2527A'},
    tech:{name:L('Тимур','Tim'), role:L('Техлид','Tech lead'), ini:L('ТИ','TI'), color:'#2E7D6B'},
    sup:{name:L('Оля','Olivia'), role:L('Поддержка','Support'), ini:L('ОЛ','OL'), color:'#B7791F'},
    data:{name:L('Дима','Dan'), role:L('Продуктовый аналитик','Product analyst'), ini:L('ДИ','DA'), color:'#4B5BD6'},
    inv:{name:L('Фонд «Север»','North Ventures'), role:L('Инвестор','Investor'), ini:L('ФС','NV'), color:'#6B5B4B'}
  };
  QUAL = {
    best:{label:L('Сильное решение','Strong call'), xp:30, pts:2},
    ok:{label:L('Рабочий вариант, но есть лучше','Workable, but there’s a better option'), xp:15, pts:1},
    bad:{label:L('Слабое решение','Weak call'), xp:5, pts:0}
  };
  FX_META = {
    ret:{label:'Retention', fmt:v=>(v>0?'+':'')+dec(v*100,1)+pp, inv:false},
    conv:{label:L('Конверсия в оплату','Paid conversion'), fmt:v=>(v>0?'+':'')+dec(v*100,1)+pp, inv:false},
    arppu:{label:'ARPPU', fmt:v=>(v>0?'+$':'−$')+dec(Math.abs(v),1), inv:false},
    cac:{label:L('CAC установки','CAC per install'), fmt:v=>(v>0?'+$':'−$')+dec(Math.abs(v),2), inv:true},
    viral:{label:L('Органика','Organic'), fmt:v=>(v>0?'+':'')+dec(v*100,1)+pp, inv:false},
    cash:{label:L('Кэш','Cash'), fmt:v=>(v>0?'+':'−')+money(Math.abs(v)), inv:false},
    trust:{label:L('Доверие','Trust'), fmt:v=>(v>0?'+':'')+Math.round(v), inv:false},
    morale:{label:L('Мораль','Morale'), fmt:v=>(v>0?'+':'')+Math.round(v), inv:false},
    debt:{label:L('Техдолг','Tech debt'), fmt:v=>(v>0?'+':'')+Math.round(v), inv:true}
  };
  CHAL_BONUS = {
    disc:{fx:{ret:0.004}, why:L('лучше понимаешь пользователей','you understand users better')},
    prio:{fx:{debt:-4, morale:3}, why:L('команда работает над правильным','the team works on the right things')},
    metr:{fx:{cac:-0.1}, why:L('бюджет тратится точнее','budget is spent more precisely')},
    exp:{fx:{conv:0.002}, why:L('эксперименты дают честный результат','experiments give honest results')}
  };
}

 s1:{title:'“Let\'s build a friends feed”', text:'A competitor just launched a social feed where friends can see each other\'s progress. Andrew is convinced Rhythm needs one too: “It\'s two months of dev work, but it\'s worth it.”', options:[

/* ============ helpers ============ */
const $ = s => document.querySelector(s);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
// RNG is swapped for a seeded one while a challenge is generated, so both languages get identical numbers
let RNG = Math.random;
function seeded(a){ return ()=>{ a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = (a,b) => a + RNG()*(b-a);
const ri = (a,b) => Math.floor(rnd(a, b+1));
const pick = arr => arr[Math.floor(RNG()*arr.length)];
const shuffle = arr => { const a = arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(RNG()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };
const NF = {ru:new Intl.NumberFormat('ru-RU'), en:new Intl.NumberFormat('en-US')};
const int = v => NF[LANG].format(Math.round(v));
function money(v){ const s = v<0?'−':''; v=Math.abs(v); if(v>=1e6) return s+'$'+(v/1e6).toFixed(2)+'M'; if(v>=1e4) return s+'$'+(v/1e3).toFixed(1)+'k'; return s+'$'+int(v); }
const dec = (v,d=1) => LANG==='en' ? v.toFixed(d) : v.toFixed(d).replace('.',',');
const pct = (v,d=1) => dec(v*100,d)+'%';
function erf(x){ const t=1/(1+0.3275911*Math.abs(x)); const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x); return x>=0?y:-y; }
const Phi = z => 0.5*(1+erf(z/Math.SQRT2));
function nice(n){ const p = Math.pow(10, Math.floor(Math.log10(n))-1); return Math.round(n/p)*p; }

 ab:{d:'exp', gen(){
   let n,c1,c2,z;
   do { n = ri(20,100)*100; const p1 = ri(40,100)/1000; const lift = rnd(-0.05,0.3); c1 = Math.round(n*p1); c2 = Math.round(n*p1*(1+lift)); const pp=(c1+c2)/(2*n); z = (c2/n-c1/n)/Math.sqrt(pp*(1-pp)*2/n); } while(Math.abs(z)>1.65 && Math.abs(z)<2.3 || c1===c2);
   const p = 2*(1-Phi(Math.abs(z))), sig = Math.abs(z)>=1.96;
   return {title:L('Значим ли результат A/B-теста?','Is the A/B test result significant?'), type:'choice',
    prompt:L(`<p>Тест новой кнопки «Отметить» на главном экране. Метрика — конверсия в оплату триала.</p>
     <div class="task-box" style="margin:0"><table class="t"><thead><tr><th>Группа</th><th>Пользователей</th><th>Оплат</th><th>Конверсия</th></tr></thead><tbody>
     <tr><td>A (контроль)</td><td>${int(n)}</td><td>${int(c1)}</td><td>${pct(c1/n,2)}</td></tr>
     <tr><td>B (новая кнопка)</td><td>${int(n)}</td><td>${int(c2)}</td><td>${pct(c2/n,2)}</td></tr></tbody></table></div>`,
     `<p>You’re testing a new “Check in” button on the home screen. The metric is trial-to-paid conversion.</p>
     <div class="task-box" style="margin:0"><table class="t"><thead><tr><th>Group</th><th>Users</th><th>Paid</th><th>Conversion</th></tr></thead><tbody>
     <tr><td>A (control)</td><td>${int(n)}</td><td>${int(c1)}</td><td>${pct(c1/n,2)}</td></tr>
     <tr><td>B (new button)</td><td>${int(n)}</td><td>${int(c2)}</td><td>${pct(c2/n,2)}</td></tr></tbody></table></div>`),
    question:L('Разница статистически значима при α = 0,05 (двусторонний тест)?','Is the difference statistically significant at α = 0.05 (two-sided test)?'),
    options:L(['Да, значима — можно раскатывать','Нет, не значима — это может быть шум'],
     ['Yes, it’s significant — OK to roll out','No, it’s not significant — it could be noise']), answer:sig?0:1,
    explain:L(`Z-тест для двух долей: объединённая конверсия p = ${pct((c1+c2)/(2*n),2)}, стандартная ошибка = √(p(1−p)·2/n). z ≈ <b>${dec(z,2)}</b>, p-value ≈ <b>${dec(p,3)}</b>. Порог для α = 0,05 — |z| ≥ 1,96. Относительная разница: ${(c2/c1-1)>=0?'+':''}${pct(c2/c1-1)}.`,
     `Two-proportion z-test: pooled conversion p = ${pct((c1+c2)/(2*n),2)}, standard error = √(p(1−p)·2/n). z ≈ <b>${dec(z,2)}</b>, p-value ≈ <b>${dec(p,3)}</b>. The threshold for α = 0.05 is |z| ≥ 1.96. Relative difference: ${(c2/c1-1)>=0?'+':''}${pct(c2/c1-1)}.`)};
 }},
 sample:{d:'exp', gen(){
   const p = pick([0.05,0.1,0.2]), mde = pick([0.1,0.2]);
   const delta = p*mde, n = nice(16*p*(1-p)/(delta*delta));
   const opts = shuffle([n, nice(n/4), nice(n*4), nice(n/12)]);
   return {title:L('Сколько пользователей нужно в тест?','How many users does the test need?'), type:'choice',
    prompt:L(`<p>Хочешь проверить новый онбординг. Стандартные параметры: α = 0,05, мощность 80%.</p>
     <div class="kv"><div><small>Базовая конверсия</small><b>${pct(p,0)}</b></div><div><small>Минимальный эффект (MDE)</small><b>+${pct(mde,0)} отн.</b></div><div><small>Абсолютный сдвиг</small><b>${dec(delta*100,1)} п.п.</b></div></div>`,
     `<p>You want to test a new onboarding flow. Standard parameters: α = 0.05, 80% power.</p>
     <div class="kv"><div><small>Baseline conversion</small><b>${pct(p,0)}</b></div><div><small>Minimum detectable effect (MDE)</small><b>+${pct(mde,0)} relative</b></div><div><small>Absolute lift</small><b>${dec(delta*100,1)} pp</b></div></div>`),
    question:L('Примерно сколько пользователей нужно в каждую группу?','Roughly how many users do you need per group?'),
    options:opts.map(v=>'≈ '+int(v)), answer:opts.indexOf(n),
    explain:L(`Эвристика Лера: n ≈ 16 · p(1−p) / δ² = 16 · ${dec(p,2)} · ${dec(1-p,2)} / ${dec(delta,3)}² ≈ <b>${int(n)}</b> на группу. Запомни: уменьшил MDE вдвое — выборка выросла в 4 раза.`,
     `Lehr’s rule of thumb: n ≈ 16 · p(1−p) / δ² = 16 · ${dec(p,2)} · ${dec(1-p,2)} / ${dec(delta,3)}² ≈ <b>${int(n)}</b> per group. Remember: halve the MDE and the sample size quadruples.`)};
 }},
 rice:{d:'prio', gen(){
   const names = shuffle(L(['Напоминание по геолокации','Виджет на главный экран','Синхронизация с Apple Health','Челленджи с друзьями','Статистика за год','Шаблоны привычек','Голосовая отметка','Серии и заморозка серии'],
     ['Location-based reminders','Home screen widget','Apple Health sync','Challenges with friends','Yearly stats','Habit templates','Voice check-in','Streaks and streak freeze'])).slice(0,4);
   let rows;
   do { rows = names.map(nm=>{ const R=ri(5,80)*100, I=pick([0.25,0.5,1,2,3]), C=pick([0.5,0.8,1]), E=ri(1,8); return {nm,R,I,C,E,s:R*I*C/E}; }); const s = rows.map(r=>r.s).sort((a,b)=>b-a); if(s[0]>=s[1]*1.2) break; } while(true);
   const best = rows.reduce((b,r,i)=>r.s>rows[b].s?i:b,0);
   return {title:L('Что делать первым по RICE?','What goes first by RICE?'), type:'choice',
    prompt:L(`<p>Бэклог на квартал. Reach — пользователей за квартал, Impact — по шкале 0,25–3, Confidence — уверенность в оценках, Effort — человеко-недели.</p>
     <div class="task-box" style="margin:0"><table class="t"><thead><tr><th>Фича</th><th>Reach</th><th>Impact</th><th>Confidence</th><th>Effort</th></tr></thead><tbody>
     ${rows.map(r=>`<tr><td>${r.nm}</td><td>${int(r.R)}</td><td>${String(r.I).replace('.',',')}</td><td>${Math.round(r.C*100)}%</td><td>${r.E}</td></tr>`).join('')}</tbody></table></div>`,
     `<p>Your backlog for the quarter. Reach is users per quarter, Impact is on a 0.25–3 scale, Confidence is how sure you are of the estimates, Effort is in person-weeks.</p>
     <div class="task-box" style="margin:0"><table class="t"><thead><tr><th>Feature</th><th>Reach</th><th>Impact</th><th>Confidence</th><th>Effort</th></tr></thead><tbody>
     ${rows.map(r=>`<tr><td>${r.nm}</td><td>${int(r.R)}</td><td>${r.I}</td><td>${Math.round(r.C*100)}%</td><td>${r.E}</td></tr>`).join('')}</tbody></table></div>`),
    question:L('Какая фича получает наивысший RICE-приоритет?','Which feature gets the highest RICE score?'), options:rows.map(r=>r.nm), answer:best,
    explain:`RICE = Reach × Impact × Confidence ÷ Effort. ${rows.map(r=>`${r.nm}: <b>${int(r.s)}</b>`).join('; ')}.`};
 }},

 funnel:{d:'metr', gen(){
   const steps = L(['Установка','Регистрация','Выбор первой привычки','Первая отметка','Старт триала','Оплата'],
     ['Install','Sign-up','First habit chosen','First check-in','Trial start','Payment']);

   const counts=[ri(8,20)*1000]; conv.forEach((c,i)=>counts.push(Math.round(counts[i]*c)));
   const real = conv.map((c,i)=>counts[i+1]/counts[i]); const minI = real.indexOf(Math.min(...real));

 cohort:{d:'metr', gen(){

const glossL = g => LANG==='en' ? Object.assign({k:g.k}, GLOSS_EN[g.k]) : Object.assign({}, g, {sub:(g.en!=='—'?g.en+' · ':'')+g.ru});
const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
let GMAP = {}, TERM_RE = null, ALIAS_KEY = {};
// English aliases are matched case-insensitively; Russian ones list their case forms explicitly
function buildTerms(){
  const gl = GLOSS.map(glossL);
  GMAP = {}; gl.forEach(g=>GMAP[g.k]=g);
  const aliases = gl.flatMap(g=>g.a.map(a=>({a, k:g.k}))).sort((x,y)=>y.a.length-x.a.length);
  const flags = LANG==='en' ? 'giu' : 'gu';
  try { TERM_RE = new RegExp('(?<![\\p{L}\\d-])(' + aliases.map(x=>esc(x.a)).join('|') + ')(?![\\p{L}\\d-])', flags); }
  catch(e){ TERM_RE = new RegExp('(' + aliases.map(x=>esc(x.a)).join('|') + ')', flags.replace('u','')); }
  ALIAS_KEY = {}; aliases.forEach(x=>{ const a = x.a.toLowerCase(); if(!(a in ALIAS_KEY)) ALIAS_KEY[a]=x.k; });
}

function annotate(root){
  if(!root || !TERM_RE) return;
  const count = {};
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(n){
      if(!n.nodeValue || n.nodeValue.trim().length<2) return NodeFilter.FILTER_REJECT;
      const p = n.parentElement;
      if(!p || p.closest('.term, .opt, kbd, .lvl, .pill, script, style, .badge, .segs')) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const nodes = []; let n; while((n = walker.nextNode())) nodes.push(n);
  nodes.forEach(node=>{
    const text = node.nodeValue; TERM_RE.lastIndex = 0;
    if(!TERM_RE.test(text)) return; TERM_RE.lastIndex = 0;
    const frag = document.createDocumentFragment(); let last = 0, m;
    while((m = TERM_RE.exec(text))){
      const key = ALIAS_KEY[m[0].toLowerCase()];
      if(!key || (count[key]||0) >= 2) continue;
      count[key] = (count[key]||0)+1;
      frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      const b = document.createElement('span');
      b.className = 'term'; b.tabIndex = 0; b.setAttribute('role','button'); b.dataset.term = key; b.textContent = m[0];
      b.setAttribute('aria-label', m[0]+L(' — что это значит',' — what it means'));
      frag.appendChild(b); last = m.index + m[0].length;
    }
    if(!last) return;
    frag.appendChild(document.createTextNode(text.slice(last)));
    node.parentNode.replaceChild(frag, node);
  });
}

}

/* ============ state ============ */
let S = null;
function derive(m){
  const debtPen = Math.max(0, m.debt-50)*0.0008;
  const effRet = clamp(m.ret - debtPen + (m.morale-60)*0.0003, 0.4, 0.96);
  const effCac = m.cac*(1+Math.max(0,m.budget-20000)/40000);
  const payers = m.users*m.conv, mrr = payers*m.arppu, gross = mrr*MARGIN;
  const burn = TEAM_COST + m.budget, net = gross - burn;
  const payerRet = Math.min(0.97, effRet+0.10);
  const ltv = m.arppu*MARGIN/(1-payerRet), cacPayer = effCac/m.conv;
  return {effRet, effCac, payers, mrr, gross, burn, net, ltv, cacPayer, ratio:ltv/cacPayer, runway: net<0 ? m.cash/(-net) : Infinity, debtPen};
}
function pickBalanced(items, n){
  const groups = {}; items.forEach(it=>{ (groups[it.d] = groups[it.d]||[]).push(it.id); });
  Object.keys(groups).forEach(k=>groups[k]=shuffle(groups[k]));
  const out=[]; while(out.length<n){ const ks = shuffle(Object.keys(groups).filter(k=>groups[k].length)); if(!ks.length) break; for(const k of ks){ if(out.length<n) out.push(groups[k].shift()); } }
  return out;
}
// scenario with texts in the current language
function scenL(id){
  const s = SCEN.find(x=>x.id===id); if(LANG==='ru') return s;
  const e = SCEN_EN[id];
  return Object.assign({}, s, {title:e.title, text:e.text, lesson:e.lesson,
    options:s.options.map((o,i)=>Object.assign({}, o, {t:e.options[i].t, fb:e.options[i].fb}, o.later?{later:Object.assign({}, o.later, {note:e.options[i].note})}:{}))});
}
const laterNote = r => scenL(r.sid).options[r.oi].later.note;
// challenge is generated once per language from the same seed; text lives in c.txt[lang]
function genChal(key){
  const seed = (Math.random()*4294967296)>>>0, keep = LANG, txt = {};
  try { LANGS.forEach(lg=>{ LANG = lg; RNG = seeded(seed); txt[lg] = CHAL[key].gen(); }); }
  finally { LANG = keep; RNG = Math.random; }
  const c = txt.ru;
  return {key, d:CHAL[key].d, type:c.type, answer:c.answer, tol:c.tol, abs:c.abs||0, txt};
}
function newGame(){
  const m = {users:45000, ret:0.80, conv:0.05, arppu:9, cac:2.5, viral:0.03, cash:600000, trust:60, morale:62, debt:40, budget:20000};
  const d = derive(m);
  S = { v:2, month:1, phase:'scenario', m,
    history:[{month:0, users:m.users, mrr:d.mrr, cash:m.cash, ratio:d.ratio, ret:d.effRet}],
    queue:[], xp:{disc:0,prio:0,metr:0,exp:0}, acc:{disc:[0,0],prio:[0,0],metr:[0,0],exp:[0,0]},
    scen:pickBalanced(SCEN.map(s=>({id:s.id,d:s.d})), MONTHS),
    chal:pickBalanced(Object.keys(CHAL).map(k=>({id:k,d:CHAL[k].d})), MONTHS),
    cur:{}, log:[], streak:0, bestStreak:0, fired:[], ended:false, initMrr:d.mrr };
  startMonth();
}
function startMonth(){
  S.phase = 'scenario';
  const id = S.scen[S.month-1];
  S.cur = { scenId:id, order:shuffle(SCEN.find(s=>s.id===id).options.map((_,i)=>i)), choice:null, chal:null, chalAns:null, chalOk:null, fxShown:null };
  save(); render();
}
function applyFx(fx){
  const m = S.m; if(!fx) return;
  for(const k in fx){ m[k] = (m[k]||0) + fx[k]; }
  m.ret = clamp(m.ret,0.4,0.95); m.conv = clamp(m.conv,0.005,0.2); m.arppu = clamp(m.arppu,3,30); m.cac = clamp(m.cac,0.8,10);
  m.viral = clamp(m.viral,0,0.15); m.trust = clamp(m.trust,0,100); m.morale = clamp(m.morale,0,100); m.debt = clamp(m.debt,0,100);
}
function streakHit(ok){ S.streak = ok ? S.streak+1 : 0; S.bestStreak = Math.max(S.bestStreak, S.streak); }

function chooseScenario(i){
  if(S.cur.choice!==null) return;
  const sc = SCEN.find(s=>s.id===S.cur.scenId), o = sc.options[i];
  S.cur.choice = i; applyFx(o.fx);
  if(o.later) S.queue.push({at:S.month+o.later.in-1, fx:o.later.fx, sid:sc.id, oi:i});
  S.xp[sc.d] += QUAL[o.q].xp; S.acc[sc.d][0] += QUAL[o.q].pts; S.acc[sc.d][1] += 2;
  streakHit(o.q==='best');
  S.log.push({kind:'scen', id:sc.id, d:sc.d, q:o.q});
  S.phase = 'scenFeedback'; save(); render();
}
function toChallenge(){
  S.cur.chal = genChal(S.chal[S.month-1]);
  S.phase = 'challenge'; save(); render();
  setTimeout(()=>{ const inp = $('#ans-num'); if(inp) inp.focus(); }, 30);
}
function answerChallenge(val){
  const c = S.cur.chal; if(S.cur.chalOk!==null) return;
  let ok;
  if(c.type==='number'){
    // ru: comma is the decimal separator; en: comma separates thousands
    const raw = String(val).replace(/[\s$]/g,'');
    const v = parseFloat(LANG==='en' ? raw.replace(/,/g,'') : raw.replace(',','.'));
    if(isNaN(v)){ const inp=$('#ans-num'); if(inp){ inp.setAttribute('aria-invalid','true'); inp.placeholder=L('Введи число','Enter a number'); inp.focus(); } return; }
    ok = Math.abs(v-c.answer) <= Math.max(Math.abs(c.answer)*c.tol, c.abs||0); S.cur.chalAns = v;
  } else { ok = val===c.answer; S.cur.chalAns = val; }
  S.cur.chalOk = ok;
  S.xp[c.d] += ok?40:10; S.acc[c.d][0] += ok?2:0; S.acc[c.d][1] += 2;
  if(ok) applyFx(CHAL_BONUS[c.d].fx);
  streakHit(ok);
  S.log.push({kind:'chal', d:c.d, ok, title:{ru:c.txt.ru.title, en:c.txt.en.title}, explain:{ru:c.txt.ru.explain, en:c.txt.en.explain}});
  S.phase = 'chalFeedback'; save(); render();
}
function closeMonth(){
  const m = S.m;
  const fired = S.queue.filter(q=>q.at<=S.month); S.queue = S.queue.filter(q=>q.at>S.month);
  fired.forEach(q=>applyFx(q.fx));
  const before = derive(m); const prev = {users:m.users, mrr:before.mrr, cash:m.cash, ratio:before.ratio};
  const d = derive(m);
  const organic = m.users*m.viral, paid = m.budget/d.effCac;
  m.users = m.users*d.effRet + organic + paid;
  const after = derive(m);
  m.cash += after.gross - after.burn;
  m.debt = clamp(m.debt+3,0,100); m.morale += (60-m.morale)*0.12; m.trust += (55-m.trust)*0.08;
  const fin = derive(m);
  S.history.push({month:S.month, users:m.users, mrr:fin.mrr, cash:m.cash, ratio:fin.ratio, ret:fin.effRet});
  S.summary = {prev, fired:fired.map(f=>({sid:f.sid, oi:f.oi})), newUsers:organic+paid, paid, organic, churned:prev.users*(1-d.effRet), debtWarn:d.debtPen>0};
  S.phase = m.cash<0 ? 'end' : (S.month>=MONTHS ? 'end' : 'summary');
  if(S.phase==='end') S.ended = true;
  save(); render();
}
function nextMonth(){ S.month++; startMonth(); }

/* ============ scoring ============ */
function totalXp(){ return Object.values(S.xp).reduce((a,b)=>a+b,0); }
function rankFromXp(x){ const r=[[0,L('Стажёр','Intern')],[120,'Junior PM'],[260,'Middle PM'],[420,'Senior PM'],[560,'Lead PM'],[660,'Head of Product']]; let t=r[0][1]; r.forEach(([v,n])=>{ if(x>=v) t=n; }); return t; }
function finalScore(){
  const sc = S.log.filter(l=>l.kind==='scen'), ch = S.log.filter(l=>l.kind==='chal');
  const s1 = sc.length ? sc.reduce((a,l)=>a+QUAL[l.q].pts,0)/(2*sc.length) : 0;
  const s2 = ch.length ? ch.filter(l=>l.ok).length/ch.length : 0;
  const skill = (s1+s2)/2;
  const d = derive(S.m), growth = d.mrr/S.initMrr;
  const biz = 0.4*clamp((growth-0.8)/1.7,0,1) + 0.3*clamp((d.ratio-1)/3,0,1) + 0.15*(S.m.cash>0?1:0) + 0.15*S.m.trust/100;
  const total = S.m.cash<0 ? Math.min(0.45, 0.6*skill+0.4*biz) : 0.6*skill+0.4*biz;
  const grades = [[0,L('Стажёр','Intern')],[0.35,'Junior PM'],[0.5,'Middle PM'],[0.65,'Senior PM'],[0.8,'Lead PM'],[0.9,'Head of Product']];
  let g = grades[0][1]; grades.forEach(([v,n])=>{ if(total>=v) g=n; });
  return {skill, biz, total, grade:g, growth, s1, s2};
}
function badges(){
  const d = derive(S.m), sc = S.log.filter(l=>l.kind==='scen');
  const disc = sc.filter(l=>l.d==='disc');
  const s14 = sc.find(l=>l.id==='s14');
  return [
    {n:L('Сначала проблема','Problem first'), t:L('Все discovery-кейсы решены сильно','Every discovery case solved with a strong call'), on: disc.length>=1 && disc.every(l=>l.q==='best')},
    {n:L('Здоровая экономика','Healthy economics'), t:L('LTV / CAC ≥ 3 в конце игры','LTV / CAC ≥ 3 at the end of the game'), on: d.ratio>=3},
    {n:L('Без подглядываний','No peeking'), t:L('Дождался конца A/B-теста','Waited for the A/B test to finish'), on: !!s14 && s14.q==='best'},
    {n:L('Серия ×5','Streak ×5'), t:L('5 верных ответов подряд','5 right answers in a row'), on: S.bestStreak>=5},
    {n:L('Чистый код','Clean code'), t:L('Техдолг ≤ 30 в конце','Tech debt ≤ 30 at the end'), on: S.m.debt<=30},
    {n:L('Кэш жив','Still solvent'), t:L('Прошёл 10 месяцев, не обнулив счёт','Made it through 10 months without running out of cash'), on: S.m.cash>0 && S.month>=MONTHS}
  ];
}

/* ============ rendering ============ */
function spark(vals, w=120, h=34){
  if(vals.length<2) vals = [vals[0], vals[0]];
  const mn = Math.min(...vals), mx = Math.max(...vals), rg = (mx-mn)||1;
  const pts = vals.map((v,i)=>[ (i/(vals.length-1))*(w-6)+3, h-4-((v-mn)/rg)*(h-10) ]);
  const line = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area = line+` L${pts[pts.length-1][0].toFixed(1)} ${h} L${pts[0][0].toFixed(1)} ${h} Z`;
  const e = pts[pts.length-1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${area}" fill="currentColor" opacity=".12"/><path d="${line}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${e[0].toFixed(1)}" cy="${e[1].toFixed(1)}" r="3" fill="currentColor"/></svg>`;
}
function fxChips(fx){
  if(!fx) return '';
  return `<div class="fx">${Object.keys(fx).map(k=>{ const v=fx[k], meta=FX_META[k]; const good = meta.inv ? v<0 : v>0; return `<span class="${good?'up':'down'}">${meta.label} ${meta.fmt(v)}</span>`; }).join('')}</div>`;
}
function renderHud(){
  const month = S ? S.month : 0;

function deltaTile(label, now, prev, fmt, inv){
  const diff = now - prev, rel = prev ? diff/Math.abs(prev) : 0;
  const cls = Math.abs(rel)<0.005 ? 'flat' : ((inv ? diff<0 : diff>0) ? 'up' : 'down');
  return `<div class="delta"><small>${label}</small><b>${fmt(now)}</b><em class="${cls}">${diff>=0?'▲':'▼'} ${fmt(Math.abs(diff))}</em></div>`;
}

  const a = b.dataset.act;
  if(a==='lang'){ setLang(b.dataset.lang); return; }
  if(a==='sheet'){ openSheet(); return; }
  if(a==='sheetClose'){ closeSheet(); return; }
  if(a==='popClose'){ closeTerm(); return; }
  if(a==='new'){ clearSave(); newGame(); window.scrollTo({top:0}); }
  else if(a==='continue'){ S = load(); render(); }
  else if(a==='scen') chooseScenario(+b.dataset.i);
  else if(a==='toChal'){ toChallenge(); window.scrollTo({top:0}); }
  else if(a==='chal') answerChallenge(+b.dataset.i);
  else if(a==='chalNum') answerChallenge($('#ans-num').value);
  else if(a==='close'){ closeMonth(); window.scrollTo({top:0}); }
  else if(a==='next'){ nextMonth(); window.scrollTo({top:0}); }
});
document.addEventListener('input', e=>{
  if(e.target.id==='budget') updateBudget();
  else if(e.target.id==='gsearch') filterSheet(e.target.value);
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ const s = document.getElementById('sheet'); if(s && !s.hidden){ closeSheet(); return; } closeTerm(); return; }
  if(e.target.id==='ans-num'){ if(e.key==='Enter'){ e.preventDefault(); answerChallenge(e.target.value); } return; }
  if(e.target.tagName==='INPUT') return;
  if(e.key==='?'){ openSheet(); return; }
  if((e.key==='Enter'||e.key===' ') && e.target.classList && e.target.classList.contains('term')){ e.preventDefault(); openTerm(e.target); return; }
  if(/^[1-5]$/.test(e.key)){ const btn = document.querySelectorAll('#stage .opt')[+e.key-1]; if(btn && !btn.disabled){ btn.click(); } }
  else if(e.key==='Enter'){ const p = document.querySelector('[data-primary]'); if(p && document.activeElement===document.body){ e.preventDefault(); p.click(); } }
});

/* ============ boot ============ */
function applyLang(){
  i18nConsts(); buildTerms();
  document.documentElement.lang = LANG;
  document.title = L('Ритм · PM-симулятор','Rhythm · PM simulator');
}
function setLang(lg){
  if(!LANGS.includes(lg) || lg===LANG) return;
  LANG = lg; applyLang();
  try{ localStorage.setItem(LANG_KEY, lg); }catch(e){}
  try{ const u = new URL(location.href); u.searchParams.set('lang', lg); history.replaceState(null, '', u); }catch(e){}
  const sheetOpen = (()=>{ const s = document.getElementById('sheet'); return s && !s.hidden; })();
  render();
  if(sheetOpen) openSheet();
}
applyLang();
function start(data){
  if(data && data.S) S = data.S;
  render();
}
try{ window.claude?.hot?.snapshot?.(()=>({S})); }catch(e){}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
