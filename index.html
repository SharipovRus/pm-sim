function totalXp(){ return Object.values(S.xp).reduce((a,b)=>a+b,0); }
// XP gives a level; job titles come only from the final grade, so the two never disagree
const levelFromXp = x => Math.floor(x/100)+1;
function finalScore(){
  const sc = S.log.filter(l=>l.kind==='scen'), ch = S.log.filter(l=>l.kind==='chal');
  const s1 = sc.length ? sc.reduce((a,l)=>a+QUAL[l.q].pts,0)/(2*sc.length) : 0;
  // a right answer with a hint counts half
  const s2 = ch.length ? ch.reduce((a,l)=>a + (l.ok ? (l.hint ? 0.5 : 1) : 0), 0)/ch.length : 0;
  const skill = (s1+s2)/2;
  const d = derive(S.m), growth = d.mrr/S.initMrr;
  const biz = 0.4*clamp((growth-0.8)/1.7,0,1) + 0.3*clamp((d.ratio-1)/3,0,1) + 0.15*(S.m.cash>0?1:0) + 0.15*S.m.trust/100;
  const total = S.m.cash<0 ? Math.min(0.45, 0.6*skill+0.4*biz) : 0.6*skill+0.4*biz;
  const grades = [[0,'Intern'],[0.35,'Junior PM'],[0.5,'Middle PM'],[0.65,'Senior PM'],[0.8,'Lead PM'],[0.9,'Head of Product']];
  // grade by the score the player sees (rounded), so "90 / 100" is never shown with a lower grade
  const shown = Math.round(total*100)/100;
  let g = grades[0][1]; grades.forEach(([v,n])=>{ if(shown>=v) g=n; });
  return {skill, biz, total, grade:gradeL(g), gradeKey:g, growth, s1, s2};
}

  shareHint(L(`Картинка скачана${ok?', текст скопирован':''}. В LinkedIn нажми «Добавить медиа» (иконка фото), выбери картинку${ok?' и вставь текст':''}.`, `Image downloaded${ok?' and text copied':''}. In LinkedIn, click “Add media” (the photo icon) and pick the image${ok?', then paste the text':''}.`, `Imagem baixada${ok?' e texto copiado':''}. No LinkedIn, clique em “Adicionar mídia” (o ícone de foto) e escolha a imagem${ok?', depois cole o texto':''}.`));
}
function shareHint(t){ const h = $('#share-hint'); if(h) h.textContent = t; }
async function copyText(t){ try{ await navigator.clipboard.writeText(t); return true; }catch(e){ return false; } }
async function shareCard(){
  const blob = await cardBlob();
  const file = new File([blob], L('ritm-rezultat.png','rhythm-result.png', 'rhythm-result.png'), {type:'image/png'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], text:shareText()}); track('share-native'); return; }
    catch(e){ if(e.name==='AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  track('share-download');
  shareHint(L('Картинка сохранена — приложи её к посту.','Image saved — attach it to your post.', 'Imagem salva — anexe ao seu post.'));
}
async function shareLinkedIn(){
  const ok = await copyText(shareText());
  window.open('https://www.linkedin.com/sharing/share-offsite/?url='+encodeURIComponent(shareUrl()), '_blank', 'noopener');
  track('share-linkedin');
  shareHint(ok ? L('Текст поста скопирован — вставь его в LinkedIn.','Post text copied — paste it into LinkedIn.', 'Texto do post copiado — cole no LinkedIn.') : '');
}

/* ============ competencies ============ */
// 7 PM competencies (texts in COMP). Each case/challenge feeds its 1–2 tags (primary full weight, secondary half);
// some competencies also get a signal from the state of the business. Scores are derived from S.log, so old saves still work.
const COMP_KEYS = ['user','strategy','exec','data','biz','stake','lead'];
const COMP_LVL = [[0,'Junior'],[0.5,'Middle'],[0.65,'Senior'],[0.8,'Lead'],[0.9,'Head']];
const LVL_PT = ['Júnior','Pleno','Sênior','Lead','Head'];
const lvlName = i => LANG==='pt' ? LVL_PT[i] : COMP_LVL[i][1];
const COMP_SIGNAL_W = 1.5;
// every competency starts from a neutral prior, so a couple of lucky answers don't make you Head
const COMP_PRIOR = {v:0.5, w:1.5};
const DOMAIN_COMP = {disc:'user', prio:'exec', metr:'biz', exp:'data'};
const scenTags = id => { const s = SCEN.find(x=>x.id===id); return (s && s.c) || COMP_TAGS.scen[id] || [DOMAIN_COMP[s ? s.d : 'disc']]; };
const chalTags = (key, d) => (key && COMP_TAGS.chal[key]) || [DOMAIN_COMP[d]];
const compName = k => { const c = COMP.find(x=>x.k===k); return c ? TL(c.name) : k; };
function compLevel(x){ let i = 0; COMP_LVL.forEach(([v],j)=>{ if(x>=v) i = j; }); return i; }
function compSignals(){
  const m = S.m, h = S.history[S.history.length-1], growth = h.mrr/S.initMrr;
  return {
    biz: 0.5*clamp((growth-0.8)/1.7,0,1) + 0.5*clamp((h.ratio-1)/3,0,1),
    stake: clamp((m.trust-30)/40,0,1),
    lead: clamp((m.morale-40)/40,0,1),
    exec: clamp((80-m.debt)/60,0,1)
  };
}
function compScores(){
  const acc = {}; COMP_KEYS.forEach(k=>acc[k] = {w:0, v:0, n:0});
  S.log.forEach(l=>{
    const tags = l.kind==='scen' ? scenTags(l.id) : chalTags(l.key, l.d);
    const v = l.kind==='scen' ? ({best:1, ok:0.5, bad:0})[l.q] : (l.ok ? (l.hint ? 0.5 : 1) : 0);
    tags.forEach((k,i)=>{ if(!acc[k]) return; const w = i ? 0.5 : 1; acc[k].w += w; acc[k].v += w*v; acc[k].n++; });
  });
  const sig = S.history.length > 1 ? compSignals() : {}, out = {};
  COMP_KEYS.forEach(k=>{
    const a = acc[k], sw = (k in sig) ? COMP_SIGNAL_W : 0, w = a.w + sw;
    out[k] = w ? {score:(a.v + sw*(sig[k]||0) + COMP_PRIOR.v*COMP_PRIOR.w)/(w + COMP_PRIOR.w), n:a.n} : {score:null, n:0};
    // the level is also capped by how often the competency came up: 1 move → Middle, 2–3 → Senior, 4–5 → Lead, 6+ → Head
    if(out[k].score!==null){ const raw = compLevel(out[k].score), cap = a.n>=6 ? 4 : a.n>=4 ? 3 : a.n>=2 ? 2 : 1; out[k].level = Math.min(raw, cap); out[k].capped = raw > cap; }
  });
  return out;
}
function compChips(tags){
  return `<span class="comp-lbl">${L('прокачиваешь','builds', 'desenvolve')}</span>` + tags.map((k,i)=>`<button class="chip comp${i?' sec':''}" data-act="compInfo" data-k="${k}" title="${L('Что это за компетенция','What this competency is', 'O que é esta competência')}">${compName(k)}</button>`).join('');
}
function openCompInfo(btn){
  const c = COMP.find(x=>x.k===btn.dataset.k); if(!c) return;
  showPop(btn, `<h4>${TL(c.name)}</h4><div class="term-sub">${L('Компетенция продакта · уровни от Junior до Head','PM competency · levels from Junior to Head', 'Competência de PM · níveis de Júnior a Head')}</div><p>${TL(c.def)}</p><p class="hint">${TL(c.game)}</p><button class="link-btn" data-act="matrix">${L('Вся матрица компетенций →','Full competency matrix →', 'Matriz de competências completa →')}</button>`);
}

function spark(vals, w=120, h=34){
  if(vals.length<2) vals = [vals[0], vals[0]];
  const mn = Math.min(...vals), mx = Math.max(...vals), rg = (mx-mn)||1;
  const pts = vals.map((v,i)=>[ (i/(vals.length-1))*(w-6)+3, h-4-((v-mn)/rg)*(h-10) ]);
  const line = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area = line+` L${pts[pts.length-1][0].toFixed(1)} ${h} L${pts[0][0].toFixed(1)} ${h} Z`;
  const e = pts[pts.length-1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${area}" fill="currentColor" opacity=".12"/><path d="${line}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${e[0].toFixed(1)}" cy="${e[1].toFixed(1)}" r="3" fill="currentColor"/></svg>`;
}
function fxChips(fx){

  return `<div class="fx">${Object.keys(fx).map(k=>{ const v=fx[k], meta=FX_META[k]; const good = meta.inv ? v<0 : v>0; return `<span class="${good?'up':'down'}">${meta.label} ${meta.fmt(v)}</span>`; }).join('')}</div>`;
}

function altBest(sc, o){

  if(others.length===1) return `<p><b>${L('Лучше было бы:','Better option:', 'Opção melhor:')}</b> ${others[0].t}</p>`;
  return `<p><b>${L('Лучше — любой из двух:','Better — either of these:', 'Melhor — qualquer uma destas:')}</b>${others.map(x=>`<br>— ${x.t}`).join('')}</p>`;
}

function deltaTile(label, now, prev, fmt, inv){
  const diff = now - prev, rel = prev ? diff/Math.abs(prev) : 0;
  const cls = Math.abs(rel)<0.005 ? 'flat' : ((inv ? diff<0 : diff>0) ? 'up' : 'down');
  return `<div class="delta"><small>${label}</small><b>${fmt(now)}</b><em class="${cls}">${diff>=0?'▲':'▼'} ${fmt(Math.abs(diff))}</em></div>`;
}

  const f = finalScore(), d = derive(S.m), bust = S.m.cash<0;
  const first = S.history[0];
  const weak = S.log.filter(l=>(l.kind==='scen' && l.q!=='best') || (l.kind==='chal' && !l.ok));
  const strong = S.log.filter(l=>(l.kind==='scen' && l.q==='best') || (l.kind==='chal' && l.ok));
  $('#stage').innerHTML = `<div class="fade">
    <div class="eyebrow"><span>${bust?L(`Игра окончена на месяце ${S.month}`,`Game over in month ${S.month}`, `Fim de jogo no mês ${S.month}`):L('Итоги 10 месяцев','10 months in review', 'Fechamento dos 10 meses')}</span></div>
    <h2 class="h-display">${bust?L('Кэш закончился. Инвестор не дал следующий транш.','You ran out of cash. The investor passed on the next tranche.', 'O caixa acabou. O investidor recusou a próxima parcela do investimento.'):(f.growth>=2?L('Ты вырастил «Ритм»','You grew Rhythm', 'Você fez a Rhythm crescer'):L('Квартальное ревью с инвестором','Quarterly review with the investor', 'Revisão trimestral com o investidor'))}</h2>
    <div class="grade"><span class="grade-badge">${f.grade}</span><span class="score">${Math.round(f.total*100)} / 100</span>${(()=>{ const p = prevRun(); if(!p) return ''; const dl = Math.round(f.total*100) - p.score; return `<span class="vs-prev ${dl>0?'up':(dl<0?'down':'')}">${dl===0 ? L('как в прошлой партии','same as last run', 'igual à última partida') : (dl>0?'+':'−') + Math.abs(dl) + L(' к прошлой партии',' vs. last run', ' vs. a última partida')}</span><button class="link-btn" data-act="runs">${L('Все мои партии →','All my runs →', 'Todas as minhas partidas →')}</button>`; })()}</div>
    ${lbOn() ? `<div class="end-cta">${certEligible() ? `<button class="chip" data-act="goto" data-target="cert-sec">🏅 ${L('Получить сертификат','Get your certificate', 'Emitir seu certificado')} ↓</button>` : ''}<button class="chip" data-act="goto" data-target="lb-sec">🏆 ${L('Попасть в лидерборд','Join the leaderboard', 'Entrar no ranking')} ↓</button></div>` : ''}
    <p class="lead">${L(`Качество решений: ${Math.round(f.s1*100)}% · задачи: ${Math.round(f.s2*100)}% · бизнес-результат: ${Math.round(f.biz*100)}%. Грейд на 60% зависит от решений и задач, на 40% — от метрик продукта.`,
      `Decision quality: ${Math.round(f.s1*100)}% · challenges: ${Math.round(f.s2*100)}% · business results: ${Math.round(f.biz*100)}%. Your grade is 60% decisions and challenges, 40% product metrics.`, `Qualidade das decisões: ${Math.round(f.s1*100)}% · desafios: ${Math.round(f.s2*100)}% · resultados do negócio: ${Math.round(f.biz*100)}%. Sua nota é 60% decisões e desafios, 40% métricas do produto.`)}</p>
    ${compProfile()}
    <div class="cases-cta"><b>${L('Потренируй слабые места на кейсах с собеседований','Practice your weak spots on interview cases', 'Treine seus pontos fracos com cases de entrevista')}</b>
      <p class="hint">${L('Пишешь ответ своими словами, сравниваешь с ответом сильного кандидата и прокачиваешь те же компетенции. Подскажем, с какого кейса начать.','Write your answer in your own words, compare it with a strong candidate’s and level up the same competencies. We’ll suggest where to start.', 'Escreva a resposta com suas palavras, compare com a de uma candidatura forte e desenvolva as mesmas competências. Vamos sugerir por onde começar.')}</p>
      <a class="btn" href="cases/${LQ()}">${L('Открыть кейсы','Open the cases', 'Abrir os cases')} →</a></div>
    <div class="share">
      <img id="share-img" alt="${L('Карточка результата','Result card', 'Cartão de resultado')}">
      <div class="share-btns">
        <button class="btn primary" data-act="publishImg">${L('Опубликовать картинкой в LinkedIn','Post the image on LinkedIn', 'Postar a imagem no LinkedIn')}</button>
        <button class="btn" data-act="shareLi">${L('Поделиться ссылкой в LinkedIn','Share a link on LinkedIn', 'Compartilhar um link no LinkedIn')}</button>
        <button class="btn" data-act="shareCard">${L('Скачать картинку','Download the image', 'Baixar a imagem')}</button>
        <label class="plain-toggle"><input type="checkbox" id="card-plain"${cardPlain()?' checked':''}> ${L('Без цифр на картинке: только грейд и компетенции','No numbers on the image: just the grade and competencies', 'Sem números na imagem: só o nível e as competências')}</label>
        <p class="hint" id="share-hint" aria-live="polite"></p>
      </div>
    </div>
    ${lbOn() ? `<div class="section-h" id="cert-sec">${L('Сертификат','Certificate', 'Certificado')}</div><div class="lb" id="cert-end"></div>` : ''}
    ${lbOn() ? `<div class="section-h" id="lb-sec">${L('Лидерборд','Leaderboard', 'Ranking')}</div><div class="lb" id="lb-end"></div>` : ''}
    <div class="task-box"><table class="t"><thead><tr><th>${L('Метрика','Metric', 'Métrica')}</th><th>${L('Старт','Start', 'Início')}</th><th>${L('Финиш','Finish', 'Fim')}</th></tr></thead><tbody>
      <tr><td>MRR</td><td>${money(first.mrr)}</td><td>${money(d.mrr)}</td></tr>
      <tr><td>${L('Активные пользователи','Active users', 'Usuários ativos')}</td><td>${int(first.users)}</td><td>${int(S.m.users)}</td></tr>
      <tr><td>${L('Retention, мес.','Monthly retention', 'Retenção mensal')}</td><td>${pct(first.ret)}</td><td>${pct(d.effRet)}</td></tr>
      <tr><td>LTV / CAC</td><td>${dec(first.ratio,2)}</td><td>${dec(d.ratio,2)}</td></tr>
      <tr><td>${L('Кэш','Cash', 'Caixa')}</td><td>${money(first.cash)}</td><td>${money(S.m.cash)}</td></tr>
    </tbody></table></div>
    <div class="section-h">${L('Достижения','Achievements', 'Conquistas')}</div>
    <div class="badges">${badges().map(b=>`<div class="badge ${b.on?'on':''}"><b>${b.n}</b>${b.t}</div>`).join('')}</div>
    <div class="section-h">${L('Что подтянуть','What to work on', 'O que desenvolver')} · ${weak.length}</div>
    ${weak.length ? `<div class="review">${weak.map(l=>{ if(l.kind==='scen'){ const sc = scenL(l.id); return `<div class="rev"><span class="dot ${l.q}"></span><b>${sc.title} · ${compName(scenTags(l.id)[0])}</b><p>${sc.lesson} ${L('Лучший вариант:','The best option:', 'A melhor opção:')} ${sc.options.filter(x=>x.q==='best').map(x=>L('«','“', '“')+x.t+L('»','”', '”')).join(L(' или ',' or ', ' ou '))}</p><button class="link-btn" data-act="recall" data-i="${S.log.indexOf(l)}">${L('Вспомнить ситуацию','Recall the situation', 'Relembrar a situação')}</button></div>`; } return `<div class="rev"><span class="dot bad"></span><b>${L('Задача:','Challenge:', 'Desafio:')} ${TL(l.title)} · ${compName(chalTags(l.key, l.d)[0])}</b><p>${TL(l.explain)}</p><button class="link-btn" data-act="recall" data-i="${S.log.indexOf(l)}">${L('Вспомнить задачу','Recall the task', 'Relembrar o desafio')}</button></div>`; }).join('')}</div>` : `<p class="lead">${L('Ни одной ошибки. Серьёзно впечатляет.','Not a single mistake. Seriously impressive.', 'Nenhum erro. Impressionante de verdade.')}</p>`}
    ${strong.length ? `<div class="section-h">${L('Что получилось','What went well', 'O que foi bem')} · ${strong.length}</div><div class="review">${strong.filter(l=>l.kind==='scen').map(l=>{ const sc = scenL(l.id); return `<div class="rev"><span class="dot best"></span><b>${sc.title}</b><p>${sc.lesson}</p></div>`; }).join('')}</div>`:''}
    <div class="actions"><button class="btn primary" data-act="new" data-primary>${L('Сыграть ещё раз — новые кейсы','Play again — new cases', 'Jogar de novo — novas situações')}</button></div>
  </div>`;
}
function render(){
  if(CERT_VIEW){ renderHud(); $('#dash').innerHTML = ''; $('#dash').hidden = true; closeTerm(); renderCertView(); return; }
  renderHud(); renderDash();
  closeTerm();
  if(!S){ renderIntro(); annotate($('#stage')); return; }
  ({scenario:renderScenario, scenFeedback:renderScenario, challenge:renderChallenge, chalFeedback:renderChallenge, summary:renderSummary, end:renderEnd})[S.phase]();
  if(S.phase!=='end') $('#stage').insertAdjacentHTML('afterbegin', goalBar());
  annotate($('#stage'));
  if(S.phase==='end'){ paintCard(); renderCertBox(); renderLb(); }
}

/* ============ events ============ */
document.addEventListener('click', e=>{
  const t = e.target.closest('.term');
  if(t){ e.preventDefault(); e.stopPropagation(); openTerm(t); return; }
  if(!e.target.closest('#pop')) closeTerm();
  if(e.target.id==='sheet'){ closeSheet(); return; }
  if(e.target.id==='board'){ closeBoard(); return; }
  if(e.target.id==='matrix'){ closeMatrix(); return; }
  if(e.target.id==='runs'){ closeRuns(); return; }
  const b = e.target.closest('[data-act]'); if(!b || b.disabled) return;
  const a = b.dataset.act;
  if(a==='lang'){ setLang(b.dataset.lang); return; }
  if(a==='hint'){ if(S && S.phase==='challenge' && !S.cur.hintUsed){ S.cur.hintUsed = true; track('hint'); save(); render(); } return; }
  if(a==='theme'){ setTheme(themeNow()==='dark' ? 'light' : 'dark'); return; }
  if(a==='shareCard'){ shareCard(); return; }
  if(a==='publishImg'){ publishImage(); return; }
  if(a==='lbSubmit'){ lbSubmit(); return; }
  if(a==='certIssue'){ certIssue(); return; }
  if(a==='certLi'){ window.open(liAddUrl(S.cert), '_blank', 'noopener'); const fl = $('#cert-fields'); if(fl) fl.hidden = false; track('cert-linkedin'); return; }
  if(a==='certShare'){ certShare(S.cert); return; }
  if(a==='copyVal'){ copyText(b.dataset.val).then(ok=>{ if(!ok) return; const t = b.textContent; b.textContent = L('Скопировано','Copied', 'Copiado'); setTimeout(()=>{ b.textContent = t; }, 1500); }); return; }
  if(a==='certPlay'){ CERT_VIEW = null; try{ const u = new URL(location.href); u.searchParams.delete('cert'); history.replaceState(null, '', u); }catch(e){} render(); window.scrollTo({top:0}); return; }
  if(a==='goto'){ const el = document.getElementById(b.dataset.target); if(el) el.scrollIntoView({behavior:'smooth', block:'start'}); return; }
  if(a==='lbEdit'){ const bx = $('#lb-end'); if(bx){ bx.dataset.edit = '1'; renderLb(); } return; }
  if(a==='board'){ openBoard(); return; }
  if(a==='boardClose'){ closeBoard(); return; }
  if(a==='matrix'){ closeTerm(); openMatrix(); return; }
  if(a==='recall'){ openRecall(b); return; }
  if(a==='home'){ save(); S = null; render(); window.scrollTo({top:0}); track('home'); return; }
  if(a==='compInfo'){ openCompInfo(b); return; }
  if(a==='matrixClose'){ closeMatrix(); return; }
  if(a==='runs'){ openRuns(); return; }
  if(a==='runsClose'){ closeRuns(); return; }
  if(a==='shareLi'){ shareLinkedIn(); return; }
  if(a==='sheet'){ openSheet(); return; }
  if(a==='sheetClose'){ closeSheet(); return; }
  if(a==='popClose'){ closeTerm(); return; }
  if(a==='new'){ clearSave(); newGame(); window.scrollTo({top:0}); }
  else if(a==='continue'){ S = load(); render(); }
  else if(a==='scen') chooseScenario(+b.dataset.i);
  else if(a==='toChal'){ toChallenge(); window.scrollTo({top:0}); }
  else if(a==='chal') answerChallenge(+b.dataset.i);
  else if(a==='chalNum') answerChallenge($('#ans-num').value);
  else if(a==='close'){ closeMonth(); window.scrollTo({top:0}); }
  else if(a==='next'){ nextMonth(); window.scrollTo({top:0}); }
});
document.addEventListener('toggle', e=>{ if(e.target.id==='goal'){ try{ localStorage.setItem(GOAL_KEY, e.target.open ? '1' : '0'); }catch(err){} } }, true);
document.addEventListener('change', e=>{
  if(e.target.id==='card-plain'){ try{ localStorage.setItem(CARD_PLAIN_KEY, e.target.checked ? '1' : '0'); }catch(err){} shareHint(''); paintCard(); }
});
document.addEventListener('input', e=>{
  if(e.target.id==='budget' || e.target.id==='debtShare') updateBudget();
  else if(e.target.id==='gsearch') filterSheet(e.target.value);
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ const rn = document.getElementById('runs'); if(rn && !rn.hidden){ closeRuns(); return; } const mx = document.getElementById('matrix'); if(mx && !mx.hidden){ closeMatrix(); return; } const bd = document.getElementById('board'); if(bd && !bd.hidden){ closeBoard(); return; } const s = document.getElementById('sheet'); if(s && !s.hidden){ closeSheet(); return; } closeTerm(); return; }
  if(e.target.id==='lb-name' || e.target.id==='lb-li'){ if(e.key==='Enter'){ e.preventDefault(); lbSubmit(); } return; }
  if(e.target.id==='cert-name'){ if(e.key==='Enter'){ e.preventDefault(); certIssue(); } return; }
  if(e.target.id==='ans-num'){ if(e.key==='Enter'){ e.preventDefault(); answerChallenge(e.target.value); } return; }
  if(e.target.tagName==='INPUT') return;
  if(e.key==='?'){ openSheet(); return; }
  if((e.key==='Enter'||e.key===' ') && e.target.classList && e.target.classList.contains('term')){ e.preventDefault(); openTerm(e.target); return; }
  if(/^[1-5]$/.test(e.key)){ const btn = document.querySelectorAll('#stage .opt')[+e.key-1]; if(btn && !btn.disabled){ btn.click(); } }
  else if(e.key==='Enter'){ const p = document.querySelector('[data-primary]'); if(p && document.activeElement===document.body){ e.preventDefault(); p.click(); } }
});

/* ============ boot ============ */
function applyLang(){
  i18nConsts(); buildTerms();
  document.documentElement.lang = LANG==='pt' ? 'pt-BR' : LANG;
  document.title = L('Ритм · PM-симулятор','Rhythm · PM simulator', 'Rhythm · simulador de PM');
}
function setLang(lg){
  if(!LANGS.includes(lg) || lg===LANG) return;
  LANG = lg; applyLang();
  try{ localStorage.setItem(LANG_KEY, lg); }catch(e){}
  try{ const u = new URL(location.href); u.searchParams.set('lang', lg); history.replaceState(null, '', u); }catch(e){}
  const sheetOpen = (()=>{ const s = document.getElementById('sheet'); return s && !s.hidden; })();
  render();
  if(sheetOpen) openSheet();
}
applyLang();
function start(data){
  if(data && data.S) S = data.S;
  try{
    const q = new URLSearchParams(location.search), tok = q.get('claim');
    if(tok && /^[0-9a-f]{32,128}$/i.test(tok)){
      setPlayer({token:tok, name:q.get('n')||'', linkedin:q.get('li')||''}); CLAIMED = q.get('n') || '—';
      ['claim','n','li'].forEach(k=>q.delete(k));
      history.replaceState(null, '', location.pathname + (q.toString() ? '?'+q : '') + location.hash);
      track('lb-claim');
    }
  }catch(e){}
  let cid = null; try{ cid = new URLSearchParams(location.search).get('cert'); }catch(e){}
  if(cid && lbOn()){ loadCertView(cid); return; }
  render();
}
try{ window.claude?.hot?.snapshot?.(()=>({S})); }catch(e){}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
