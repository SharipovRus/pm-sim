   {t:'Say no and raise LTV first: with LTV/CAC around 1.3, it’s too early to scale.', fb:'The math is right: at LTV/CAC ≈ 1.3, scaling is dangerous. But a flat no without data strains the investor relationship, and a small controlled step would have shown where the ceiling is.'},
   {t:'Raise the budget by 25%, measure marginal CAC per payer, and scale up in steps.', fb:'Blended CAC hides paid traffic behind free organic installs, and an average hides how much each additional install costs. Scale in steps and compare marginal CAC per payer with LTV.', note:'The +25% step showed that the extra installs were so expensive that marginal CAC per payer exceeded LTV. You shelved scaling and switched off the worst ad sets — average CAC went down.'}
 ], lesson:'Make budget decisions on marginal CAC per payer in paid channels, not on the blended average.'},
 s29:{title:'A discount for users who cancel?', text:'About 220 payers cancel every month. Olivia suggests offering 50% off for three months right at the moment of cancellation: “Competitors say it saves up to a quarter of cancellations.” Tim pushes back: “People will figure it out and start cancelling just to get the discount.”', options:[
   {t:'50% off for 3 months — only for users still logging habits, and once per person.', fb:'You save some payers right away, and only those still getting value — for them, price really may be the barrier. The cost is your price point: some would have stayed anyway, ARPPU drops, and sooner or later word about the discount gets out.', note:'The cancellation discount showed up in a Reddit thread — some payers started “cancelling for the discount.” ARPPU slipped a bit.'},
   {t:'No discounts: a month after they cancel, email them a progress recap and an invite back.', fb:'Win-back emails work, but weakly: a month after cancelling, the habit is already broken. The moment of cancellation is the cheapest point to retain someone, and you’re skipping it.'},
   {t:'Instead of a discount, offer a 1–2 month pause to everyone who hits “Cancel.”', fb:'A pause protects your price and doesn’t teach people to cancel for a deal, while giving those leaving “for a while” a reason to come back. The cost is dev time and fewer saves now: a pause won’t keep people leaving over price.', note:'You shipped the pause: about a third of those who took it came back to paying. The price held, but you saved fewer people than a discount would have.'},
   {t:'50% off for everyone who hits “Cancel”: keeping a payer is cheaper than acquiring one.', fb:'A discount for anyone reaching for the button quickly becomes a life hack: cancelling turns into a way to get a deal, and you end up subsidizing people who would have stayed anyway.'}
 ], lesson:'Retention through price is never free: a discount costs you ARPPU and price discipline, a pause costs time and reach. Choose deliberately how you pay.'},
 s30:{title:'Kill the free tier?', text:'Rhythm is freemium: basic trackers are free, 5% pay, and one in seven installs is organic — mostly free users inviting friends. Andrew read a competitor case study: a hard paywall with a 7-day trial tripled their paid conversion. “We’re tight on cash until the next round — let’s do the same.”', options:[
   {t:'Change nothing: freemium is our organic engine, and a paywall would just choke it.', fb:'You keep organic growth, but the money problem hasn’t gone anywhere. Refusing to change anything on a short runway is a decision too — and an expensive one.'},
   {t:'Keep freemium, but cap the free tier at three habits — everything beyond is Premium.', fb:'You keep the funnel and organic growth, and the people who start paying are the ones already hooked. The cost is speed: revenue grows more slowly, and you’ll reach the next round with a thinner cash cushion.', note:'You tuned the cap using data: the paywall triggers most often at the fourth habit. Paid conversion rose a bit more, and organic growth held.'},
   {t:'Paywall for everyone at once, current free users included — that maximizes the effect.', fb:'Taking away what current users have been getting for free guarantees a wave of backlash and churn. The effect is “maximal” — in revenue and in losses alike.'},
   {t:'Hard paywall with a 7-day trial — for new users only; leave current free users alone.', fb:'You get money fast: the trial filters out people who aren’t ready to pay, and paid conversion jumps. The cost is organic growth and your base: the free users who used to invite friends stop showing up.', note:'Payers went up, but friend invites dropped noticeably: free users had been your main source of organic growth.'}
 ], lesson:'A monetization model is always a trade: a hard paywall buys revenue now at the cost of organic growth, freemium does the reverse. Name the price of your choice out loud.'},
 s31:{title:'$9 for India and Indonesia', text:'Lena broke revenue down by country: 35% of installs come from India, Indonesia, and Turkey, but only 1.2% of users there pay, versus 7% in the US and Europe. “For them, $9 feels like $30 does to us. Maybe we just stop buying traffic there?”', options:[
   {t:'Stop buying traffic there and shift the budget to the US and Europe, where people pay.', fb:'The logic makes sense, but a US install costs several times more and the audience there is finite — the budget will run into rising CAC. You’re walking away from a market without checking what price would make it pay off.'},
   {t:'Keep $9 everywhere: regional pricing adds complexity, and Americans will just use a VPN.', fb:'Arbitrage risk in mobile app stores is low: the price is tied to the account’s country and payment method. And a single global price leaves a third of your audience barely monetized.'},
   {t:'Test $3–4 prices on new users in those countries and compare ARPU by country.', fb:'Price should match what a market can pay. Testing on new users shows which price maximizes ARPU (conversion × price) in each country — without putting current revenue at risk.', note:'At $4 in India, Indonesia, and Turkey, three times as many users started paying — revenue per user there rose by a third. You rolled it out to new users; average ARPPU across the base dipped slightly.'}
 ], lesson:'One price for the whole world is still a pricing decision. Judge regional prices by ARPU, not by conversion or price alone.'},
 s32:{title:'A 50/50 split that came out 53/47', text:'Tim shares the results of the new onboarding test. The split was planned as 50/50, but control has 5,300 users and the variant has 4,700. The variant shows +9% paid conversion, p = 0.01. “So it’s off by a few hundred — it’s still significant. Ship it?”', options:[
   {t:'Ship it: p = 0.01 at this sample size, and the stats already handle unequal groups.', fb:'Statistics do handle unequal groups — but only when the imbalance is random. SRM tells you the people missing from the variant aren’t random, so the p-value no longer means anything.', note:'After the full rollout, paid conversion didn’t budge, but users on older Android phones flooded support with reports of onboarding crashes.'},
   {t:'Don’t trust the result: find the cause of the imbalance (platforms, versions, logs) and rerun.', fb:'A sample ratio mismatch is a red flag: with honest randomization, an imbalance like this is nearly impossible. Someone is systematically dropping out of the variant, so the comparison is no longer fair.', note:'Found it: on older Android devices, the new onboarding crashed before the event reached analytics — the “weakest” users were falling out of the variant. You fixed it and reran: the honest effect was about +4%.'},
   {t:'Break the result down by platform and roll out wherever the groups came out 50/50.', fb:'Breaking it down by platform is the right first step to find the cause. But rolling out to the “clean” segment is premature: until you know the cause, you can’t be sure it didn’t touch that segment too.'},
   {t:'Randomly drop 600 users from control to even out the groups, recompute, and ship if it holds.', fb:'Evening out the counts doesn’t restore randomness: specific people fell out of the variant (say, those on slow devices), and randomly trimming control won’t undo that bias.', note:'You shipped the “evened-out” result — the effect didn’t replicate, and onboarding started crashing for everyone on older Android: exactly the people who had been dropping out of the variant.'}
 ], lesson:'Check for SRM before reading test results: if the groups drifted from the planned split, look for a bug, not an effect.'},
 s33:{title:'Conversion fell, though it rose everywhere', text:'Andrew is alarmed: paid conversion fell from 5.2% to 4.6% in a month. “The new onboarding broke everything — roll it back.” Dan breaks it down by channel: TikTok went from 2.0% to 2.4%, all other channels from 6.0% to 6.4%. But TikTok’s share of new users jumped from 20% to 45%.', options:[
   {t:'Roll back the onboarding: overall conversion fell right after it shipped — why take the risk?', fb:'You’re rolling back a change that improved conversion in every single channel. The total dropped because the traffic mix shifted, not because of the product.'},
   {t:'Show that it’s the channel mix, keep the onboarding, and check TikTok’s payback separately.', fb:'This is Simpson’s paradox: conversion rose in every channel, but the total fell because the mix shifted. The onboarding works; the real question is whether TikTok pays back on CAC per payer.', note:'You ran the payback numbers: CAC per payer from TikTok was fine except for two ad sets. You switched those off, and the budget started working harder.'},
   {t:'Cut the TikTok budget: it’s the one dragging overall conversion down; the rest is fine.', fb:'Low conversion doesn’t make a channel unprofitable: if a TikTok install costs half as much, CAC per payer may be just fine. Decide on CAC per payer, not on conversion.'}
 ], lesson:'When your audience mix changes, the topline metric can lie. Segment before you draw conclusions.'},
 s34:{title:'An effect that fades every week', text:'Lena is testing a new streak screen with animations and rewards. Daily habit check-ins in the variant: +14% in week one, +7% in week two, +3% in week three. The three-week average is +8%, p < 0.01. “Let’s ship it — great result!”', options:[
   {t:'Ship it, but refresh the animations and rewards every month so the novelty never wears off.', fb:'You can keep feeding novelty, but it’s a treadmill: the team keeps shipping cosmetics, and the effect fades anyway. First find out whether the feature has a lasting effect.'},
   {t:'Ship it: +8% on average over three weeks at p < 0.01 — that doesn’t happen by chance.', fb:'Significance tells you the effect isn’t zero right now, not what it will be in a month. The three-week average hides the trend: the lasting effect is probably around +3%.', note:'The effect deflated to +3%, and you had to rewrite the retention plan built on +8% in front of North Ventures.'},
   {t:'Don’t ship: the effect drops every week, so by week five or six it’ll obviously hit zero.', fb:'Extrapolating from three points is risky: novelty decay usually plateaus, and a steady +3% is still a result. Without data, you might throw away a feature that works.'},
   {t:'Check the effect on new users, for whom the screen isn’t new, and extend the test 2 weeks.', fb:'An effect that shrinks week by week is a sign of novelty: existing users react to “new,” not to value. New users never saw the old version, so their effect is closer to the lasting one.', note:'For new users, the effect held at +3% after five weeks. You shipped it expecting an honest +3%, not +8%.'}
 ], lesson:'If an effect fades week over week, suspect novelty: look at the trend and at new users, not the average.'},
 s35:{title:'Switch off the push holdout?', text:'A year ago, 10% of users were put into a holdout — they get no reminders. Their retention is 4 pp lower. Lena: “We’re knowingly losing about 180 people a month. Let’s turn pushes on for everyone.” Dan objects: the holdout is the only way to see what pushes actually do.', options:[
   {t:'Turn pushes on for everyone and measure with two-week holdouts once a quarter.', fb:'You win back retention right away and defuse the conflict with marketing, without giving up measurement entirely. The cost is a blind spot: a two-week test can’t see slow effects that build up over months.', note:'The quarterly holdout caught push fatigue late: some users had already turned off notifications.'},
   {t:'Keep the 10%: it gives precise numbers, and 180 people a month is an acceptable price.', fb:'You keep the measurement, but 10% is more than your questions need: a holdout half that size would give the same answers. You’re overpaying in retention and in your relationship with marketing.'},
   {t:'Shrink the holdout to 5% and keep it permanent: half the loss, and you keep measuring.', fb:'You keep continuous measurement and can catch slow effects like push fatigue. The cost is some retention right now and an unhappy Lena, and precision drops as the group shrinks.', note:'The holdout showed that retention starts falling after the third push in a week. You cut the frequency, and retention went up.'},
   {t:'Turn pushes on for everyone and close the topic: a year proved the effect, why keep measuring?', fb:'A year ago, the effect was proven for those pushes. Without a control group, you won’t see when new campaigns start doing harm — and marketing will keep adding more.', note:'Marketing added push after push, with nothing to measure the harm against. Users turned off notifications in droves, and retention sagged.'}
 ], lesson:'A holdout trades retention for knowledge. There’s no free option: decide explicitly how much you’ll pay to see long-term effects.'},
 s40:{title:'Seven quotes for $15,000', text:'Andrew hired a research agency for $15,000. A month later, the report arrived: 20 interviews and seven “key quotes”:<ul><li>“I’ve been checking boxes for three months, and I can’t tell if I’m any better.”</li><li>“Add charts, like running apps have.”</li><li>“I don’t need charts. I need someone to tell me ‘well done.’”</li><li>“My streak broke on day 47, so I deleted the app. Why start over?”</li><li>“The reminders drive me nuts. But without them, I forget.”</li><li>“Add export to Google Sheets — I track everything there.”</li><li>“212 days without alcohol. Rhythm is the only thing holding me together.”</li></ul>Andrew: “The money’s spent. What do we do with all this?”', options:[
   {t:'Ask the agency for all 20 transcripts, cluster the statements into user jobs, and size each in the data.', fb:'The agency picked these seven quotes, so you can’t count frequency from them — you need every transcript. Charts, export, and “tell me well done” are different solutions to one job: seeing your own progress. The sobriety story shows how high the stakes can be, not how common they are; you size each job in behavior.', note:'In the transcripts, the job “see that I’m changing” came up for 14 of 20 people: it was behind the charts, the export, and the broken streak. The data confirmed it: after the first month, the only progress Rhythm shows is a streak counter. You added a monthly “what changed” recap — retention went up.'},
   {t:'Move the requests into the backlog as is — charts, export, praise: users told us exactly what they want.', fb:'Users phrase their needs as solutions, and here those solutions contradict each other: some want charts, others explicitly don’t. Taking the quotes literally, you build three features instead of the one that solves the shared job.', note:'Charts, export, and praise shipped separately. Each is used by a handful of people, and retention barely moved.'},
   {t:'Bet on the most powerful story: if Rhythm helps people stay sober, that’s our positioning right there.', fb:'The most vivid quote isn’t the most common one. One story shows how much a habit can matter to someone, not how many such people there are. Repositioning on a single interview means building the product around an outlier.', note:'The “Rhythm helps you quit drinking” landing page brought in few installs, and pricey ones: the core audience didn’t see themselves in it.'},
   {t:'Don’t spend time on the report: 20 interviews isn’t a sample, so we make decisions based on product data.', fb:'The skepticism is partly right: 20 interviews can’t tell you frequency. But data shows “what” and “where,” not “why” — without interviews, you don’t know what to look for. And Andrew’s $15,000 goes in the bin along with his trust in discovery.'}
 ], lesson:'Quotes are raw material, not a backlog: cluster them into user jobs, separate the vivid from the frequent, and size them in the data.'},
 s41:{title:'“Bring back the old design!”', text:'A week ago, release 4.0 shipped with a new home screen, and the store rating dropped from 4.6 to 4.3. Olivia: “41 one-star reviews and 380 tickets — twice the usual, but those are mostly ‘how do I…’ questions.” The typical ones:<ul><li>1★: “BRING BACK THE OLD DESIGN. I’ve paid for two years, and this is what I get?”</li><li>1★: “Who designed this? Deleting.”</li><li>Ticket: “How do I check off yesterday now? I forgot last night, and my streak reset.”</li><li>Ticket: “You used to long-press to log a past day. Where did that go?”</li><li>4★: “The new look is nice. My streak reset for some reason, though.”</li><li>5★: “Finally, fast and modern!”</li></ul>', options:[
   {t:'Tag every review and ticket from the week by problem, count each, and check it against check-in data.', fb:'Loud isn’t the same as frequent. All caps and one star are strong emotion from a few people; polite “how do I log yesterday” questions are a widespread breakage that silently resets streaks. Tagging turns noise into a weighted list of problems, and check-in data shows what actually hits behavior.', note:'Angry design reviews: 41. Questions about logging yesterday: 230 — the new screen buried it in a menu, and streaks were resetting en masse. You brought back the long-press and restored the streaks — retention recovered, and the design complaints faded within two weeks.'},
   {t:'Roll back the redesign entirely: the store rating drives CAC, and the angry ones are two-year payers.', fb:'A rollback silences both the noise and the quiet breakage — but blindly. You throw away whatever worked in the redesign, the team loses a month, and nobody ever names the cause: the next release will step on the same rake.'},
   {t:'Reply to every reviewer and wait two weeks: people always push back on a new design at first, then adapt.', fb:'Change aversion is real, and for a purely visual change, waiting it out is often right. But a functional breakage sat in the same pile, and waiting doesn’t fix it. Separate taste from problems first.', note:'The angry reviews did die down — people got used to it. But the quiet problem stayed: without a way to log yesterday, streaks kept resetting, and retention dipped.'},
   {t:'Bring back the old design as an option in settings, so anyone who dislikes the new one can switch.', fb:'An option calms the loud users but doubles the UI you maintain, while most people stay on the new screen with the same breakage. You responded to the tone of the reviews, not their substance.', note:'6% of users switched to the old look, the team now maintains two screens, and the new one still can’t log yesterday.'}
 ], lesson:'Loud doesn’t mean frequent: tag signals by problem, count them, and check them against behavior before reacting to tone.'},
 s42:{title:'44% would “definitely buy.” Will they?', text:'Lena wants to sell expert-led habit programs — sleep, running, meditation — at $4.99 each. Dan brings an in-app survey: of 3,100 respondents, 44% would “definitely buy.” Andrew has already multiplied that across the base: 45,000 × 44% × $4.99 ≈ $99,000. But behavior tells a different story: the free “Sleep” program already in the app was started by 9% of active users and finished by 1.5%. And of those who said “definitely,” more than half have seen the $9 Premium paywall — 6% paid, barely above the 5% average.', options:[
   {t:'Test real demand: a “Buy for $4.99” button for a week (a fake door) and 6 interviews about past purchases.', fb:'Saying “definitely” costs nothing, so a survey measures sympathy, not demand. A button with a price captures an action, and questions about the past (“when did you last pay for a course?”) capture real behavior. The need behind the survey didn’t go away — you learned its real size and shape.', note:'2% of those who saw the price button clicked it — over twenty times less than the survey promised. Interviews showed people don’t want a program; they want a ready-made plan for their first two weeks. You built it into Premium — paid conversion and retention ticked up.'},
   {t:'Launch: even if only one in five of the “yes” crowd buys, that’s about $20k — another month of revenue.', fb:'Discounting to “one in five” looks sober, but it still rests on words, just shrunk by eye. And you multiplied the answers of your most engaged users across the whole base. Behavior already gave you the order of magnitude: 1.5% finish the program even when it’s free.', note:'Three programs shipped. In two months they sold about 600 copies — $3,000 against expert and development costs several times higher. Andrew had already promised North Ventures very different numbers.'},
   {t:'Make one paid program with an expert and sell it for a month: real purchases are more honest than any survey.', fb:'Real sales are the right currency — that’s behavior, not words. But you pay a month and a content budget for what a price button would have shown in a week. And without talking to people, you won’t learn why they didn’t buy.', note:'The program sold about 300 copies — a fraction of the forecast. Why everyone else passed remained a mystery.'},
   {t:'Drop the idea: even the free “Sleep” program gets finished by only 1.5%, so this survey can’t be trusted.', fb:'You read the behavior right: the stated interest is inflated. But 44% didn’t pick programs at random — behind it is a need for structure and a hint on where to start. Throw out the survey entirely, and you throw that out too.'}
 ], lesson:'Stated intent to buy isn’t demand. Forecast revenue from behavior (conversion, clicks on a real price), and use surveys to understand the need.'},
 s36:{title:'Three mockups for the home screen', text:'Kira is redesigning the home screen, where people check in their habits. In 6 home interviews she saw how it really happens: in the evening, lying in bed, one hand, 5–10 seconds. Meanwhile, in last year’s survey 64% asked for “more stats.” Of Kira’s three mockups, Andrew likes A: “It looks like a serious product.”', options:[
   {t:'Variant A: a dashboard with a weekly chart and a compact list — two thirds of survey respondents asked for stats outright.', fb:'A survey captures wishes; interviews capture behavior. The screen’s job is to log the day in seconds, one-handed, in the dark — and tiny checkboxes under charts turn that into target practice. Stats belong on a separate tab, not on top of the main action.', note:'Evening check-ins dropped: in the dark, people kept missing the tiny checkboxes and put it off “until tomorrow.”'},
   {t:'Variant B: big rows in the lower half of the screen, one thumb tap per check-in, and stats folded into a single line.', fb:'You chose by the job and context Kira observed: bed, one hand, seconds. Big tap targets where the thumb can reach mean both speed and accessibility. The stats haven’t gone anywhere — they just stay out of the way of the main action.', note:'The share of days with a check-in went up: the evening check-in takes a couple of seconds, and people who really want stats open them on the second tab.'},
   {t:'Variant C: one card per habit, swipe right to check in — easy one-handed, and checking in becomes a little game.', fb:'It accounts for one-handed use, but for someone tracking five habits, a check-in becomes five swipes, and a stray swipe while half asleep logs the wrong thing. The gesture isn’t obvious either: new users don’t know the card is meant to be swiped.'}
 ], lesson:'Pick a design by the user’s job and context from research — not by taste (yours, the designer’s, or the CEO’s), and not by survey wish lists.'},
 s37:{title:'How to invite a buddy', text:'The quarter’s goal is getting new users to add a habit buddy: with one, retention is twice as high. Kira brought three variants of the invite screen, and Tim estimated each. There’s one team, and the variant you pick decides what else fits into the quarter.', options:[
   {t:'Variant A: the native share sheet with a link — three days of work, familiar on iOS and Android, invite data this sprint.', fb:'You’re buying speed and data: within a week you’ll see whether people invite buddies at all, and nobody has to learn a native screen. The cost is acceptance: a bare link in a messenger promises the friend nothing, and you’ll lose some buddies along the way.', note:'Invites started flowing in week one, but friends rarely accepted a bare link. On the upside, you could now see who invites whom and when — and what to improve next.'},
   {t:'Variant B: a custom invite card previewing shared progress — three weeks, but the invite itself tells the friend why to join.', fb:'You’re buying quality at your key growth point: the invite is an ad for Rhythm that the friend sees, and a strong card lifts acceptance. The cost is time: three weeks with no data, and the risk of polishing something people may not use.', note:'The card shipped mid-quarter: friends accepted invites noticeably more often, but the first data arrived a month later.'},
   {t:'Variant C: full-blown friends — username search, requests, a buddy list. Two months, but a base for every future social feature.', fb:'A platform for a feature nobody has validated: two months on search and requests when the job is inviting one close person. Foundations get built for proven demand, not in advance.', note:'Friends shipped at the end of the quarter. Username search barely got used: people wanted one specific person, not a network.'}
 ], lesson:'Choosing a design also means choosing a price: learning speed or the quality of a key screen. Name what you pay, and don’t build a platform for unproven demand.'},
 s38:{title:'The broken-streak screen', text:'Every month about 3,000 people break a streak longer than a week, and 40% of them never come back. Kira drew three variants of the screen they’ll see the next day. Andrew picked C right away: “Even if 5% buy, that’s +$1,350 MRR every month.”', options:[
   {t:'Variant A: an honest zero, no consolation. A streak only matters if you can lose it, and freezes or buybacks would cheapen it.', fb:'The point about streak value is fair, and the screen is honest. But it doesn’t solve the problem the redesign exists for: 40% of those who slip leave after seeing a zero. Retention after a broken streak stays right where it was.'},
   {t:'Variant B: a free freeze saves the streak and invites a check-in today; we judge it by 30-day retention of those who slipped.', fb:'You pick a metric that reflects the user’s goal — keeping the habit going — and a screen that serves it: a slip becomes a pause, not a failure. Payers will come from the people who stayed, not from those cornered at their worst moment.', note:'After 30 days, noticeably more of the users who broke a streak were still around: the freeze turned a slip into a pause.'},
   {t:'Variant C: the streak comes back only with Premium, before a timer runs out — motivation peaks here, so judge it by revenue.', fb:'The revenue is real, but the screen profits from shame: a timer and a tiny close button squeeze people at their worst moment. You see the screen’s money right away, but lost users and angry reviews only show up a month later, in retention and ratings.', note:'There were purchases on the screen, but reviews started saying “they hold your streak hostage,” and free users who slipped left even more often.'}
 ], lesson:'Judge a screen by the metric of the user’s goal — retention a month later — not by money or clicks on the screen itself.'},
 s39:{title:'One test slot, three mockups', text:'You get enough new users for one onboarding A/B test a month, and it can detect effects of 10% or more. Kira brought three variants of the first screen, and in the current onboarding 35% of new users drop off at the habit setup step. Which variant goes into the test against the current one?', options:[
   {t:'Variant A: the same screen with a new illustration and a brighter button — minimal risk, a clean test, little to roll back.', fb:'Cosmetic changes move metrics by 1–2%, and your test only detects 10% or more: you’ll almost certainly get “no difference,” and a month of traffic goes to waste. Small polish ships without a test while you watch the dashboards.', note:'The test ended with “no significant difference”: a month of traffic went into something you could have simply shipped.'},
   {t:'Variant B: pick one habit and check it in right away. It hits the exact step where we lose 35%, so any effect will be big.', fb:'A test is an expensive resource, best spent on a big, risky change with a data-backed hypothesis. This variant targets the biggest drop-off, and the test can see an effect that size. If the hypothesis is wrong, you learn it in a month, not after rollout.', note:'The test ran its course: D7 rose 14%, and paid conversion went up too. You rolled it out to all new users.'},
   {t:'Variant C: an 8-question quiz about goals plus a personal plan — in fitness apps, this kind of onboarding lifts paid conversion.', fb:'A big change is the right kind of test candidate, but this hypothesis contradicts your own data: people drop off at a long setup, and a quiz makes it longer. Someone else’s case study is a reason for a hypothesis, not a substitute for your own funnel.', note:'The quiz lifted paid conversion among those who finished it, but fewer people finished — net, almost zero. A month gone, but the hypothesis is closed.'}
 ], lesson:'An A/B test is an expensive resource: spend it on big, risky UI changes with a data-backed hypothesis, and ship cosmetic tweaks with monitoring.'},
 s43:{title:'The lift vanished after rollout', text:'Dan is puzzled. The new paywall test — a plan for your first 30 days instead of a feature list — ran for three weeks in January and showed +12% paid conversion at p = 0.01, with balanced groups. The paywall went out to everyone, and four weeks later paid conversion hasn’t budged: 5.0% before, 5.0% after, against an expected 5.6%. Andrew: “So the test lied to us?” Lena suggests bringing back the old paywall.', options:[
   {t:'Roll back the paywall: if the effect didn’t hold for everyone, the test gave a false signal, and keeping it is a risk.', fb:'A false positive at p = 0.01 is possible, but it’s the least likely explanation. The test proved an effect under its own conditions: the January audience and that implementation. Rolling back blind, you may throw away a change that works — and never learn what changed at rollout.', note:'A month later, Dan dug into the data anyway: the new paywall worked for new users, but only half of Android users had ever seen it. The rollback wiped out that effect too.'},
   {t:'Wait two more months: effects often take a while to show up after a rollout, and there isn’t much data yet.', fb:'Waiting without a hypothesis isn’t a plan. Delayed effects happen with slow metrics like retention, but people decide on a paywall on the spot, and four weeks across the whole base is plenty of data for conversion. If not everyone sees the variant, or it only worked for part of the audience, the picture will be the same in two months — and the time to fix it will be gone.', note:'Two months later, conversion was still at 5.0%, and there was no way to explain to North Ventures where the planned growth went.'},
   {t:'Re-run the same 50/50 test on everyone right away: a fresh measurement beats any guessing about causes.', fb:'A re-run is an honest measurement, but an expensive one: a month of traffic, and the answer is “no effect,” not “why.” Most causes — exposure, audience mix, season, segments — can be checked in a couple of days with data you already have. A test makes sense afterward, to confirm the cause you found.', note:'The re-run a month later showed almost nothing. Why remained unclear, and you had to dig into the causes anyway.'},
   {t:'Diff the rollout against the test: who sees the variant, audience mix and season, who drove the lift — then decide.', fb:'An A/B test proves an effect under the test’s conditions. You check, one by one, how the rollout differs: implementation and exposure, audience mix (new vs. existing users, platforms, channels), timing (novelty, seasonality), and uneven effects across segments — then check the result against revenue. The cause you find points to the decision: fix, target a segment, or roll back.', note:'There were two causes. On Android, only half of users saw the new paywall: anyone who hadn’t updated the app still got the old screen. And in January, nearly all of the lift came from new users with New Year’s resolutions — long-time free users showed no difference. You fixed the exposure and took on long-time users separately — paid conversion rose by an honest 6%.'}
 ], lesson:'An A/B test proves an effect under the test’s conditions, not for every audience: when a lift disappears after rollout, look for what’s different about the rollout.'},
 s44:{title:'Do reviews double conversion?', text:'Rhythm has a catalog of community challenges: 240 programs of 21–30 days from bloggers and coaches, open to Premium users. Public reviews are next on the roadmap, but nobody has really spelled out what they’re for. Lena brings numbers: 8% of visitors to challenge pages with reviews start a trial, versus 4% on the rest. “Reviews double conversion! Let’s ask everyone for a review on day three.” Right now, almost all reviews sit on the 30 most popular challenges.', options:[
   {t:'Ask every participant for a review on day three: challenges with reviews convert twice as well.', fb:'That’s correlation, not cause: popular challenges collect both traffic and reviews because they’re good — reviews are more a result than a driver. Besides, on day three people have nothing to say yet, and a pop-up mid-challenge gets in the way of the habit itself. Conversion won’t double just because there are more reviews.', note:'Reviews went up fivefold, but they were mostly “fine so far” on day three. Page conversion barely moved, and the pop-up mid-challenge annoyed people — some participants quit.'},
   {t:'Skip public reviews: without moderation, we can’t keep up with fake ratings from creators or pile-ons.', fb:'The risk is real: creators will farm five-star ratings, and rivals will bury each other. But rules can contain it: only people who finished a challenge can review, plus reporting and checks for new creators. Dropping reviews entirely leaves participants with no hint about which of the 240 challenges they can actually handle.'},
   {t:'Do it the marketplace way — star ratings plus text — and set a quarterly goal of 3,000 reviews.', fb:'Review count is an output metric: it’s easy to pump up, and it says nothing about whether reviews help people choose. Marketplace stars answer “will this product rip me off?”, but a challenge participant needs something else. Without a named job, you copy the form and count activity instead of results.', note:'You hit the review goal — through reminders and “5 stars, all great.” Nobody could say whether people started more challenges.'},
   {t:'Name the job reviews do for participants and creators, see why few leave them, then test the effect.', fb:'8% vs. 4% is a correlation: popular challenges get more visitors and more reviews, and quality drives both. You start with the job — participants deciding “can I handle this?”, creators getting feedback and reputation — find out why reviews are rare, and measure the effect with a shown-vs-hidden test or by comparing similar challenges in the same category with similar traffic.', note:'Interviews showed that before starting, people care about one thing: “Can I pull this off?” Reviews became two questions at the finish line: how hard was it, and how many minutes a day. The shown-vs-hidden test gave +12% to trial starts — not double, but honest.'}
 ], lesson:'Start with the feature’s job, then the metric. “Pages with reviews convert better” is correlation, not cause: test the effect or compare like with like.'},
 s45:{title:'Five snags in onboarding', text:'Kira ran 6 new users through onboarding and logged where they stumbled. There are four screens, followed by the home screen and the first check-in:<ul><li>Screen 1: a vague question, “What do you want to achieve?” — 4 of 6 hesitated.</li><li>Screen 2: a mandatory account before people have seen anything — 2 of 6 grumbled.</li><li>Screen 3: 14 habit categories — all six got lost.</li><li>Same screen, right after picking a habit: a notifications prompt — 3 of 6 declined.</li><li>Screen 4: the trial, with price and auto-renewal in fine print — 5 of 6 asked whether they’d be charged.</li></ul>Monthly funnel: 10,000 people opened screen 1, 9,200 reached screen 2, 5,800 screen 3, 5,100 screen 4, and 4,100 made a first check-in. The sprint has room for one fix.', options:[
   {t:'Start with the categories screen: all six got lost there — the most common problem in the tests.', fb:'Frequency in a usability test isn’t drop-off: participants got lost but made it through, and in real life screen 3 passes 88%. Test participants rarely quit — they feel awkward in front of the researcher — while a real new user just closes the app. The biggest loss is on screen 2: 3,400 out of 9,200.', note:'The new picker looked tidy: its step conversion rose from 88% to 93%. But first check-ins grew by only a couple hundred people — most were still leaving at the account screen.'},
   {t:'Move the notifications prompt to right after the first check-in and explain what reminders are for.', fb:'The idea is right: ask for permission once people have seen the value, and a tracker without reminders loses retention. It’s a cheap, useful fix, but it lands after activation and barely changes the funnel to the first check-in. The biggest leak stays on screen 2 — 37% leave before even picking a habit.', note:'55% of new users now allow notifications instead of 38%, and week-two retention ticked up. But still only 41% make it to a first check-in.'},
   {t:'Let people make a first check-in without an account, and offer to save progress right after it.', fb:'The funnel up to your activation metric sets the order of fixes, not the complaint count. Screen 2 loses 37% — 3,400 people a month, more than all the other steps combined — and all before the first check-in. Only two testers grumbled about the account because test participants push through; in real life, people silently close the app. Fix the trial copy in passing: it’s a day of work and a matter of honesty.', note:'85% now reach the habit picker instead of 63%, and 51% of new users make a first check-in instead of 41%. Two thirds create an account after checking in: now they have something to save.'}
 ], lesson:'Fix onboarding along the funnel to your activation metric: the biggest leak goes first, not the most frequent complaint.'}
};

/* ============ helpers ============ */
const $ = s => document.querySelector(s);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
// RNG is swapped for a seeded one while a challenge is generated, so both languages get identical numbers
let RNG = Math.random;
function seeded(a){ return ()=>{ a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = (a,b) => a + RNG()*(b-a);
const ri = (a,b) => Math.floor(rnd(a, b+1));
const pick = arr => arr[Math.floor(RNG()*arr.length)];
const shuffle = arr => { const a = arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(RNG()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };
const NF = {ru:new Intl.NumberFormat('ru-RU'), en:new Intl.NumberFormat('en-US')};
const int = v => NF[LANG].format(Math.round(v));
function money(v){ const s = v<0?'−':''; v=Math.abs(v); if(v>=1e6) return s+'$'+(v/1e6).toFixed(2)+'M'; if(v>=1e4) return s+'$'+(v/1e3).toFixed(1).replace(/\.0$/,'')+'k'; return s+'$'+int(v); }
const dec = (v,d=1) => LANG==='en' ? v.toFixed(d) : v.toFixed(d).replace('.',',');
const pct = (v,d=1) => dec(v*100,d)+'%';
function erf(x){ const t=1/(1+0.3275911*Math.abs(x)); const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x); return x>=0?y:-y; }
const Phi = z => 0.5*(1+erf(z/Math.SQRT2));
function nice(n){ const p = Math.pow(10, Math.floor(Math.log10(n))-1); return Math.round(n/p)*p; }

/* ============ challenges ============ */
const CHAL = {
 ltv:{d:'metr', gen(){
   const arppu = ri(7,15), churn = pick([0.05,0.06,0.08,0.1,0.12,0.15]);
   const ltv = arppu*MARGIN/churn;
   return {title:L('Посчитай LTV платящего','Calculate LTV per paying user'), type:'number', unit:'$',
    prompt:L(`<p>Подписка Ритма. Магазин приложений забирает 30%, значит, валовая маржа — 70%.</p>
     <div class="kv"><div><small>ARPPU в месяц</small><b>$${arppu}</b></div><div><small>Маржа</small><b>70%</b></div><div><small>Месячный отток платящих</small><b>${pct(churn,0)}</b></div></div>`,
     `<p>Rhythm runs on subscriptions. The app store takes a 30% cut, so gross margin is 70%.</p>
     <div class="kv"><div><small>Monthly ARPPU</small><b>$${arppu}</b></div><div><small>Gross margin</small><b>70%</b></div><div><small>Monthly payer churn</small><b>${pct(churn,0)}</b></div></div>`),
    question:L('Какой LTV одного платящего пользователя (в $)?','What’s the LTV of a single paying user (in $)?'), answer:ltv, tol:0.05,
    explain:L(`LTV = ARPPU × маржа ÷ отток = ${arppu} × 0,7 ÷ ${dec(churn,2)} ≈ <b>$${dec(ltv,0)}</b>. Средняя «жизнь» платящего — 1 ÷ отток ≈ ${dec(1/churn,1)} мес.`,
     `LTV = ARPPU × margin ÷ churn = ${arppu} × 0.7 ÷ ${dec(churn,2)} ≈ <b>$${dec(ltv,0)}</b>. The average payer “lifetime” is 1 ÷ churn ≈ ${dec(1/churn,1)} months.`),
    hint:L('LTV — это сколько один платящий приносит за всю свою «жизнь» в продукте: месячная выручка после комиссии стора × сколько месяцев он остаётся. Средняя «жизнь» = 1 ÷ месячный отток.',
     'LTV is what one payer brings in over their whole life with the product: monthly revenue after the store’s cut × how many months they stay. Average lifetime = 1 ÷ monthly churn.')};
 }},
 payback:{d:'metr', gen(){
   const cac = ri(6,18)*5, arppu = ri(7,14);
   const m = cac/(arppu*MARGIN);
   return {title:L('Срок окупаемости CAC','CAC payback period'), type:'number', unit:L('мес.','months'),
    prompt:L(`<p>Ты платишь за привлечение одного платящего пользователя и хочешь понять, через сколько месяцев он окупится.</p>
     <div class="kv"><div><small>CAC платящего</small><b>$${cac}</b></div><div><small>ARPPU в месяц</small><b>$${arppu}</b></div><div><small>Маржа</small><b>70%</b></div></div>`,
     `<p>You pay to acquire each paying user and want to know how many months it takes for them to pay that back.</p>
     <div class="kv"><div><small>CAC per payer</small><b>$${cac}</b></div><div><small>Monthly ARPPU</small><b>$${arppu}</b></div><div><small>Gross margin</small><b>70%</b></div></div>`),
    question:L('Через сколько месяцев окупится CAC?','How many months until CAC pays back?'), answer:m, tol:0.07, abs:0.5,
    explain:L(`Payback = CAC ÷ (ARPPU × маржа) = ${cac} ÷ (${arppu} × 0,7) ≈ <b>${dec(m,1)} мес.</b> Для подписок хорошим считается срок до 12 месяцев, отличным — до 6.`,
     `Payback = CAC ÷ (ARPPU × margin) = ${cac} ÷ (${arppu} × 0.7) ≈ <b>${dec(m,1)} months</b>. For subscriptions, under 12 months is considered good and under 6 is excellent.`),
    hint:L('Окупаемость — это сколько месяцев нужно, чтобы маржа с платящего вернула деньги, потраченные на его привлечение. Раздели CAC на то, что он приносит в месяц после комиссии стора.',
     'Payback is how many months of margin it takes to earn back what you spent acquiring a payer. Divide CAC by what they bring in each month after the store’s cut.')};
 }},
 ltvcac:{d:'metr', gen(){
   let cacI, conv, ltv, r;
   do { cacI = ri(10,40)/10; conv = ri(20,80)/1000; ltv = ri(3,30)*5; r = ltv/(cacI/conv); } while((r>0.85&&r<1.15)||(r>2.7&&r<3.3)||r>8);
   const cp = cacI/conv, ans = r<1?0:(r<3?1:2);
   return {title:L('Масштабировать канал?','Scale the channel?'), type:'choice',
    prompt:L(`<p>Новый рекламный канал отработал месяц. Решаем, что с ним делать.</p>
     <div class="kv"><div><small>Стоимость установки</small><b>$${dec(cacI,2)}</b></div><div><small>Конверсия в оплату</small><b>${pct(conv)}</b></div><div><small>LTV платящего</small><b>$${ltv}</b></div></div>`,
     `<p>A new ad channel has been running for a month. Time to decide what to do with it.</p>

    question:L('Что делать с каналом?','What do you do with the channel?'),

    explain:L(`CAC платящего = $${dec(cacI,2)} ÷ ${pct(conv)} ≈ $${dec(cp,0)}. LTV / CAC = ${ltv} ÷ ${dec(cp,0)} ≈ <b>${dec(r,1)}</b>. Ориентиры: < 1 — канал сжигает деньги, 1–3 — окупается впритык, > 3 — можно масштабировать.`,

 }},
 ab:{d:'exp', gen(){
   let n,c1,c2,z;
   do { n = ri(20,100)*100; const p1 = ri(40,100)/1000; const lift = rnd(-0.05,0.3); c1 = Math.round(n*p1); c2 = Math.round(n*p1*(1+lift)); const pp=(c1+c2)/(2*n); z = (c2/n-c1/n)/Math.sqrt(pp*(1-pp)*2/n); } while(Math.abs(z)>1.65 && Math.abs(z)<2.3 || c1===c2);
   const p = 2*(1-Phi(Math.abs(z))), sig = Math.abs(z)>=1.96;
   return {title:L('Значим ли результат A/B-теста?','Is the A/B test result significant?'), type:'choice',
    prompt:L(`<p>Тест новой кнопки «Отметить» на главном экране. Метрика — конверсия в оплату триала.</p>
     <div class="task-box" style="margin:0"><table class="t"><thead><tr><th>Группа</th><th>Пользователей</th><th>Оплат</th><th>Конверсия</th></tr></thead><tbody>
     <tr><td>A (контроль)</td><td>${int(n)}</td><td>${int(c1)}</td><td>${pct(c1/n,2)}</td></tr>
     <tr><td>B (новая кнопка)</td><td>${int(n)}</td><td>${int(c2)}</td><td>${pct(c2/n,2)}</td></tr></tbody></table></div>`,
     `<p>You’re testing a new “Check in” button on the home screen. The metric is trial-to-paid conversion.</p>
     <div class="task-box" style="margin:0"><table class="t"><thead><tr><th>Group</th><th>Users</th><th>Paid</th><th>Conversion</th></tr></thead><tbody>
     <tr><td>A (control)</td><td>${int(n)}</td><td>${int(c1)}</td><td>${pct(c1/n,2)}</td></tr>
     <tr><td>B (new button)</td><td>${int(n)}</td><td>${int(c2)}</td><td>${pct(c2/n,2)}</td></tr></tbody></table></div>`),
    question:L('Разница статистически значима при α = 0,05 (двусторонний тест)?','Is the difference statistically significant at α = 0.05 (two-sided test)?'),
    options:L(['Да, значима — можно раскатывать','Нет, не значима — это может быть шум'],
     ['Yes, it’s significant — OK to roll out','No, it’s not significant — it could be noise']), answer:sig?0:1,
    explain:L(`Z-тест для двух долей: объединённая конверсия p = ${pct((c1+c2)/(2*n),2)}, стандартная ошибка = √(p(1−p)·2/n). z ≈ <b>${dec(z,2)}</b>, p-value ≈ <b>${dec(p,3)}</b>. Порог для α = 0,05 — |z| ≥ 1,96. Относительная разница: ${(c2/c1-1)>=0?'+':''}${pct(c2/c1-1)}.`,
     `Two-proportion z-test: pooled conversion p = ${pct((c1+c2)/(2*n),2)}, standard error = √(p(1−p)·2/n). z ≈ <b>${dec(z,2)}</b>, p-value ≈ <b>${dec(p,3)}</b>. The threshold for α = 0.05 is |z| ≥ 1.96. Relative difference: ${(c2/c1-1)>=0?'+':''}${pct(c2/c1-1)}.`),
    hint:L('Разница в конверсиях сама по себе ничего не значит — сравни её с шумом. Раздели разницу на стандартную ошибку √(p(1−p)·2/n), где p — общая конверсия обеих групп, и сравни результат с порогом 1,96.',
     'A gap in conversion means nothing on its own — compare it to the noise. Divide the difference by the standard error √(p(1−p)·2/n), where p is the pooled conversion of both groups, and check the result against 1.96.')};
 }},
 sample:{d:'exp', gen(){
   const p = pick([0.05,0.1,0.2]), mde = pick([0.1,0.2]);
   const delta = p*mde, n = nice(16*p*(1-p)/(delta*delta));
   const opts = shuffle([n, nice(n/4), nice(n*4), nice(n/12)]);
   return {title:L('Сколько пользователей нужно в тест?','How many users does the test need?'), type:'choice',
    prompt:L(`<p>Хочешь проверить новый онбординг. Стандартные параметры: α = 0,05, мощность 80%.</p>
     <div class="kv"><div><small>Базовая конверсия</small><b>${pct(p,0)}</b></div><div><small>Минимальный эффект (MDE)</small><b>+${pct(mde,0)} отн.</b></div><div><small>Абсолютный сдвиг</small><b>${dec(delta*100,1)} п.п.</b></div></div>`,
     `<p>You want to test a new onboarding flow. Standard parameters: α = 0.05, 80% power.</p>
     <div class="kv"><div><small>Baseline conversion</small><b>${pct(p,0)}</b></div><div><small>Minimum detectable effect (MDE)</small><b>+${pct(mde,0)} relative</b></div><div><small>Absolute lift</small><b>${dec(delta*100,1)} pp</b></div></div>`),
    question:L('Примерно сколько пользователей нужно в каждую группу?','Roughly how many users do you need per group?'),
    options:opts.map(v=>'≈ '+int(v)), answer:opts.indexOf(n),
    explain:L(`Эвристика Лера: n ≈ 16 · p(1−p) / δ² = 16 · ${dec(p,2)} · ${dec(1-p,2)} / ${dec(delta,3)}² ≈ <b>${int(n)}</b> на группу. Запомни: уменьшил MDE вдвое — выборка выросла в 4 раза.`,
     `Lehr’s rule of thumb: n ≈ 16 · p(1−p) / δ² = 16 · ${dec(p,2)} · ${dec(1-p,2)} / ${dec(delta,3)}² ≈ <b>${int(n)}</b> per group. Remember: halve the MDE and the sample size quadruples.`),
    hint:L('Используй правило Лера: n на группу ≈ 16 × p(1−p) ÷ (абсолютный сдвиг)². Следи за единицами: сдвиг подставляй долей, а не в процентных пунктах и не относительным MDE.',
     'Use Lehr’s rule: n per group ≈ 16 × p(1−p) ÷ (absolute lift)². Watch the units: plug the lift in as a fraction — not in percentage points, and not as the relative MDE.')};
 }},
 rice:{d:'prio', gen(){
   const names = shuffle(L(['Напоминание по геолокации','Виджет на главный экран','Синхронизация с Apple Health','Челленджи с друзьями','Статистика за год','Шаблоны привычек','Голосовая отметка','Серии и заморозка серии'],
     ['Location-based reminders','Home screen widget','Apple Health sync','Challenges with friends','Yearly stats','Habit templates','Voice check-in','Streaks and streak freeze'])).slice(0,4);
   let rows;
   do { rows = names.map(nm=>{ const R=ri(5,80)*100, I=pick([0.25,0.5,1,2,3]), C=pick([0.5,0.8,1]), E=ri(1,8); return {nm,R,I,C,E,s:R*I*C/E}; }); const s = rows.map(r=>r.s).sort((a,b)=>b-a); if(s[0]>=s[1]*1.2) break; } while(true);
   const best = rows.reduce((b,r,i)=>r.s>rows[b].s?i:b,0);
   return {title:L('Что делать первым по RICE?','What goes first by RICE?'), type:'choice',
    prompt:L(`<p>Бэклог на квартал. Reach — пользователей за квартал, Impact — по шкале 0,25–3, Confidence — уверенность в оценках, Effort — человеко-недели.</p>
     <div class="task-box" style="margin:0"><table class="t"><thead><tr><th>Фича</th><th>Reach</th><th>Impact</th><th>Confidence</th><th>Effort</th></tr></thead><tbody>
     ${rows.map(r=>`<tr><td>${r.nm}</td><td>${int(r.R)}</td><td>${String(r.I).replace('.',',')}</td><td>${Math.round(r.C*100)}%</td><td>${r.E}</td></tr>`).join('')}</tbody></table></div>`,
     `<p>Your backlog for the quarter. Reach is users per quarter, Impact is on a 0.25–3 scale, Confidence is how sure you are of the estimates, Effort is in person-weeks.</p>
     <div class="task-box" style="margin:0"><table class="t"><thead><tr><th>Feature</th><th>Reach</th><th>Impact</th><th>Confidence</th><th>Effort</th></tr></thead><tbody>
     ${rows.map(r=>`<tr><td>${r.nm}</td><td>${int(r.R)}</td><td>${r.I}</td><td>${Math.round(r.C*100)}%</td><td>${r.E}</td></tr>`).join('')}</tbody></table></div>`),
    question:L('Какая фича получает наивысший RICE-приоритет?','Which feature gets the highest RICE score?'), options:rows.map(r=>r.nm), answer:best,
    explain:`RICE = Reach × Impact × Confidence ÷ Effort. ${rows.map(r=>`${r.nm}: <b>${int(r.s)}</b>`).join('; ')}.`,
    hint:L('Для каждой фичи перемножь Reach, Impact и Confidence и раздели на Effort. Не выбирай по одному столбцу: большой охват легко съедается низкой уверенностью или долгой разработкой.',
     'For each feature, multiply Reach × Impact × Confidence and divide by Effort. Don’t pick by a single column: big reach is easily eaten up by low confidence or a long build.')};
 }},

 funnel:{d:'metr', gen(){

 cohort:{d:'metr', gen(){
   const mons = L(['Янв','Фев','Мар','Апр'], ['Jan','Feb','Mar','Apr']);
   const variant = pick(['bad','improve']); const badI = ri(1,2); // Apr has only M0, a drop there would be invisible
   const rows = mons.map((m,i)=>{
     let b = [100, ri(42,47), ri(33,37), ri(29,32)];
     if(variant==='improve'){ b = [100, 38+i*5+ri(0,1), 29+i*4+ri(0,1), 25+i*4]; }
     if(variant==='bad' && i===badI){ b = [100, ri(23,27), ri(15,18), ri(12,14)]; }
     return {m, v:b.slice(0, 4-i)};
   });
   const o = [L(`Проблема в когорте «${mons[badI]}»: что-то изменилось в привлечении или продукте именно в этом месяце`,
               `The problem is in the “${mons[badI]}” cohort: something changed in acquisition or the product that particular month`),
              L('Удержание улучшается от когорты к когорте — изменения в продукте работают','Retention improves from cohort to cohort — the product changes are working'),
              L('Продукт в целом не удерживает: кривые не выходят на плато','The product doesn’t retain overall: the curves never flatten out'),
              L('Все когорты ведут себя одинаково, выводов нет','All cohorts behave the same, nothing to conclude')];
   const opts = shuffle(o); const ans = opts.indexOf(variant==='bad'?o[0]:o[1]);
   return {title:L('Прочитай когортную таблицу','Read the cohort table'), type:'choice',
    prompt:L(`<p>Retention по месячным когортам (% пользователей когорты, активных в месяц N).</p>
     <div class="task-box" style="margin:0"><table class="t"><thead><tr><th>Когорта</th><th>M0</th><th>M1</th><th>M2</th><th>M3</th></tr></thead><tbody>
     ${rows.map(r=>`<tr><td>${r.m}</td>${[0,1,2,3].map(k=>`<td>${r.v[k]!==undefined?r.v[k]+'%':'—'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`,
     `<p>Retention by monthly cohort (% of the cohort’s users active in month N).</p>
     <div class="task-box" style="margin:0"><table class="t"><thead><tr><th>Cohort</th><th>M0</th><th>M1</th><th>M2</th><th>M3</th></tr></thead><tbody>
     ${rows.map(r=>`<tr><td>${r.m}</td>${[0,1,2,3].map(k=>`<td>${r.v[k]!==undefined?r.v[k]+'%':'—'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`),
    question:L('Какой вывод верный?','Which conclusion is correct?'), options:opts, answer:ans,
    explain: variant==='bad' ? L(`Когорта «${mons[badI]}» резко проседает уже на M1, а соседние ведут себя нормально и выходят на плато. Значит, проблема локальна: новый канал привлечения, релиз или сезон. Сравнивай когорты по столбцам, а не только по строкам.`,
     `The “${mons[badI]}” cohort drops sharply as early as M1, while its neighbors behave normally and level off. So the problem is local: a new acquisition channel, a release, or seasonality. Compare cohorts down the columns, not just across the rows.`)
     : L('Каждая следующая когорта удерживается лучше на одном и том же «возрасте» (сравни столбец M1 сверху вниз). Это признак того, что продуктовые изменения работают.',
     'Each newer cohort retains better at the same “age” (read the M1 column top to bottom). That’s a sign the product changes are working.'),
    hint:L('Сравнивай когорты на одном и том же «возрасте»: читай столбцы M1 и M2 сверху вниз, а не только строки слева направо. Так видно, что изменилось между когортами, а не просто как люди отваливаются со временем.',
     'Compare cohorts at the same “age”: read the M1 and M2 columns top to bottom, not just the rows left to right. That shows what changed between cohorts, not just how people drop off over time.')};
 }},
 mrr:{d:'metr', gen(){
   const u = ri(20,90)*1000, c = ri(20,80)/10, a = ri(6,15), mrr = u*c/100*a;
   return {title:L('Посчитай MRR','Calculate MRR'), type:'number', unit:'$',
    prompt:L(`<div class="kv"><div><small>Активных пользователей</small><b>${int(u)}</b></div><div><small>Доля платящих</small><b>${dec(c,1)}%</b></div><div><small>ARPPU в месяц</small><b>$${a}</b></div></div>`,

    question:L('Какая ежемесячная регулярная выручка (MRR) в $?','What’s the monthly recurring revenue (MRR), in $?'), answer:mrr, tol:0.02,
    explain:L(`MRR = пользователи × доля платящих × ARPPU = ${int(u)} × ${dec(c/100,3)} × ${a} = <b>$${int(mrr)}</b>. Тот же расчёт через ARPU: ARPU = $${dec(c/100*a,2)} на пользователя, MRR = ARPU × ${int(u)}.`,
     `MRR = users × share of payers × ARPPU = ${int(u)} × ${dec(c/100,3)} × ${a} = <b>$${int(mrr)}</b>. Same math via ARPU: ARPU = $${dec(c/100*a,2)} per user, MRR = ARPU × ${int(u)}.`),
    hint:L('MRR — это число платящих × сколько каждый платит в месяц; это выручка, так что комиссию стора здесь не вычитай. Не забудь перевести долю платящих из процентов в число людей.',

const glossL = g => LANG==='en' ? Object.assign({k:g.k}, GLOSS_EN[g.k]) : Object.assign({}, g, {sub:(g.en!=='—'?g.en+' · ':'')+g.ru});
const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
let GMAP = {}, TERM_RE = null, ALIAS_KEY = {};
// English aliases are matched case-insensitively; Russian ones list their case forms explicitly
function buildTerms(){
  const gl = GLOSS.map(glossL);
  GMAP = {}; gl.forEach(g=>GMAP[g.k]=g);
  const aliases = gl.flatMap(g=>g.a.map(a=>({a, k:g.k}))).sort((x,y)=>y.a.length-x.a.length);
  const flags = LANG==='en' ? 'giu' : 'gu';
  try { TERM_RE = new RegExp('(?<![\\p{L}\\d-])(' + aliases.map(x=>esc(x.a)).join('|') + ')(?![\\p{L}\\d-])', flags); }
  catch(e){ TERM_RE = new RegExp('(' + aliases.map(x=>esc(x.a)).join('|') + ')', flags.replace('u','')); }
  ALIAS_KEY = {}; aliases.forEach(x=>{ const a = x.a.toLowerCase(); if(!(a in ALIAS_KEY)) ALIAS_KEY[a]=x.k; });
}

function annotate(root){
  if(!root || !TERM_RE) return;
  const count = {};
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(n){
      if(!n.nodeValue || n.nodeValue.trim().length<2) return NodeFilter.FILTER_REJECT;
      const p = n.parentElement;
      if(!p || p.closest('.term, .opt, kbd, .lvl, .pill, script, style, .badge, .segs, .goal summary, .comp-lbl, .chip')) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const nodes = []; let n; while((n = walker.nextNode())) nodes.push(n);
  nodes.forEach(node=>{
    const text = node.nodeValue; TERM_RE.lastIndex = 0;
    if(!TERM_RE.test(text)) return; TERM_RE.lastIndex = 0;
    const frag = document.createDocumentFragment(); let last = 0, m;
    while((m = TERM_RE.exec(text))){
      const key = ALIAS_KEY[m[0].toLowerCase()];
      if(!key || (count[key]||0) >= 2) continue;
      count[key] = (count[key]||0)+1;
      frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      const b = document.createElement('span');
      b.className = 'term'; b.tabIndex = 0; b.setAttribute('role','button'); b.dataset.term = key; b.textContent = m[0];
      b.setAttribute('aria-label', m[0]+L(' — что это значит',' — what it means'));
      frag.appendChild(b); last = m.index + m[0].length;
    }
    if(!last) return;
    frag.appendChild(document.createTextNode(text.slice(last)));
    node.parentNode.replaceChild(frag, node);
  });
}

  return `<h4>${g.t}</h4><div class="term-sub">${g.sub}</div><p>${g.d}</p>${g.f?`<div class="term-f">${g.f}</div>`:''}`;
}

  }

/* ============ state ============ */
let S = null;
function derive(m){
  const debtPen = Math.max(0, m.debt-50)*DEBT_WORK.penalty;
  const effRet = clamp(m.ret - debtPen + (m.morale-60)*0.0003, 0.4, 0.96);
  const effCac = m.cac*(1+Math.max(0,m.budget-20000)/40000);
  const payers = m.users*m.conv, mrr = payers*m.arppu, gross = mrr*MARGIN;
  const burn = TEAM_COST + m.budget, net = gross - burn;
  const payerRet = Math.min(0.97, effRet+0.10);
  const ltv = m.arppu*MARGIN/(1-payerRet), cacPayer = effCac/m.conv;
  return {effRet, effCac, payers, mrr, gross, burn, net, ltv, cacPayer, ratio:ltv/cacPayer, runway: net<0 ? m.cash/(-net) : Infinity, debtPen};
}
function pickBalanced(items, n){
  const groups = {}; items.forEach(it=>{ (groups[it.d] = groups[it.d]||[]).push(it.id); });
  Object.keys(groups).forEach(k=>groups[k]=shuffle(groups[k]));
  const out=[]; while(out.length<n){ const ks = shuffle(Object.keys(groups).filter(k=>groups[k].length)); if(!ks.length) break; for(const k of ks){ if(out.length<n) out.push(groups[k].shift()); } }
  return out;
}
// scenario with texts in the current language
function scenL(id){
  const s = SCEN.find(x=>x.id===id); if(LANG==='ru') return s;
  const e = SCEN_EN[id];
  return Object.assign({}, s, {title:e.title, text:e.text, lesson:e.lesson,
    options:s.options.map((o,i)=>Object.assign({}, o, {t:e.options[i].t, fb:e.options[i].fb}, o.later?{later:Object.assign({}, o.later, {note:e.options[i].note})}:{}))});
}
const laterNote = r => scenL(r.sid).options[r.oi].later.note;
// challenge is generated once per language from the same seed; text lives in c.txt[lang]
function genChal(key){
  const seed = (Math.random()*4294967296)>>>0, keep = LANG, txt = {};
  try { LANGS.forEach(lg=>{ LANG = lg; RNG = seeded(seed); txt[lg] = CHAL[key].gen(); }); }
  finally { LANG = keep; RNG = Math.random; }
  const c = txt.ru;
  return {key, d:CHAL[key].d, type:c.type, answer:c.answer, tol:c.tol, abs:c.abs||0, txt};
}
// balanced by domain, with at least one dilemma per game
function pickScenarios(){
  const ids = pickBalanced(SCEN.map(s=>({id:s.id,d:s.d})), MONTHS), byId = id => SCEN.find(s=>s.id===id);
  if(!ids.some(id=>byId(id).dilemma)){
    const dl = shuffle(SCEN.filter(s=>s.dilemma))[0];
    const k = dl ? ids.findIndex(id=>byId(id).d===dl.d) : -1;
    if(k>=0) ids[k] = dl.id;
  }
  return ids;
}
function newGame(){
  const m = {users:45000, ret:0.80, conv:0.05, arppu:9, cac:2.5, viral:0.03, cash:START_CASH, trust:60, morale:62, debt:40, budget:20000, budgetRec:20000, debtShare:0};
  const d = derive(m);
  S = { v:2, month:1, phase:'scenario', m,
    history:[{month:0, users:m.users, mrr:d.mrr, cash:m.cash, ratio:d.ratio, ret:d.effRet}],
    queue:[], xp:{disc:0,prio:0,metr:0,exp:0}, acc:{disc:[0,0],prio:[0,0],metr:[0,0],exp:[0,0]},
    scen:pickScenarios(),
    chal:pickBalanced(Object.keys(CHAL).map(k=>({id:k,d:CHAL[k].d})), MONTHS),
    cur:{}, log:[], streak:0, bestStreak:0, fired:[], ended:false, initMrr:d.mrr, review:null };
  track('start');
  startMonth();
}
function startMonth(){
  S.phase = 'scenario';
  const id = S.scen[S.month-1];
  S.cur = { scenId:id, order:shuffle(SCEN.find(s=>s.id===id).options.map((_,i)=>i)), choice:null, chal:null, chalAns:null, chalOk:null, fxShown:null };
  save(); render();
}
function applyFx(fx){
  const m = S.m; if(!fx) return;
  for(const k in fx){ m[k] = (m[k]||0) + fx[k]; }
  m.ret = clamp(m.ret,0.4,0.95); m.conv = clamp(m.conv,0.005,0.2); m.arppu = clamp(m.arppu,3,30); m.cac = clamp(m.cac,0.8,10);
  m.viral = clamp(m.viral,0,0.15); m.trust = clamp(m.trust,0,100); m.morale = clamp(m.morale,0,100); m.debt = clamp(m.debt,0,100);
}
function streakHit(ok){ S.streak = ok ? S.streak+1 : 0; S.bestStreak = Math.max(S.bestStreak, S.streak); }

function chooseScenario(i){
  if(S.cur.choice!==null) return;
  const sc = SCEN.find(s=>s.id===S.cur.scenId), o = sc.options[i];
  S.cur.choice = i; applyFx(o.fx);
  if(o.later) S.queue.push({at:S.month+o.later.in-1, fx:o.later.fx, sid:sc.id, oi:i});
  S.xp[sc.d] += QUAL[o.q].xp; S.acc[sc.d][0] += QUAL[o.q].pts; S.acc[sc.d][1] += 2;
  streakHit(o.q==='best');

function toChallenge(){
  S.cur.chal = genChal(S.chal[S.month-1]);
  S.phase = 'challenge'; save(); render();
  setTimeout(()=>{ const inp = $('#ans-num'); if(inp) inp.focus(); }, 30);
}
function answerChallenge(val){
  const c = S.cur.chal; if(S.cur.chalOk!==null) return;
  let ok;
  if(c.type==='number'){
    // ru: comma is the decimal separator; en: comma separates thousands
    const raw = String(val).replace(/[\s$]/g,'');
    const v = parseFloat(LANG==='en' ? raw.replace(/,/g,'') : raw.replace(',','.'));
    if(isNaN(v)){ const inp=$('#ans-num'); if(inp){ inp.setAttribute('aria-invalid','true'); inp.placeholder=L('Введи число','Enter a number'); inp.focus(); } return; }
    ok = Math.abs(v-c.answer) <= Math.max(Math.abs(c.answer)*c.tol, c.abs||0); S.cur.chalAns = v;
  } else { ok = val===c.answer; S.cur.chalAns = val; }
  S.cur.chalOk = ok;
  const hint = !!S.cur.hintUsed;
  S.xp[c.d] += ok ? (hint ? HINT.xp : 40) : 10; S.acc[c.d][0] += ok ? (hint ? 1 : 2) : 0; S.acc[c.d][1] += 2;
  if(ok) applyFx(CHAL_BONUS[c.d].fx);
  streakHit(ok);
  S.log.push({kind:'chal', key:c.key, d:c.d, ok, hint, title:{ru:c.txt.ru.title, en:c.txt.en.title}, explain:{ru:c.txt.ru.explain, en:c.txt.en.explain}});
  S.phase = 'chalFeedback'; save(); render();
}
function closeMonth(){
  const m = S.m;
  const fired = S.queue.filter(q=>q.at<=S.month); S.queue = S.queue.filter(q=>q.at>S.month);
  fired.forEach(q=>applyFx(q.fx));
  const before = derive(m); const prev = {users:m.users, mrr:before.mrr, cash:m.cash, ratio:before.ratio};
  const d = derive(m);
  // team share on tech debt: fewer features ship, so organic growth drops
  const ds = m.debtShare||0;
  const organic = m.users*m.viral*(1 - ds*DEBT_WORK.organic), paid = m.budget/d.effCac;
  m.users = m.users*d.effRet + organic + paid;
  const after = derive(m);
  m.cash += after.gross - after.burn;
  m.debt = clamp(m.debt + DEBT_WORK.drift - ds*DEBT_WORK.paydown, 0, 100); m.morale += (60-m.morale)*0.12 + ds*DEBT_WORK.morale; m.trust += (55-m.trust)*0.08;
  const fin = derive(m);
  let review = null;
  if(S.month===REVIEW.month){
    const g = fin.mrr/S.initMrr, lvl = g>=REVIEW.full ? 'full' : (g>=REVIEW.half ? 'half' : 'none');
    const amount = {full:REVIEW.tranche, half:REVIEW.tranche/2, none:0}[lvl];
    m.cash += amount; m.trust = clamp(m.trust + {full:6, half:-4, none:-12}[lvl], 0, 100);
    review = S.review = {g, lvl, amount};
    track('review-'+lvl);
  }
  S.history.push({month:S.month, users:m.users, mrr:fin.mrr, cash:m.cash, ratio:fin.ratio, ret:fin.effRet});
  S.summary = {prev, fired:fired.map(f=>({sid:f.sid, oi:f.oi})), newUsers:organic+paid, paid, organic, churned:prev.users*(1-d.effRet), debtWarn:d.debtPen>0, review};
  S.phase = m.cash<0 ? 'end' : (S.month>=MONTHS ? 'end' : 'summary');
  if(S.phase==='end'){ S.ended = true; track(m.cash<0 ? 'bust' : 'finish'); }
  save(); render();
}

/* ============ scoring ============ */
function totalXp(){ return Object.values(S.xp).reduce((a,b)=>a+b,0); }
// XP gives a level; job titles come only from the final grade, so the two never disagree
const levelFromXp = x => Math.floor(x/100)+1;
function finalScore(){
  const sc = S.log.filter(l=>l.kind==='scen'), ch = S.log.filter(l=>l.kind==='chal');
  const s1 = sc.length ? sc.reduce((a,l)=>a+QUAL[l.q].pts,0)/(2*sc.length) : 0;
  // a right answer with a hint counts half
  const s2 = ch.length ? ch.reduce((a,l)=>a + (l.ok ? (l.hint ? 0.5 : 1) : 0), 0)/ch.length : 0;
  const skill = (s1+s2)/2;
  const d = derive(S.m), growth = d.mrr/S.initMrr;
  const biz = 0.4*clamp((growth-0.8)/1.7,0,1) + 0.3*clamp((d.ratio-1)/3,0,1) + 0.15*(S.m.cash>0?1:0) + 0.15*S.m.trust/100;
  const total = S.m.cash<0 ? Math.min(0.45, 0.6*skill+0.4*biz) : 0.6*skill+0.4*biz;
  const grades = [[0,L('Стажёр','Intern')],[0.35,'Junior PM'],[0.5,'Middle PM'],[0.65,'Senior PM'],[0.8,'Lead PM'],[0.9,'Head of Product']];
  // grade by the score the player sees (rounded), so "90 / 100" is never shown with a lower grade
  const shown = Math.round(total*100)/100;
  let g = grades[0][1]; grades.forEach(([v,n])=>{ if(shown>=v) g=n; });
  return {skill, biz, total, grade:g, growth, s1, s2};
}
function badges(){
  const d = derive(S.m), sc = S.log.filter(l=>l.kind==='scen');

  return [
    {n:L('Сначала проблема','Problem first'), t:L('Все discovery-кейсы решены сильно','Every discovery case solved with a strong call'), on: disc.length>=1 && disc.every(l=>l.q==='best')},
    {n:L('Здоровая экономика','Healthy economics'), t:L('LTV / CAC ≥ 3 в конце игры','LTV / CAC ≥ 3 at the end of the game'), on: d.ratio>=3},
    {n:L('Без подглядываний','No peeking'), t:L('Дождался конца A/B-теста','Waited for the A/B test to finish'), on: !!s14 && s14.q==='best'},

/* ============ competencies ============ */
// 7 PM competencies (texts in COMP). Each case/challenge feeds its 1–2 tags (primary full weight, secondary half);
// some competencies also get a signal from the state of the business. Scores are derived from S.log, so old saves still work.
const COMP_KEYS = ['user','strategy','exec','data','biz','stake','lead'];
const COMP_LVL = [[0,'Junior'],[0.5,'Middle'],[0.65,'Senior'],[0.8,'Lead'],[0.9,'Head']];
const COMP_SIGNAL_W = 1.5;
// every competency starts from a neutral prior, so a couple of lucky answers don't make you Head
const COMP_PRIOR = {v:0.5, w:1.5};
const DOMAIN_COMP = {disc:'user', prio:'exec', metr:'biz', exp:'data'};
const scenTags = id => { const s = SCEN.find(x=>x.id===id); return (s && s.c) || COMP_TAGS.scen[id] || [DOMAIN_COMP[s ? s.d : 'disc']]; };
const chalTags = (key, d) => (key && COMP_TAGS.chal[key]) || [DOMAIN_COMP[d]];
const compName = k => { const c = COMP.find(x=>x.k===k); return c ? c.name[LANG] : k; };
function compLevel(x){ let i = 0; COMP_LVL.forEach(([v],j)=>{ if(x>=v) i = j; }); return i; }
function compSignals(){
  const m = S.m, d = derive(m), growth = d.mrr/S.initMrr;
  return {
    biz: 0.5*clamp((growth-0.8)/1.7,0,1) + 0.5*clamp((d.ratio-1)/3,0,1),
    stake: clamp((m.trust-30)/40,0,1),
    lead: clamp((m.morale-40)/40,0,1),
    exec: clamp((80-m.debt)/60,0,1)
  };
}
function compScores(){
  const acc = {}; COMP_KEYS.forEach(k=>acc[k] = {w:0, v:0, n:0});
  S.log.forEach(l=>{

  });

}

function spark(vals, w=120, h=34){
  if(vals.length<2) vals = [vals[0], vals[0]];
  const mn = Math.min(...vals), mx = Math.max(...vals), rg = (mx-mn)||1;
  const pts = vals.map((v,i)=>[ (i/(vals.length-1))*(w-6)+3, h-4-((v-mn)/rg)*(h-10) ]);
  const line = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area = line+` L${pts[pts.length-1][0].toFixed(1)} ${h} L${pts[0][0].toFixed(1)} ${h} Z`;
  const e = pts[pts.length-1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${area}" fill="currentColor" opacity=".12"/><path d="${line}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${e[0].toFixed(1)}" cy="${e[1].toFixed(1)}" r="3" fill="currentColor"/></svg>`;
}

function altBest(sc, o){
  const others = sc.options.filter(x=>x.q==='best' && x!==o);

function deltaTile(label, now, prev, fmt, inv){
  const diff = now - prev, rel = prev ? diff/Math.abs(prev) : 0;
  const cls = Math.abs(rel)<0.005 ? 'flat' : ((inv ? diff<0 : diff>0) ? 'up' : 'down');
  return `<div class="delta"><small>${label}</small><b>${fmt(now)}</b><em class="${cls}">${diff>=0?'▲':'▼'} ${fmt(Math.abs(diff))}</em></div>`;
}

  if(e.target.id==='board'){ closeBoard(); return; }
  if(e.target.id==='matrix'){ closeMatrix(); return; }

  const a = b.dataset.act;
  if(a==='lang'){ setLang(b.dataset.lang); return; }
  if(a==='hint'){ if(S && S.phase==='challenge' && !S.cur.hintUsed){ S.cur.hintUsed = true; track('hint'); save(); render(); } return; }
  if(a==='theme'){ setTheme(themeNow()==='dark' ? 'light' : 'dark'); return; }
  if(a==='shareCard'){ shareCard(); return; }
  if(a==='publishImg'){ publishImage(); return; }
  if(a==='lbSubmit'){ lbSubmit(); return; }
  if(a==='certIssue'){ certIssue(); return; }
  if(a==='certLi'){ window.open(liAddUrl(S.cert), '_blank', 'noopener'); const fl = $('#cert-fields'); if(fl) fl.hidden = false; track('cert-linkedin'); return; }
  if(a==='certShare'){ certShare(S.cert); return; }

  if(a==='certPlay'){ CERT_VIEW = null; try{ const u = new URL(location.href); u.searchParams.delete('cert'); history.replaceState(null, '', u); }catch(e){} render(); window.scrollTo({top:0}); return; }
  if(a==='goto'){ const el = document.getElementById(b.dataset.target); if(el) el.scrollIntoView({behavior:'smooth', block:'start'}); return; }
  if(a==='lbEdit'){ const bx = $('#lb-end'); if(bx){ bx.dataset.edit = '1'; renderLb(); } return; }
  if(a==='board'){ openBoard(); return; }
  if(a==='boardClose'){ closeBoard(); return; }
  if(a==='matrix'){ closeTerm(); openMatrix(); return; }
  if(a==='compInfo'){ openCompInfo(b); return; }
  if(a==='matrixClose'){ closeMatrix(); return; }
  if(a==='shareLi'){ shareLinkedIn(); return; }
  if(a==='sheet'){ openSheet(); return; }
  if(a==='sheetClose'){ closeSheet(); return; }
  if(a==='popClose'){ closeTerm(); return; }
  if(a==='new'){ clearSave(); newGame(); window.scrollTo({top:0}); }
  else if(a==='continue'){ S = load(); render(); }
  else if(a==='scen') chooseScenario(+b.dataset.i);
  else if(a==='toChal'){ toChallenge(); window.scrollTo({top:0}); }
  else if(a==='chal') answerChallenge(+b.dataset.i);
  else if(a==='chalNum') answerChallenge($('#ans-num').value);
  else if(a==='close'){ closeMonth(); window.scrollTo({top:0}); }
  else if(a==='next'){ nextMonth(); window.scrollTo({top:0}); }
});
document.addEventListener('toggle', e=>{ if(e.target.id==='goal'){ try{ localStorage.setItem(GOAL_KEY, e.target.open ? '1' : '0'); }catch(err){} } }, true);
document.addEventListener('change', e=>{
  if(e.target.id==='card-plain'){ try{ localStorage.setItem(CARD_PLAIN_KEY, e.target.checked ? '1' : '0'); }catch(err){} shareHint(''); paintCard(); }
});
document.addEventListener('input', e=>{
  if(e.target.id==='budget' || e.target.id==='debtShare') updateBudget();
  else if(e.target.id==='gsearch') filterSheet(e.target.value);
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ const mx = document.getElementById('matrix'); if(mx && !mx.hidden){ closeMatrix(); return; } const bd = document.getElementById('board'); if(bd && !bd.hidden){ closeBoard(); return; } const s = document.getElementById('sheet'); if(s && !s.hidden){ closeSheet(); return; } closeTerm(); return; }
  if(e.target.id==='lb-name' || e.target.id==='lb-li'){ if(e.key==='Enter'){ e.preventDefault(); lbSubmit(); } return; }
  if(e.target.id==='cert-name'){ if(e.key==='Enter'){ e.preventDefault(); certIssue(); } return; }
  if(e.target.id==='ans-num'){ if(e.key==='Enter'){ e.preventDefault(); answerChallenge(e.target.value); } return; }
  if(e.target.tagName==='INPUT') return;
  if(e.key==='?'){ openSheet(); return; }
  if((e.key==='Enter'||e.key===' ') && e.target.classList && e.target.classList.contains('term')){ e.preventDefault(); openTerm(e.target); return; }
  if(/^[1-5]$/.test(e.key)){ const btn = document.querySelectorAll('#stage .opt')[+e.key-1]; if(btn && !btn.disabled){ btn.click(); } }
  else if(e.key==='Enter'){ const p = document.querySelector('[data-primary]'); if(p && document.activeElement===document.body){ e.preventDefault(); p.click(); } }
});

/* ============ boot ============ */
function applyLang(){
  i18nConsts(); buildTerms();
  document.documentElement.lang = LANG;
  document.title = L('Ритм · PM-симулятор','Rhythm · PM simulator');
}
function setLang(lg){
  if(!LANGS.includes(lg) || lg===LANG) return;
  LANG = lg; applyLang();
  try{ localStorage.setItem(LANG_KEY, lg); }catch(e){}
  try{ const u = new URL(location.href); u.searchParams.set('lang', lg); history.replaceState(null, '', u); }catch(e){}
  const sheetOpen = (()=>{ const s = document.getElementById('sheet'); return s && !s.hidden; })();
  render();
  if(sheetOpen) openSheet();
}
applyLang();
function start(data){
  if(data && data.S) S = data.S;
  try{
    const q = new URLSearchParams(location.search), tok = q.get('claim');
    if(tok && /^[0-9a-f]{32,128}$/i.test(tok)){
      setPlayer({token:tok, name:q.get('n')||'', linkedin:q.get('li')||''}); CLAIMED = q.get('n') || '—';
      ['claim','n','li'].forEach(k=>q.delete(k));
      history.replaceState(null, '', location.pathname + (q.toString() ? '?'+q : '') + location.hash);
      track('lb-claim');
    }
  }catch(e){}
  let cid = null; try{ cid = new URLSearchParams(location.search).get('cert'); }catch(e){}
  if(cid && lbOn()){ loadCertView(cid); return; }
  render();
}
try{ window.claude?.hot?.snapshot?.(()=>({S})); }catch(e){}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
