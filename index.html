      'Ask two questions: how do users feel when the feature is there, and how do they feel when it isn’t? Whether anyone expected it matters too.', 'Faça duas perguntas: como os usuários se sentem quando a feature existe e como se sentem quando não existe? Também importa se alguém a esperava.')},
    {t:L('Персональные «итоги года» в декабре: никто их не просил и без них никто бы не расстроился, но пользователи массово выкладывают их в соцсети.','A personal “year in review” in December: nobody asked for it and nobody would have missed it, but users post it all over social media.', 'Uma “retrospectiva do ano” pessoal em dezembro: ninguém pediu e ninguém sentiria falta, mas os usuários postam em todas as redes sociais.'), a:2,
     w:L('«Итоги года» — привлекательная функция: неожиданная радость, которой делятся, хотя её отсутствие никого не огорчало.','The year in review is an attractive feature: an unexpected delight that people share, even though nobody minded its absence.', 'A retrospectiva do ano é uma feature atrativa: um encanto inesperado que as pessoas compartilham, embora ninguém se incomodasse com a ausência dela.'),
     hint:L('Сопоставь реакцию на наличие функции с реакцией на её отсутствие — в описании есть и то и другое. Именно эта пара определяет категорию по Кано.',
      'Weigh the reaction to the feature being there against the reaction to it being missing — the description gives you both. That pair is what sets the Kano category.', 'Compare a reação à presença da feature com a reação à ausência dela — a descrição traz as duas. É esse par que define a categoria Kano.')},
    {t:L('Выбор из 12 цветов иконки приложения: в опросах пользователям всё равно, есть эта настройка или нет, — на удовлетворённость она не влияет.','A choice of 12 app icon colors: in surveys users don’t care whether the setting exists or not — it has no effect on satisfaction.', 'Escolha entre 12 cores para o ícone do app: nas pesquisas, tanto faz para os usuários se a opção existe ou não — ela não afeta a satisfação.'), a:3,
     w:L('Цвета иконки — безразличная функция: ни их наличие, ни отсутствие не меняют удовлетворённость.','Icon colors are indifferent: neither having them nor lacking them changes satisfaction.', 'As cores do ícone são indiferentes: tê-las ou não tê-las não muda a satisfação.'),
     hint:L('Ищи в описании, меняется ли удовлетворённость вообще — при наличии функции или при её отсутствии. В модели Кано это и есть главный вопрос.',
      'Look for whether satisfaction changes at all — when the feature is there or when it’s missing. In the Kano model, that’s the key question.', 'Veja se a satisfação muda de alguma forma — quando a feature existe ou quando falta. No modelo Kano, essa é a pergunta-chave.')},
    {t:L('Страница «О команде» в настройках: в Кано-опросе пользователи одинаково нейтральны и к её наличию, и к отсутствию.','An “About the team” page in settings: in a Kano survey, users feel equally neutral whether it’s there or not.', 'Uma página “Sobre o time” nas configurações: em uma pesquisa Kano, os usuários ficam igualmente neutros com ou sem ela.'), a:3,
     w:L('Страница «О команде» — безразличная функция: она не сдвигает удовлетворённость ни в одну сторону.','The “About the team” page is indifferent: it doesn’t move satisfaction either way.', 'A página “Sobre o time” é indiferente: não move a satisfação para nenhum lado.'),
     hint:L('В Кано-опросе задают парный вопрос: «Как вам, если функция есть?» и «Как вам, если её нет?». Посмотри, как люди ответили на оба.',
      'A Kano survey asks a paired question: “How do you feel if the feature is there?” and “How do you feel if it isn’t?” Look at how people answered both.', 'Uma pesquisa Kano faz uma pergunta em par: “Como você se sente se a feature existir?” e “Como você se sente se ela não existir?” Veja como as pessoas responderam às duas.')}
   ];
   const it = pick(items);
   const opts = L(['Обязательная (must-be)','Одномерная (performance)','Привлекательная (delighter)','Безразличная (indifferent)'],
     ['Must-be (basic)','One-dimensional (performance)','Attractive (delighter)','Indifferent'], ['Obrigatório (básico)','Unidimensional (desempenho)','Atrativo (encantador)','Indiferente']);
   return {title:L('Классифицируй по модели Кано','Classify it with the Kano model', 'Classifique pelo modelo Kano'), type:'choice',
    prompt:`<p>${it.t}</p>`, question:L('К какой категории модели Кано относится функция?','Which Kano category does this feature fall into?', 'Em qual categoria Kano esta feature se encaixa?'), options:opts, answer:it.a,
    explain:L(`${it.w} Напомним: обязательные — их отсутствие злит, наличие не радует; одномерные — удовлетворённость растёт пропорционально качеству; привлекательные — неожиданно радуют, но их отсутствие не замечают; безразличные — ни на что не влияют. Со временем «привлекательные» превращаются в «обязательные».`,
     `${it.w} Recap: must-be — their absence makes users angry, their presence doesn’t make anyone happy; one-dimensional — satisfaction grows in proportion to quality; attractive — they delight unexpectedly, but nobody notices when they’re missing; indifferent — they don’t move the needle. Over time, attractive features turn into must-bes.`, `${it.w} Resumo: obrigatórias — a ausência irrita os usuários, a presença não deixa ninguém feliz; unidimensionais — a satisfação cresce na proporção da qualidade; atrativas — encantam de forma inesperada, mas ninguém percebe quando faltam; indiferentes — não fazem diferença. Com o tempo, features atrativas viram obrigatórias.`), hint:it.hint};
 }},
 method:{d:'disc', gen(){
   const sets = [
    {ctx:L('Треть пользователей уходит сразу после окончания триала, не оплатив. Нужно понять почему.',
       'A third of users leave right after the trial ends without paying. You need to understand why.', 'Um terço dos usuários sai logo depois do fim do período grátis, sem pagar. Você precisa entender por quê.'),
     good:L('Поговорить с 6–8 ушедшими после триала и сверить их путь в аналитике','Interview 6–8 trial churners and trace their journeys in analytics', 'Entrevistar 6 a 8 pessoas que saíram após o período grátis e traçar a jornada delas no analytics'),
     bad:L(['Разослать NPS-опрос всей базе и внимательно прочитать комментарии критиков','Сразу запустить A/B-тест скидки 30% на первый месяц после окончания триала','Собрать мнение поддержки о причинах неоплаты и ранжировать их'],
      ['Send an NPS survey to the whole base and read the detractors’ comments','Launch an A/B test of a 30% first-month discount after the trial','Ask support why people don’t pay and rank the reasons they name'], ['Enviar uma pesquisa de NPS para toda a base e ler os comentários dos detratores','Lançar um teste A/B com 30% de desconto no primeiro mês após o período grátis','Perguntar ao suporte por que as pessoas não pagam e ranquear os motivos citados']),
     why:L('Нужны ответы от <b>тех самых</b> пользователей, у которых проблема: интервью объяснят «почему», аналитика подтвердит масштаб. NPS по всей базе размыт, A/B-тест скидки — лечение до диагноза, а мнение поддержки — полезный, но вторичный источник.',
      'You need answers from <b>the very users</b> who have the problem: interviews explain the “why,” analytics confirms the scale. An NPS survey of the whole base is too diluted, a discount A/B test is a cure before a diagnosis, and support’s opinion is useful but secondhand.', 'Você precisa de respostas <b>dos próprios usuários</b> que têm o problema: as entrevistas explicam o “porquê”, o analytics confirma a escala. Uma pesquisa de NPS com toda a base é diluída demais, um teste A/B de desconto é remédio antes do diagnóstico, e a opinião do suporte é útil, mas de segunda mão.'),
     hint:L('Сначала определи тип вопроса: «почему» или «сколько»? Потом подумай, от кого нужны ответы — от всех подряд или от тех, у кого проблема.',
      'First pin down the type of question: “why” or “how many”? Then think about whose answers you need — everyone’s, or those of the people who actually have the problem.', 'Primeiro defina o tipo de pergunta: “por quê” ou “quantos”? Depois pense em de quem você precisa das respostas — de todo mundo ou de quem realmente tem o problema.')},
    {ctx:L('Интервью выявили пять болей пользователей. Нужно понять, какая из них самая массовая среди активной базы, чтобы выбрать фокус квартала.',
       'Interviews surfaced five user pain points. You need to know which one is the most widespread across the active base to pick the quarter’s focus.', 'As entrevistas revelaram cinco dores dos usuários. Você precisa saber qual é a mais comum em toda a base ativa para escolher o foco do trimestre.'),
     good:L('Опросить в приложении случайную выборку активных и посчитать частоту болей','Run an in-app survey of a random sample of active users to size each pain', 'Fazer uma pesquisa no app com uma amostra aleatória de usuários ativos para dimensionar cada dor'),
     bad:L(['Провести ещё 10 интервью и как следует раскопать каждую из пяти найденных болей','Попросить подписчиков Ритма в соцсетях проголосовать за самую главную боль','Посчитать, какая боль чаще всего звучала во всех уже проведённых интервью'],
      ['Run 10 more interviews to dig deeper into each of the five pain points you found','Ask Rhythm’s social media followers to vote for the biggest pain point','Count which pain came up most often in the interviews you’ve already done'], ['Fazer mais 10 entrevistas para aprofundar cada uma das cinco dores que você encontrou','Pedir aos seguidores da Rhythm nas redes sociais que votem na maior de todas as dores','Contar qual dor apareceu mais vezes nas entrevistas que você já fez até o momento']),
     why:L('Вопрос «сколько» — количественный: нужен опрос на репрезентативной выборке. Интервью отвечают на «почему», а не на «сколько», и частота упоминаний в нескольких интервью статистически ничего не значит. Подписчики в соцсетях — смещённая выборка, а не активная база.',
      'A “how many” question is quantitative: you need a survey on a representative sample. Interviews answer “why,” not “how many,” and mention counts from a handful of interviews mean nothing statistically. Social media followers are a biased sample, not your active base.', 'Uma pergunta de “quantos” é quantitativa: você precisa de uma pesquisa com amostra representativa. Entrevistas respondem “por quê”, não “quantos”, e a contagem de menções em um punhado de entrevistas não significa nada estatisticamente. Seguidores nas redes sociais são uma amostra enviesada, não a sua base ativa.'),
     hint:L('Здесь вопрос «сколько» по всей активной базе, а не «почему». Подумай, какой метод даёт цифры, которые можно перенести на всю базу.',
      'This is a “how many, across the active base” question, not a “why.” Think about which method gives you numbers you can generalize to the whole base.', 'Esta é uma pergunta de “quantos, em toda a base ativa”, não de “por quê”. Pense em qual método dá números que você pode generalizar para a base inteira.')},
    {ctx:L('В отзывах жалуются, что не могут поменять расписание привычки. Аналитика показывает: до экрана настроек доходят, но изменения не сохраняют.',
       'Reviews complain that people can’t change a habit’s schedule. Analytics shows they reach the settings screen but don’t save their changes.', 'As avaliações reclamam que não dá para mudar a programação de um hábito. O analytics mostra que as pessoas chegam à tela de configurações, mas não salvam as alterações.'),
     good:L('Юзабилити-тест на 5 пользователях: дать задачу и попросить думать вслух','Run a usability test with 5 users who think aloud while doing the task', 'Fazer um teste de usabilidade com 5 usuários que pensam em voz alta durante a tarefa'),
     bad:L(['Спросить в приложении: «Легко ли поменять расписание?» по шкале от 1 до 5','Сразу запустить A/B-тест двух вариантов экрана настроек расписания','Собрать тепловую карту кликов по экрану настроек за следующий месяц'],
      ['Ask in-app, “How easy is it to change a schedule?” on a 1-to-5 scale','Launch an A/B test of two different versions of the schedule settings screen','Collect a click heatmap of the settings screen over the next month'], ['Perguntar no app “É fácil mudar a programação?”, em uma escala de 1 a 5','Lançar um teste A/B com duas versões diferentes da tela de programação','Coletar um mapa de calor de cliques na tela de configurações por um mês']),
     why:L('Аналитика уже сказала, <b>где</b> проблема; юзабилити-тест покажет, <b>что именно</b> мешает, — хватит и пяти человек. Оценка по шкале даст цифру без причины, A/B-тест выбирает между вариантами, когда ещё неясно, что чинить, а тепловая карта займёт месяц и всё равно не объяснит «почему».',
      'Analytics has already told you <b>where</b> the problem is; a usability test shows <b>what exactly</b> gets in the way — five people are enough. A rating scale gives you a number without a reason, an A/B test picks between variants before you know what to fix, and a heatmap takes a month and still won’t explain the “why.”', 'O analytics já mostrou <b>onde</b> está o problema; um teste de usabilidade mostra <b>o que exatamente</b> atrapalha — cinco pessoas bastam. Uma escala de notas dá um número sem motivo, um teste A/B escolhe entre variantes antes de você saber o que corrigir, e um mapa de calor leva um mês e ainda não explica o “porquê”.'),
     hint:L('Аналитика уже показала, где люди застревают. Теперь нужно увидеть, что именно им мешает, — и как можно быстрее.',
      'Analytics has already shown where people get stuck. Now you need to see what exactly gets in their way — and as fast as possible.', 'O analytics já mostrou onde as pessoas travam. Agora você precisa ver o que exatamente as atrapalha — e o mais rápido possível.')},
    {ctx:L('Копирайтер предложил новый текст напоминания. Нужно понять, станут ли люди из-за него чаще отмечать привычки.',
       'A copywriter has proposed new reminder copy. You need to know whether it actually makes people check in more often.', 'Uma redatora propôs um novo texto para os lembretes. Você precisa saber se ele realmente leva as pessoas a fazer check-in com mais frequência.'),
     good:L('A/B-тест: половине — новый текст, половине — старый, сравнить долю отметок','A/B test it: half see the new copy, half the old; compare check-in rates', 'Teste A/B: metade vê o texto novo, metade o antigo; comparar as taxas de check-in'),
     bad:L(['Показать оба текста на интервью и спросить, какой из них больше мотивирует','Раскатать новый текст на всех и сравнить отметки за неделю до и после','Опросить пользователей в приложении, какой из двух текстов им больше нравится'],
      ['Show both versions in customer interviews and ask which one motivates more','Roll the new copy out to everyone and compare check-ins week over week','Run an in-app survey asking which of the two versions users like better'], ['Mostrar as duas versões em entrevistas com clientes e perguntar qual motiva mais','Liberar o texto novo para todos e comparar os check-ins de uma semana para outra','Fazer uma pesquisa no app perguntando de qual das duas versões os usuários gostam mais']),
     why:L('Вопрос причинно-следственный — вызывает ли изменение эффект, — и ответ на него даёт только контролируемый эксперимент. Сравнение «до/после» смешает эффект с сезонностью и днями недели, а мнения в интервью и опросе — это слова, а не поведение.',
      'This is a causal question — does the change cause the effect — and only a controlled experiment can answer it. A before/after comparison mixes the effect up with seasonality and weekday patterns, and opinions from interviews or surveys are words, not behavior.', 'Esta é uma pergunta causal — a mudança causa o efeito? — e só um experimento controlado consegue respondê-la. Uma comparação antes/depois mistura o efeito com sazonalidade e padrões de dia da semana, e opiniões de entrevistas ou pesquisas são palavras, não comportamento.'),
     hint:L('Это вопрос о причине и следствии: вызывает ли изменение эффект. Подумай, какой метод отделит эффект текста от сезонности и других случайных факторов.',
      'This is a cause-and-effect question: does the change produce the effect? Think about which method separates the copy’s effect from seasonality and other noise.', 'Esta é uma pergunta de causa e efeito: a mudança produz o efeito? Pense em qual método separa o efeito do texto da sazonalidade e de outros ruídos.')},
    {ctx:L('Команда хочет делать семейный тариф — это два месяца разработки. Сначала нужно понять, есть ли на него спрос.',
       'The team wants to build a family plan — two months of development. First, you need to know whether there’s demand for it.', 'O time quer criar um plano família — dois meses de desenvolvimento. Antes, você precisa saber se existe demanda.'),
     good:L('Добавить на пейвол кнопку «Семейный тариф» и замерить долю нажатий','Add a “Family plan” button to the paywall and measure how many tap it', 'Colocar um botão “Plano família” no paywall e medir quantos tocam nele'),
     bad:L(['Спросить в интервью, купили бы люди семейный тариф и за сколько','Сделать семейный тариф целиком и посмотреть на продажи за первый месяц','Опросить всю базу пользователей: «Интересен ли вам семейный тариф?»'],
      ['Ask in interviews whether people would buy a family plan, and at what price','Build the family plan and look at its sales in the first month','Survey the whole base: “Would you be interested in a family plan?”'], ['Perguntar em entrevistas se comprariam um plano família e por qual preço','Desenvolver o plano família e olhar as vendas dele no primeiro mês','Pesquisar toda a base: “Você teria interesse em um plano família?”']),
     why:L('Спрос лучше всего проверяет поведение, а не слова: fake door («фальшивая дверь») за пару дней покажет, сколько людей реально хотят тариф. Вопросы о намерениях в интервью и опросе дают завышенные ответы, а сделать тариф целиком — значит потратить два месяца до какой-либо проверки.',
      'Demand is best tested with behavior, not words: a fake door test shows within a couple of days how many people actually want the plan. Questions about intentions in interviews and surveys produce inflated answers, and building the whole plan means spending two months before you’ve tested anything.', 'A melhor forma de testar demanda é com comportamento, não com palavras: um teste de fake door mostra em poucos dias quantas pessoas realmente querem o plano. Perguntas sobre intenção em entrevistas e pesquisas geram respostas infladas, e desenvolver o plano inteiro significa gastar dois meses antes de testar qualquer coisa.'),
     hint:L('Спрос надёжнее проверять поведением, а не словами, — и до того, как тратить два месяца на разработку. Подумай, как увидеть реальное желание купить почти бесплатно.',
      'Demand is best tested through behavior, not words — and before you spend two months building. Think about how to see real intent to buy at almost no cost.', 'A melhor forma de testar demanda é pelo comportamento, não por palavras — e antes de gastar dois meses desenvolvendo. Pense em como ver a intenção real de compra quase sem custo.')}
   ];
   const s = pick(sets); const opts = shuffle([s.good, ...s.bad]);
   return {title:L('Выбери метод исследования','Choose a research method', 'Escolha um método de pesquisa'), type:'choice',
    prompt:L(`<p>${s.ctx}</p>`, `<p>${s.ctx}</p>`, `<p>${s.ctx}</p>`),
    question:L('Какой первый шаг лучше всего?','What’s the best first step?', 'Qual é o melhor primeiro passo?'), options:opts, answer:opts.indexOf(s.good),
    explain:s.why, hint:s.hint};
 }},
 hypo:{d:'exp', gen(){
   const sets = [
    {ctx:L('Перед тестом нового онбординга команда записывает гипотезу в трекер экспериментов.','Before testing a new onboarding flow, the team logs the hypothesis in the experiment tracker.', 'Antes de testar um novo fluxo de onboarding, o time registra a hipótese no controle de experimentos.'),
     good:L('Если сократить онбординг с 5 шагов до 2, D1 retention вырастет на 5 п.п.: в интервью жалуются на долгую настройку. A/B-тест, 2 недели',
       'If we cut onboarding from 5 steps to 2, D1 retention will rise by 5 pp, since interviewees complain about lengthy setup. A/B test, 2 weeks', 'Se reduzirmos o onboarding de 5 passos para 2, a retenção D1 subirá 5 p.p., pois os entrevistados reclamam da configuração demorada. Teste A/B, 2 semanas'),
     bad:L(['Если сократить онбординг, пользователям больше понравится приложение, ведь в интервью жалуются на долгую настройку. Проверим A/B-тестом за 2 недели',
       'Поднять D1 retention с 40% до 45% к концу квартала за счёт нового короткого онбординга: два шага вместо нынешних пяти',
       'Пользователи в интервью жалуются на долгую настройку, поэтому онбординг из 2 шагов поднимет D1 retention — раскатываем на всех'],
      ['If we shorten onboarding, users will like the app more, since interviewees complain about lengthy setup. We’ll check it with a 2-week A/B test',
       'Grow D1 retention from 40% to 45% by the end of the quarter with a new two-step onboarding instead of the current five steps',
       'Interviewees complain about lengthy setup, so a 2-step onboarding will lift D1 retention — let’s roll it out to everyone next sprint'], ['Se encurtarmos o onboarding, os usuários vão gostar mais do app, pois os entrevistados reclamam da configuração demorada. Vamos checar com teste A/B de 2 semanas',
       'Aumentar a retenção D1 de 40% para 45% até o fim do trimestre com um novo onboarding de dois passos no lugar dos cinco passos atuais',
       'Os entrevistados reclamam da configuração demorada, então um onboarding de 2 passos vai elevar a retenção D1 — vamos liberar para todos no próximo sprint']),
     why:L('Остальные варианты: без конкретной метрики и величины эффекта («понравится» не измерить), цель на квартал без обоснования и способа проверки и уверенное решение вообще без теста.',
      'The others: no specific metric or effect size (you can’t measure “will like”), a quarterly target with no rationale or way to test it, and a confident decision with no test at all.', 'As outras: sem métrica específica nem tamanho de efeito (não dá para medir “vão gostar”), uma meta trimestral sem justificativa nem forma de testar e uma decisão confiante sem teste nenhum.'),
     hint:L('Проверь, есть ли в формулировке все части: конкретное изменение, метрика с величиной эффекта, обоснование и способ проверки со сроком. Если чего-то не хватает, результат теста будет не с чем сравнить.',

    {ctx:L('Тестируешь годовой тариф со скидкой 40% на пейволе. Тест длится 4 недели.','You’re testing an annual plan at 40% off on the paywall. The test runs for 4 weeks.', 'Você está testando um plano anual com 40% de desconto no paywall. O teste dura 4 semanas.'),

 alpha:{d:'exp', gen(){

    {ctx:L('Команда заранее договорилась считать результат значимым при α = 0,10. Тест нового пейвола: конверсия в оплату +6% относительно контроля, p = 0,07.',

      ['Not significant: only results with a p-value below 0.05 count as significant','There’s a 93% chance the new paywall really converts better than the old one','Significant, and now we know for sure the paywall lifts conversion by 6%'], ['Não significativo: só resultados com p-value abaixo de 0,05 contam como significativos','Há 93% de chance de o novo paywall realmente converter melhor que o antigo','Significativo, e agora sabemos com certeza que o paywall eleva a conversão em 6%']),
     why:L('Порог выбирают до теста, и p = 0,07 под α = 0,10 проходит. Цена мягкого порога: если эффекта на самом деле нет, «значимый» результат будет выпадать примерно в каждом десятом тесте, а не в каждом двадцатом. При этом p-value — не вероятность того, что пейвол лучше (93% — неверное прочтение), и не гарантия, что эффект равен ровно +6%: это точечная оценка со своим разбросом.',
      'The threshold is set before the test, and p = 0.07 clears α = 0.10. The price of a looser threshold: if there’s no real effect, a “significant” result will turn up in about one test in ten rather than one in twenty. And the p-value isn’t the probability that the paywall is better (93% is a misreading), nor a guarantee that the effect is exactly +6% — that’s a point estimate with its own spread.', 'O limiar é definido antes do teste, e p = 0,07 passa em α = 0,10. O preço de um limiar mais frouxo: se não houver efeito real, um resultado “significativo” aparecerá em cerca de um teste a cada dez, e não um a cada vinte. E o p-value não é a probabilidade de o paywall ser melhor (93% é uma leitura errada), nem garantia de que o efeito seja exatamente +6% — isso é uma estimativa pontual com sua própria dispersão.'),
     hint:L('Сравни p-value с порогом, о котором команда договорилась заранее, а не с привычным. Потом вспомни, что сам порог говорит о цене ошибки.',
      'Compare the p-value with the threshold the team agreed on up front, not the one you’re used to. Then recall what that threshold says about the cost of being wrong.', 'Compare o p-value com o limiar que o time combinou de antemão, não com aquele a que você está acostumado. Depois lembre o que esse limiar diz sobre o custo de errar.')},
    {ctx:L('Две команды отчитываются о тестах. Команда онбординга работает с α = 0,05 и получила p = 0,04. Команда пейвола — с α = 0,10 и получила p = 0,08. Обе пишут: «Значимо».',
       'Two teams report on their tests. The onboarding team uses α = 0.05 and got p = 0.04. The paywall team uses α = 0.10 and got p = 0.08. Both write: “Significant.”', 'Dois times apresentam seus testes. O time de onboarding usa α = 0,05 e obteve p = 0,04. O time de paywall usa α = 0,10 e obteve p = 0,08. Ambos escrevem: “Significativo.”'),

     why:L('Чем ниже α, тем строже порог: при 5% тест без реального эффекта даёт ложную находку в одном случае из двадцати, при 10% — в одном из десяти. И чем меньше p, тем хуже данные согласуются с версией «эффекта нет». Значимость — не бинарный знак качества: порог 10% пропускает вдвое больше ложных находок, чем 5%. А о размере эффекта p-value ничего не говорит — его смотрят отдельно.',
      'The lower the α, the stricter the bar: at 5%, a test with no real effect gives a false positive one time in twenty; at 10%, one time in ten. And the smaller the p, the worse the data fit the “no effect” story. Significance isn’t a binary quality badge: a 10% threshold lets through twice as many false positives as 5%. And the p-value says nothing about the size of the effect — you look at that separately.', 'Quanto menor o α, mais rigoroso o critério: com 5%, um teste sem efeito real dá falso positivo uma vez em vinte; com 10%, uma vez em dez. E quanto menor o p, pior os dados se encaixam na história de “sem efeito”. Significância não é um selo binário de qualidade: um limiar de 10% deixa passar o dobro de falsos positivos em relação a 5%. E o p-value não diz nada sobre o tamanho do efeito — isso você avalia separadamente.'),

      'Compare the thresholds themselves: which one lets noise through as “significant” more often? Then recall what a p-value does and doesn’t tell you.', 'Compare os limiares em si: qual deles deixa o ruído passar como “significativo” com mais frequência? Depois lembre o que um p-value diz e o que não diz.')},
    {ctx:L('Тест пейвола с видеоотзывами шёл на всей аудитории. Конверсия в оплату: 5,0% в контроле, 5,1% в тесте — +0,1 п.п., p = 0,04 при α = 0,05. Видео придётся обновлять каждый месяц.',

     q:L('Раскатывать новый пейвол?','Do you roll out the new paywall?', 'Você lança o novo paywall?'),

     bad:L(['Да: p = 0,04 меньше 0,05, значит, эффект доказан — раскатываем без обсуждений','Нет: такой крошечный эффект не может быть значимым — где-то в расчёте ошибка','Продлить тест ещё на месяц: с ростом выборки эффект станет заметно больше'],
      ['Yes: p = 0.04 is below 0.05, so the effect is proven — roll it out, no debate','No: an effect this tiny can’t be significant — there’s an error in the math','Extend the test by a month: with a bigger sample, the effect will grow too'], ['Sim: p = 0,04 está abaixo de 0,05, então o efeito está provado — lance, sem discussão','Não: um efeito tão pequeno não pode ser significativo — há um erro na conta','Estenda o teste por um mês: com uma amostra maior, o efeito também vai crescer']),
     why:L('Статистическая значимость отвечает на вопрос «похоже ли это на шум», а не «стоит ли оно того». На большой выборке значимыми становятся даже крошечные эффекты — ошибки в расчёте тут нет. Раскатку решают, сравнивая эффект и его доверительный интервал с минимальным эффектом, ради которого стоит платить за поддержку, — этот порог фиксируют до теста. А продление уменьшит p-value, но не увеличит сам эффект.',
      'Statistical significance answers “does this look like noise?”, not “is it worth it?” With a big enough sample, even tiny effects become significant — there’s no error in the math. You decide on a rollout by comparing the effect and its confidence interval with the smallest effect worth paying the upkeep for — a bar you set before the test. And extending the test will shrink the p-value, not grow the effect.', 'A significância estatística responde “isso parece ruído?”, não “vale a pena?”. Com uma amostra grande o suficiente, até efeitos minúsculos ficam significativos — não há erro na conta. Você decide o rollout comparando o efeito e seu intervalo de confiança com o menor efeito que compensa o custo de manutenção — um critério definido antes do teste. E estender o teste vai reduzir o p-value, não aumentar o efeito.'),
     hint:L('Раздели два вопроса: «похоже ли это на шум» и «стоит ли эффект своей цены». p-value отвечает только на один из них.',
      'Separate two questions: “does this look like noise?” and “is the effect worth its cost?” The p-value only answers one of them.', 'Separe duas perguntas: “isso parece ruído?” e “o efeito compensa o custo?”. O p-value só responde a uma delas.')},
    {ctx:L('После теста нового онбординга аналитик проверил 10 метрик: D1, D7, D30, конверсию в оплату, число привычек и другие. Основную метрику до теста не выбрали. Значимой при α = 0,05 оказалась одна — число созданных привычек, p = 0,03.',
       'After a new onboarding test, the analyst checked 10 metrics: D1, D7, D30, paid conversion, number of habits and more. No primary metric was chosen before the test. One came out significant at α = 0.05: habits created, p = 0.03.', 'Depois de um teste do novo onboarding, o analista conferiu 10 métricas: D1, D7, D30, conversão para assinatura paga, número de hábitos e outras. Nenhuma métrica principal foi escolhida antes do teste. Uma saiu significativa com α = 0,05: hábitos criados, p = 0,03.'),
     q:L('Что из этого следует?','What can you conclude?', 'O que dá para concluir?'),
     good:L('Немного: из 10 метрик хотя бы одна будет «значимой» случайно с шансом ~40%','Not much: with 10 metrics, the odds of at least one fluke “win” are ~40%', 'Pouca coisa: com 10 métricas, a chance de ao menos uma “vitória” por acaso é ~40%'),
     bad:L(['Онбординг работает: одна значимая метрика из десяти — уже доказанный эффект','Результат надёжный: p = 0,03 ниже 0,05 с запасом, поправка тут не нужна','Онбординг вредит: раз значима лишь одна метрика из десяти, тест провален'],
      ['The onboarding works: one significant metric out of ten is a proven effect','It’s solid: p = 0.03 clears 0.05 with room to spare, no correction needed','The onboarding hurts: only one of ten metrics is significant, so it failed'], ['O onboarding funciona: uma métrica significativa em dez é um efeito comprovado','É sólido: p = 0,03 passa em 0,05 com folga, não precisa de nenhuma correção','O onboarding atrapalha: só uma de dez métricas é significativa, então falhou']),
     why:L('Каждая метрика при α = 0,05 — это 5% шанс ложной находки. На 10 независимых метриках шанс получить хотя бы одну — 1 − 0,95¹⁰ ≈ 40%. Поэтому основную метрику выбирают до теста, а остальные проверяют с поправкой — например, Бонферрони: 0,05 ÷ 10 = 0,005, и p = 0,03 её не проходит. А «незначимо» не значит «вредно»: это лишь отсутствие доказательств. Находку про привычки стоит взять гипотезой для отдельного теста.',
      'Each metric at α = 0.05 carries a 5% chance of a false positive. Across 10 independent metrics, the chance of at least one is 1 − 0.95¹⁰ ≈ 40%. That’s why the primary metric is chosen before the test and the rest get a correction — e.g., Bonferroni: 0.05 ÷ 10 = 0.005, which p = 0.03 doesn’t clear. And “not significant” doesn’t mean “harmful” — it’s just an absence of evidence. Treat the habits finding as a hypothesis for a separate test.', 'Cada métrica com α = 0,05 carrega 5% de chance de falso positivo. Em 10 métricas independentes, a chance de ao menos um é 1 − 0,95¹⁰ ≈ 40%. Por isso a métrica principal é escolhida antes do teste e as demais recebem uma correção — por exemplo, Bonferroni: 0,05 ÷ 10 = 0,005, que p = 0,03 não atinge. E “não significativo” não quer dizer “prejudicial” — é só ausência de evidência. Trate o achado dos hábitos como hipótese para um teste separado.'),
     hint:L('Каждая проверенная метрика — ещё один лотерейный билет на случайную «значимость». Прикинь, сколько таких билетов было у аналитика.',
      'Every metric you check is another lottery ticket for a fluke “significant” result. Count how many tickets the analyst had.', 'Cada métrica conferida é mais um bilhete de loteria para um resultado “significativo” por acaso. Conte quantos bilhetes o analista tinha.')},
    {ctx:L('Чтобы решать быстрее, команда перешла с α = 0,05 на α = 0,10. За полгода прошло 30 тестов, и, допустим, в 20 из них реального эффекта не было.',
       'To decide faster, the team moved from α = 0.05 to α = 0.10. Thirty tests ran over six months, and let’s say 20 of them had no real effect.', 'Para decidir mais rápido, o time passou de α = 0,05 para α = 0,10. Trinta testes rodaram em seis meses e, digamos, 20 deles não tinham efeito real.'),

      ['None: if there’s no effect, the p-value will land above any threshold','About four: the looser bar doubles the risk, so 20% of tests go wrong','About one: the threshold affects the test’s power, not false positives'], ['Nenhum: se não há efeito, o p-value ficará sempre acima de qualquer limiar','Cerca de quatro: o critério mais frouxo dobra o risco, então 20% dos testes erram','Cerca de um: o limiar afeta o poder do teste, não os falsos positivos']),
     why:L('α — это и есть доля ложных срабатываний среди тестов, где эффекта нет: в таком тесте p-value распределено равномерно и падает ниже 0,10 в 10% случаев. 20 × 0,10 = 2 ложные «победы» — против одной при α = 0,05. Порог 10% вдвое повышает этот риск относительно 5%, но сам риск — 10%, а не 20%. Мягкий порог действительно повышает мощность — но ценой ложных находок, а не вместо них.',
      'α is exactly the false-positive rate among tests with no effect: in such a test, the p-value is uniformly distributed and falls below 0.10 ten percent of the time. 20 × 0.10 = 2 false “wins” — versus one at α = 0.05. A 10% threshold doubles that risk compared with 5%, but the risk itself is 10%, not 20%. A looser threshold does raise power — but at the cost of false positives, not instead of them.', 'O α é exatamente a taxa de falsos positivos entre testes sem efeito: nesses testes, o p-value tem distribuição uniforme e fica abaixo de 0,10 em dez por cento das vezes. 20 × 0,10 = 2 falsas “vitórias” — contra uma com α = 0,05. Um limiar de 10% dobra esse risco em comparação com 5%, mas o risco em si é de 10%, não de 20%. Um limiar mais frouxo de fato aumenta o poder — mas ao custo de falsos positivos, não no lugar deles.'),

   return {title:L('Уровень значимости и p-value','Significance level and p-value', 'Nível de significância e p-value'), type:'choice',
    prompt:`<p>${s.ctx}</p>`, question:s.q, options:opts, answer:opts.indexOf(s.good),
    explain:L(`p-value — вероятность увидеть такую же или ещё большую разницу, если эффекта на самом деле нет. α — порог, выбранный до теста: доля ложных срабатываний, которую ты готов терпеть в тестах без реального эффекта. ${s.why}`,
     `The p-value is the probability of seeing a difference this big or bigger if there’s no real effect. α is the threshold set before the test: the false-positive rate you’re willing to accept in tests with no real effect. ${s.why}`, `O p-value é a probabilidade de ver uma diferença desse tamanho ou maior se não houver efeito real. O α é o limiar definido antes do teste: a taxa de falsos positivos que você aceita em testes sem efeito real. ${s.why}`), hint:s.hint};
 }},
 grey:{d:'exp', gen(){
   const sets = [
    {ctx:L('Команда сделала новый экран статистики, чтобы поднять W4 retention. План: «серый запуск» на 10% пользователей на месяц — «посмотреть, работает ли».',
       'The team built a new stats screen to lift W4 retention. The plan: a staged (“grey”) rollout to 10% of users for a month, to “see if it works.”', 'O time criou uma nova tela de estatísticas para elevar a retenção W4. O plano: um rollout gradual (em etapas) para 10% dos usuários por um mês, para “ver se funciona”.'),
     q:L('Что не так с этим планом?','What’s wrong with this plan?', 'O que há de errado nesse plano?'),
     good:L('Серый запуск ловит поломки, а не эффект: нужен A/B-тест с расчётом срока','A staged rollout catches bugs, not effects: you need a proper A/B test', 'Rollout gradual pega bugs, não efeitos: você precisa de um teste A/B de verdade'),
     bad:L(['Ничего: месяц — стандартный срок, за него успеет проявиться любой эффект','Мало охвата: раскатить на 50%, тогда эффект на retention будет хорошо виден','Слишком долго: двух недель хватит, retention проявляется гораздо быстрее'],
      ['Nothing: a month is the standard window — any effect will show up by then','Too little reach: go to 50%, and then the retention effect will be visible','Too long: two weeks is plenty, since retention shows up faster than that'], ['Nada: um mês é a janela padrão — qualquer efeito vai aparecer até lá','Alcance pequeno demais: vá para 50%, e o efeito na retenção ficará visível','Tempo demais: duas semanas bastam, pois a retenção aparece antes disso']),
     why:L('Без случайной контрольной группы рост retention у этих 10% не отделить от сезона и от того, кто в них попал, — и охват 50% этого не исправит. Нужен A/B-тест, а его срок считают из выборки под нужный MDE и округляют до целых недель из-за недельной сезонности. «Месяц» или «две недели» на глаз — не расчёт, а для W4 retention тест вдобавок не может закончиться раньше, чем последняя когорта проживёт четыре недели.',
      'Without a random control group, a retention lift among those 10% can’t be separated from seasonality or from who ended up in them — and 50% reach doesn’t fix that. You need an A/B test, and its duration comes from the sample size for your MDE, rounded to whole weeks because of weekly seasonality. “A month” or “two weeks” by eye isn’t a calculation — and for W4 retention, the test can’t end before the last cohort has lived through four weeks anyway.', 'Sem um grupo de controle aleatório, um aumento de retenção entre esses 10% não pode ser separado da sazonalidade nem de quem acabou caindo neles — e um alcance de 50% não resolve isso. Você precisa de um teste A/B, e a duração dele vem do tamanho da amostra para o seu MDE, arredondado para semanas inteiras por causa da sazonalidade semanal. “Um mês” ou “duas semanas” no olho não é cálculo — e, para a retenção W4, o teste de qualquer forma não pode terminar antes de a última coorte completar quatro semanas.'),
     hint:L('Спроси себя, на какой вопрос отвечает серый запуск, а на какой — тест с контрольной группой. И откуда вообще должен браться срок теста.',
      'Ask yourself which question a staged rollout answers and which one a test with a control group answers. And where a test’s duration should come from in the first place.', 'Pergunte-se a qual pergunta um rollout gradual responde e a qual responde um teste com grupo de controle. E de onde deve vir, afinal, a duração de um teste.')},
    {ctx:L('Ты переводишь оплату на новый платёжный SDK и заодно меняешь экран оплаты. Если SDK сбоит, люди просто не смогут заплатить.',
       'You’re moving payments to a new payment SDK and redesigning the checkout screen at the same time. If the SDK fails, people simply can’t pay.', 'Você está migrando os pagamentos para um novo SDK de pagamento e redesenhando a tela de checkout ao mesmo tempo. Se o SDK falhar, as pessoas simplesmente não conseguem pagar.'),
     q:L('Как запускать?','How do you launch it?', 'Como você lança isso?'),
     good:L('Серый запуск на 1–5% со стоп-порогами по ошибкам, затем A/B-тест экрана','Staged rollout to 1–5% with error-rate stop rules, then A/B test the screen', 'Rollout gradual para 1–5% com regras de parada por taxa de erro, depois teste A/B da tela'),
     bad:L(['Сразу A/B-тест 50/50: он покажет и эффект нового экрана, и поломки SDK','Раскатить на всех ночью, когда платежей мало, и следить за дашбордом','Только серый запуск: если конверсия у этих 5% не упала, экран тоже удался'],
      ['Go straight to a 50/50 A/B test: it shows the screen’s effect and any SDK bugs','Ship to everyone overnight when payments are low, and watch the dashboard','Staged rollout only: if conversion holds at 5%, the new screen works as well'], ['Vá direto para um teste A/B 50/50: ele mostra o efeito da tela e os bugs do SDK','Lance para todos de madrugada, quando há poucos pagamentos, e acompanhe o dashboard','Só rollout gradual: se a conversão se mantiver em 5%, a nova tela também funciona']),
     why:L('Здесь два разных риска. Технический — сбой SDK — ловят серым запуском на маленькой доле с заранее заданными стоп-порогами: доля ошибок оплаты, краши, обращения в поддержку. Продуктовый — лучше ли новый экран — проверяет только A/B-тест с контролем. A/B 50/50 сразу подставит под возможный сбой половину платящих, раскатка на всех — всех сразу, а «у 5% не упало» — не доказательство эффекта.',
      'There are two separate risks here. The technical one — the SDK failing — is caught with a staged rollout to a small slice, with stop thresholds set in advance: payment error rate, crashes, support tickets. The product one — whether the new screen is better — only an A/B test with a control can answer. A 50/50 test exposes half your payers to a possible outage, a full rollout exposes everyone, and “it didn’t drop at 5%” doesn’t prove any effect.', 'Há dois riscos distintos aqui. O técnico — a falha do SDK — é pego com um rollout gradual para uma fatia pequena, com limites de parada definidos de antemão: taxa de erro de pagamento, crashes, chamados no suporte. O de produto — se a nova tela é melhor — só um teste A/B com controle responde. Um teste 50/50 expõe metade dos seus pagantes a uma possível indisponibilidade, um rollout completo expõe todos, e “não caiu com 5%” não prova efeito nenhum.'),
     hint:L('Раздели изменение на два риска: что может сломаться и что может не сработать. Для каждого подумай, какой инструмент на него отвечает и скольких людей ты готов подставить.',
      'Split the change into two risks: what could break and what might not work. For each, think about which tool answers it and how many people you’re willing to expose.', 'Divida a mudança em dois riscos: o que pode quebrar e o que pode não funcionar. Para cada um, pense em qual ferramenta responde e quantas pessoas você aceita expor.')},
    {ctx:L('Умные напоминания две недели работали у 5% аудитории — у тех, кто первым обновил приложение. У них доля дней с отметкой на 8% выше, чем за две недели до включения. Андрей хочет написать инвесторам: «+8% к вовлечённости».',
       'Smart reminders ran for two weeks for 5% of the audience — the users who updated the app first. Their share of check-in days is 8% higher than in the two weeks before. Andrew wants to tell investors: “+8% engagement.”', 'Os lembretes inteligentes rodaram por duas semanas para 5% da audiência — os usuários que atualizaram o app primeiro. A parcela de dias com check-in deles está 8% acima das duas semanas anteriores. Andrew quer dizer aos investidores: “+8% de engajamento.”'),
     q:L('Можно так написать?','Can he say that?', 'Ele pode dizer isso?'),
     good:L('Нет: без случайной контрольной группы +8% не отделить от сезона и состава','No: without a random control, the +8% may be seasonality or selection', 'Não: sem controle aleatório, os +8% podem ser sazonalidade ou seleção'),
     bad:L(['Да: 5% аудитории — это тысячи людей, такой выборки для вывода вполне достаточно','Да, но осторожно: написать вдвое меньше, +4%, с поправкой на случайный шум','Нет: 5% мало — расширить запуск до 50% и пересчитать прирост тем же способом'],
      ['Yes: 5% of the audience is thousands of people, plenty for a conclusion','Yes, but carefully: report +4% instead, to allow for random noise','No: 5% is too few — widen it to 50% and recompute the lift the same way'], ['Sim: 5% da audiência são milhares de pessoas, o bastante para concluir','Sim, mas com cuidado: informe +4%, para dar margem ao ruído aleatório','Não: 5% é pouco — amplie para 50% e recalcule o aumento do mesmo jeito']),
     why:L('Серый запуск не создаёт контрольной группы: первыми обновляются самые активные, и они отмечаются чаще и без новой фичи. А сравнение «до/после» смешивает эффект с сезонностью, праздниками и эффектом новизны. Размер выборки этого не лечит, «поделить на два» — тоже: смещение — не случайный шум. Чтобы утверждать эффект, нужен A/B-тест: случайное разбиение и сравнение групп за один и тот же период.',
      'A staged rollout doesn’t create a control group: the earliest updaters are the most engaged users, who check in more even without the feature. And a before/after comparison mixes the effect with seasonality, holidays and novelty. Sample size doesn’t cure that, and neither does “halving it” — bias isn’t random noise. To claim an effect, you need an A/B test: random assignment and a comparison of groups over the same period.', 'Um rollout gradual não cria um grupo de controle: quem atualiza primeiro são os usuários mais engajados, que fazem mais check-ins mesmo sem a feature. E uma comparação antes/depois mistura o efeito com sazonalidade, feriados e efeito novidade. O tamanho da amostra não cura isso, e “cortar pela metade” também não — viés não é ruído aleatório. Para afirmar um efeito, você precisa de um teste A/B: distribuição aleatória e comparação dos grupos no mesmo período.'),
     hint:L('Спроси: с кем сравнивают этих 5% и случайно ли они попали в запуск? Подумай, что ещё, кроме фичи, могло измениться за эти недели.',
      'Ask: who are these 5% being compared with, and did they land in the rollout at random? Think about what else besides the feature could have changed over those weeks.', 'Pergunte: com quem esses 5% estão sendo comparados, e eles entraram no rollout ao acaso? Pense no que mais, além da feature, pode ter mudado nessas semanas.')},
    {ctx:L('Синхронизация с Apple Health в сером запуске на 5%. Прошло три дня, и Тим спрашивает, когда расширять до 25%.',
       'Apple Health sync is in a staged rollout at 5%. Three days in, Tim asks when to widen it to 25%.', 'A sincronização com o Apple Health está em rollout gradual, em 5%. Depois de três dias, Tim pergunta quando ampliar para 25%.'),
     q:L('По какому правилу решать?','What rule should decide it?', 'Que regra deve decidir isso?'),
     good:L('По заранее записанным порогам: краши, ошибки синхронизации, обращения','By thresholds written down in advance: crashes, sync errors, tickets', 'Por limites registrados de antemão: crashes, erros de sincronização, chamados'),
     bad:L(['Когда вовлечённость у этих 5% станет заметно выше, чем у остальных','Когда команда посмотрит дашборды и сойдётся, что вроде всё в порядке','Прибавлять каждый день по 5 п.п., пока кто-то не заметит проблему'],
      ['When engagement among those 5% gets clearly higher than everyone else’s','When the team looks at the dashboards and agrees things seem fine','Add 5 pp every day until someone on the team happens to notice a problem'], ['Quando o engajamento desses 5% ficar claramente acima do dos demais','Quando o time olhar os dashboards e concordar que parece tudo bem','Somar 5 p.p. por dia até alguém do time notar um problema por acaso']),
     why:L('Расширение решают по guardrail-метрикам с порогами, записанными до старта: доля крашей, ошибок синхронизации, время ответа, обращения в поддержку — в сравнении с теми, у кого фича выключена. Плюс минимальное время на каждом шаге, чтобы успели проявиться редкие сбои. Рост вовлечённости — не критерий серого запуска (его меряет A/B-тест), а «вроде нормально» и «пока не заметят» — это решения без критериев.',
      'You widen based on guardrail metrics with thresholds written down before launch: crash rate, sync errors, response time, support tickets — compared with users who don’t have the feature. Plus a minimum time at each step so rare failures have a chance to surface. An engagement lift isn’t a staged-rollout criterion (that’s what an A/B test measures), and “seems fine” or “until someone notices” are decisions without criteria.', 'Você amplia com base em guardrails com limites registrados antes do lançamento: taxa de crashes, erros de sincronização, tempo de resposta, chamados no suporte — em comparação com usuários que não têm a feature. Além de um tempo mínimo em cada etapa, para que falhas raras tenham chance de aparecer. Aumento de engajamento não é critério de rollout gradual (isso é o que um teste A/B mede), e “parece tudo bem” ou “até alguém notar” são decisões sem critério.'),
     hint:L('Вспомни, ради чего вообще делают серый запуск. Хорошее правило расширения придумывают до старта, и его нельзя трактовать по настроению.',
      'Recall what a staged rollout is for in the first place. A good widening rule is set before launch and leaves no room for gut feel.', 'Lembre para que serve, afinal, um rollout gradual. Uma boa regra de ampliação é definida antes do lançamento e não deixa espaço para intuição.')},
    {ctx:L('В плане релизов три изменения: (а) переезд на новую базу данных — пользователи ничего не заметят; (б) онбординг из 2 шагов вместо 5, который должен поднять D7; (в) новый движок напоминаний на новом сервере, который должен поднять число отметок.',
       'The release plan has three changes: (a) a move to a new database — users won’t notice a thing; (b) a 2-step onboarding instead of 5 steps, meant to lift D7; (c) a new reminder engine on a new server, meant to increase check-ins.', 'O plano do release tem três mudanças: (a) a migração para um novo banco de dados — os usuários não vão notar nada; (b) um onboarding de 2 etapas em vez de 5, para elevar o D7; (c) um novo motor de lembretes em um novo servidor, para aumentar os check-ins.'),
     q:L('Что чем проверять?','Which tool fits each change?', 'Qual ferramenta serve para cada mudança?'),
     good:L('а — серый запуск; б — A/B-тест; в — серый запуск, а затем A/B-тест','(a) staged rollout; (b) A/B test; (c) staged rollout, then an A/B test', '(a) rollout gradual; (b) teste A/B; (c) rollout gradual, depois teste A/B'),
     bad:L(['а — A/B-тест; б — серый запуск; в — сразу A/B-тест на 50% аудитории','Все три — серым запуском: он показывает и стабильность, и эффект','Все три — A/B-тестом: только он даёт надёжный ответ на любой вопрос'],
      ['(a) A/B test; (b) staged rollout; (c) an A/B test on 50% right away','All three as staged rollouts: they show both stability and effect','All three as A/B tests: only an A/B test gives a reliable answer'], ['(a) teste A/B; (b) rollout gradual; (c) teste A/B em 50% de imediato','Todas como rollout gradual: ele mostra tanto estabilidade quanto efeito','Todas como teste A/B: só um teste A/B dá uma resposta confiável']),
     why:L('Переезд базы несёт только технический риск и не должен ничего менять для пользователя — хватит серого запуска со стоп-порогами. Новый онбординг технически прост, вопрос лишь в эффекте — это A/B-тест. Новый движок может и упасть, и не дать эффекта: сначала серый запуск, чтобы убедиться в стабильности, потом A/B-тест на отметки. Серый запуск не меряет эффект, а A/B-тест на непроверенной инфраструктуре подставит под сбой половину аудитории.',
      'The database move carries only technical risk and shouldn’t change anything for users — a staged rollout with stop thresholds is enough. The new onboarding is technically simple; the only question is its effect — that’s an A/B test. The new engine could both break and fail to deliver: first a staged rollout to make sure it’s stable, then an A/B test on check-ins. A staged rollout doesn’t measure effect, and an A/B test on unproven infrastructure exposes half your audience to an outage.', 'A migração do banco de dados traz só risco técnico e não deve mudar nada para os usuários — um rollout gradual com limites de parada basta. O novo onboarding é tecnicamente simples; a única dúvida é o efeito — isso é um teste A/B. O novo motor pode tanto quebrar quanto não entregar resultado: primeiro um rollout gradual para garantir a estabilidade, depois um teste A/B nos check-ins. Um rollout gradual não mede efeito, e um teste A/B em infraestrutura não comprovada expõe metade da sua audiência a uma indisponibilidade.'),
     hint:L('Для каждого изменения назови главный риск: что-то сломается или эффекта не будет. Потом подбери инструмент под каждый риск, а не один на всё.',
      'For each change, name the main risk: something breaks, or there’s no effect. Then match a tool to each risk rather than one tool to everything.', 'Para cada mudança, nomeie o risco principal: algo quebra ou não há efeito. Depois associe uma ferramenta a cada risco, em vez de uma ferramenta para tudo.')}
   ];
   const s = pick(sets); const opts = shuffle([s.good, ...s.bad]);
   return {title:L('Серый запуск или A/B-тест','Staged rollout or A/B test', 'Rollout gradual ou teste A/B'), type:'choice',
    prompt:`<p>${s.ctx}</p>`, question:s.q, options:opts, answer:opts.indexOf(s.good),
    explain:L(`Серый (поэтапный) запуск отвечает на вопрос «не сломается ли»: стабильность, нагрузка, ошибки. A/B-тест — на вопрос «есть ли эффект»: только случайная контрольная группа отделяет причину от совпадения. ${s.why}`,
     `A staged (“grey”) rollout answers “will it break?” — stability, load, errors. An A/B test answers “is there an effect?” — only a random control group separates cause from coincidence. ${s.why}`, `Um rollout gradual (em etapas) responde “vai quebrar?” — estabilidade, carga, erros. Um teste A/B responde “há efeito?” — só um grupo de controle aleatório separa causa de coincidência. ${s.why}`), hint:s.hint};
 }},
 proxy:{d:'metr', gen(){
   const sets = [
    {ctx:L('Готовишь план на год, и инвестор спрашивает, сколько в нише трекеров привычек стоит привлечь одного платящего. Своих данных по платной рекламе у Ритма почти нет.',
       'You’re building next year’s plan, and an investor asks what it costs to acquire one payer in the habit-tracker niche. Rhythm has almost no paid-ads data of its own.', 'Você está montando o plano do próximo ano, e um investidor pergunta quanto custa adquirir um pagante no nicho de apps de hábitos. A Rhythm quase não tem dados próprios de anúncios pagos.'),
     good:L('Сверить бенчмарки ниши со своей воронкой и провести тест рекламы на $2 тыс.','Check niche benchmarks against your own funnel, then run a $2k ad test', 'Compare benchmarks do nicho com o seu funil e rode um teste de anúncios de US$ 2 mil'),
     bad:L(['Назвать среднее по всем мобильным приложениям из первой же статьи в поиске','Не называть цифру, пока не накопится полгода своих данных по платной рекламе','Спросить знакомого маркетолога из фитнес-приложения и просто взять его цифру'],
      ['Quote the mobile-app average from the first article that comes up in search','Give no number until you’ve built up six months of your own paid-ads data','Ask a marketer friend at a fitness app and just go with their number'], ['Citar a média de apps mobile do primeiro artigo que aparecer na busca','Não dar número algum até juntar seis meses de dados próprios de mídia paga','Perguntar a um colega de marketing de um app fitness e usar o número dele']),
     why:L('Отраслевые отчёты по подпискам в health & fitness дают порядок цены установки, своя воронка (конверсия из установки в оплату) переводит её в цену платящего, а тест на пару тысяч долларов показывает реальную стоимость установки именно для Ритма. Сошлись три оценки — называешь вилку. Среднее «по всем приложениям» и цифра знакомого — чужие аудитории и чужие воронки, а полгода ожидания — это решение, отложенное на полгода.',
      'Industry reports on health & fitness subscriptions give you the order of magnitude for cost per install, your own funnel (install-to-paid conversion) turns that into cost per payer, and a test of a couple thousand dollars shows Rhythm’s real cost per install. When the three agree, you quote a range. An “all apps” average and a friend’s number come from other audiences and other funnels, and waiting six months means putting the decision off by six months.', 'Relatórios do setor sobre assinaturas de saúde e fitness dão a ordem de grandeza do custo por instalação, o seu funil (conversão de instalação para assinatura paga) transforma isso em custo por pagante, e um teste de uns dois mil dólares mostra o custo por instalação real da Rhythm. Quando os três batem, você informa uma faixa. A média de “todos os apps” e o número de um colega vêm de outros públicos e outros funis, e esperar seis meses significa adiar a decisão por seis meses.'),
     hint:L('Цена платящего складывается из цены установки и конверсии в оплату. Подумай, какую часть можно взять из своих данных, какую — снаружи и как дёшево проверить остальное.',
      'Cost per payer is built from cost per install and paid conversion. Think about which part you can take from your own data, which from outside, and how to cheaply check the rest.', 'O custo por pagante é formado pelo custo por instalação e pela conversão para assinatura paga. Pense em qual parte você tira dos seus dados, qual vem de fora e como checar o restante gastando pouco.')},

      ['Run a survey asking payers whether they’d switch to a discounted annual plan','Assume 30% — that’s roughly the share subscription apps usually see','Build the full plan and check the real share after a couple of months'], ['Fazer uma pesquisa perguntando aos pagantes se trocariam o plano mensal por um anual com desconto','Assumir 30% — é mais ou menos a fatia que os apps de assinatura costumam registrar no plano anual','Construir o plano anual completo e conferir a fatia real de adesão depois de uns dois meses no ar']),
     why:L('Отчёты и пейволы конкурентов подсказывают типичную долю годовых, твой отток платящих показывает, сколько людей и так остаются дольше 7 месяцев (им годовой тариф выгоден), а кнопка годового тарифа на пейволе (fake door) за неделю покажет реальные клики при видимой цене. Опрос измеряет симпатию, а не покупку, «обычные 30%» — догадка, а сделать тариф целиком — значит узнать ответ уже после решения.',
      'Competitors’ reports and paywalls hint at a typical annual share, your own payer churn shows how many people already stay longer than 7 months (the ones an annual plan pays off for), and an annual-plan button on the paywall (a fake door) shows real clicks with the price in view within a week. A survey measures sympathy, not purchases, “the usual 30%” is a guess, and building the whole plan means learning the answer after you’ve already decided.', 'Relatórios e paywalls dos concorrentes indicam a fatia típica do plano anual, o churn dos seus pagantes mostra quantas pessoas já ficam mais de 7 meses (aquelas para quem o plano anual compensa), e um botão de plano anual no paywall (um fake door) mostra, em uma semana, cliques reais com o preço à vista. Pesquisa mede simpatia, não compra; “os 30% de sempre” são um chute; e construir o plano inteiro significa descobrir a resposta depois de já ter decidido.'),
     hint:L('Спроси себя, по каким данным уже видно, кому годовой тариф выгоден, и как увидеть реальное желание заплатить вперёд, а не обещание.',
      'Ask yourself which data already shows who’d benefit from an annual plan, and how to see real willingness to pay upfront rather than a promise.', 'Pergunte-se quais dados já mostram quem se beneficiaria de um plano anual e como enxergar a disposição real de pagar adiantado, e não uma promessa.')},
    {ctx:L('Ритм думает о запуске в Польше. Совет директоров просит оценить, сколько там в принципе можно заработать на трекерах привычек за год.',

     good:L('Снизу вверх по открытым данным, сверка с выручкой конкурентов, тест рекламы','Bottom-up from open data, cross-checked with rivals’ revenue and an ad test', 'Bottom-up com dados abertos, cruzado com a receita dos concorrentes e um teste de anúncios'),
     bad:L(['Купить отчёт консалтинга о рынке wellness-приложений и взять цифру оттуда','Умножить выручку Ритма в своей стране на соотношение населения двух стран','Не оценивать заранее: запустить локализацию и посмотреть, сколько заработаем'],
      ['Buy a consulting report on the wellness-app market and take its number as given','Scale Rhythm’s home-market revenue by the two countries’ population ratio','Skip the estimate: ship the localization and just see how much we make'], ['Comprar um relatório de consultoria sobre o mercado de apps de bem-estar e adotar o número dele','Escalar a receita da Rhythm no mercado de origem pela proporção entre as populações dos países','Pular a estimativa: lançar a versão localizada do app e simplesmente ver quanto ele vai faturar']),
     why:L('Снизу вверх: владельцы смартфонов × доля тех, кто платит за приложения о здоровье, × средний чек — по открытой статистике и своим данным из похожих стран. Сверху вниз: оценки выручки конкурентов в Польше из сервисов аналитики магазинов приложений. Небольшая реклама на польскую аудиторию даёт реальную цену установки и конверсию. Отчёт консалтинга — один источник с неизвестной методикой, пересчёт по населению игнорирует доходы и конкуренцию, а «запустим и увидим» — дорогой способ узнать то, что можно оценить за неделю.',
      'Bottom-up: smartphone owners × the share who pay for health apps × average price — from open statistics and your own data from similar countries. Top-down: competitors’ revenue estimates in Poland from app-store intelligence tools. A small ad campaign aimed at Polish users gives you a real cost per install and conversion. A consulting report is a single source with an unknown method, scaling by population ignores income and competition, and “launch and see” is an expensive way to learn what you could estimate in a week.', 'Bottom-up: donos de smartphone × a parcela que paga por apps de saúde × preço médio — a partir de estatísticas abertas e dos seus dados de países parecidos. Top-down: estimativas de receita dos concorrentes na Polônia em ferramentas de inteligência de lojas de apps. Uma pequena campanha de anúncios voltada a usuários poloneses dá o custo por instalação e a conversão reais. Um relatório de consultoria é uma fonte única com método desconhecido, escalar pela população ignora renda e concorrência, e “lançar e ver” é um jeito caro de aprender o que dava para estimar em uma semana.'),
     hint:L('Рынок можно оценить с двух сторон — от пользователей и от денег конкурентов. Подумай, какие куски для каждой стороны есть в открытом доступе и что проверить самим за малые деньги.',
      'A market can be sized from two directions — from the users up and from competitors’ revenue down. Think about which pieces of each are public and what you can check yourself for little money.', 'Um mercado pode ser dimensionado em duas direções — de baixo para cima, a partir dos usuários, e de cima para baixo, a partir da receita dos concorrentes. Pense em quais peças de cada uma são públicas e o que você consegue checar por conta própria gastando pouco.')},
    {ctx:L('Готовишь запуск синхронизации с Apple Health. В поддержке два человека, и они спрашивают, сколько обращений ждать в первый месяц, — от этого зависит, нанимать ли третьего.',

     bad:L(['Спросить разработчиков, сколько багов они ждут, и умножить на всю базу','Нанять третьего человека заранее, а нагрузку посчитать уже после запуска','Взять среднеотраслевую норму обращений на тысячу активных пользователей'],
      ['Ask the engineers how many bugs they expect and multiply by the whole user base','Hire the third person now and work out the actual load after the launch','Use the industry-average support ticket rate per thousand active users'], ['Perguntar aos engenheiros quantos bugs eles esperam e multiplicar por toda a base de usuários','Contratar a terceira pessoa agora e calcular a carga real de chamados depois do lançamento','Usar a taxa média de chamados de suporte do setor para cada mil usuários ativos do app']),
     why:L('Свои данные — лучшая основа: сколько обращений на тысячу пользователей дали прошлые фичи с интеграциями. Отзывы и форумы конкурентов с такой же синхронизацией подскажут типичные проблемы. А серый запуск на 5% даёт реальную долю обращений именно по этой фиче — её можно умножить на полную аудиторию до решения о найме. Оценка разработчиков — мнение, а не данные, среднеотраслевая норма не учитывает специфику интеграций, а «наймём, потом посчитаем» — решение без оценки.',

    {ctx:L('Маркетинг хочет перевести половину бюджета в TikTok. Сначала нужно понять, как будут удерживаться пользователи из нового канала.',

     why:L('Маленький тест на часть бюджета за пару недель даёт ранние D1–D7 по новому каналу. Свои кривые удержания показывают, как ранние точки других каналов переходят в D30, — по ним можно продлить кривую. Публичные бенчмарки по каналам — проверка на здравый смысл. Перевести бюджет вслепую — дорогой эксперимент без контроля, а пользователи из разных каналов как раз сильно различаются; кейс конкурента — чужой продукт и чужая аудитория.',
      'A small test on part of the budget gives you early D1–D7 for the new channel within a couple of weeks. Your own retention curves show how other channels’ early points translate into D30, so you can extend the curve. Public channel benchmarks are a sanity check. Moving the budget blind is an expensive experiment with no control, and users from different channels differ a lot; a competitor’s case study is another product and another audience.', 'Um teste pequeno com parte do orçamento dá, em umas duas semanas, o D1–D7 inicial do novo canal. Suas próprias curvas de retenção mostram como os pontos iniciais de outros canais se traduzem em D30, então dá para estender a curva. Benchmarks públicos por canal servem de checagem de sanidade. Mover o orçamento às cegas é um experimento caro e sem controle, e usuários de canais diferentes variam muito; o case de um concorrente é outro produto e outro público.'),
     hint:L('Не обязательно ждать длинную кривую, чтобы понять её форму, и не обязательно рисковать всем бюджетом. Подумай, на какие ориентиры можно опереться заранее.',

 }}

    "note": "Nas transcrições, a tarefa “ver que estou mudando” apareceu em 14 das 20 pessoas: estava por trás dos gráficos, da exportação e da sequência quebrada. Os dados confirmaram: depois do primeiro mês, o único progresso que a Rhythm mostra é um contador de sequência. Você adicionou um resumo mensal “o que mudou” — a retenção subiu."

 "s45": {
  "title": "Cinco tropeços no onboarding",
  "text": "Kira acompanhou 6 novos usuários no onboarding e anotou onde eles tropeçaram. São quatro telas, seguidas da tela inicial e do primeiro check-in:<ul><li>Tela 1: uma pergunta vaga, “O que você quer alcançar?” — 4 de 6 hesitaram.<\/li><li>Tela 2: conta obrigatória antes de a pessoa ter visto qualquer coisa — 2 de 6 reclamaram.<\/li><li>Tela 3: 14 categorias de hábitos — os seis se perderam.<\/li><li>Mesma tela, logo depois de escolher um hábito: um pedido de permissão para notificações — 3 de 6 recusaram.<\/li><li>Tela 4: o período grátis, com preço e renovação automática em letras miúdas — 5 de 6 perguntaram se seriam cobrados.<\/li><\/ul>Funil do mês: 10.000 pessoas abriram a tela 1, 9.200 chegaram à tela 2, 5.800 à tela 3, 5.100 à tela 4, e 4.100 fizeram o primeiro check-in. No sprint, cabe uma correção.",

    "note": "O novo seletor ficou caprichado: a conversão da etapa subiu de 88% para 93%. Mas os primeiros check-ins cresceram só umas duas centenas de pessoas — a maioria continuava saindo na tela de conta."

const glossL = g => LANG!=='ru' ? Object.assign({k:g.k}, (LANG==='pt' && GLOSS_PT[g.k]) || GLOSS_EN[g.k]) : Object.assign({}, g, {sub:(g.en!=='—'?g.en+' · ':'')+g.ru});
const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
let GMAP = {}, TERM_RE = null, ALIAS_KEY = {};
// English aliases are matched case-insensitively; Russian ones list their case forms explicitly
function buildTerms(){
  const gl = GLOSS.map(glossL);
  GMAP = {}; gl.forEach(g=>GMAP[g.k]=g);
  const aliases = gl.flatMap(g=>g.a.map(a=>({a, k:g.k}))).sort((x,y)=>y.a.length-x.a.length);
  const flags = LANG!=='ru' ? 'giu' : 'gu';
  try { TERM_RE = new RegExp('(?<![\\p{L}\\d-])(' + aliases.map(x=>esc(x.a)).join('|') + ')(?![\\p{L}\\d-])', flags); }
  catch(e){ TERM_RE = new RegExp('(' + aliases.map(x=>esc(x.a)).join('|') + ')', flags.replace('u','')); }
  ALIAS_KEY = {}; aliases.forEach(x=>{ const a = x.a.toLowerCase(); if(!(a in ALIAS_KEY)) ALIAS_KEY[a]=x.k; });
}

function annotate(root){
  if(!root || !TERM_RE) return;
  const count = {};
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(n){
      if(!n.nodeValue || n.nodeValue.trim().length<2) return NodeFilter.FILTER_REJECT;
      const p = n.parentElement;
      if(!p || p.closest('.term, .opt, kbd, .lvl, .pill, script, style, .badge, .segs, .goal summary, .comp-lbl, .chip, .move-chip, button, a.btn')) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const nodes = []; let n; while((n = walker.nextNode())) nodes.push(n);
  nodes.forEach(node=>{
    const text = node.nodeValue; TERM_RE.lastIndex = 0;
    if(!TERM_RE.test(text)) return; TERM_RE.lastIndex = 0;
    const frag = document.createDocumentFragment(); let last = 0, m;
    while((m = TERM_RE.exec(text))){
      const key = ALIAS_KEY[m[0].toLowerCase()];
      if(!key || (count[key]||0) >= 2) continue;
      count[key] = (count[key]||0)+1;
      frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      const b = document.createElement('span');
      b.className = 'term'; b.tabIndex = 0; b.setAttribute('role','button'); b.dataset.term = key; b.textContent = m[0];
      b.setAttribute('aria-label', m[0]+L(' — что это значит',' — what it means', ' — o que significa'));
      frag.appendChild(b); last = m.index + m[0].length;
    }
    if(!last) return;
    frag.appendChild(document.createTextNode(text.slice(last)));
    node.parentNode.replaceChild(frag, node);
  });
}

    requestAnimationFrame(()=>{ const pr = pop.getBoundingClientRect(); if(pr.bottom > window.innerHeight - 8) pop.style.top = Math.max(8, r.top - pr.height - 8)+'px'; });

}

let S = null;
function derive(m){
  const debtPen = Math.max(0, m.debt-50)*DEBT_WORK.penalty;
  const effRet = clamp(m.ret - debtPen + (m.morale-60)*0.0003, 0.4, 0.96);
  const effCac = m.cac*(1+Math.max(0,m.budget-20000)/40000);
  const payers = m.users*m.conv, mrr = payers*m.arppu, gross = mrr*MARGIN;
  const burn = TEAM_COST + m.budget, net = gross - burn;
  const payerRet = Math.min(0.97, effRet+0.10);
  const ltv = m.arppu*MARGIN/(1-payerRet), cacPayer = effCac/m.conv;
  return {effRet, effCac, payers, mrr, gross, burn, net, ltv, cacPayer, ratio:ltv/cacPayer, runway: net<0 ? m.cash/(-net) : Infinity, debtPen};
}
function pickBalanced(items, n){
  const groups = {}; items.forEach(it=>{ (groups[it.d] = groups[it.d]||[]).push(it.id); });
  Object.keys(groups).forEach(k=>groups[k]=shuffle(groups[k]));
  const out=[]; while(out.length<n){ const ks = shuffle(Object.keys(groups).filter(k=>groups[k].length)); if(!ks.length) break; for(const k of ks){ if(out.length<n) out.push(groups[k].shift()); } }
  return out;
}
// scenario with texts in the current language
function scenL(id){
  const s = SCEN.find(x=>x.id===id); if(LANG==='ru') return s;
  const e = (LANG==='pt' && SCEN_PT[id]) || SCEN_EN[id];
  return Object.assign({}, s, {title:e.title, text:e.text, lesson:e.lesson,
    options:s.options.map((o,i)=>Object.assign({}, o, {t:e.options[i].t, fb:e.options[i].fb}, o.later?{later:Object.assign({}, o.later, {note:e.options[i].note})}:{}))});
}
const laterNote = r => scenL(r.sid).options[r.oi].later.note;
// challenge is generated once per language from the same seed; text lives in c.txt[lang]
function genChal(key){
  const seed = (Math.random()*4294967296)>>>0, keep = LANG, txt = {};
  try { LANGS.forEach(lg=>{ LANG = lg; RNG = seeded(seed); txt[lg] = CHAL[key].gen(); }); }
  finally { LANG = keep; RNG = Math.random; }
  const c = txt.ru;
  return {key, d:CHAL[key].d, type:c.type, answer:c.answer, tol:c.tol, abs:c.abs||0, txt};
}
// balanced by domain, with at least one dilemma per game
function pickScenarios(){
  const ids = pickBalanced(SCEN.map(s=>({id:s.id,d:s.d})), MONTHS), byId = id => SCEN.find(s=>s.id===id);
  if(!ids.some(id=>byId(id).dilemma)){
    const dl = shuffle(SCEN.filter(s=>s.dilemma))[0];
    const k = dl ? ids.findIndex(id=>byId(id).d===dl.d) : -1;
    if(k>=0) ids[k] = dl.id;
  }
  return ids;
}
function newGame(){
  const m = {users:45000, ret:0.80, conv:0.05, arppu:9, cac:2.5, viral:0.03, cash:START_CASH, trust:60, morale:62, debt:40, budget:20000, budgetRec:20000, debtShare:0};
  const d = derive(m);
  S = { v:2, month:1, phase:'scenario', m,
    history:[{month:0, users:m.users, mrr:d.mrr, cash:m.cash, ratio:d.ratio, ret:d.effRet}],
    queue:[], xp:{disc:0,prio:0,metr:0,exp:0}, acc:{disc:[0,0],prio:[0,0],metr:[0,0],exp:[0,0]},
    scen:pickScenarios(),
    chal:pickBalanced(Object.keys(CHAL).map(k=>({id:k,d:CHAL[k].d})), MONTHS),
    cur:{}, log:[], streak:0, bestStreak:0, fired:[], ended:false, initMrr:d.mrr, review:null };
  track('start');

}
function startMonth(){
  S.phase = 'scenario';
  const id = S.scen[S.month-1];
  S.cur = { scenId:id, order:shuffle(SCEN.find(s=>s.id===id).options.map((_,i)=>i)), choice:null, chal:null, chalAns:null, chalOk:null, fxShown:null };
  save(); render();
}
function applyFx(fx){
  const m = S.m; if(!fx) return;
  for(const k in fx){ m[k] = (m[k]||0) + fx[k]; }
  m.ret = clamp(m.ret,0.4,0.95); m.conv = clamp(m.conv,0.005,0.2); m.arppu = clamp(m.arppu,3,30); m.cac = clamp(m.cac,0.8,10);
  m.viral = clamp(m.viral,0,0.15); m.trust = clamp(m.trust,0,100); m.morale = clamp(m.morale,0,100); m.debt = clamp(m.debt,0,100);
}
function streakHit(ok){ S.streak = ok ? S.streak+1 : 0; S.bestStreak = Math.max(S.bestStreak, S.streak); }

function chooseScenario(i){
  if(S.cur.choice!==null) return;
  const sc = SCEN.find(s=>s.id===S.cur.scenId), o = sc.options[i];
  S.cur.choice = i; applyFx(o.fx);
  if(o.later) S.queue.push({at:S.month+o.later.in-1, fx:o.later.fx, sid:sc.id, oi:i});
  S.xp[sc.d] += QUAL[o.q].xp; S.acc[sc.d][0] += QUAL[o.q].pts; S.acc[sc.d][1] += 2;
  streakHit(o.q==='best');

function answerChallenge(val){
  const c = S.cur.chal; if(S.cur.chalOk!==null) return;
  let ok;
  if(c.type==='number'){
    // ru: comma is the decimal separator; en: comma separates thousands
    const raw = String(val).replace(/US\$/i,'').replace(/[\s$]/g,'');
    const v = parseFloat(LANG==='en' ? raw.replace(/,/g,'') : (LANG==='pt' && raw.includes(',') ? raw.replace(/\./g,'') : raw).replace(',','.'));
    if(isNaN(v)){ const inp=$('#ans-num'); if(inp){ inp.setAttribute('aria-invalid','true'); inp.placeholder=L('Введи число','Enter a number', 'Digite um número'); inp.focus(); } return; }
    ok = Math.abs(v-c.answer) <= Math.max(Math.abs(c.answer)*c.tol, c.abs||0); S.cur.chalAns = v;
  } else { ok = val===c.answer; S.cur.chalAns = val; }
  S.cur.chalOk = ok;
  const hint = !!S.cur.hintUsed;
  S.xp[c.d] += ok ? (hint ? HINT.xp : 40) : 10; S.acc[c.d][0] += ok ? (hint ? 1 : 2) : 0; S.acc[c.d][1] += 2;
  if(ok) applyFx(CHAL_BONUS[c.d].fx);
  streakHit(ok);
  // the task text in both languages, so the end screen can show it again
  const rc = {}, keepLang = LANG;
  try{ LANGS.forEach(lg=>{ LANG = lg; const t = c.txt[lg] || c.txt.en, fmt = v => t.unit==='$' ? USD()+int(v) : dec(v,1)+' '+t.unit;
    rc[lg] = {prompt:t.prompt, question:t.question, right: c.type==='number' ? fmt(c.answer) : t.options[c.answer], mine: c.type==='number' ? fmt(S.cur.chalAns) : t.options[S.cur.chalAns]}; }); }
  finally{ LANG = keepLang; }
  S.log.push({kind:'chal', key:c.key, d:c.d, ok, hint, title:Object.fromEntries(LANGS.map(lg=>[lg, (c.txt[lg] || c.txt.en).title])), explain:Object.fromEntries(LANGS.map(lg=>[lg, (c.txt[lg] || c.txt.en).explain])), rc});
  S.phase = 'chalFeedback'; save(); render();
}
function closeMonth(){
  const m = S.m;
  const fired = S.queue.filter(q=>q.at<=S.month); S.queue = S.queue.filter(q=>q.at>S.month);
  fired.forEach(q=>applyFx(q.fx));
  // the summary compares with the end of last month, like the dashboard charts. The month's own decisions
  // (and delayed effects that just fired) already moved MRR before the tick: that part is shown separately
  const last = S.history[S.history.length-1], before = derive(m), startUsers = m.users;
  const prev = {users:last.users, mrr:last.mrr, cash:last.cash, ratio:last.ratio};
  const d = derive(m);
  // team share on tech debt: fewer features ship, so organic growth drops
  const ds = m.debtShare||0;
  const organic = m.users*m.viral*(1 - ds*DEBT_WORK.organic), paid = m.budget/d.effCac;
  m.users = m.users*d.effRet + organic + paid;
  const after = derive(m);
  m.cash += after.gross - after.burn;
  m.debt = clamp(m.debt + DEBT_WORK.drift - ds*DEBT_WORK.paydown, 0, 100); m.morale += (60-m.morale)*0.12 + ds*DEBT_WORK.morale; m.trust += (55-m.trust)*0.08;
  const fin = derive(m);
  let review = null;
  if(S.month===REVIEW.month){
    const g = fin.mrr/S.initMrr, lvl = g>=REVIEW.full ? 'full' : (g>=REVIEW.half ? 'half' : 'none');
    const amount = {full:REVIEW.tranche, half:REVIEW.tranche/2, none:0}[lvl];
    m.cash += amount; m.trust = clamp(m.trust + {full:6, half:-4, none:-12}[lvl], 0, 100);
    review = S.review = {g, lvl, amount};
    track('review-'+lvl);
  }
  S.history.push({month:S.month, users:m.users, mrr:fin.mrr, cash:m.cash, ratio:fin.ratio, ret:fin.effRet});
  S.summary = {prev, fired:fired.map(f=>({sid:f.sid, oi:f.oi})), newUsers:organic+paid, paid, organic, churned:startUsers*(1-d.effRet), decisionMrr:before.mrr-last.mrr, debtWarn:d.debtPen>0, review};
  S.phase = m.cash<0 ? 'end' : (S.month>=MONTHS ? 'end' : 'summary');
  if(S.phase==='end'){ S.ended = true; track(m.cash<0 ? 'bust' : 'finish'); saveRun(); }
  save(); render();
}
