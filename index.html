    <div class="opts" role="list">${order.map((i,pos)=>{ const op = sc.options[i]; let cls='opt'; if(done){ if(op.q==='best') cls+=' is-best'; else if(i===picked) cls+=' is-wrong'; if(i===picked) cls+=' picked'; } return `<button class="${cls}" data-act="scen" data-i="${i}" ${done?'disabled':''}><kbd>${pos+1}</kbd><span>${op.t}</span></button>`; }).join('')}</div>
    ${done ? `<div class="verdict ${o.q}"><h3>${sc.dilemma && o.q==='best' ? L('Обоснованный выбор','A defensible call') : QUAL[o.q].label}<span class="xp">+${QUAL[o.q].xp} XP</span></h3><p>${o.fb}</p>${altBest(sc, o)}<p><b>${L('Принцип:','Principle:')}</b> ${sc.lesson}</p>${fxChips(o.fx)}${o.later?`<div class="later">${L('Часть эффекта проявится','Part of the effect will show up')} ${later}</div>`:''}</div>
      <div class="actions"><button class="btn primary" data-act="toChal" data-primary>${L('К задаче месяца →','To the monthly challenge →')}</button></div>` : `<p class="hint" style="margin-top:14px">${L('Можно выбрать клавишами','You can also press')} 1–${sc.options.length}</p>`}
  </div>`;
}
function renderChallenge(){
  const c = Object.assign({}, S.cur.chal, S.cur.chal.txt[LANG]), done = S.cur.chalOk!==null;
  let body = '';
  if(c.type==='choice'){
    body = `<div class="opts">${c.options.map((t,i)=>{ let cls='opt'; if(done){ if(i===c.answer) cls+=' is-best'; else if(i===S.cur.chalAns) cls+=' is-wrong'; } return `<button class="${cls}" data-act="chal" data-i="${i}" ${done?'disabled':''}><kbd>${i+1}</kbd><span>${t}</span></button>`; }).join('')}</div>`;
  } else {
    body = `<div class="num-row"><input id="ans-num" type="text" inputmode="decimal" autocomplete="off" placeholder="${L('Ответ','Answer')}, ${c.unit}" ${done?`disabled value="${S.cur.chalAns}"`:''}><button class="btn primary" data-act="chalNum" ${done?'disabled':''}>${L('Проверить','Check')}</button></div><p class="hint" style="margin-top:8px">${L('Допустимая погрешность','Allowed margin of error')} — ${Math.round(c.tol*100)}%${c.abs?` ${L('или','or')} ±${dec(c.abs,1)} ${c.unit}`:''}</p>`;
  }
  const b = CHAL_BONUS[c.d];
  $('#stage').innerHTML = `<div class="fade">
    <div class="eyebrow"><span>${L('Месяц','Month')} ${S.month} · ${L('Задача','Challenge')}</span>${domainChip(c.d)}</div>
    <h2 class="h-display">${c.title}</h2>
    <div style="margin-bottom:16px">${c.prompt}</div>
    <p><b>${c.question}</b></p>
    ${body}
    ${done ? `<div class="verdict ${S.cur.chalOk?'best':'bad'}"><h3>${S.cur.chalOk?L('Верно','Correct'):L('Мимо','Miss')}<span class="xp">+${S.cur.chalOk?40:10} XP</span></h3>${c.type==='number'?`<p>${L('Правильный ответ:','Correct answer:')} <b class="num">${c.unit==='$'?'$'+int(c.answer):dec(c.answer,1)+' '+c.unit}</b>${S.cur.chalOk?'':` · ${L('твой:','yours:')} <span class="num">${S.cur.chalAns}</span>`}</p>`:''}<p>${c.explain}</p>${S.cur.chalOk?`<p class="hint">${L('Бонус:','Bonus:')} ${b.why}.</p>${fxChips(b.fx)}`:''}</div>
      <div class="actions"><button class="btn primary" data-act="close" data-primary>${S.month>=MONTHS?L('Закрыть последний месяц →','Close the final month →'):L('Закрыть месяц →','Close the month →')}</button></div>` : ''}
  </div>`;
}
function deltaTile(label, now, prev, fmt, inv){
  const diff = now - prev, rel = prev ? diff/Math.abs(prev) : 0;
  const cls = Math.abs(rel)<0.005 ? 'flat' : ((inv ? diff<0 : diff>0) ? 'up' : 'down');
  return `<div class="delta"><small>${label}</small><b>${fmt(now)}</b><em class="${cls}">${diff>=0?'▲':'▼'} ${fmt(Math.abs(diff))}</em></div>`;
}
function renderSummary(){
  const s = S.summary, m = S.m, d = derive(m);
  $('#stage').innerHTML = `<div class="fade">
    <div class="eyebrow"><span>${L(`Итоги месяца ${S.month}`,`Month ${S.month} in review`)}</span></div>
    <h2 class="h-display">${d.mrr>s.prev.mrr?L('Выручка растёт','Revenue is growing'):L('Выручка просела','Revenue dipped')}${m.cash<200000?L(' · кэш заканчивается',' · cash is running low'):''}</h2>
    <div class="deltas">
      ${deltaTile('MRR', d.mrr, s.prev.mrr, money)}
      ${deltaTile(L('Активные пользователи','Active users'), m.users, s.prev.users, int)}
      ${deltaTile(L('Кэш','Cash'), m.cash, s.prev.cash, money)}
      ${deltaTile('LTV / CAC', d.ratio, s.prev.ratio, v=>dec(v,2))}
    </div>
    <p class="lead">${L(`Пришло ${int(s.newUsers)} новых пользователей (${int(s.paid)} из рекламы, ${int(s.organic)} органически), ушло ${int(s.churned)}. Валовая выручка ${money(d.gross)} против расходов ${money(d.burn)}.`,
      `${int(s.newUsers)} new users came in (${int(s.paid)} from ads, ${int(s.organic)} organic) and ${int(s.churned)} churned. Revenue after store fees: ${money(d.gross)} vs. costs of ${money(d.burn)}.`)}</p>
    ${s.review ? `<div class="notes"><div class="note ${s.review.lvl==='full'?'':'warn'}"><b>${L('Ревью инвестора.','Investor review.')}</b> ${reviewText(s.review)}</div></div>` : ''}
    ${(s.fired.length||s.debtWarn) ? `<div class="notes">${s.fired.map(r=>`<div class="note">${laterNote(r)}</div>`).join('')}${s.debtWarn?`<div class="note warn">${L('Техдолг выше 50 — релизы ломаются, retention снижается. Отдай часть команды на техдолг ниже.','Tech debt is above 50 — releases break and retention drops. Put part of the team on it below.')}</div>`:''}</div>`:''}
    <section class="move" aria-label="${L('Твой ход','Your move')}">
      <div class="move-head"><span class="chip move-chip">${L('Твой ход','Your move')}</span><b>${L(`Решения на месяц ${S.month+1}`,`Decisions for month ${S.month+1}`)}</b></div>
      <p class="hint">${L('Два рычага, которые есть только здесь: сколько тратить на рекламу и сколько сил команды отдать техдолгу.','Two levers you only get here: how much to spend on ads and how much of the team to put on tech debt.')}</p>
      <div class="budget">
        <div class="budget-top"><span><b style="font-family:var(--body);font-size:15px">${L('Маркетинговый бюджет','Marketing budget')}</b></span><b id="bval">${money(m.budget)}</b></div>
        <input type="range" id="budget" min="0" max="60000" step="5000" value="${m.budget}" aria-label="${L('Маркетинговый бюджет','Marketing budget')}">
        <div class="budget-calc" id="bcalc"></div>
        <p class="hint" style="margin:10px 0 0">${L('Выше $20k каналы насыщаются и CAC растёт. Масштабируй, только если LTV / CAC здоровый — иначе сжигаешь кэш быстрее.','Above $20k, channels saturate and CAC climbs. Scale only if LTV / CAC is healthy — otherwise you just burn cash faster.')}</p>
      </div>
      <div class="budget">
        <div class="budget-top"><span><b style="font-family:var(--body);font-size:15px">${L('Команда на техдолг','Team on tech debt')}</b></span><b id="dval">${Math.round((m.debtShare||0)*100)}%</b></div>
        <input type="range" id="debtShare" min="0" max="${DEBT_WORK.max*100}" step="10" value="${Math.round((m.debtShare||0)*100)}" aria-label="${L('Доля команды на техдолг','Share of the team on tech debt')}">
        <div class="budget-calc" id="dcalc"></div>
        <p class="hint" style="margin:10px 0 0">${L(`Сам по себе техдолг растёт на ${DEBT_WORK.drift} в месяц, а выше 50 режет retention. Каждые 10% команды снимают по ${dec(DEBT_WORK.paydown/10,1)} пункта, но фич выходит меньше — и органики тоже.`,`Tech debt grows by ${DEBT_WORK.drift} a month on its own, and above 50 it cuts retention. Every 10% of the team removes ${dec(DEBT_WORK.paydown/10,1)} points, but fewer features ship — and organic growth slows too.`)}</p>
      </div>
    </section>
    <div class="actions"><button class="btn primary" data-act="next" data-primary>${L('Начать месяц','Start month')} ${S.month+1} →</button></div>
  </div>`;
  updateBudget();
}
function updateBudget(){
  const el = $('#budget'); if(!el) return;
  S.m.budget = +el.value; const d = derive(S.m);
  $('#bval').textContent = money(S.m.budget);
  $('#bcalc').innerHTML = `<div><span>${L('CAC установки','CAC per install')}</span><b>$${dec(d.effCac,2)}</b></div><div><span>${L('Установок из рекламы','Installs from ads')}</span><b>≈ ${int(S.m.budget/d.effCac)}</b></div><div><span>${L('CAC платящего','CAC per payer')}</span><b>$${dec(d.cacPayer,0)}</b></div><div><span>LTV / CAC</span><b>${dec(d.ratio,1)}</b></div><div><span>${L('Расходы в месяц','Monthly costs')}</span><b>${money(d.burn)}</b></div>`;
  const ds = $('#debtShare');
  if(ds){
    const m = S.m; m.debtShare = +ds.value/100;
    const next = clamp(m.debt + DEBT_WORK.drift - m.debtShare*DEBT_WORK.paydown, 0, 100);
    $('#dval').textContent = Math.round(m.debtShare*100)+'%';
    $('#dcalc').innerHTML = `<div><span>${L('Техдолг через месяц','Tech debt next month')}</span><b>${Math.round(m.debt)} → ${Math.round(next)}</b></div><div><span>${L('Органика','Organic installs')}</span><b>${m.debtShare ? '−'+Math.round(m.debtShare*DEBT_WORK.organic*100)+'%' : L('без потерь','no loss')}</b></div><div><span>${L('Штраф к retention','Retention penalty')}</span><b>${next>50 ? '−'+dec((next-50)*DEBT_WORK.penalty*100,1)+L(' п.п.',' pp') : L('нет','none')}</b></div>`;
  }
  save(); renderDash();
}
function renderEnd(){
  const f = finalScore(), d = derive(S.m), bust = S.m.cash<0;
  const first = S.history[0];
  const weak = S.log.filter(l=>(l.kind==='scen' && l.q!=='best') || (l.kind==='chal' && !l.ok));
  const strong = S.log.filter(l=>(l.kind==='scen' && l.q==='best') || (l.kind==='chal' && l.ok));
  $('#stage').innerHTML = `<div class="fade">
    <div class="eyebrow"><span>${bust?L(`Игра окончена на месяце ${S.month}`,`Game over in month ${S.month}`):L('Итоги 10 месяцев','10 months in review')}</span></div>
    <h2 class="h-display">${bust?L('Кэш закончился. Инвестор не дал следующий транш.','You ran out of cash. The investor passed on the next tranche.'):(f.growth>=2?L('Ты вырастил «Ритм»','You grew Rhythm'):L('Квартальное ревью с инвестором','Quarterly review with the investor'))}</h2>
    <div class="grade"><span class="grade-badge">${f.grade}</span><span class="score">${Math.round(f.total*100)} / 100</span></div>
    <p class="lead">${L(`Качество решений: ${Math.round(f.s1*100)}% · задачи: ${Math.round(f.s2*100)}% · бизнес-результат: ${Math.round(f.biz*100)}%. Грейд на 60% зависит от решений и задач, на 40% — от метрик продукта.`,
      `Decision quality: ${Math.round(f.s1*100)}% · challenges: ${Math.round(f.s2*100)}% · business results: ${Math.round(f.biz*100)}%. Your grade is 60% decisions and challenges, 40% product metrics.`)}</p>
    <div class="share">
      <img id="share-img" alt="${L('Карточка результата','Result card')}">
      <div class="share-btns">
        <button class="btn primary" data-act="shareCard">${L('Поделиться карточкой','Share the card')}</button>
        <button class="btn" data-act="shareLi">${L('Опубликовать в LinkedIn','Post on LinkedIn')}</button>
        <button class="btn" data-act="copyRes">${L('Скопировать результат','Copy my result')}</button>
        <p class="hint" id="share-hint" aria-live="polite"></p>
      </div>
    </div>
    ${lbOn() ? `<div class="section-h">${L('Лидерборд','Leaderboard')}</div><div class="lb" id="lb-end"></div>` : ''}
    <div class="task-box"><table class="t"><thead><tr><th>${L('Метрика','Metric')}</th><th>${L('Старт','Start')}</th><th>${L('Финиш','Finish')}</th></tr></thead><tbody>
      <tr><td>MRR</td><td>${money(first.mrr)}</td><td>${money(d.mrr)}</td></tr>
      <tr><td>${L('Активные пользователи','Active users')}</td><td>${int(first.users)}</td><td>${int(S.m.users)}</td></tr>
      <tr><td>${L('Retention, мес.','Monthly retention')}</td><td>${pct(first.ret)}</td><td>${pct(d.effRet)}</td></tr>
      <tr><td>LTV / CAC</td><td>${dec(first.ratio,2)}</td><td>${dec(d.ratio,2)}</td></tr>
      <tr><td>${L('Кэш','Cash')}</td><td>${money(first.cash)}</td><td>${money(S.m.cash)}</td></tr>
    </tbody></table></div>
    <div class="section-h">${L('Достижения','Achievements')}</div>
    <div class="badges">${badges().map(b=>`<div class="badge ${b.on?'on':''}"><b>${b.n}</b>${b.t}</div>`).join('')}</div>
    <div class="section-h">${L('Что подтянуть','What to work on')} · ${weak.length}</div>
    ${weak.length ? `<div class="review">${weak.map(l=>{ if(l.kind==='scen'){ const sc = scenL(l.id); return `<div class="rev"><span class="dot ${l.q}"></span><b>${sc.title} · ${DOMAINS[l.d].name}</b><p>${sc.lesson} ${L('Сильнее было:','The stronger call:')} ${sc.options.filter(x=>x.q==='best').map(x=>L('«','“')+x.t+L('»','”')).join(L(' или ',' or '))}</p></div>`; } return `<div class="rev"><span class="dot bad"></span><b>${L('Задача:','Challenge:')} ${l.title[LANG]} · ${DOMAINS[l.d].name}</b><p>${l.explain[LANG]}</p></div>`; }).join('')}</div>` : `<p class="lead">${L('Ни одной ошибки. Серьёзно впечатляет.','Not a single mistake. Seriously impressive.')}</p>`}
    ${strong.length ? `<div class="section-h">${L('Что получилось','What went well')} · ${strong.length}</div><div class="review">${strong.filter(l=>l.kind==='scen').map(l=>{ const sc = scenL(l.id); return `<div class="rev"><span class="dot best"></span><b>${sc.title}</b><p>${sc.lesson}</p></div>`; }).join('')}</div>`:''}
    <div class="actions"><button class="btn primary" data-act="new" data-primary>${L('Сыграть ещё раз — новые кейсы','Play again — new cases')}</button></div>
  </div>`;
}
function render(){
  renderHud(); renderDash();
  closeTerm();
  if(!S){ renderIntro(); annotate($('#stage')); return; }
  ({scenario:renderScenario, scenFeedback:renderScenario, challenge:renderChallenge, chalFeedback:renderChallenge, summary:renderSummary, end:renderEnd})[S.phase]();
  annotate($('#stage'));
  if(S.phase==='end'){ paintCard(); renderLb(); }
}

/* ============ events ============ */
document.addEventListener('click', e=>{
  const t = e.target.closest('.term');
  if(t){ e.preventDefault(); e.stopPropagation(); openTerm(t); return; }
  if(!e.target.closest('#pop')) closeTerm();
  if(e.target.id==='sheet'){ closeSheet(); return; }
  if(e.target.id==='board'){ closeBoard(); return; }
  const b = e.target.closest('[data-act]'); if(!b || b.disabled) return;
  const a = b.dataset.act;
  if(a==='lang'){ setLang(b.dataset.lang); return; }
  if(a==='shareCard'){ shareCard(); return; }
  if(a==='lbSubmit'){ lbSubmit(); return; }
  if(a==='lbEdit'){ const bx = $('#lb-end'); if(bx){ bx.dataset.edit = '1'; renderLb(); } return; }
  if(a==='board'){ openBoard(); return; }
  if(a==='boardClose'){ closeBoard(); return; }
  if(a==='shareLi'){ shareLinkedIn(); return; }
  if(a==='copyRes'){ copyResult(); return; }
  if(a==='sheet'){ openSheet(); return; }
  if(a==='sheetClose'){ closeSheet(); return; }
  if(a==='popClose'){ closeTerm(); return; }
  if(a==='new'){ clearSave(); newGame(); window.scrollTo({top:0}); }
  else if(a==='continue'){ S = load(); render(); }
  else if(a==='scen') chooseScenario(+b.dataset.i);
  else if(a==='toChal'){ toChallenge(); window.scrollTo({top:0}); }
  else if(a==='chal') answerChallenge(+b.dataset.i);
  else if(a==='chalNum') answerChallenge($('#ans-num').value);
  else if(a==='close'){ closeMonth(); window.scrollTo({top:0}); }
  else if(a==='next'){ nextMonth(); window.scrollTo({top:0}); }
});
document.addEventListener('input', e=>{
  if(e.target.id==='budget' || e.target.id==='debtShare') updateBudget();
  else if(e.target.id==='gsearch') filterSheet(e.target.value);
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ const bd = document.getElementById('board'); if(bd && !bd.hidden){ closeBoard(); return; } const s = document.getElementById('sheet'); if(s && !s.hidden){ closeSheet(); return; } closeTerm(); return; }
  if(e.target.id==='lb-name' || e.target.id==='lb-li'){ if(e.key==='Enter'){ e.preventDefault(); lbSubmit(); } return; }
  if(e.target.id==='ans-num'){ if(e.key==='Enter'){ e.preventDefault(); answerChallenge(e.target.value); } return; }
  if(e.target.tagName==='INPUT') return;
  if(e.key==='?'){ openSheet(); return; }
  if((e.key==='Enter'||e.key===' ') && e.target.classList && e.target.classList.contains('term')){ e.preventDefault(); openTerm(e.target); return; }
  if(/^[1-5]$/.test(e.key)){ const btn = document.querySelectorAll('#stage .opt')[+e.key-1]; if(btn && !btn.disabled){ btn.click(); } }
  else if(e.key==='Enter'){ const p = document.querySelector('[data-primary]'); if(p && document.activeElement===document.body){ e.preventDefault(); p.click(); } }
});

/* ============ boot ============ */
function applyLang(){
  i18nConsts(); buildTerms();
  document.documentElement.lang = LANG;
  document.title = L('Ритм · PM-симулятор','Rhythm · PM simulator');
}
function setLang(lg){
  if(!LANGS.includes(lg) || lg===LANG) return;
  LANG = lg; applyLang();
  try{ localStorage.setItem(LANG_KEY, lg); }catch(e){}
  try{ const u = new URL(location.href); u.searchParams.set('lang', lg); history.replaceState(null, '', u); }catch(e){}
  const sheetOpen = (()=>{ const s = document.getElementById('sheet'); return s && !s.hidden; })();
  render();
  if(sheetOpen) openSheet();
}
applyLang();
function start(data){
  if(data && data.S) S = data.S;
  render();
}
try{ window.claude?.hot?.snapshot?.(()=>({S})); }catch(e){}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>

</body>
