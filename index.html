   {t:'First, 8–10 problem interviews plus usage data: do users share their progress today, with whom, and why?', fb:'You\'re testing the problem, not the solution. Instead of an expensive feed, you find a narrow, cheap feature that hits a real pain point.', note:'Interviews showed people don\'t need a feed — they need support from one close person. You built a lightweight “habit buddy” — retention went up.'},
   {t:'Fake door: a “Friends” button in the menu for a week. If over 5% of active users click, interest is proven — build it.', fb:'A fake door measures interest fast but doesn\'t explain the “why.” Great as a first step; paired with interviews it would be ideal.', note:'The fake door showed moderate interest — you shipped a stripped-down version.'},
   {t:'Pass for now: the roadmap is locked, and a feed would derail the onboarding work. Revisit it at next quarter’s planning.', fb:'Saying no without data damages your relationship with a stakeholder. Better to offer a fast, cheap way to test the idea.'}
 ], lesson:'Validate the problem before the solution: interviews, data, and fake doors are cheaper than two months of development.'},
 s2:{title:'200 reviews asking for dark mode', text:'Olivia sends over an export: more than 200 reviews in a month asking for dark mode, some of them one-star. “People are angry — let\'s just build it.”', options:[
   {t:'Ship dark mode this sprint: 200 reviews is a strong signal, and it’s only a couple of days of work.', fb:'Sometimes a request is literal, and building it is fine. But a request at this scale is your cue to find out which user job is behind it.'},
   {t:'Get on calls with 6 of the reviewers and find out when, where, and why they actually open the app.', fb:'Jobs To Be Done: behind “dark mode” was the job “quickly log the day in bed before sleep without fully waking up.” The solution ended up broader and more valuable than the request.', note:'Turns out people log their habits in bed before going to sleep. You built a night mode — dark theme, quiet reminders, one-tap check-off.'},
   {t:'Skip it: dark mode is cosmetic and won’t move retention. Reply in the store that it’s planned.', fb:'A recurring signal from support is valuable discovery input, even when users phrase it as a ready-made solution.'}
 ], lesson:'Users bring solutions; the PM\'s job is to dig down to the job (JTBD) they\'re trying to get done.'},
 s3:{title:'58% leave after day one', text:'Dan shows you the numbers: 58% of new users don\'t come back on day two. “There\'s a hole somewhere in onboarding, but we can\'t tell where.”', options:[
   {t:'Full redesign: the UI looks dated, our store screenshots lose to rivals, and first impressions decide D1.', fb:'A redesign without a diagnosis is a shot in the dark. First find exactly where and why the user journey breaks.', note:'The redesign shipped. D1 barely moved — the problem was never the visuals.'},
   {t:'Break down the onboarding funnel step by step and run 5 usability tests with brand-new users.', fb:'Quantitative data shows where the problem is; qualitative shows why. Funnel analysis plus usability testing is the backbone of discovery.', note:'Found it: the “pick 5 habits” step scares people off. You cut it to one — D1 rose noticeably.'},
   {t:'Daily reminder pushes for new users: push is a habit tracker’s main re-engagement channel.', fb:'A short-term bump at the cost of long-term retention and your app rating. You\'re treating the symptom, not the cause.', note:'Push spam: users turn off notifications and delete the app.'}
 ], lesson:'Data tells you “where,” talking to users tells you “why.” Don\'t pick a solution before you have a diagnosis.'},
 s4:{title:'Rhythm for enterprise?', text:'Lena is fired up: “A friend of mine who works in HR at a bank wants Rhythm for their employees. Let\'s build a corporate version with an admin panel and reports!”', options:[
   {t:'Build the B2B version: admin panel, reports, SSO. Enterprise deals pay far more, and the bank is a ready client.', fb:'One HR friend is not a market. A new segment needs its own discovery: whose pain is it, who pays, how long is the sales cycle?'},
   {t:'10 interviews with HR directors, plus one pilot you run entirely by hand (a concierge MVP).', fb:'Concierge MVP: you sell and deliver by hand before writing any code. If people pay for the manual service, it\'s worth automating.'},
   {t:'Put it off until next year: B2C isn’t profitable yet, and a small team can’t split across two segments.', fb:'Focus is a legitimate choice. But without a quick, cheap test, you\'ll never know the cost of the missed opportunity.'}
 ], lesson:'Test a new segment manually (concierge / Wizard of Oz), not by building it.'},
 s5:{title:'Three “urgent” requests, one sprint', text:'Andrew wants gamification, Lena wants a referral program, and Olivia wants cross-device sync fixed — 12% of paying users complain about it. You only have capacity for one.', options:[
   {t:'Do all three in parallel, each cut down to an MVP, so no stakeholder walks away empty-handed.', fb:'Working on everything at once means nothing gets finished. Capacity is finite, and context switching is expensive.'},
   {t:'Score all three requests with RICE and share the math openly with every stakeholder; sync goes first.', fb:'Transparent prioritization defuses the conflict: people argue with the formula, not with you. A bug hitting 12% of paying users moves retention more than new features do.'},
   {t:'Gamification: Andrew sees the big picture, and streaks and badges are a proven retention lever.', fb:'HiPPO (highest paid person’s opinion) is not a prioritization method. The paying users\' problem is still unsolved.'}
 ], lesson:'Prioritize with a transparent framework (RICE/ICE) and show your math to stakeholders.'},
 s6:{title:'Tech debt is choking releases', text:'Tim: “Every release breaks something. Give me a full sprint for refactoring.” The big marketing campaign is a month away.', options:[
   {t:'Say no until after the campaign: a wave of new users lands in a month, so features come first.', fb:'Tech debt works like a loan: every sprint you don\'t service it makes the next ones more expensive and riskier.'},
   {t:'Agree with Tim on a standing 20% of every sprint’s capacity for tech debt, starting with this one.', fb:'Regular hygiene beats rare heroic sprints: the business gets predictability, and risk goes down continuously.'},
   {t:'Give Tim a full refactoring sprint now: better to clean up the code before the campaign than firefight under load.', fb:'Cuts the debt a lot, but freezing features right before the campaign costs you trust with the business.'}
 ], lesson:'Reserve a fixed share of capacity for tech debt instead of letting it pile up into a crisis.'},
 s7:{title:'Friday, 7:40 PM. Payments are broken', text:'Since yesterday\'s release, subscription payments have been failing for 6% of users. The team is already heading home.', options:[
   {t:'Roll back the release, message the affected users, and hold a blameless postmortem on Monday.', fb:'Rolling back is the fastest way to stop the bleeding. Honest communication preserves trust; a blameless postmortem prevents a repeat.'},
   {t:'Send the team home and dig in on Monday with fresh eyes: 94% of payments go through, and late-night fixes break more.', fb:'Every hour of broken payments means lost revenue and paying users churning.'},
   {t:'Keep the team late and hotfix it tonight: the bug looks contained, so that’s faster than a full rollback.', fb:'It might work, but fixing forward under pressure is risky. A rollback is usually safer and faster.'}
 ], lesson:'In an incident, stop the damage first (roll back), then communicate, then run the postmortem.'},
 s8:{title:'A competitor launched an AI coach', text:'Industry chats are buzzing: a competitor now has an AI coach that picks habits for you. Andrew is nervous: “We\'re falling behind!”', options:[
   {t:'Copy it fast and pause everything else: with LLM APIs, an AI coach is a two-sprint job.', fb:'Reactive copying pulls you off your own strategy. First figure out whether this threatens the job users choose you for.', note:'A half-baked AI coach shipped. There\'s an effect, but it\'s small.'},
   {t:'Check the data for churn to the competitor and interview 5 users who left; decide in 2 weeks.', fb:'Competitive analysis through the lens of your own users: what they “hire” you for and why they leave.', note:'Turns out users aren\'t leaving because of AI — they\'re leaving because setup is complicated. You built personalized tips instead — cheaper and more targeted.'},
   {t:'Don’t react: we have our own strategy, and AI features like this often turn out to be hype.', fb:'Staying calm is good, but ignoring it without data leaves the risk in place and stakeholders anxious.'}
 ], lesson:'Answer a competitor\'s move with data on your own users, not by copying.'},
 s9:{title:'A 12-month roadmap “with dates”', text:'Ahead of the next tranche, North Ventures asks for a 12-month roadmap with specific release dates for every feature.', options:[
   {t:'A year of features with dates, each padded by 30%: the fund gets exactly what it asked for.', fb:'Feature-by-date commitments a year out are promises that almost always slip: uncertainty grows with the horizon.', note:'Two dates on the roadmap slipped. The investor is disappointed.'},
   {t:'Now / Next / Later with metric-based goals for each horizon; dates only for the next quarter.', fb:'An outcome-based roadmap shows which results you\'re driving and leaves room to choose the solutions.'},
   {t:'Explain that year-out dates are fiction at a startup: we iterate fast and share plans sprint by sprint.', fb:'Agile doesn\'t mean no planning. Stakeholders need a predictable direction.'}
 ], lesson:'A roadmap is about outcomes, not a list of features with dates.'},
 s10:{title:'What\'s our North Star?', text:'Andrew wants one key metric the whole team will live by. The options on the whiteboard:', options:[
   {t:'Installs: everyone understands them, from investors to marketing, and they update daily.', fb:'Installs are a vanity metric: they grow with marketing and say nothing about the value of the product.'},
   {t:'MAU — monthly active users: the industry standard investors benchmark us on.', fb:'Better than installs, but it doesn\'t show whether people get value: you can open the app and do nothing.'},
   {t:'Number of users who logged habits on at least 3 different days in a given week.', fb:'A good North Star reflects user value and predicts revenue. Regular check-ins are the core value of a habit tracker.'},
   {t:'Revenue: the business runs on money, and there’s no fooling yourself with it.', fb:'Revenue is an outcome, not a driver: it lags and gives the team little guidance on what to do tomorrow.'}
 ], lesson:'A North Star reflects user value and is a leading indicator of revenue.'},
 s11:{title:'“CAC just got cut in half!”', text:'Lena is beaming: she moved budget into incentivized traffic (installs in exchange for rewards inside other apps), and CAC per install dropped by half.', options:[
   {t:'Double the budget there: at half the cost per install, the same money brings in twice the users.', fb:'A cheap install ≠ a cheap customer. Incentivized traffic barely retains and almost never pays — CAC per payer went up.'},
   {t:'Compare cohort retention and paid conversion across channels before moving any budget.', fb:'Unit economics are calculated for the channel end to end: CAC ÷ paid conversion, against the LTV of that specific cohort.', note:'You switched off the “junk” channel and reallocated the budget — CAC per payer went down.'},
   {t:'Set a rule: marketing clears channel changes with product in advance, so there are no surprises.', fb:'Control instead of analysis kills experimentation. You need a shared metric (CAC per payer), not bans.'}
 ], lesson:'Look at CAC per payer and retention by channel, not at the cost of an install.'},
 s12:{title:'Raise the price from $9 to $13?', text:'Andrew thinks Rhythm is worth more: “Let\'s raise the subscription to $13 — revenue goes up 44%.”', options:[
   {t:'Raise it for everyone at once, current subscribers included: full revenue impact, and one simple price.', fb:'A sharp price hike for existing users risks churn and a wave of backlash. Price elasticity is unknown.'},
   {t:'Run an A/B test of the new price on new users; keep current subscribers on the old price.', fb:'Price is your most powerful revenue lever. Test elasticity on new users and protect loyal ones (grandfathering).', note:'The test showed that at $12, revenue per user is higher and conversion barely dipped. You rolled it out to new users.'},
   {t:'The opposite: cut it to $6 — more payers, and a bigger base outweighs the lower price.', fb:'A discount lifts conversion, but not necessarily revenue. Do the math — ARPU = paid conversion × ARPPU: here it went down.'}
 ], lesson:'Test pricing with an experiment; look at ARPU, not just conversion.'},
 s13:{title:'A discounted annual plan', text:'Dan proposes an annual plan at 35% off the monthly price and asks for your take.', options:[
   {t:'Launch it and make annual the default on the paywall, with the savings shown right next to the price.', fb:'An annual plan brings money in up front (cash!) and reduces churn. The trade-off: a slightly lower average monthly payment.'},
   {t:'Don’t launch: 35% off means losing a third of revenue from people who’d have paid monthly anyway.', fb:'The discount does lower the average payment, but you miss out on prepayment and the lower churn of annual subscribers.'},
   {t:'Offer a $30 lifetime plan instead: lots of cash up front, and people would rather pay once.', fb:'A lifetime plan gives you a one-time cash injection but eats your recurring revenue: LTV is capped forever.'}
 ], lesson:'Annual plans improve cash flow and retention; lifetime plans eat into LTV.'},
 s14:{title:'4 days in, p = 0.03. Ship it?', text:'The new paywall test is planned for 14 days. On day four, Dan messages you: “+11% conversion, p = 0.03! Should we roll it out?”', options:[
   {t:'Ship it: p = 0.03 is below the 0.05 threshold, and meanwhile half our traffic sees the worse paywall.', fb:'Peeking: if you check the p-value every day and stop at the first significant result, your false positive rate multiplies.', note:'The effect “deflated” — it was noise caught by peeking.'},
   {t:'Wait the full pre-calculated 14 days — two complete weekly cycles and the planned sample size.', fb:'Duration and sample size are fixed in advance. Full weeks cancel out day-of-week effects.', note:'The test ran its course: the effect held up, but it was smaller — around +6%.'},
   {t:'Stop the test and keep the new paywall: it’s winning on both the numbers and user feedback.', fb:'Without a completed test, you don\'t know the effect size and could roll out something that makes things worse.'}
 ], lesson:'Don\'t peek: calculate the sample size up front and wait until you hit it.'},
 s15:{title:'Conversion +15%, but refunds ×2', text:'The new paywall lifted paid conversion by 15%. A week later, refund requests have doubled, and reviews mention a “hidden subscription.”', options:[
   {t:'Ship it: a 15% lift more than covers the refunds, and we’ll tweak the copy next release.', fb:'Guardrail metrics (refunds, complaints, churn) protect you from “wins” that hurt the business.', note:'A wave of cancellations and refunds; the app store rating dropped.'},
   {t:'Calculate 30-day revenue per user net of refunds, strip out the dark patterns, then relaunch.', fb:'You look at the end value, not an intermediate metric, and fix the root cause — the misleading design.'},
   {t:'Roll it back and drop the paywall work: our reputation is worth more than 15% conversion.', fb:'Safe, but you\'re throwing away whatever worked in the variant. Better to figure out what actually drove the lift.'}
 ], lesson:'Every test needs guardrail metrics.'},
 s16:{title:'20 push variants and one “winner”', text:'Lena launched 20 variants of reminder copy at once. One showed p = 0.04. “We have a winner!”', options:[
   {t:'Roll the winner out: p = 0.04 is significant, and a bad push text is easy to undo.', fb:'With 20 comparisons at α = 0.05, you\'d expect about one “significant” result by pure chance. That\'s the multiple comparisons trap.'},
   {t:'Re-run the winner in a separate head-to-head test against the control group.', fb:'A replication test is the most reliable way to separate signal from noise.', note:'The re-test: the “winner” didn\'t hold up, but you found another variant that works.'},
   {t:'Take the top 3 and keep testing with a multiple comparisons correction.', fb:'Right idea (Bonferroni / FDR), but a correction requires a bigger sample — the test will drag on.', note:'With the Bonferroni correction, no variant cleared the threshold — but you narrowed the search.'}
 ], lesson:'More comparisons → more false discoveries. Correct for it or re-test.'},
 s17:{title:'“Why do we even need these tests?”', text:'Andrew is irritated: “Tests slow us down. I already know what users need. Let\'s just ship.”', options:[
   {t:'Agree and ship straight away, watching the dashboards: at our traffic levels, learning fast beats statistical precision.', fb:'Without experiments, you can\'t tell the effect of your changes apart from seasonality and noise.', note:'One of the “obvious” changes quietly dragged down conversion — nobody noticed for a month.'},
   {t:'Show 3 past calls where intuition was wrong, and agree to test only what’s expensive to roll back or touches revenue.', fb:'Agreeing on what gets tested resolves the tension between speed and quality.'},
   {t:'Test every single change, down to button colors: make one exception and the whole experimentation culture falls apart.', fb:'Testing small tweaks with tiny effects is expensive: there isn\'t enough traffic, and the team slows down.'}
 ], lesson:'Test what\'s expensive, risky, or non-obvious; ship the small stuff and monitor it.'},
 s18:{title:'NPS crashed from 41 to 29', text:'Olivia is worried: NPS dropped from 41 to 29 in a month, and the comments are all over the place — from pricing to bugs. Andrew is already asking what happened and whose fault it is.', options:[
   {t:'Slice NPS by platform, app version, and cohort, read the detractors’ comments, and call 8 of them.', fb:'An aggregate hides where the drop comes from. Segments show who and after what; talking to detractors shows why. A diagnosis takes days, not a quarter.', note:'The drop sat in one cohort: after update 3.4, Android was resetting reminder times. You fixed it and apologized — NPS and retention recovered.'},
   {t:'Take the top 3 complaints by number of mentions and put them straight into the next sprint.', fb:'Mention counts show what’s loudest, not what changed. You’d be treating the evergreen complaints and could miss whatever caused this particular drop.'},
   {t:'It’s probably sampling noise — NPS jumps around. Wait a month and see whether the trend holds.', fb:'Noise is a hypothesis, and you can check it in a day: sample size and a segment breakdown. A month of waiting is a month for the problem to spread.', note:'It wasn’t noise: over the month the problem reached new cohorts, and retention dipped.'},
   {t:'Make NPS support’s key metric, with a target of 41 by quarter-end — someone has to own it.', fb:'NPS reflects the whole product, and support doesn’t control it. A target with no levers behind it leads to gaming the number — like surveying only happy users.'}
 ], lesson:'When an aggregate metric drops, segment first (who, where, after what), then talk to those people.'},
 s19:{title:'“Too expensive” — or is it?', text:'Dan brings the cancellation survey: 62% picked “too expensive.” But the data shows the same people stopped logging habits 2–3 weeks before they canceled. Andrew is already pitching a discount.', options:[
   {t:'Talk to 8 recent churners about when and why they stopped logging habits — not about the price.', fb:'The survey captures what people say on the way out; the data shows when they actually left. Interviews about that real moment surface the cause — “too expensive” often means “no longer worth it.”', note:'Turns out people broke their streak, got discouraged, and quit. You added a “streak freeze” and a gentle comeback after a missed day — churn went down.'},
   {t:'Offer users who cancel 50% off for three months: they told us themselves the problem is the price.', fb:'A save offer will keep some payers, but you’re treating price when people left the product before they left the subscription. The cause stays, and users soon learn to cancel just to get the discount.'},
   {t:'Leave it: “too expensive” is the polite default answer — people pick it at cancellation everywhere.', fb:'The observation is right — cancellation answers are unreliable. But concluding “do nothing” throws away a strong signal in the data: usage drops long before people cancel.', note:'Churn kept climbing, and nobody ever went looking for the cause.'},
   {t:'Rework the cancellation survey: add more answer options and a free-text “tell us more” field.', fb:'A better instrument helps, but it’s still self-reporting at the worst possible moment, and new answers take weeks to pile up. The behavior data has already told you where to look.', note:'The new survey produced more varied answers, but it still took another month to get to the real cause.'}
 ], lesson:'Behavior beats stated reasons: check survey answers against the data and dig into the moment people stopped getting value.'},
 s20:{title:'Just ask everyone what to build?', text:'Andrew wants to send all 45,000 users a survey — “Which features should we add to Rhythm?” — with a list of 15 ideas: “Let the users pick the roadmap themselves.”', options:[
   {t:'Send it as is: thousands of responses are real statistics, not the opinion of a couple of people.', fb:'Picking from a feature list is a question about solutions, not problems. The most engaged users answer, and they pick whatever sounds nice. You get a ranking of wishes, not causes.', note:'You built the survey’s winning feature — far fewer people use it than voted for it.'},
   {t:'Start with 8 interviews about how people keep habits, then a survey to size what you found.', fb:'Interviews uncover problems you didn’t know about; a survey measures how widespread they are. Andrew still gets his survey — just with the right questions.', note:'Interviews surfaced 4 recurring problems, and the survey showed the biggest one: people set an “every day” goal and burn out. You added a “starter pace” — retention went up.'},
   {t:'Keep the survey but ask about problems, not features: “What gets in the way of your habits?”', fb:'Better: it asks about problems, not solutions. But open-ended answers from thousands of people are shallow and hard to analyze — without interviews, you don’t know what to dig into.', note:'Thousands of answers boiled down to “no time” and “I forget.” You made reminders smarter — the effect was modest.'},
   {t:'Skip the survey: users don’t know what they want — “a faster horse,” as Ford supposedly said.', fb:'The horse quote is about not asking users for solutions, not about never asking them anything. People know their problems perfectly well, and a CEO’s initiative is better redirected than killed.'}
 ], lesson:'Surveys measure; interviews discover. Find the problems in conversations first, then size them with a survey.'},
 s21:{title:'Students or professionals?', text:'Dan clustered the user base. Students: 55% of users, happy to invite friends, but only 2% pay. Professionals 30+: 20% of users, 11% pay, but they arrive almost exclusively through paid ads. You only have room for deep discovery on one segment.', options:[
   {t:'Focus on students: interviews about classes and exams, and a bet on growth through friend invites.', fb:'You’re buying cheap organic growth and a big user base. You pay in monetization: revenue will lag, and you’ll have to figure out how to get students to pay later.', note:'Students brought their classmates along: organic growth picked up noticeably, while revenue barely moved.'},
   {t:'Focus on professionals 30+: interviews about work and health, and a bet on value people pay for.', fb:'You’re buying monetization: these people pay for value and stick around longer. You pay in growth: nearly every user comes from expensive ads, there’s no organic, and the base grows slowly.', note:'Professionals told you about their morning routine — you built a daily plan, and payers started sticking around longer.'},
   {t:'Run ads and referrals to both segments for two weeks, then pick whichever one shows the better numbers.', fb:'The segments’ strengths are already visible in the data — a test would only repeat them. You pay time and money to postpone a strategic choice the numbers won’t make for you.'},
   {t:'Build a single “busy 25–35-year-old” persona — a happy medium between the two segments.', fb:'An averaged persona describes someone who doesn’t exist. A product “for everyone” ends up for no one — and you haven’t avoided the segment choice, just hidden it.', note:'Features built for the “average user” didn’t land with students or professionals.'}
 ], lesson:'There’s no free option: choosing a segment means choosing what you pay with — growth or monetization. Name the price explicitly and choose deliberately.'},
 s22:{title:'Brazil out of nowhere', text:'Lena noticed that installs from Brazil grew fourfold in two months, even though Rhythm is only available in English and Russian. “Let’s localize into Portuguese — it’s a new market!”', options:[
   {t:'Localize everything while the wave lasts: UI, push notifications, store listing, and prices in reais.', fb:'You’re investing in a market without knowing why it showed up. If the spike is a one-off, the localization becomes an expensive monument to it.', note:'The localization shipped six weeks later — by then the flow from Brazil had almost dried up.'},
   {t:'First find out where the wave came from: dig into sources and cohorts, call 5 users in Brazil.', fb:'An anomaly in the data is a gift for discovery: someone found value in the product you don’t know about. First understand what job they “hired” Rhythm for, then decide what to scale.', note:'The cause: a Brazilian creator’s video about a 30-day challenge. You built a shareable challenge template — it spread well beyond Brazil.'},
   {t:'Machine-translate the UI in a week: it’s cheap, and we’ll see right away whether retention moves.', fb:'A cheap experiment is a good instinct, but it tests the hypothesis “language is the barrier,” which nobody actually stated. And a clunky translation can cost you ratings.'}
 ], lesson:'An unexpected spike calls for “why?” before “how do we scale it?”'},
 s23:{title:'Quarterly OKRs', text:'North Ventures wants quarterly OKRs ahead of the board meeting. Every lead has already sent in their goals — the draft has 6 objectives and 19 key results.', options:[
   {t:'Keep all 6 objectives: each team owns its area, and nobody feels their work got pushed aside.', fb:'OKRs that include everything are a to-do list, not a focus. The team spreads itself across 19 results and misses most of them.', note:'By quarter-end you’d hit 4 of 19 KRs — the board meeting got uncomfortable.'},
   {t:'One objective — “new users lock in a habit in their first 2 weeks” — with 3 measurable retention KRs.', fb:'One objective targets the business’s main constraint, and the KRs measure outcomes, not shipped features. The rest of the work doesn’t disappear — it just stops pretending to be a priority.', note:'The whole team aimed at one goal — retention in new cohorts rose noticeably.'},
   {t:'Turn roadmap features into KRs: “ship widgets,” “launch smart tips” — clear and easy to check.', fb:'That’s output, not outcome: you can ship everything on the list and move no metric at all. A KR describes a change, not a task.', note:'Every feature shipped and the KRs were “done” — but when the fund asked what changed in the numbers, you had no answer.'},
   {t:'Take the fund’s target — MRR up 30% this quarter — and break it down into KRs for each team.', fb:'Tying into the investor’s goals is a plus, but MRR is a lagging result, and individual teams have no lever on it. Better to pick the driver of MRR the team can actually move.'}
 ], lesson:'OKRs are about focus: few objectives, and KRs about outcomes, not shipped features.'},
 s24:{title:'Down one iOS developer', text:'Tim: “Our strongest iOS developer leaves in two weeks, and we won’t find a replacement for 2–3 months.” The quarter’s plan has widgets for Lena’s campaign and 20% for tech debt. It won’t all fit.', options:[
   {t:'Keep the 20% for tech debt and stability, push widgets to next quarter, and tell Lena right now.', fb:'You protect the health of the product and the team: releases stay stable, and the people left don’t burn out. You pay in growth — the campaign will be weaker, and Lena has to rework her plan.', note:'The campaign launched without widgets — the response was weaker, and installs cost more.'},
   {t:'Ship widgets for the campaign and freeze tech debt for a quarter, with a return date and risk log.', fb:'You’re buying growth: the campaign launches with a strong hook. You pay in tech debt — it grows, and you must bring back the 20% after the quarter, or the pause becomes the norm.', note:'Widgets shipped in time for the campaign: installs got cheaper and paid conversion ticked up. But releases started breaking more often.'},
   {t:'Cut nothing: the rest of the team will manage if everyone pushes a bit harder for one quarter.', fb:'You can’t make up a quarter of your capacity with enthusiasm. If you don’t choose what to cut, things cut themselves — quality and people.', note:'By mid-quarter another developer was talking about leaving, and release bugs became more frequent.'},
   {t:'Bring in an experienced contractor for three months to plug the gap and leave the quarter’s plan untouched.', fb:'Money buys hours, not context: a contractor needs a month to ramp up, and the team maintains their code afterward. The plan survives on paper; the choice is just postponed.'}
 ], lesson:'When capacity shrinks, there’s no free option: decide explicitly what you pay with — growth or product health — and spell out the cost to stakeholders.'},
 s25:{title:'Andrew’s pet project', text:'Andrew is back from a conference: “We need an Apple Watch app. I wear a watch myself, and so does everyone around me.” Tim estimates 6 weeks. This quarter’s roadmap is entirely about new-user retention.', options:[
   {t:'Add it to the quarter: the CEO rarely asks for anything personally, and wearables really are trending.', fb:'Personal enthusiasm and a trend aren’t data. Six weeks go somewhere other than the quarter’s main goal, and the team learns the roadmap can be overridden by rank.', note:'The watch app shipped: 3% of users use it, and new-user retention didn’t budge.'},
   {t:'Run the idea through the roadmap criteria: how many users own a watch, and does it move the quarter’s goal?', fb:'One yardstick for everyone: the CEO’s idea isn’t rejected, it competes on equal terms. Data takes the personal out of the conversation, and a cheap slice of the idea often fits right now.', note:'Only 9% of users had a watch. Andrew suggested postponing it himself, and you shipped the cheap part — checking off a habit right from a notification — in 3 days.'},
   {t:'Give Andrew one developer “for an experiment” so the main plan doesn’t take a hit.', fb:'A compromise that looks free: a side project eats capacity and attention, and without success criteria it will only grow.'},
   {t:'Politely say no: the roadmap is agreed, and changing it mid-quarter sends the team a bad signal.', fb:'A roadmap protects focus, but a flat “no” to the CEO without analysis turns a product discussion into a power struggle — and you’ll lose the next one.'}
 ], lesson:'The CEO’s ideas go through the same criteria as everyone else’s: not “yes,” not “no,” but “let’s run the numbers.”'},
 s26:{title:'A deal with a gym chain', text:'Lena brings a deal: the Pulse gym chain will buy 3,000 annual subscriptions for its members — $45,000 up front. The condition: integrate their login and a branded screen within 6 weeks. That’s half the team’s capacity for the quarter.', options:[
   {t:'Take it: build the integration as a separate module in a strict timebox and push the roadmap back.', fb:'You’re buying cash and early revenue — for an unprofitable startup, that’s months of runway. You pay in focus and tech debt: the custom code stays with you, and the retention roadmap slips.', note:'The money came in, but work on new-user retention slipped by two months.'},
   {t:'Counter-offer: standard promo codes now, the integration only if a pilot shows real activation.', fb:'You keep your focus and a clean codebase, and build the integration only once a pilot proves its value. You pay in cash: the partner buys less — and could have walked away entirely.', note:'Pulse took 800 subscriptions via promo codes instead of 3,000, and the team finished the retention work on schedule.'},
   {t:'Politely decline: custom development for a single client is the road to becoming an agency.', fb:'The principle is sound, but you didn’t negotiate: between “everything your way” and “no” there were options that kept both the money and the focus.'},
   {t:'Take it, and throw in white label and custom reports — let the first big client be absolutely thrilled.', fb:'Scope creep for a single client: you’re selling them a separate product, and every promise turns into support forever.', note:'Pulse buried the team in change requests, and the custom code broke with every release.'}
 ], lesson:'No deal is free: a client’s money is paid for with your team’s focus. Compare what you get with what you pay, and choose explicitly.'},
 s27:{title:'Paid conversion +1.4 pp overnight', text:'After release 3.2, paid conversion on the dashboard jumped from 5.0% to 6.4%. Andrew has already bragged about it to North Ventures. Dan can’t explain the lift: the release only had a new settings screen and an updated in-app purchase SDK.', options:[
   {t:'Work out which changes in 3.2 drove the lift and double down on them in the next sprint.', fb:'Amplifying an effect you don’t understand is building on sand. An unexplained jump gets checked for a data error first; only then do you look for a product cause.', note:'You spent a month amplifying an effect that didn’t exist: after the SDK update, restored purchases were counted as new payments. North Ventures asked which other numbers they shouldn’t trust.'},
   {t:'Reconcile purchase events with App Store and Google Play revenue for the same days.', fb:'Store revenue hadn’t moved: after the SDK update, restored purchases were being logged as new payments. An unexplained spike is a data suspect first, and the source of truth for money is billing.'},
   {t:'Wait a week: if the lift holds steady, it’s real — and then we can celebrate.', fb:'Caution is right, but time proves nothing: a tracking bug is just as “stable” as a real lift. Check the data source instead of waiting.', note:'A week later the lift was still there — and so was the bug: after the SDK update, restored purchases were logged as new payments. You had to send North Ventures a correction.'}
 ], lesson:'Before celebrating a metric spike, reconcile it with an independent source of truth — revenue, billing, raw logs.'},
 s28:{title:'“CAC is $2.1 — pour it on!”', text:'North Ventures sees a blended CAC of $2.1 in the report and suggests tripling the ad budget from $20k to $60k a month. Dan points out that blended includes free organic installs: a paid install costs $2.5, and payer LTV (~$63) is only slightly above CAC per payer (~$50).', options:[
   {t:'Triple the budget as the fund asks: blended CAC is low and the investor wants growth.', fb:'Blended CAC is diluted by free organic installs, and when you triple the budget each extra install gets pricier: bids go up, the audience burns out. At LTV/CAC ≈ 1.3, that just burns cash faster.', note:'Installs went up, but each additional one cost more: CAC per payer climbed to about $100 against an LTV of $63. You burned cash faster than MRR grew.'},
   {t:'Say no and raise LTV first: with LTV/CAC around 1.3, it’s too early to scale.', fb:'The math is right: at LTV/CAC ≈ 1.3, scaling is dangerous. But a flat no without data strains the investor relationship, and a small controlled step would have shown where the ceiling is.'},
   {t:'Raise the budget by 25%, measure marginal CAC per payer, and scale up in steps.', fb:'Blended CAC hides paid traffic behind free organic installs, and an average hides how much each additional install costs. Scale in steps and compare marginal CAC per payer with LTV.', note:'The +25% step showed that the extra installs were so expensive that marginal CAC per payer exceeded LTV. You shelved scaling and switched off the worst ad sets — average CAC went down.'}
 ], lesson:'Make budget decisions on marginal CAC per payer in paid channels, not on the blended average.'},
 s29:{title:'A discount for users who cancel?', text:'About 220 payers cancel every month. Olivia suggests offering 50% off for three months right at the moment of cancellation: “Competitors say it saves up to a quarter of cancellations.” Tim pushes back: “People will figure it out and start cancelling just to get the discount.”', options:[
   {t:'50% off for 3 months — only for users still logging habits, and once per person.', fb:'You save some payers right away, and only those still getting value — for them, price really may be the barrier. The cost is your price point: some would have stayed anyway, ARPPU drops, and sooner or later word about the discount gets out.', note:'The cancellation discount showed up in a Reddit thread — some payers started “cancelling for the discount.” ARPPU slipped a bit.'},
   {t:'No discounts: a month after they cancel, email them a progress recap and an invite back.', fb:'Win-back emails work, but weakly: a month after cancelling, the habit is already broken. The moment of cancellation is the cheapest point to retain someone, and you’re skipping it.'},
   {t:'Instead of a discount, offer a 1–2 month pause to everyone who hits “Cancel.”', fb:'A pause protects your price and doesn’t teach people to cancel for a deal, while giving those leaving “for a while” a reason to come back. The cost is dev time and fewer saves now: a pause won’t keep people leaving over price.', note:'You shipped the pause: about a third of those who took it came back to paying. The price held, but you saved fewer people than a discount would have.'},
   {t:'50% off for everyone who hits “Cancel”: keeping a payer is cheaper than acquiring one.', fb:'A discount for anyone reaching for the button quickly becomes a life hack: cancelling turns into a way to get a deal, and you end up subsidizing people who would have stayed anyway.'}
 ], lesson:'Retention through price is never free: a discount costs you ARPPU and price discipline, a pause costs time and reach. Choose deliberately how you pay.'},
 s30:{title:'Kill the free tier?', text:'Rhythm is freemium: basic trackers are free, 5% pay, and one in seven installs is organic — mostly free users inviting friends. Andrew read a competitor case study: a hard paywall with a 7-day trial tripled their paid conversion. “We’re tight on cash until the next round — let’s do the same.”', options:[
   {t:'Change nothing: freemium is our organic engine, and a paywall would just choke it.', fb:'You keep organic growth, but the money problem hasn’t gone anywhere. Refusing to change anything on a short runway is a decision too — and an expensive one.'},
   {t:'Keep freemium, but cap the free tier at three habits — everything beyond is Premium.', fb:'You keep the funnel and organic growth, and the people who start paying are the ones already hooked. The cost is speed: revenue grows more slowly, and you’ll reach the next round with a thinner cash cushion.', note:'You tuned the cap using data: the paywall triggers most often at the fourth habit. Paid conversion rose a bit more, and organic growth held.'},
   {t:'Paywall for everyone at once, current free users included — that maximizes the effect.', fb:'Taking away what current users have been getting for free guarantees a wave of backlash and churn. The effect is “maximal” — in revenue and in losses alike.'},
   {t:'Hard paywall with a 7-day trial — for new users only; leave current free users alone.', fb:'You get money fast: the trial filters out people who aren’t ready to pay, and paid conversion jumps. The cost is organic growth and your base: the free users who used to invite friends stop showing up.', note:'Payers went up, but friend invites dropped noticeably: free users had been your main source of organic growth.'}
 ], lesson:'A monetization model is always a trade: a hard paywall buys revenue now at the cost of organic growth, freemium does the reverse. Name the price of your choice out loud.'},
 s31:{title:'$9 for India and Indonesia', text:'Lena broke revenue down by country: 35% of installs come from India, Indonesia, and Turkey, but only 1.2% of users there pay, versus 7% in the US and Europe. “For them, $9 feels like $30 does to us. Maybe we just stop buying traffic there?”', options:[
   {t:'Stop buying traffic there and shift the budget to the US and Europe, where people pay.', fb:'The logic makes sense, but a US install costs several times more and the audience there is finite — the budget will run into rising CAC. You’re walking away from a market without checking what price would make it pay off.'},
   {t:'Keep $9 everywhere: regional pricing adds complexity, and Americans will just use a VPN.', fb:'Arbitrage risk in mobile app stores is low: the price is tied to the account’s country and payment method. And a single global price leaves a third of your audience barely monetized.'},
   {t:'Test $3–4 prices on new users in those countries and compare ARPU by country.', fb:'Price should match what a market can pay. Testing on new users shows which price maximizes ARPU (conversion × price) in each country — without putting current revenue at risk.', note:'At $4 in India, Indonesia, and Turkey, three times as many users started paying — revenue per user there rose by a third. You rolled it out to new users; average ARPPU across the base dipped slightly.'}
 ], lesson:'One price for the whole world is still a pricing decision. Judge regional prices by ARPU, not by conversion or price alone.'},
 s32:{title:'A 50/50 split that came out 53/47', text:'Tim shares the results of the new onboarding test. The split was planned as 50/50, but control has 5,300 users and the variant has 4,700. The variant shows +9% paid conversion, p = 0.01. “So it’s off by a few hundred — it’s still significant. Ship it?”', options:[
   {t:'Ship it: p = 0.01 at this sample size, and the stats already handle unequal groups.', fb:'Statistics do handle unequal groups — but only when the imbalance is random. SRM tells you the people missing from the variant aren’t random, so the p-value no longer means anything.', note:'After the full rollout, paid conversion didn’t budge, but users on older Android phones flooded support with reports of onboarding crashes.'},
   {t:'Don’t trust the result: find the cause of the imbalance (platforms, versions, logs) and rerun.', fb:'A sample ratio mismatch is a red flag: with honest randomization, an imbalance like this is nearly impossible. Someone is systematically dropping out of the variant, so the comparison is no longer fair.', note:'Found it: on older Android devices, the new onboarding crashed before the event reached analytics — the “weakest” users were falling out of the variant. You fixed it and reran: the honest effect was about +4%.'},
   {t:'Break the result down by platform and roll out wherever the groups came out 50/50.', fb:'Breaking it down by platform is the right first step to find the cause. But rolling out to the “clean” segment is premature: until you know the cause, you can’t be sure it didn’t touch that segment too.'},
   {t:'Randomly drop 600 users from control to even out the groups, recompute, and ship if it holds.', fb:'Evening out the counts doesn’t restore randomness: specific people fell out of the variant (say, those on slow devices), and randomly trimming control won’t undo that bias.', note:'You shipped the “evened-out” result — the effect didn’t replicate, and onboarding started crashing for everyone on older Android: exactly the people who had been dropping out of the variant.'}
 ], lesson:'Check for SRM before reading test results: if the groups drifted from the planned split, look for a bug, not an effect.'},
 s33:{title:'Conversion fell, though it rose everywhere', text:'Andrew is alarmed: paid conversion fell from 5.2% to 4.6% in a month. “The new onboarding broke everything — roll it back.” Dan breaks it down by channel: TikTok went from 2.0% to 2.4%, all other channels from 6.0% to 6.4%. But TikTok’s share of new users jumped from 20% to 45%.', options:[
   {t:'Roll back the onboarding: overall conversion fell right after it shipped — why take the risk?', fb:'You’re rolling back a change that improved conversion in every single channel. The total dropped because the traffic mix shifted, not because of the product.'},
   {t:'Show that it’s the channel mix, keep the onboarding, and check TikTok’s payback separately.', fb:'This is Simpson’s paradox: conversion rose in every channel, but the total fell because the mix shifted. The onboarding works; the real question is whether TikTok pays back on CAC per payer.', note:'You ran the payback numbers: CAC per payer from TikTok was fine except for two ad sets. You switched those off, and the budget started working harder.'},
   {t:'Cut the TikTok budget: it’s the one dragging overall conversion down; the rest is fine.', fb:'Low conversion doesn’t make a channel unprofitable: if a TikTok install costs half as much, CAC per payer may be just fine. Decide on CAC per payer, not on conversion.'}
 ], lesson:'When your audience mix changes, the topline metric can lie. Segment before you draw conclusions.'},
 s34:{title:'An effect that fades every week', text:'Lena is testing a new streak screen with animations and rewards. Daily habit check-ins in the variant: +14% in week one, +7% in week two, +3% in week three. The three-week average is +8%, p < 0.01. “Let’s ship it — great result!”', options:[
   {t:'Ship it, but refresh the animations and rewards every month so the novelty never wears off.', fb:'You can keep feeding novelty, but it’s a treadmill: the team keeps shipping cosmetics, and the effect fades anyway. First find out whether the feature has a lasting effect.'},
   {t:'Ship it: +8% on average over three weeks at p < 0.01 — that doesn’t happen by chance.', fb:'Significance tells you the effect isn’t zero right now, not what it will be in a month. The three-week average hides the trend: the lasting effect is probably around +3%.', note:'The effect deflated to +3%, and you had to rewrite the retention plan built on +8% in front of North Ventures.'},
   {t:'Don’t ship: the effect drops every week, so by week five or six it’ll obviously hit zero.', fb:'Extrapolating from three points is risky: novelty decay usually plateaus, and a steady +3% is still a result. Without data, you might throw away a feature that works.'},
   {t:'Check the effect on new users, for whom the screen isn’t new, and extend the test 2 weeks.', fb:'An effect that shrinks week by week is a sign of novelty: existing users react to “new,” not to value. New users never saw the old version, so their effect is closer to the lasting one.', note:'For new users, the effect held at +3% after five weeks. You shipped it expecting an honest +3%, not +8%.'}
 ], lesson:'If an effect fades week over week, suspect novelty: look at the trend and at new users, not the average.'},
 s35:{title:'Switch off the push holdout?', text:'A year ago, 10% of users were put into a holdout — they get no reminders. Their retention is 4 pp lower. Lena: “We’re knowingly losing about 180 people a month. Let’s turn pushes on for everyone.” Dan objects: the holdout is the only way to see what pushes actually do.', options:[
   {t:'Turn pushes on for everyone and measure with two-week holdouts once a quarter.', fb:'You win back retention right away and defuse the conflict with marketing, without giving up measurement entirely. The cost is a blind spot: a two-week test can’t see slow effects that build up over months.', note:'The quarterly holdout caught push fatigue late: some users had already turned off notifications.'},
   {t:'Keep the 10%: it gives precise numbers, and 180 people a month is an acceptable price.', fb:'You keep the measurement, but 10% is more than your questions need: a holdout half that size would give the same answers. You’re overpaying in retention and in your relationship with marketing.'},
   {t:'Shrink the holdout to 5% and keep it permanent: half the loss, and you keep measuring.', fb:'You keep continuous measurement and can catch slow effects like push fatigue. The cost is some retention right now and an unhappy Lena, and precision drops as the group shrinks.', note:'The holdout showed that retention starts falling after the third push in a week. You cut the frequency, and retention went up.'},
   {t:'Turn pushes on for everyone and close the topic: a year proved the effect, why keep measuring?', fb:'A year ago, the effect was proven for those pushes. Without a control group, you won’t see when new campaigns start doing harm — and marketing will keep adding more.', note:'Marketing added push after push, with nothing to measure the harm against. Users turned off notifications in droves, and retention sagged.'}
 ], lesson:'A holdout trades retention for knowledge. There’s no free option: decide explicitly how much you’ll pay to see long-term effects.'}
};

/* ============ helpers ============ */
const $ = s => document.querySelector(s);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
// RNG is swapped for a seeded one while a challenge is generated, so both languages get identical numbers
let RNG = Math.random;
function seeded(a){ return ()=>{ a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = (a,b) => a + RNG()*(b-a);
const ri = (a,b) => Math.floor(rnd(a, b+1));
const pick = arr => arr[Math.floor(RNG()*arr.length)];
const shuffle = arr => { const a = arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(RNG()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };
const NF = {ru:new Intl.NumberFormat('ru-RU'), en:new Intl.NumberFormat('en-US')};
const int = v => NF[LANG].format(Math.round(v));
function money(v){ const s = v<0?'−':''; v=Math.abs(v); if(v>=1e6) return s+'$'+(v/1e6).toFixed(2)+'M'; if(v>=1e4) return s+'$'+(v/1e3).toFixed(1).replace(/\.0$/,'')+'k'; return s+'$'+int(v); }
const dec = (v,d=1) => LANG==='en' ? v.toFixed(d) : v.toFixed(d).replace('.',',');
const pct = (v,d=1) => dec(v*100,d)+'%';
function erf(x){ const t=1/(1+0.3275911*Math.abs(x)); const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x); return x>=0?y:-y; }
const Phi = z => 0.5*(1+erf(z/Math.SQRT2));
function nice(n){ const p = Math.pow(10, Math.floor(Math.log10(n))-1); return Math.round(n/p)*p; }

/* ============ challenges ============ */
const CHAL = {
 ltv:{d:'metr', gen(){
   const arppu = ri(7,15), churn = pick([0.05,0.06,0.08,0.1,0.12,0.15]);
   const ltv = arppu*MARGIN/churn;
   return {title:L('Посчитай LTV платящего','Calculate LTV per paying user'), type:'number', unit:'$',
    prompt:L(`<p>Подписка Ритма. Магазин приложений забирает 30%, значит, валовая маржа — 70%.</p>
     <div class="kv"><div><small>ARPPU в месяц</small><b>$${arppu}</b></div><div><small>Маржа</small><b>70%</b></div><div><small>Месячный отток платящих</small><b>${pct(churn,0)}</b></div></div>`,
     `<p>Rhythm runs on subscriptions. The app store takes a 30% cut, so gross margin is 70%.</p>
     <div class="kv"><div><small>Monthly ARPPU</small><b>$${arppu}</b></div><div><small>Gross margin</small><b>70%</b></div><div><small>Monthly payer churn</small><b>${pct(churn,0)}</b></div></div>`),
    question:L('Какой LTV одного платящего пользователя (в $)?','What’s the LTV of a single paying user (in $)?'), answer:ltv, tol:0.05,
    explain:L(`LTV = ARPPU × маржа ÷ отток = ${arppu} × 0,7 ÷ ${dec(churn,2)} ≈ <b>$${dec(ltv,0)}</b>. Средняя «жизнь» платящего — 1 ÷ отток ≈ ${dec(1/churn,1)} мес.`,
     `LTV = ARPPU × margin ÷ churn = ${arppu} × 0.7 ÷ ${dec(churn,2)} ≈ <b>$${dec(ltv,0)}</b>. The average payer “lifetime” is 1 ÷ churn ≈ ${dec(1/churn,1)} months.`)};
 }},
 payback:{d:'metr', gen(){
   const cac = ri(6,18)*5, arppu = ri(7,14);
   const m = cac/(arppu*MARGIN);
   return {title:L('Срок окупаемости CAC','CAC payback period'), type:'number', unit:L('мес.','months'),
    prompt:L(`<p>Ты платишь за привлечение одного платящего пользователя и хочешь понять, через сколько месяцев он окупится.</p>
     <div class="kv"><div><small>CAC платящего</small><b>$${cac}</b></div><div><small>ARPPU в месяц</small><b>$${arppu}</b></div><div><small>Маржа</small><b>70%</b></div></div>`,
     `<p>You pay to acquire each paying user and want to know how many months it takes for them to pay that back.</p>
     <div class="kv"><div><small>CAC per payer</small><b>$${cac}</b></div><div><small>Monthly ARPPU</small><b>$${arppu}</b></div><div><small>Gross margin</small><b>70%</b></div></div>`),
    question:L('Через сколько месяцев окупится CAC?','How many months until CAC pays back?'), answer:m, tol:0.07, abs:0.5,
    explain:L(`Payback = CAC ÷ (ARPPU × маржа) = ${cac} ÷ (${arppu} × 0,7) ≈ <b>${dec(m,1)} мес.</b> Для подписок хорошим считается срок до 12 месяцев, отличным — до 6.`,
     `Payback = CAC ÷ (ARPPU × margin) = ${cac} ÷ (${arppu} × 0.7) ≈ <b>${dec(m,1)} months</b>. For subscriptions, under 12 months is considered good and under 6 is excellent.`)};
 }},
 ltvcac:{d:'metr', gen(){
   let cacI, conv, ltv, r;
   do { cacI = ri(10,40)/10; conv = ri(20,80)/1000; ltv = ri(3,30)*5; r = ltv/(cacI/conv); } while((r>0.85&&r<1.15)||(r>2.7&&r<3.3)||r>8);
   const cp = cacI/conv, ans = r<1?0:(r<3?1:2);
   return {title:L('Масштабировать канал?','Scale the channel?'), type:'choice',
    prompt:L(`<p>Новый рекламный канал отработал месяц. Решаем, что с ним делать.</p>
     <div class="kv"><div><small>Стоимость установки</small><b>$${dec(cacI,2)}</b></div><div><small>Конверсия в оплату</small><b>${pct(conv)}</b></div><div><small>LTV платящего</small><b>$${ltv}</b></div></div>`,
     `<p>A new ad channel has been running for a month. Time to decide what to do with it.</p>
     <div class="kv"><div><small>Cost per install</small><b>$${dec(cacI,2)}</b></div><div><small>Paid conversion</small><b>${pct(conv)}</b></div><div><small>LTV per payer</small><b>$${ltv}</b></div></div>`),
    question:L('Что делать с каналом?','What do you do with the channel?'),
    options:L(['Отключить или радикально оптимизировать: он убыточен','Оставить и оптимизировать: окупается, но с тонкой маржой','Масштабировать: экономика здоровая'],
     ['Shut it off or overhaul it: it loses money','Keep it and optimize: it pays back, but the margin is thin','Scale it: the unit economics are healthy']),
    answer:ans,
    explain:L(`CAC платящего = $${dec(cacI,2)} ÷ ${pct(conv)} ≈ $${dec(cp,0)}. LTV / CAC = ${ltv} ÷ ${dec(cp,0)} ≈ <b>${dec(r,1)}</b>. Ориентиры: < 1 — канал сжигает деньги, 1–3 — окупается впритык, > 3 — можно масштабировать.`,
     `CAC per payer = $${dec(cacI,2)} ÷ ${pct(conv)} ≈ $${dec(cp,0)}. LTV / CAC = ${ltv} ÷ ${dec(cp,0)} ≈ <b>${dec(r,1)}</b>. Rules of thumb: < 1 — the channel burns cash, 1–3 — it barely pays back, > 3 — you can scale it.`)};
 }},
 ab:{d:'exp', gen(){
   let n,c1,c2,z;
   do { n = ri(20,100)*100; const p1 = ri(40,100)/1000; const lift = rnd(-0.05,0.3); c1 = Math.round(n*p1); c2 = Math.round(n*p1*(1+lift)); const pp=(c1+c2)/(2*n); z = (c2/n-c1/n)/Math.sqrt(pp*(1-pp)*2/n); } while(Math.abs(z)>1.65 && Math.abs(z)<2.3 || c1===c2);
   const p = 2*(1-Phi(Math.abs(z))), sig = Math.abs(z)>=1.96;
   return {title:L('Значим ли результат A/B-теста?','Is the A/B test result significant?'), type:'choice',
    prompt:L(`<p>Тест новой кнопки «Отметить» на главном экране. Метрика — конверсия в оплату триала.</p>
     <div class="task-box" style="margin:0"><table class="t"><thead><tr><th>Группа</th><th>Пользователей</th><th>Оплат</th><th>Конверсия</th></tr></thead><tbody>
     <tr><td>A (контроль)</td><td>${int(n)}</td><td>${int(c1)}</td><td>${pct(c1/n,2)}</td></tr>
     <tr><td>B (новая кнопка)</td><td>${int(n)}</td><td>${int(c2)}</td><td>${pct(c2/n,2)}</td></tr></tbody></table></div>`,
     `<p>You’re testing a new “Check in” button on the home screen. The metric is trial-to-paid conversion.</p>
     <div class="task-box" style="margin:0"><table class="t"><thead><tr><th>Group</th><th>Users</th><th>Paid</th><th>Conversion</th></tr></thead><tbody>
     <tr><td>A (control)</td><td>${int(n)}</td><td>${int(c1)}</td><td>${pct(c1/n,2)}</td></tr>
     <tr><td>B (new button)</td><td>${int(n)}</td><td>${int(c2)}</td><td>${pct(c2/n,2)}</td></tr></tbody></table></div>`),
    question:L('Разница статистически значима при α = 0,05 (двусторонний тест)?','Is the difference statistically significant at α = 0.05 (two-sided test)?'),
    options:L(['Да, значима — можно раскатывать','Нет, не значима — это может быть шум'],
     ['Yes, it’s significant — OK to roll out','No, it’s not significant — it could be noise']), answer:sig?0:1,
    explain:L(`Z-тест для двух долей: объединённая конверсия p = ${pct((c1+c2)/(2*n),2)}, стандартная ошибка = √(p(1−p)·2/n). z ≈ <b>${dec(z,2)}</b>, p-value ≈ <b>${dec(p,3)}</b>. Порог для α = 0,05 — |z| ≥ 1,96. Относительная разница: ${(c2/c1-1)>=0?'+':''}${pct(c2/c1-1)}.`,
     `Two-proportion z-test: pooled conversion p = ${pct((c1+c2)/(2*n),2)}, standard error = √(p(1−p)·2/n). z ≈ <b>${dec(z,2)}</b>, p-value ≈ <b>${dec(p,3)}</b>. The threshold for α = 0.05 is |z| ≥ 1.96. Relative difference: ${(c2/c1-1)>=0?'+':''}${pct(c2/c1-1)}.`)};
 }},
 sample:{d:'exp', gen(){
   const p = pick([0.05,0.1,0.2]), mde = pick([0.1,0.2]);
   const delta = p*mde, n = nice(16*p*(1-p)/(delta*delta));
   const opts = shuffle([n, nice(n/4), nice(n*4), nice(n/12)]);
   return {title:L('Сколько пользователей нужно в тест?','How many users does the test need?'), type:'choice',
    prompt:L(`<p>Хочешь проверить новый онбординг. Стандартные параметры: α = 0,05, мощность 80%.</p>

     `<p>You want to test a new onboarding flow. Standard parameters: α = 0.05, 80% power.</p>

     `Lehr’s rule of thumb: n ≈ 16 · p(1−p) / δ² = 16 · ${dec(p,2)} · ${dec(1-p,2)} / ${dec(delta,3)}² ≈ <b>${int(n)}</b> per group. Remember: halve the MDE and the sample size quadruples.`)};

 rice:{d:'prio', gen(){
   const names = shuffle(L(['Напоминание по геолокации','Виджет на главный экран','Синхронизация с Apple Health','Челленджи с друзьями','Статистика за год','Шаблоны привычек','Голосовая отметка','Серии и заморозка серии'],
     ['Location-based reminders','Home screen widget','Apple Health sync','Challenges with friends','Yearly stats','Habit templates','Voice check-in','Streaks and streak freeze'])).slice(0,4);
   let rows;
   do { rows = names.map(nm=>{ const R=ri(5,80)*100, I=pick([0.25,0.5,1,2,3]), C=pick([0.5,0.8,1]), E=ri(1,8); return {nm,R,I,C,E,s:R*I*C/E}; }); const s = rows.map(r=>r.s).sort((a,b)=>b-a); if(s[0]>=s[1]*1.2) break; } while(true);
   const best = rows.reduce((b,r,i)=>r.s>rows[b].s?i:b,0);
   return {title:L('Что делать первым по RICE?','What goes first by RICE?'), type:'choice',
    prompt:L(`<p>Бэклог на квартал. Reach — пользователей за квартал, Impact — по шкале 0,25–3, Confidence — уверенность в оценках, Effort — человеко-недели.</p>
     <div class="task-box" style="margin:0"><table class="t"><thead><tr><th>Фича</th><th>Reach</th><th>Impact</th><th>Confidence</th><th>Effort</th></tr></thead><tbody>
     ${rows.map(r=>`<tr><td>${r.nm}</td><td>${int(r.R)}</td><td>${String(r.I).replace('.',',')}</td><td>${Math.round(r.C*100)}%</td><td>${r.E}</td></tr>`).join('')}</tbody></table></div>`,
     `<p>Your backlog for the quarter. Reach is users per quarter, Impact is on a 0.25–3 scale, Confidence is how sure you are of the estimates, Effort is in person-weeks.</p>
     <div class="task-box" style="margin:0"><table class="t"><thead><tr><th>Feature</th><th>Reach</th><th>Impact</th><th>Confidence</th><th>Effort</th></tr></thead><tbody>
     ${rows.map(r=>`<tr><td>${r.nm}</td><td>${int(r.R)}</td><td>${r.I}</td><td>${Math.round(r.C*100)}%</td><td>${r.E}</td></tr>`).join('')}</tbody></table></div>`),
    question:L('Какая фича получает наивысший RICE-приоритет?','Which feature gets the highest RICE score?'), options:rows.map(r=>r.nm), answer:best,
    explain:`RICE = Reach × Impact × Confidence ÷ Effort. ${rows.map(r=>`${r.nm}: <b>${int(r.s)}</b>`).join('; ')}.`};
 }},

 funnel:{d:'metr', gen(){

 cohort:{d:'metr', gen(){

     ${rows.map(r=>`<tr><td>${r.m}</td>${[0,1,2,3].map(k=>`<td>${r.v[k]!==undefined?r.v[k]+'%':'—'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`,

const glossL = g => LANG==='en' ? Object.assign({k:g.k}, GLOSS_EN[g.k]) : Object.assign({}, g, {sub:(g.en!=='—'?g.en+' · ':'')+g.ru});
const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
let GMAP = {}, TERM_RE = null, ALIAS_KEY = {};
// English aliases are matched case-insensitively; Russian ones list their case forms explicitly
function buildTerms(){
  const gl = GLOSS.map(glossL);
  GMAP = {}; gl.forEach(g=>GMAP[g.k]=g);
  const aliases = gl.flatMap(g=>g.a.map(a=>({a, k:g.k}))).sort((x,y)=>y.a.length-x.a.length);
  const flags = LANG==='en' ? 'giu' : 'gu';
  try { TERM_RE = new RegExp('(?<![\\p{L}\\d-])(' + aliases.map(x=>esc(x.a)).join('|') + ')(?![\\p{L}\\d-])', flags); }
  catch(e){ TERM_RE = new RegExp('(' + aliases.map(x=>esc(x.a)).join('|') + ')', flags.replace('u','')); }
  ALIAS_KEY = {}; aliases.forEach(x=>{ const a = x.a.toLowerCase(); if(!(a in ALIAS_KEY)) ALIAS_KEY[a]=x.k; });
}

function annotate(root){
  if(!root || !TERM_RE) return;
  const count = {};
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(n){
      if(!n.nodeValue || n.nodeValue.trim().length<2) return NodeFilter.FILTER_REJECT;
      const p = n.parentElement;
      if(!p || p.closest('.term, .opt, kbd, .lvl, .pill, script, style, .badge, .segs')) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const nodes = []; let n; while((n = walker.nextNode())) nodes.push(n);
  nodes.forEach(node=>{
    const text = node.nodeValue; TERM_RE.lastIndex = 0;
    if(!TERM_RE.test(text)) return; TERM_RE.lastIndex = 0;
    const frag = document.createDocumentFragment(); let last = 0, m;
    while((m = TERM_RE.exec(text))){
      const key = ALIAS_KEY[m[0].toLowerCase()];
      if(!key || (count[key]||0) >= 2) continue;
      count[key] = (count[key]||0)+1;
      frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      const b = document.createElement('span');
      b.className = 'term'; b.tabIndex = 0; b.setAttribute('role','button'); b.dataset.term = key; b.textContent = m[0];
      b.setAttribute('aria-label', m[0]+L(' — что это значит',' — what it means'));
      frag.appendChild(b); last = m.index + m[0].length;
    }
    if(!last) return;
    frag.appendChild(document.createTextNode(text.slice(last)));
    node.parentNode.replaceChild(frag, node);
  });
}
function termCard(g){
  return `<h4>${g.t}</h4><div class="term-sub">${g.sub}</div><p>${g.d}</p>${g.f?`<div class="term-f">${g.f}</div>`:''}`;
}
function openTerm(btn){
  const g = GMAP[btn.dataset.term]; if(!g) return;
  let pop = document.getElementById('pop');
  if(!pop){ pop = document.createElement('div'); pop.id = 'pop'; pop.setAttribute('role','dialog'); document.body.appendChild(pop); }
  pop.innerHTML = termCard(g) + `<button class="term-close" data-act="popClose" aria-label="${L('Закрыть','Close')}">×</button>`;
  pop.hidden = false; pop.classList.remove('sheet');
  const narrow = window.innerWidth < 620;
  if(narrow){ pop.classList.add('sheet'); pop.style.left = ''; pop.style.top = ''; }
  else {
    const r = btn.getBoundingClientRect(), w = 340;
    let left = Math.min(Math.max(12, r.left), window.innerWidth - w - 12);
    pop.style.left = left+'px';
    pop.style.top = (r.bottom + 8)+'px';
    requestAnimationFrame(()=>{ const pr = pop.getBoundingClientRect(); if(pr.bottom > window.innerHeight - 8) pop.style.top = Math.max(8, r.top - pr.height - 8)+'px'; });
  }
}
function closeTerm(){ const p = document.getElementById('pop'); if(p) p.hidden = true; }
function openSheet(){
  let s = document.getElementById('sheet');
  if(!s){ s = document.createElement('div'); s.id = 'sheet'; document.body.appendChild(s); }
  const gl = Object.values(GMAP), groups = [...new Set(gl.map(g=>g.g))];
  s.innerHTML = `<div class="sheet-panel" role="dialog" aria-label="${L('Шпаргалка','Cheat sheet')}">

    <input id="gsearch" type="search" placeholder="${L('Поиск: LTV, когорта, RICE…','Search: LTV, cohort, RICE…')}" autocomplete="off">
    <div class="sheet-body">${groups.map(gr=>`<div class="gsec" data-group="${gr}"><div class="gsec-h">${gr}</div>${gl.filter(g=>g.g===gr).map(g=>`<div class="gitem" data-find="${(g.t+' '+g.sub+' '+g.d).toLowerCase().replace(/"/g,'&quot;')}">${termCard(g)}</div>`).join('')}</div>`).join('')}</div>
  </div>`;
  s.hidden = false;
  setTimeout(()=>{ const i = document.getElementById('gsearch'); if(i && window.innerWidth>620) i.focus(); },20);
}
function closeSheet(){ const s = document.getElementById('sheet'); if(s) s.hidden = true; }
function filterSheet(q){
  q = q.trim().toLowerCase();
  document.querySelectorAll('#sheet .gitem').forEach(el=>{ el.hidden = q && !el.dataset.find.includes(q); });
  document.querySelectorAll('#sheet .gsec').forEach(el=>{ el.hidden = !el.querySelector('.gitem:not([hidden])'); });
}

function derive(m){
  const debtPen = Math.max(0, m.debt-50)*DEBT_WORK.penalty;
  const effRet = clamp(m.ret - debtPen + (m.morale-60)*0.0003, 0.4, 0.96);
  const effCac = m.cac*(1+Math.max(0,m.budget-20000)/40000);
  const payers = m.users*m.conv, mrr = payers*m.arppu, gross = mrr*MARGIN;
  const burn = TEAM_COST + m.budget, net = gross - burn;
  const payerRet = Math.min(0.97, effRet+0.10);
  const ltv = m.arppu*MARGIN/(1-payerRet), cacPayer = effCac/m.conv;
  return {effRet, effCac, payers, mrr, gross, burn, net, ltv, cacPayer, ratio:ltv/cacPayer, runway: net<0 ? m.cash/(-net) : Infinity, debtPen};
}
function pickBalanced(items, n){
  const groups = {}; items.forEach(it=>{ (groups[it.d] = groups[it.d]||[]).push(it.id); });
  Object.keys(groups).forEach(k=>groups[k]=shuffle(groups[k]));
  const out=[]; while(out.length<n){ const ks = shuffle(Object.keys(groups).filter(k=>groups[k].length)); if(!ks.length) break; for(const k of ks){ if(out.length<n) out.push(groups[k].shift()); } }
  return out;
}
// scenario with texts in the current language
function scenL(id){
  const s = SCEN.find(x=>x.id===id); if(LANG==='ru') return s;
  const e = SCEN_EN[id];
  return Object.assign({}, s, {title:e.title, text:e.text, lesson:e.lesson,
    options:s.options.map((o,i)=>Object.assign({}, o, {t:e.options[i].t, fb:e.options[i].fb}, o.later?{later:Object.assign({}, o.later, {note:e.options[i].note})}:{}))});
}
const laterNote = r => scenL(r.sid).options[r.oi].later.note;
// challenge is generated once per language from the same seed; text lives in c.txt[lang]
function genChal(key){
  const seed = (Math.random()*4294967296)>>>0, keep = LANG, txt = {};
  try { LANGS.forEach(lg=>{ LANG = lg; RNG = seeded(seed); txt[lg] = CHAL[key].gen(); }); }
  finally { LANG = keep; RNG = Math.random; }
  const c = txt.ru;
  return {key, d:CHAL[key].d, type:c.type, answer:c.answer, tol:c.tol, abs:c.abs||0, txt};
}
// balanced by domain, with at least one dilemma per game
function pickScenarios(){
  const ids = pickBalanced(SCEN.map(s=>({id:s.id,d:s.d})), MONTHS), byId = id => SCEN.find(s=>s.id===id);
  if(!ids.some(id=>byId(id).dilemma)){
    const dl = shuffle(SCEN.filter(s=>s.dilemma))[0];
    const k = dl ? ids.findIndex(id=>byId(id).d===dl.d) : -1;
    if(k>=0) ids[k] = dl.id;
  }
  return ids;
}
function newGame(){
  const m = {users:45000, ret:0.80, conv:0.05, arppu:9, cac:2.5, viral:0.03, cash:START_CASH, trust:60, morale:62, debt:40, budget:20000, debtShare:0};
  const d = derive(m);
  S = { v:2, month:1, phase:'scenario', m,
    history:[{month:0, users:m.users, mrr:d.mrr, cash:m.cash, ratio:d.ratio, ret:d.effRet}],
    queue:[], xp:{disc:0,prio:0,metr:0,exp:0}, acc:{disc:[0,0],prio:[0,0],metr:[0,0],exp:[0,0]},
    scen:pickScenarios(),
    chal:pickBalanced(Object.keys(CHAL).map(k=>({id:k,d:CHAL[k].d})), MONTHS),
    cur:{}, log:[], streak:0, bestStreak:0, fired:[], ended:false, initMrr:d.mrr, review:null };
  track('start');
  startMonth();
}
function startMonth(){
  S.phase = 'scenario';
  const id = S.scen[S.month-1];
  S.cur = { scenId:id, order:shuffle(SCEN.find(s=>s.id===id).options.map((_,i)=>i)), choice:null, chal:null, chalAns:null, chalOk:null, fxShown:null };
  save(); render();
}
function applyFx(fx){
  const m = S.m; if(!fx) return;
  for(const k in fx){ m[k] = (m[k]||0) + fx[k]; }
  m.ret = clamp(m.ret,0.4,0.95); m.conv = clamp(m.conv,0.005,0.2); m.arppu = clamp(m.arppu,3,30); m.cac = clamp(m.cac,0.8,10);
  m.viral = clamp(m.viral,0,0.15); m.trust = clamp(m.trust,0,100); m.morale = clamp(m.morale,0,100); m.debt = clamp(m.debt,0,100);
}
function streakHit(ok){ S.streak = ok ? S.streak+1 : 0; S.bestStreak = Math.max(S.bestStreak, S.streak); }

function chooseScenario(i){
  if(S.cur.choice!==null) return;
  const sc = SCEN.find(s=>s.id===S.cur.scenId), o = sc.options[i];
  S.cur.choice = i; applyFx(o.fx);
  if(o.later) S.queue.push({at:S.month+o.later.in-1, fx:o.later.fx, sid:sc.id, oi:i});
  S.xp[sc.d] += QUAL[o.q].xp; S.acc[sc.d][0] += QUAL[o.q].pts; S.acc[sc.d][1] += 2;
  streakHit(o.q==='best');
  S.log.push({kind:'scen', id:sc.id, d:sc.d, q:o.q});
  S.phase = 'scenFeedback'; save(); render();
}
function toChallenge(){
  S.cur.chal = genChal(S.chal[S.month-1]);
  S.phase = 'challenge'; save(); render();
  setTimeout(()=>{ const inp = $('#ans-num'); if(inp) inp.focus(); }, 30);
}
function answerChallenge(val){
  const c = S.cur.chal; if(S.cur.chalOk!==null) return;
  let ok;
  if(c.type==='number'){
    // ru: comma is the decimal separator; en: comma separates thousands
    const raw = String(val).replace(/[\s$]/g,'');
    const v = parseFloat(LANG==='en' ? raw.replace(/,/g,'') : raw.replace(',','.'));
    if(isNaN(v)){ const inp=$('#ans-num'); if(inp){ inp.setAttribute('aria-invalid','true'); inp.placeholder=L('Введи число','Enter a number'); inp.focus(); } return; }
    ok = Math.abs(v-c.answer) <= Math.max(Math.abs(c.answer)*c.tol, c.abs||0); S.cur.chalAns = v;
  } else { ok = val===c.answer; S.cur.chalAns = val; }
  S.cur.chalOk = ok;
  S.xp[c.d] += ok?40:10; S.acc[c.d][0] += ok?2:0; S.acc[c.d][1] += 2;
  if(ok) applyFx(CHAL_BONUS[c.d].fx);
  streakHit(ok);
  S.log.push({kind:'chal', d:c.d, ok, title:{ru:c.txt.ru.title, en:c.txt.en.title}, explain:{ru:c.txt.ru.explain, en:c.txt.en.explain}});
  S.phase = 'chalFeedback'; save(); render();
}
function closeMonth(){
  const m = S.m;
  const fired = S.queue.filter(q=>q.at<=S.month); S.queue = S.queue.filter(q=>q.at>S.month);
  fired.forEach(q=>applyFx(q.fx));
  const before = derive(m); const prev = {users:m.users, mrr:before.mrr, cash:m.cash, ratio:before.ratio};
  const d = derive(m);
  // team share on tech debt: fewer features ship, so organic growth drops
  const ds = m.debtShare||0;
  const organic = m.users*m.viral*(1 - ds*DEBT_WORK.organic), paid = m.budget/d.effCac;
  m.users = m.users*d.effRet + organic + paid;
  const after = derive(m);
  m.cash += after.gross - after.burn;
  m.debt = clamp(m.debt + DEBT_WORK.drift - ds*DEBT_WORK.paydown, 0, 100); m.morale += (60-m.morale)*0.12 + ds*DEBT_WORK.morale; m.trust += (55-m.trust)*0.08;
  const fin = derive(m);
  let review = null;
  if(S.month===REVIEW.month){
    const g = fin.mrr/S.initMrr, lvl = g>=REVIEW.full ? 'full' : (g>=REVIEW.half ? 'half' : 'none');
    const amount = {full:REVIEW.tranche, half:REVIEW.tranche/2, none:0}[lvl];
    m.cash += amount; m.trust = clamp(m.trust + {full:6, half:-4, none:-12}[lvl], 0, 100);
    review = S.review = {g, lvl, amount};
    track('review-'+lvl);
  }
  S.history.push({month:S.month, users:m.users, mrr:fin.mrr, cash:m.cash, ratio:fin.ratio, ret:fin.effRet});
  S.summary = {prev, fired:fired.map(f=>({sid:f.sid, oi:f.oi})), newUsers:organic+paid, paid, organic, churned:prev.users*(1-d.effRet), debtWarn:d.debtPen>0, review};
  S.phase = m.cash<0 ? 'end' : (S.month>=MONTHS ? 'end' : 'summary');
  if(S.phase==='end'){ S.ended = true; track(m.cash<0 ? 'bust' : 'finish'); }
  save(); render();
}
function nextMonth(){ S.month++; startMonth(); }

function totalXp(){ return Object.values(S.xp).reduce((a,b)=>a+b,0); }
// XP gives a level; job titles come only from the final grade, so the two never disagree
const levelFromXp = x => Math.floor(x/100)+1;
function finalScore(){
  const sc = S.log.filter(l=>l.kind==='scen'), ch = S.log.filter(l=>l.kind==='chal');
  const s1 = sc.length ? sc.reduce((a,l)=>a+QUAL[l.q].pts,0)/(2*sc.length) : 0;
  const s2 = ch.length ? ch.filter(l=>l.ok).length/ch.length : 0;
  const skill = (s1+s2)/2;
  const d = derive(S.m), growth = d.mrr/S.initMrr;
  const biz = 0.4*clamp((growth-0.8)/1.7,0,1) + 0.3*clamp((d.ratio-1)/3,0,1) + 0.15*(S.m.cash>0?1:0) + 0.15*S.m.trust/100;
  const total = S.m.cash<0 ? Math.min(0.45, 0.6*skill+0.4*biz) : 0.6*skill+0.4*biz;
  const grades = [[0,L('Стажёр','Intern')],[0.35,'Junior PM'],[0.5,'Middle PM'],[0.65,'Senior PM'],[0.8,'Lead PM'],[0.9,'Head of Product']];
  // grade by the score the player sees (rounded), so "90 / 100" is never shown with a lower grade
  const shown = Math.round(total*100)/100;
  let g = grades[0][1]; grades.forEach(([v,n])=>{ if(shown>=v) g=n; });
  return {skill, biz, total, grade:g, growth, s1, s2};
}

function spark(vals, w=120, h=34){
  if(vals.length<2) vals = [vals[0], vals[0]];
  const mn = Math.min(...vals), mx = Math.max(...vals), rg = (mx-mn)||1;
  const pts = vals.map((v,i)=>[ (i/(vals.length-1))*(w-6)+3, h-4-((v-mn)/rg)*(h-10) ]);
  const line = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area = line+` L${pts[pts.length-1][0].toFixed(1)} ${h} L${pts[0][0].toFixed(1)} ${h} Z`;
  const e = pts[pts.length-1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${area}" fill="currentColor" opacity=".12"/><path d="${line}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${e[0].toFixed(1)}" cy="${e[1].toFixed(1)}" r="3" fill="currentColor"/></svg>`;
}
function fxChips(fx){
  if(!fx) return '';
  return `<div class="fx">${Object.keys(fx).map(k=>{ const v=fx[k], meta=FX_META[k]; const good = meta.inv ? v<0 : v>0; return `<span class="${good?'up':'down'}">${meta.label} ${meta.fmt(v)}</span>`; }).join('')}</div>`;
}

  if(others.length===1) return `<p><b>${L('Сильнее:','Stronger:')}</b> ${others[0].t}</p>`;
  return `<p><b>${L('Сильнее — любой из двух:','Stronger — either of these:')}</b>${others.map(x=>`<br>— ${x.t}`).join('')}</p>`;
